openapi: "3.0.2"
info:
  title: Cluster Topology Management API
  version: "1.0"
  description: API for managing cluster membership and partition distribution.
servers:
  - url: "{schema}://{host}:{port}/actuator/cluster"
    variables:
      host:
        default: localhost
        description: Management server hostname
      port:
        default: "9600"
        description: Management server port
      schema:
        default: http
        description: Management server schema
paths:
  /brokers/{brokerId}:
    post:
      summary: Add a broker to the cluster
      description: Add a broker with the given brokerId to the cluster. The broker must be running
        to complete the operation.
      parameters:
        - $ref: '#/components/parameters/BrokerId'
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          $ref: '#/components/responses/AddBrokersResponse'
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
    delete:
      summary: Remove a broker from the cluster.
      description: Remove a broker with the given brokerId from the cluster. The broker must be
        running to complete the operation.
      parameters:
        - $ref: '#/components/parameters/BrokerId'
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          $ref: '#/components/responses/RemoveBrokerResponse'
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
  /brokers/{brokerId}/partitions/{partitionId}:
    post:
      summary: Add a broker to a partition's replication group, or change its priority
      description: Adds the broker to the replication group of the given partition, replicating it
        with the requested priority. If the broker already replicates the partition, only its
        priority is changed. The broker must be running to complete the operation.
        Partition ids restart at 1 in every physical tenant, so the partition is resolved within
        the physical tenant named by physicalTenant, or within the default physical tenant when
        the parameter is absent.
      parameters:
        - $ref: '#/components/parameters/BrokerId'
        - $ref: '#/components/parameters/PartitionId'
        - $ref: '#/components/parameters/DryRunParameter'
        - $ref: '#/components/parameters/DefaultingPhysicalTenantParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/PartitionJoinRequest"
      responses:
        '202':
          $ref: '#/components/responses/JoinPartitionResponse'
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
    delete:
      summary: Remove a broker from a partition's replication group
      description: Removes the broker from the replication group of the given partition. The
        partition must keep at least one replica, so the last remaining replica cannot be removed.
        The broker must be running to complete the operation.
        Partition ids restart at 1 in every physical tenant, so the partition is resolved within
        the physical tenant named by physicalTenant, or within the default physical tenant when
        the parameter is absent.
      parameters:
        - $ref: '#/components/parameters/BrokerId'
        - $ref: '#/components/parameters/PartitionId'
        - $ref: '#/components/parameters/DryRunParameter'
        - $ref: '#/components/parameters/DefaultingPhysicalTenantParameter'
      responses:
        '202':
          $ref: '#/components/responses/LeavePartitionResponse'
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /brokers:
    post:
      summary: Reconfigure the cluster with the given brokers.
      description: The final cluster consists of only the brokers in the request body. New brokers
        in the request will be added to the cluster. Any existing brokers that are not part
        of the request will be removed from the cluster. The partitions will be re-distributed
        to the given brokers. All brokers must be running to complete the operation unless the
        parameter force is set to true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/ScaleRequest"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
        - $ref: '#/components/parameters/ForceParameter'
        - $ref: '#/components/parameters/ReplicationFactorParameter'
      responses:
        '202':
          $ref: "#/components/responses/ScaleBrokersResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /purge:
    post:
      summary: Purge data from the cluster
      description: Purges data from Zeebe cluster and all exporters.
        This operation is irreversible and will remove all data from the cluster!
        During this operation all brokers will leave their partitions, data will be deleted,
        and then the brokers will rejoin their partition with empty state, restoring the
        original topology.
        Without the physicalTenant parameter every physical tenant is purged; with it, only
        the given physical tenant is purged and the others are left untouched.
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
        - $ref: '#/components/parameters/PhysicalTenantParameter'
      responses:
        '202':
          $ref: "#/components/responses/ClusterConfigPurgeResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /:
    get:
      summary: Get current topology
      description: Returns the current topology of the cluster.
      parameters:
        - $ref: '#/components/parameters/PhysicalTenantParameter'
      responses:
        '200':
          $ref: "#/components/responses/GetTopologyResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /changes/{changeId}:
    get:
      summary: Get a configuration change
      description: Returns the status and operations of one configuration change.
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      responses:
        '200':
          $ref: "#/components/responses/GetConfigurationChangeResponse"
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /changes:
    get:
      summary: List configuration changes
      description: Returns every configuration change currently known to this broker.
      responses:
        '200':
          $ref: "#/components/responses/GetConfigurationChangesResponse"
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

    patch:
      summary: Reconfigure cluster
      description: Reconfigure cluster by adding or removing brokers, adding more partitions, or
                   changing the replicationFactor. Note that adding partitions is an experimental
                   feature and not fully supported.
                   Only the partition count can be scoped to a physical tenant, with the
                   physicalTenant parameter; without it, the partition count of the default
                   physical tenant is changed. Partitions are distributed across brokers
                   considering every physical tenant's partitions at once, so that scaling one
                   tenant does not overload brokers already busy with another tenant's partitions;
                   as a consequence, it can also relocate partitions of the tenants that are not
                   being scaled.
                   The broker count (or the brokers to add/remove) changes cluster membership, and
                   the replication factor is a cluster-wide setting; neither has a tenant to scope it
                   to, so neither may be combined with physicalTenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/ClusterConfigPatchRequest"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
        - $ref: '#/components/parameters/ForceParameter'
        - $ref: '#/components/parameters/PhysicalTenantParameter'
      responses:
        '202':
          $ref: "#/components/responses/ClusterConfigPatchResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /routing-state:
    patch:
      summary:
        Force an update of the routing state using the user provided routing state
        or by fetching the routing state from the engine first and then
        applying it to the configuration.
        No validation is performed on the user provided routing state, so it must be
        used only in the rare circumstances when it's not possible to fetch it from the engine.
        When physicalTenant is given, only that physical tenant's routing state is written;
        when omitted, the default physical tenant's routing state is written, regardless of
        which other physical tenants exist.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/RoutingState"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
        - $ref: '#/components/parameters/DefaultingPhysicalTenantParameter'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /partition-distribution:
    put:
      summary:
        Update the partition distribution configuration. Exactly one of `config` and `zonePriorities` must be set.

        Setting `config` persists a new configuration and applies it immediately by computing the necessary
        partition join, leave, and priority-reconfiguration operations. When migrating a bare or partially zoned
        cluster to zone-aware (see `PUT /cluster/zones`), list zones in `config.zones` in the order they should
        receive the existing (bare) nodes — the first zone receives node 0, the second node 1, and so on, wrapping
        around by zone count. This order only matters for that one-time migration; once all zones are migrated,
        every other API addresses zones by name.

        Setting `zonePriorities` re-orders the zones' priorities on a fully zone-aware cluster. The
        priorities values are reused and they are just reassigned to a different zone based on the order of the zones in the
        request. The first zone gets the highest existing priority value, the second zone the next highest, and so on. No new
        priority values are introduced. This only updates the priorities; it does not itself move partition
        leaders. Leaders move to the newly-preferred zone on the next election (e.g. triggered by a separate
        rebalance). It must list exactly the currently configured zones; idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/UpdatePartitionDistributionRequest"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/PlannedOperationsResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /zones/{zoneId}:
    delete:
      summary: Force-remove a zone
      description: Force-evicts the given zone's brokers from the cluster and drops the zone from
        the persisted partition distribution configuration, in one atomic change. Use this when a
        zone is down and its brokers are unreachable.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/PlannedOperationsResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
    post:
      summary: Add back a previously force-removed zone
      description: Re-adds the operator-supplied brokers and re-includes the given zone in the
        persisted partition distribution configuration, with the supplied replica count and
        priority, in one atomic change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/AddZoneRequest"
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/PlannedOperationsResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /zones:
    put:
      summary:
        Migrate one zone of a bare or partially zoned cluster to a zone-aware topology. The request
        contains only the zone name. Before migrating a zone, update the persisted partition
        distribution with `PUT /cluster/partition-distribution` with a zone aware partition distribution.
        For dual-region clusters, migrate the secondary zone first (odd-numbered nodes) and then the primary zone.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/ClusterZoneMigrationRequest"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/PlannedOperationsResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
      x-added-in-version: "8.10.0"

  /physical-tenants/{physicalTenantId}:
    delete:
      summary: Remove a disabled physical tenant
      description: Discards the given disabled physical tenant, so that brokers still holding its
        partitions may leave the cluster. The tenant must already be disabled, i.e. removed from
        the brokers' static configuration. Removal is permanent — the tenant id cannot be brought
        back — and does not delete the tenant's data, which stays on the brokers' disks until
        reclaimed out of band. A normal request runs on the elected coordinator; with force, it is
        executed by whichever broker received it — the bail-out for a disaster where the
        coordinator is unreachable.
      parameters:
        - $ref: '#/components/parameters/PhysicalTenantId'
        - $ref: '#/components/parameters/DryRunParameter'
        - $ref: '#/components/parameters/ForceParameter'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/PlannedOperationsResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
      x-added-in-version: "8.10.0"

components:
  parameters:
    BrokerId:
      name: brokerId
      required: true
      in: path
      description: Id of the broker
      schema:
        $ref: 'components.yaml#/schemas/BrokerId'
    ZoneId:
      name: zoneId
      required: true
      in: path
      description: Name of the zone
      schema:
        type: string
    PhysicalTenantId:
      name: physicalTenantId
      required: true
      in: path
      description: Id of the physical tenant
      schema:
        $ref: 'components.yaml#/schemas/PhysicalTenantId'
    PartitionId:
      name: partitionId
      required: true
      in: path
      description: Id of the partition
      schema:
        $ref: 'components.yaml#/schemas/PartitionId'
    ChangeId:
      name: changeId
      required: true
      in: path
      description: Id of the configuration change
      schema:
        $ref: 'components.yaml#/schemas/ChangeId'
    DryRunParameter:
      name: dryRun
      description: If true, requested changes are only simulated and not actually applied.
      in: query
      style: form
      required: false
      schema:
        type: boolean
        default: false
    PhysicalTenantParameter:
      name: physicalTenant
      description: Id of the physical tenant to target. If not specified, the operation applies to all physical tenants.
      in: query
      style: form
      required: false
      schema:
        $ref: 'components.yaml#/schemas/PhysicalTenantId'
    DefaultingPhysicalTenantParameter:
      name: physicalTenant
      description: Id of the physical tenant to target. If not specified, the default physical tenant is targeted,
        not every physical tenant - unlike the other operations taking this parameter.
      in: query
      style: form
      required: false
      schema:
        $ref: 'components.yaml#/schemas/PhysicalTenantId'
    ForceParameter:
      name: force
      description: If true, the operation is a force operation. This is typically used to force remove a set of brokers when they are not available.
      in: query
      style: form
      required: false
      schema:
        type: boolean
        default: false
    ReplicationFactorParameter:
      name: replicationFactor
      description: The new replication factor for the partitions. If not specified, the current replication factor is used.
      in: query
      style: form
      required: false
      schema:
        type: integer
        format: int32
  responses:
    AddBrokersResponse:
      description: Request to add a new broker is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    ScaleBrokersResponse:
      description: Request to reconfigure brokers is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    ClusterConfigPatchResponse:
      description: Request to reconfigure cluster is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    ClusterConfigPurgeResponse:
      description: Request to purge cluster data is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    JoinPartitionResponse:
      description: Request for the broker to join the partition is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    LeavePartitionResponse:
      description: Request for the broker to leave the partition is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    RemoveBrokerResponse:
      description: Request to remove broker is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    GetTopologyResponse:
      description: response body for getting current topology
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/GetTopologyResponse"

    GetConfigurationChangeResponse:
      description: response body for getting one configuration change
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/ConfigurationChange"

    GetConfigurationChangesResponse:
      description: response body for listing configuration changes
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/GetConfigurationChangesResponse"
