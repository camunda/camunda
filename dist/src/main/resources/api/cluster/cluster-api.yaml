openapi: "3.0.2"
info:
  title: Cluster Topology Management API
  version: "1.0"
  description: API for managing cluster membership and partition distribution.
servers:
  - url: "{schema}://{host}:{port}/actuator/cluster"
    variables:
      host:
        default: localhost
        description: Management server hostname
      port:
        default: "9600"
        description: Management server port
      schema:
        default: http
        description: Management server schema
paths:
  /brokers/{brokerId}:
    post:
      summary: Add a broker to the cluster
      description: Add a broker with the given brokerId to the cluster. The broker must be running
        to complete the operation.
      parameters:
        - $ref: '#/components/parameters/BrokerId'
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          $ref: '#/components/responses/AddBrokersResponse'
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
    delete:
      summary: Remove a broker from the cluster.
      description: Remove a broker with the given brokerId from the cluster. The broker must be
        running to complete the operation.
      parameters:
        - $ref: '#/components/parameters/BrokerId'
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          $ref: '#/components/responses/RemoveBrokerResponse'
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
  /brokers:
    post:
      summary: Reconfigure the cluster with the given brokers.
      description: The final cluster consists of only the brokers in the request body. New brokers
        in the request will be added to the cluster. Any existing brokers that are not part
        of the request will be removed from the cluster. The partitions will be re-distributed
        to the given brokers. All brokers must be running to complete the operation unless the
        parameter force is set to true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/ScaleRequest"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
        - $ref: '#/components/parameters/ForceParameter'
        - $ref: '#/components/parameters/ReplicationFactorParameter'
      responses:
        '202':
          $ref: "#/components/responses/ScaleBrokersResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /purge:
    post:
      summary: Purge data from the cluster
      description: Purges data from Zeebe cluster and all exporters.
        This operation is irreversible and will remove all data from the cluster!
        During this operation all brokers will leave their partitions, data will be deleted,
        and then the brokers will rejoin their partition with empty state, restoring the
        original topology.
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          $ref: "#/components/responses/ClusterConfigPurgeResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /:
    get:
      summary: Get current topology
      description: Returns the current topology of the cluster.
      responses:
        '200':
          $ref: "#/components/responses/GetTopologyResponse"
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

    patch:
      summary: Reconfigure cluster
      description: Reconfigure cluster by adding or removing brokers, adding more partitions, or
                   changing the replicationFactor. Note that adding partitions is an experimental
                   feature and not fully supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/ClusterConfigPatchRequest"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
        - $ref: '#/components/parameters/ForceParameter'
      responses:
        '202':
          $ref: "#/components/responses/ClusterConfigPatchResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /routing-state:
    patch:
      summary:
        Force an update of the routing state using the user provided routing state
        or by fetching the routing state from the engine first and then
        applying it to the configuration.
        No validation is performed on the user provided routing state, so it must be
        used only in the rare circumstances when it's not possible to fetch it from the engine.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/RoutingState"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /partition-distribution:
    put:
      summary:
        Update the partition distribution configuration. Exactly one of `config` and `zonePriorities` must be set.

        Setting `config` persists a new configuration and applies it immediately by computing the necessary
        partition join, leave, and priority-reconfiguration operations. When migrating a bare or partially zoned
        cluster to zone-aware (see `PUT /cluster/zones`), list zones in `config.zones` in the order they should
        receive the existing (bare) nodes — the first zone receives node 0, the second node 1, and so on, wrapping
        around by zone count. This order only matters for that one-time migration; once all zones are migrated,
        every other API addresses zones by name.

        Setting `zonePriorities` re-orders the zones' priorities on a fully zone-aware cluster. The
        priorities values are reused and they are just reassigned to a different zone based on the order of the zones in the
        request. The first zone gets the highest existing priority value, the second zone the next highest, and so on. No new
        priority values are introduced. This only updates the priorities; it does not itself move partition
        leaders. Leaders move to the newly-preferred zone on the next election (e.g. triggered by a separate
        rebalance). It must list exactly the currently configured zones; idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/UpdatePartitionDistributionRequest"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/PlannedOperationsResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /zones/{zoneId}:
    delete:
      summary: Force-remove a zone
      description: Force-evicts the given zone's brokers from the cluster and drops the zone from
        the persisted partition distribution configuration, in one atomic change. Use this when a
        zone is down and its brokers are unreachable.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/PlannedOperationsResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
    post:
      summary: Add back a previously force-removed zone
      description: Re-adds the operator-supplied brokers and re-includes the given zone in the
        persisted partition distribution configuration, with the supplied replica count and
        priority, in one atomic change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/AddZoneRequest"
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/PlannedOperationsResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'

  /zones:
    put:
      summary:
        Migrate one zone of a bare or partially zoned cluster to a zone-aware topology. The request
        contains only the zone name. Before migrating a zone, update the persisted partition
        distribution with `PUT /cluster/partition-distribution` with a zone aware partition distribution.
        For dual-region clusters, migrate the secondary zone first (odd-numbered nodes) and then the primary zone.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components.yaml#/schemas/ClusterZoneMigrationRequest"
      parameters:
        - $ref: '#/components/parameters/DryRunParameter'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/PlannedOperationsResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          $ref: 'components.yaml#/responses/ConcurrentChangeError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
      x-added-in-version: "8.10.0"

  /rebalance:
    post:
      summary: Start a cluster-wide leadership rebalance
      description:
        Transfer leadership of every partition that is not led by its highest-priority replica
        towards that replica, one partition at a time. Returns as soon as the rebalance has been
        accepted; poll `GET /cluster/rebalance` to follow it. Only one rebalance runs at a time and
        rebalances neither queue nor merge, because each pins its own view of the desired leaders.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebalanceRequest"
      responses:
        '202':
          description: The rebalance was accepted, and is reported as it starts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceStatusResponse"
        '400':
          $ref: 'components.yaml#/responses/InvalidRequest'
        '409':
          description: A rebalance is already running.
          content:
            application/json:
              schema:
                $ref: "components.yaml#/schemas/Error"
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
      x-added-in-version: "8.10.0"

    get:
      summary: Report the rebalance in flight, and the last one that finished
      description:
        Report where the running rebalance has got to with each partition it covers, and what became
        of the last rebalance to finish. Both are held in memory by the coordinating broker, so a
        coordinator that has restarted or moved reports an idle status with no history.
      responses:
        '200':
          description: The current rebalance status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceStatusResponse"
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
      x-added-in-version: "8.10.0"

    delete:
      summary: Stop the running rebalance
      description:
        Ask the running rebalance to stop once the transfer in flight has finished, so that no
        partition is left part-way through a transfer. Partitions already transferred keep their new
        leaders; those the rebalance had not reached keep their current ones. Cancelling is always
        accepted, so `wasRunning` is how a cancellation that stopped a rebalance is told apart from
        one that found nothing to stop.
      responses:
        '200':
          description: The cancellation was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceCancellationResponse"
        '500':
          $ref: 'components.yaml#/responses/InternalError'
        '502':
          $ref: 'components.yaml#/responses/GatewayError'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
        '504':
          $ref: 'components.yaml#/responses/TimeoutError'
      x-added-in-version: "8.10.0"

components:
  parameters:
    BrokerId:
      name: brokerId
      required: true
      in: path
      description: Id of the broker
      schema:
        $ref: 'components.yaml#/schemas/BrokerId'
    ZoneId:
      name: zoneId
      required: true
      in: path
      description: Name of the zone
      schema:
        type: string
    DryRunParameter:
      name: dryRun
      description: If true, requested changes are only simulated and not actually applied.
      in: query
      style: form
      required: false
      schema:
        type: boolean
        default: false
    ForceParameter:
      name: force
      description: If true, the operation is a force operation. This is typically used to force remove a set of brokers when they are not available.
      in: query
      style: form
      required: false
      schema:
        type: boolean
        default: false
    ReplicationFactorParameter:
      name: replicationFactor
      description: The new replication factor for the partitions. If not specified, the current replication factor is used.
      in: query
      style: form
      required: false
      schema:
        type: integer
        format: int32
  responses:
    AddBrokersResponse:
      description: Request to add a new broker is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    ScaleBrokersResponse:
      description: Request to reconfigure brokers is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    ClusterConfigPatchResponse:
      description: Request to reconfigure cluster is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    ClusterConfigPurgeResponse:
      description: Request to purge cluster data is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    RemoveBrokerResponse:
      description: Request to remove broker is accepted.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/PlannedOperationsResponse"

    GetTopologyResponse:
      description: response body for getting current topology
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/GetTopologyResponse"

    CoordinatorUnavailable:
      description:
        The broker coordinating rebalances could not be reached. It may have restarted or the
        coordinating role may be moving between brokers; retry the request.
      content:
        application/json:
          schema:
            $ref: "components.yaml#/schemas/Error"

  schemas:
    RebalanceRequest:
      title: RebalanceRequest
      description: What to run one rebalance under, and whether to carry it out at all.
      type: object
      allOf:
        - $ref: "#/components/schemas/RebalanceSettings"
        - type: object
          properties:
            dryRun:
              description:
                If true, report the plan the rebalance would carry out without pausing any partition
                or transferring any leadership.
              type: boolean
              default: false

    RebalanceSettings:
      title: RebalanceSettings
      description:
        Settings for one rebalance, each replacing the configured value for that rebalance only.
        Every setting is optional, and whatever is left out keeps its configured value.
      type: object
      properties:
        replicationLagThreshold:
          description:
            The most replication lag, in bytes, a desired leader may have for its transfer to be
            accepted.
          type: integer
          format: int64
          example: 8388608
        replicationTimeout:
          description:
            How long a partition may stay frozen waiting for its desired leader to catch up, as an
            ISO-8601 duration.
          type: string
          example: "PT10S"
        maxTransferAttempts:
          description:
            How many times a leader may prompt its desired leader to campaign before giving up.
          type: integer
          format: int32
          example: 3
        leaderWaitTimeout:
          description:
            How long the coordinator waits for a transfer it handed to a leader to resolve before
            giving up on that partition and moving on, as an ISO-8601 duration. This must stay above
            everything the leader is itself allowed to spend on a transfer, since giving up early
            moves the rebalance on while the partition is still frozen.
          type: string
          example: "PT1M"

    RebalanceStatusResponse:
      title: RebalanceStatusResponse
      description: What the rebalance coordinator is doing, and what it last did.
      type: object
      properties:
        status:
          description: Whether a rebalance is running, and whether it has been asked to stop.
          type: string
          enum:
            - IDLE
            - RUNNING
            - CANCELLING
          example: "RUNNING"
        rebalanceId:
          description:
            Identifies the running rebalance in the coordinator's logs and metrics. Absent while no
            rebalance is running.
          type: integer
          format: int64
          example: 7
        dryRun:
          description: Whether the running rebalance is reporting a plan rather than carrying it out.
          type: boolean
        settings:
          $ref: "#/components/schemas/RebalanceSettings"
        partitions:
          description:
            Every partition the running rebalance covers and where it has got to with each, in the
            order it works through them. Empty while no rebalance is running, and while one is still
            being planned.
          type: array
          items:
            $ref: "#/components/schemas/PartitionRebalanceStatus"
        lastCompletedRebalance:
          $ref: "#/components/schemas/CompletedRebalance"

    CompletedRebalance:
      title: CompletedRebalance
      description:
        The last rebalance this coordinator finished. Absent before one has finished, including
        after the coordinating role has moved to another broker.
      type: object
      properties:
        rebalanceId:
          description: Identifies the rebalance in the coordinator's logs and metrics.
          type: integer
          format: int64
          example: 6
        outcome:
          description: How the rebalance ended.
          type: string
          enum:
            - COMPLETED
            - CANCELLED
            - FAILED
          example: "COMPLETED"
        dryRun:
          description: Whether the rebalance reported a plan rather than carrying it out.
          type: boolean
        partitions:
          description:
            Every partition the rebalance covered and what became of each. For a dry run, the plan
            it would have carried out.
          type: array
          items:
            $ref: "#/components/schemas/PartitionRebalanceStatus"

    PartitionRebalanceStatus:
      title: PartitionRebalanceStatus
      description:
        One partition's place in a rebalance - where its leadership is, where the rebalance wants
        it, and how far the rebalance has got with moving it.
      type: object
      properties:
        id:
          $ref: "components.yaml#/schemas/PartitionId"
        physicalTenantId:
          description:
            The partition group this partition belongs to. Partition ids are unique only within a
            group, so this is needed to identify the partition.
          type: string
          example: "default"
        currentLeader:
          $ref: "components.yaml#/schemas/BrokerId"
        desiredLeader:
          $ref: "components.yaml#/schemas/BrokerId"
        status:
          description: >-
            Where this partition stands in the rebalance. `SKIPPED` means the rebalance had no work
            to do for it, whereas `FAILED` means it wanted to move this partition's leadership and
            did not manage to - including a transfer the partition's leader declined, which never
            froze the partition. Use `reason` to tell those apart.
          type: string
          enum:
            - PENDING
            - TRANSFERRING
            - TRANSFERRED
            - SKIPPED
            - FAILED
          example: "TRANSFERRED"
        reason:
          description:
            Why this partition ended in this status, for a status that does not speak for itself.
            Absent otherwise.
          type: string
          example: "its leader declined the transfer: NOT_REPLICATING"

    RebalanceCancellationResponse:
      title: RebalanceCancellationResponse
      type: object
      properties:
        wasRunning:
          description:
            Whether there was a rebalance to stop. A cancellation is accepted either way.
          type: boolean
          example: true
