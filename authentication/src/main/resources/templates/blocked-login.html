<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f4; --card: #ffffff; --text: #161616; --muted: #525252; --border: #e0e0e0; --accent: #fc5d0d; --button: #161616; --button-text: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --card: #262626; --text: #f4f4f4; --muted: #c6c6c6; --border: #393939; --button: #f4f4f4; --button-text: #161616; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5; }
  main { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 4px; padding: 32px; text-align: center; }
  .icon { width: 48px; height: 48px; color: var(--accent); }
  h1 { margin: 16px 0 8px; font-size: 1.375rem; font-weight: 600; }
  p { margin: 0 0 16px; color: var(--muted); }
  dl { margin: 0 0 24px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 4px; text-align: left; font-size: 0.875rem; }
  dt { color: var(--muted); }
  dd { margin: 0 0 8px; font-weight: 600; word-break: break-all; }
  dd:last-child { margin-bottom: 0; }
  .button { display: inline-block; font-weight: 600; text-decoration: none; border-radius: 4px; padding: 10px 24px; background: var(--button); color: var(--button-text); }
</style>
</head>
<body>
<main>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg>
  <h1>{{title}}</h1>
  <p>{{text}}</p>
  <dl>
    <dt>Username</dt><dd>{{username}}</dd>{{details}}
  </dl>
  <a class="button" href="{{resetUrl}}">Sign in again</a>
</main>
</body>
</html>
