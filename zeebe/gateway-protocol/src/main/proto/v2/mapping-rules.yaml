        - Mapping rule
      operationId: createMappingRule
      x-required-permissions:
        - { resourceType: MAPPING_RULE, permissionType: CREATE }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Create mapping rule
      description: |
        Create a new mapping rule
      x-semantic-establishes:
        kind: MappingRule
        identifiedBy:
          - { in: body, name: mappingRuleId, semanticType: MappingRuleId }
      requestBody:
        content:
          application/json:
