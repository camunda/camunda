## Schema definitions

components:
  schemas:
    MappingRuleCreateUpdateRequest:
      type: object
      properties:
        claimName:
          type: string
          description: The name of the claim to map.
        claimValue:
          type: string
          description: The value of the claim to map.
        name:
          type: string
          description: The name of the mapping rule.
      required:
        - claimName
        - claimValue
        - name

    MappingRuleCreateRequest:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/MappingRuleCreateUpdateRequest'
      properties:
        mappingRuleId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/MappingRuleId'
          description: The unique ID of the mapping rule.
      required:
        - mappingRuleId

    MappingRuleUpdateRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/MappingRuleCreateUpdateRequest'

    MappingRuleCreateUpdateResult:
      type: object
      properties:
        claimName:
          type: string
          description: The name of the claim to map.
        claimValue:
          type: string
          description: The value of the claim to map.
        name:
          type: string
          description: The name of the mapping rule.
        mappingRuleId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/MappingRuleId'
          description: The unique ID of the mapping rule.
      required:
        - claimName
        - claimValue
        - name
        - mappingRuleId

    MappingRuleCreateResult:
      type: object
      allOf:
        - $ref: '#/components/schemas/MappingRuleCreateUpdateResult'

    MappingRuleUpdateResult:
      type: object
      allOf:
        - $ref: '#/components/schemas/MappingRuleCreateUpdateResult'

    MappingRuleSearchQueryResult:
      required:
        - items
      type: object
      allOf:
        - $ref: "search-models.yaml#/components/schemas/SearchQueryResponse"
      properties:
        items:
          description: The matching mapping rules.
          type: array
          items:
            $ref: '#/components/schemas/MappingRuleResult'

    MappingRuleResult:
      type: object
      properties:
        claimName:
          type: string
          description: The name of the claim to map.
        claimValue:
          type: string
          description: The value of the claim to map.
        name:
          type: string
          description: The name of the mapping rule.
        mappingRuleId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/MappingRuleId'
          description: The ID of the mapping rule.
      required:
        - claimName
        - claimValue
        - name
        - mappingRuleId

    MappingRuleSearchQuerySortRequest:
      type: object
      properties:
        field:
          description: The field to sort by.
          type: string
          enum:
            - mappingRuleId
            - claimName
            - claimValue
            - name
        order:
          $ref: 'search-models.yaml#/components/schemas/SortOrderEnum'
      required:
        - field

    MappingRuleSearchQueryRequest:
      additionalProperties: false
      allOf:
        - $ref: 'search-models.yaml#/components/schemas/SearchQueryRequest'
      type: object
      properties:
        sort:
          description: Sort field criteria.
          type: array
          items:
            $ref: '#/components/schemas/MappingRuleSearchQuerySortRequest'
        filter:
          description: The mapping rule search filters.
          allOf:
            - $ref: '#/components/schemas/MappingRuleFilter'

    MappingRuleFilterFields:
      description: Mapping rule search filter fields.
      type: object
      properties:
        claimName:
          type: string
          description: The claim name to match against a token.
        claimValue:
          type: string
          description: The value of the claim to match.
        name:
          description: The name of the mapping rule.
          allOf:
            - $ref: 'filters.yaml#/components/schemas/StringFilterProperty'
        mappingRuleId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/MappingRuleId'
          description: The ID of the mapping rule.

    MappingRuleFilter:
      description: Mapping rule search filter.
      allOf:
        - $ref: '#/components/schemas/MappingRuleFilterFields'
        - type: object
          properties:
            $or:
              description: |
                Defines a list of alternative filter groups combined using OR logic. Each object in the array is evaluated independently, and the filter matches if any one of them is satisfied.

                Top-level fields and the `$or` clause are combined using AND logic — meaning: (top-level filters) AND (any of the `$or` filters) must match.
                <br>
                <em>Example:</em>

                ```json
                {
                  "$or": [
                    { "mappingRuleId": "rule-1" },
                    { "mappingRuleId": "rule-2" }
                  ]
                }
                ```
                This matches mapping rules whose <code>mappingRuleId</code> is <em>rule-1</em> or <em>rule-2</em>.
                <br>
                <p>Note: Using complex <code>$or</code> conditions may impact performance, use with caution in high-volume environments.
              type: array
              items:
                $ref: '#/components/schemas/MappingRuleFilterFields'
          x-properties-added-in-version:
            - propertyName: "$or"
              addedInVersion: "8.10"
