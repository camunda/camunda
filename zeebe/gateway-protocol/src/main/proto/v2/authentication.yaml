## Endpoint definitions
paths:
  /authentication/me:
    get:
      x-eventually-consistent: false
      tags:
        - Authentication
      operationId: getAuthentication
      x-required-permissions: []
      summary: Get current user
      description: Retrieves the current authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current user is successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamundaUserResult'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.8"
      x-scope: physical-tenant

  /authentication/me/authorizations/search:
    post:
      x-eventually-consistent: true
      tags:
        - Authentication
      operationId: searchOwnAuthorizations
      x-required-permissions: []
      summary: Search own authorizations
      description: >-
        Search for the current authenticated principal's own authorization records — including
        authorizations granted directly to the user or client, as well as those granted via a group,
        role, or mapping rule the principal belongs to.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: 'authorizations.yaml#/components/schemas/AuthorizationSearchQuery'
      responses:
        "200":
          description: The authorization search result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnAuthorizationSearchResult'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.10"
      x-scope: physical-tenant

## Schema definitions

components:
  schemas:
    OwnAuthorizationSearchResult:
      type: object
      allOf:
        - $ref: 'authorizations.yaml#/components/schemas/AuthorizationSearchResult'
      required:
        - authorizationsEnabled
      properties:
        authorizationsEnabled:
          description: Indicates whether authorization checks are enabled for the cluster.
          type: boolean

    CamundaUserResult:
      type: object
      required:
        - authorizedComponents
        - tenants
        - groups
        - roles
        - salesPlanType
        - c8Links
        - canLogout
        - displayName
        - email
        - username
      properties:
        username:
          description: The username of the user.
          allOf:
            - $ref: "identifiers.yaml#/components/schemas/Username"
        displayName:
          description: The display name of the user.
          type: string
          example: Samantha Willis
          nullable: true
        email:
          description: The email of the user.
          type: string
          example: swillis@acme.com
          nullable: true
        authorizedComponents:
          description: The web components the user is authorized to use.
          type: array
          example:
            - "*"
          items:
            type: string
        tenants:
          description: The tenants the user is a member of.
          type: array
          items:
            $ref: 'tenants.yaml#/components/schemas/TenantResult'
        groups:
          description: The groups assigned to the user.
          type: array
          example:
            - customer-service
          items:
            type: string
        roles:
          description: The roles assigned to the user.
          type: array
          example:
            - frontline-support
          items:
            type: string
        salesPlanType:
          description: The plan of the user.
          nullable: true
          type: string
          example: ""
        c8Links:
          description: The links to the components in the C8 stack.
          type: object
          example: {}
          additionalProperties:
            type: string
        canLogout:
          description: Flag for understanding if the user is able to perform logout.
          type: boolean
