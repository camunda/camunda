## Endpoint definitions

paths:
  /variables/history/search:
    post:
      x-eventually-consistent: true
      tags:
        - Variable
      operationId: searchVariableHistory
      x-permission-enforcement: filter
      x-required-permissions:
        - { resourceType: PROCESS_DEFINITION, permissionType: READ_PROCESS_INSTANCE }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Search variable history
      description: |-
        Search for variable history items, which record the changes made to a variable's
        value over time. The audit log configuration decides which changes are recorded;
        by default, only changes made by users are.

        Results are sorted by `variableHistoryItemKey` ascending by default, which lists the
        changes of one variable from oldest to newest. Across partitions, the key says nothing
        about time: a search that spans partitions, for example by process definition, lists the
        changes of one partition after the other.

        By default, the endpoint truncates long variable values in the response. For the output
        collection of a multi-instance element or an ad-hoc sub-process, the endpoint cuts the
        value at the size limit regardless of the `truncateValues` parameter. The truncation
        size limit is configurable.
      parameters:
        - name: truncateValues
          in: query
          required: false
          description: When true (default), long variable values in the response are truncated. When false, full variable values are returned where available.
          schema:
            type: boolean
            default: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableHistoryItemSearchQuery'
      responses:
        "200":
          description: The variable history search result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableHistoryItemSearchQueryResult'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.11"
      x-scope: physical-tenant

  /variables/search:
    post:
      x-eventually-consistent: true
      tags:
        - Variable
      operationId: searchVariables
      x-permission-enforcement: filter
      x-required-permissions:
        - { resourceType: PROCESS_DEFINITION, permissionType: READ_PROCESS_INSTANCE }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Search variables
      description: |-
        Search for variables based on given criteria.

        This endpoint returns variables that exist directly at the specified scopes - it does not
        include variables from parent scopes that would be visible through the scope hierarchy.

        Variables can be process-level (scoped to the process instance) or local (scoped to specific
        BPMN elements like tasks, subprocesses, etc.).

        By default, long variable values in the response are truncated.
      parameters:
        - name: truncateValues
          in: query
          required: false
          description: When true (default), long variable values in the response are truncated. When false, full variable values are returned.
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableSearchQuery'
      responses:
        "200":
          description: The variable search result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableSearchQueryResult'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.8"
      x-scope: physical-tenant

  /variables/{variableKey}:
    get:
      x-eventually-consistent: true
      tags:
        - Variable
      operationId: getVariable
      x-required-permissions:
        - { resourceType: PROCESS_DEFINITION, permissionType: READ_PROCESS_INSTANCE }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Get variable
      description: |-
        Get a variable by its key.

        This endpoint returns both process-level and local (element-scoped) variables.
        The variable's scopeKey indicates whether it's a process-level variable or scoped to a
        specific element instance.
      parameters:
        - name: variableKey
          in: path
          required: true
          description: The variable key.
          schema:
            $ref: 'keys.yaml#/components/schemas/VariableKey'
      responses:
        "200":
          description: The variable is successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableResult'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "problem-detail.yaml#/components/schemas/ProblemDetail"
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.8"
      x-scope: physical-tenant

## Schema definitions

components:
  schemas:
    VariableSearchQuerySortRequest:
      type: object
      properties:
        field:
          description: The field to sort by.
          type: string
          enum:
            - value
            - name
            - tenantId
            - variableKey
            - scopeKey
            - processInstanceKey
        order:
          $ref: 'search-models.yaml#/components/schemas/SortOrderEnum'
      required:
        - field

    VariableSearchQuery:
      description: Variable search query request.
      additionalProperties: false
      type: object
      allOf:
        - $ref: 'search-models.yaml#/components/schemas/SearchQueryRequest'
      properties:
        sort:
          description: Sort field criteria.
          type: array
          items:
            $ref: '#/components/schemas/VariableSearchQuerySortRequest'
        filter:
          description: The variable search filters.
          allOf:
            - $ref: '#/components/schemas/VariableFilter'

    VariableFilter:
      description: Variable filter request.
      type: object
      properties:
        name:
          description: Name of the variable.
          allOf:
            - $ref: 'filters.yaml#/components/schemas/StringFilterProperty'
        value:
          description: |
            The value of the variable.
            Variable values in filters need to be in serialized JSON format. For example, a variable
            with string value `myValue` can be found with the filter value `"myValue"`. Consider
            appropriate escaping for special characters in JSON strings when constructing filter values.
          allOf:
            - $ref: 'filters.yaml#/components/schemas/StringFilterProperty'
        tenantId:
          description: Tenant ID of this variable.
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/TenantId'
        isTruncated:
          description: Whether the value is truncated or not.
          type: boolean
        variableKey:
          description: The key for this variable.
          allOf:
            - $ref: 'keys.yaml#/components/schemas/VariableKeyFilterProperty'
        scopeKey:
          description: |
            The key of the scope that defines where this variable is directly defined. This can be a
            process instance key (for process-level variables) or an element instance key (for local
            variables scoped to tasks, subprocesses, gateways, events, etc.). Use this filter to
            find variables directly defined in specific scopes. Note that this does not include
            variables from parent scopes that would be visible through the scope hierarchy.
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ScopeKeyFilterProperty'
        processInstanceKey:
          description: The key of the process instance of this variable.
          allOf:
          - $ref: 'keys.yaml#/components/schemas/ProcessInstanceKeyFilterProperty'

    VariableSearchQueryResult:
      description: Variable search query response.
      type: object
      required:
        - items
      allOf:
        - $ref: 'search-models.yaml#/components/schemas/SearchQueryResponse'
      properties:
        items:
          description: The matching variables.
          type: array
          items:
            $ref: '#/components/schemas/VariableSearchResult'

    VariableSearchResult:
      required:
        - isTruncated
        - value
      description: Variable search response item.
      type: object
      allOf:
        - $ref: '#/components/schemas/VariableResultBase'
      properties:
        value:
          description: Value of this variable. Can be truncated.
          type: string
        isTruncated:
          description: Whether the value is truncated or not.
          type: boolean

    VariableResult:
      description: Variable search response item.
      type: object
      required:
        - value
      allOf:
        - $ref: '#/components/schemas/VariableResultBase'
      properties:
        value:
          description: Full value of this variable.
          type: string

    VariableResultBase:
      description: Variable response item.
      type: object
      required:
        - name
        - processInstanceKey
        - tenantId
        - variableKey
        - scopeKey
        - rootProcessInstanceKey
      properties:
        name:
          description: Name of this variable.
          type: string
        tenantId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/TenantId'
          description: Tenant ID of this variable.
        variableKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/VariableKey'
          description: The key for this variable.
        scopeKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ScopeKey'
          description: |
            The key of the scope where this variable is directly defined. For process-level
            variables, this is the process instance key. For local variables, this is the key of the
            specific element instance (task, subprocess, gateway, event, etc.) where the variable is
            directly defined.
        processInstanceKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ProcessInstanceKey'
          description: The key of the process instance of this variable.
        rootProcessInstanceKey:
          description: |
            The key of the root process instance. The root process instance is the top-level
            ancestor in the process instance hierarchy. This field is only present for data
            belonging to process instance hierarchies created in version 8.9 or later.
          nullable: true
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ProcessInstanceKey'
      x-properties-added-in-version:
        - propertyName: rootProcessInstanceKey
          addedInVersion: "8.9"

    VariableValueFilterProperty:
      type: object
      properties:
        name:
          type: string
          description: Name of the variable.
        value:
          allOf:
            - $ref: 'filters.yaml#/components/schemas/StringFilterProperty'
          description: |
            The value of the variable.
            Variable values in filters need to be in serialized JSON format. For example, a variable
            with string value `myValue` can be found with the filter value `"myValue"`. Consider
            appropriate escaping for special characters in JSON strings when constructing filter values.
      required:
        - name
        - value

    SetVariableRequest:
      type: object
      additionalProperties: false
      properties:
        variables:
          description: JSON object representing the variables to set in the element’s scope.
          additionalProperties: true
          type: object
        local:
          description: |-
            If set to `true`, the variables are merged strictly into the local scope (as specified
            by the `elementInstanceKey`). Otherwise, the variables are propagated to upper scopes
            and set at the outermost one.

            Let's consider the following example:
            There are two scopes '1' and '2'. Scope '1' is the parent scope of '2'. The effective
            variables of the scopes are:
            1 => { "foo" : 2 }
            2 => { "bar" : 1 }

            An update request with elementInstanceKey as '2', variables { "foo": 5 }, and local set
            to `true` leaves scope '1' unchanged and adjusts scope '2' to { "bar": 1, "foo": 5 }. By
            default, with local set to `false`, scope '1' will be { "foo": 5 } and scope '2' will be
            { "bar": 1 }.
          type: boolean
          default: false
        operationReference:
          $ref: 'keys.yaml#/components/schemas/OperationReference'
      required:
        - variables
      x-properties-added-in-version:
        - propertyName: "variables"
          addedInVersionOverride: "8.6"
        - propertyName: "local"
          addedInVersionOverride: "8.6"
        - propertyName: "operationReference"
          addedInVersionOverride: "8.6"

    VariableHistoryItemSearchQuerySortRequest:
      type: object
      additionalProperties: false
      properties:
        field:
          description: The field to sort by.
          type: string
          enum:
            - variableHistoryItemKey
        order:
          $ref: 'search-models.yaml#/components/schemas/SortOrderEnum'
      required:
        - field

    VariableHistoryItemSearchQuery:
      description: Variable history item search query request.
      additionalProperties: false
      type: object
      allOf:
        - $ref: 'search-models.yaml#/components/schemas/SearchQueryRequest'
      properties:
        sort:
          description: Sort field criteria.
          type: array
          items:
            $ref: '#/components/schemas/VariableHistoryItemSearchQuerySortRequest'
        filter:
          description: The variable history item search filters.
          allOf:
            - $ref: '#/components/schemas/VariableHistoryItemFilter'

    VariableHistoryItemFilter:
      description: Variable history item filter request.
      type: object
      properties:
        variableKey:
          description: The key of the variable this history item belongs to.
          allOf:
            - $ref: 'keys.yaml#/components/schemas/VariableKeyFilterProperty'
        processInstanceKey:
          description: The key of the process instance of this variable.
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ProcessInstanceKeyFilterProperty'
        name:
          description: Name of the variable.
          allOf:
            - $ref: 'filters.yaml#/components/schemas/StringFilterProperty'
        scopeKey:
          description: |
            The key of the scope that defines where this variable is directly defined. This can
            be a process instance key (for process-level variables) or an element instance key
            (for local variables scoped to tasks, sub-processes, gateways, events, etc.).
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ScopeKeyFilterProperty'
        elementId:
          description: The model-defined id of the element that caused this change, if any.
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/ElementIdFilterProperty'
        elementInstanceKey:
          description: The key of the element instance that caused this change, if any.
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ElementInstanceKeyFilterProperty'
        variableHistoryItemKey:
          description: The unique key of this variable history item.
          allOf:
            - $ref: 'keys.yaml#/components/schemas/VariableHistoryItemKeyFilterProperty'
        processDefinitionKey:
          description: The key of the process definition.
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ProcessDefinitionKeyFilterProperty'
        processDefinitionId:
          description: The id of the process definition.
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/ProcessDefinitionIdFilterProperty'
        tenantId:
          description: The tenant id of this variable.
          allOf:
            - $ref: 'filters.yaml#/components/schemas/StringFilterProperty'
        timestamp:
          description: The timestamp when this change occurred.
          allOf:
            - $ref: 'filters.yaml#/components/schemas/DateTimeFilterProperty'
        operationType:
          description: The type of operation that produced this variable change.
          allOf:
            - $ref: '#/components/schemas/VariableHistoryItemOperationTypeFilterProperty'
        variableOperationType:
          description: What wrote this variable value.
          allOf:
            - $ref: '#/components/schemas/VariableHistoryItemVariableOperationTypeFilterProperty'
        actorType:
          description: The type of the actor who performed the operation.
          allOf:
            - $ref: '#/components/schemas/VariableHistoryItemActorTypeFilterProperty'
        actorId:
          description: The id of the user or client that caused this change, if known.
          allOf:
            - $ref: 'filters.yaml#/components/schemas/StringFilterProperty'
        agentElementId:
          description: |
            The element id of the agent that caused this change, for example the element id
            of an ad-hoc sub-process, if any.
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/ElementIdFilterProperty'

    VariableHistoryItemSearchQueryResult:
      description: Variable history item search query response.
      type: object
      required:
        - items
      allOf:
        - $ref: 'search-models.yaml#/components/schemas/SearchQueryResponse'
      properties:
        items:
          description: The matching variable history items.
          type: array
          items:
            $ref: '#/components/schemas/VariableHistoryItemSearchResult'

    VariableHistoryItemSearchResult:
      required:
        - value
        - isTruncated
      description: Variable history item search response item.
      type: object
      allOf:
        - $ref: '#/components/schemas/VariableHistoryItemResultBase'
      properties:
        value:
          description: Value of this variable change. Can be truncated, also when `truncateValues` is false, for the output collection of a multi-instance element or an ad-hoc sub-process.
          type: string
        isTruncated:
          description: Indicates if the value is truncated.
          type: boolean

    VariableHistoryItemResultBase:
      description: Variable history item response base.
      type: object
      required:
        - variableHistoryItemKey
        - variableKey
        - name
        - scopeKey
        - elementInstanceKey
        - elementId
        - processInstanceKey
        - rootProcessInstanceKey
        - processDefinitionKey
        - processDefinitionId
        - tenantId
        - timestamp
        - operationType
        - variableOperationType
        - actorType
        - actorId
        - agentElementId
      properties:
        variableHistoryItemKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/VariableHistoryItemKey'
          description: The unique key of this variable history item.
        variableKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/VariableKey'
          description: The key of the variable this history item belongs to.
        name:
          description: Name of the variable.
          type: string
        scopeKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ScopeKey'
          description: |
            The key of the scope where this variable is directly defined. For process-level
            variables, this is the process instance key. For local variables, this is the key
            of the specific element instance where the variable is directly defined.
        elementInstanceKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ElementInstanceKey'
          description: The key of the element instance that caused this change, if any.
          nullable: true
        elementId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/ElementId'
          description: The model-defined id of the element that caused this change, if any.
          nullable: true
        processInstanceKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ProcessInstanceKey'
          description: The key of the process instance of this variable.
        rootProcessInstanceKey:
          description: |
            The key of the root process instance. The root process instance is the top-level
            ancestor in the process instance hierarchy. This field is only present for data
            belonging to process instance hierarchies created in version 8.9 or later.
          nullable: true
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ProcessInstanceKey'
        processDefinitionKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ProcessDefinitionKey'
          description: The key of the process definition.
        processDefinitionId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/ProcessDefinitionId'
          description: The id of the process definition.
        tenantId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/TenantId'
          description: The tenant id of this variable.
        timestamp:
          type: string
          format: date-time
          description: The timestamp when this change occurred.
        operationType:
          $ref: '#/components/schemas/VariableHistoryItemOperationTypeEnum'
        variableOperationType:
          $ref: '#/components/schemas/VariableHistoryItemVariableOperationTypeEnum'
        actorType:
          $ref: '#/components/schemas/VariableHistoryItemActorTypeEnum'
        actorId:
          type: string
          description: The id of the user or client that caused this change, if known.
          nullable: true
        agentElementId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/ElementId'
          description: |
            The element id of the agent that caused this change, for example the element id
            of an ad-hoc sub-process, if any.
          nullable: true

    ## Enums

    VariableHistoryItemOperationTypeEnum:
      type: string
      description: |
        The type of operation that produced this variable change. Camunda can add values in later
        versions; clients must handle unknown values gracefully.
      enum:
        - CREATE
        - UPDATE

    VariableHistoryItemVariableOperationTypeEnum:
      type: string
      description: |
        What wrote this variable value, for example a job completion, a script result, or a
        multi-instance output collection. Camunda can add values in later versions; clients must
        handle unknown values gracefully.
      enum:
        - API
        - USER_TASK_COMPLETION
        - PROCESS_INSTANCE_CREATION
        - PROCESS_INSTANCE_MODIFICATION
        - JOB_COMPLETION
        - JOB_FAILURE
        - JOB_ERROR
        - EXECUTION_LISTENER_COMPLETION
        - MESSAGE_CORRELATION
        - SIGNAL_BROADCAST
        - CONDITIONAL_EVALUATION
        - AD_HOC_SUB_PROCESS_ACTIVATION
        - INPUT_MAPPING
        - OUTPUT_MAPPING
        - SCRIPT_RESULT
        - DECISION_RESULT
        - CALL_ACTIVITY_INPUT
        - CALL_ACTIVITY_OUTPUT
        - MULTI_INSTANCE_INPUT_ELEMENT
        - MULTI_INSTANCE_LOOP_COUNTER
        - MULTI_INSTANCE_OUTPUT_ELEMENT
        - MULTI_INSTANCE_OUTPUT_COLLECTION
        - AD_HOC_SUB_PROCESS_METADATA
        - AD_HOC_SUB_PROCESS_OUTPUT_ELEMENT
        - AD_HOC_SUB_PROCESS_OUTPUT_COLLECTION
        - UNKNOWN

    VariableHistoryItemActorTypeEnum:
      type: string
      description: |
        The type of the actor who performed the operation. Camunda can add values in later
        versions; clients must handle unknown values gracefully.
      enum:
        - USER
        - CLIENT
        - ENGINE
        - UNKNOWN

