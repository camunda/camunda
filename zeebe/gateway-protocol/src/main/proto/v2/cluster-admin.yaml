                $ref: '#/components/schemas/ClusterBalanceResponse'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "502":
          description: The coordinator was reached, but its response was absent or unusable.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "503":
          description: No coordinator is currently available or reachable.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "504":
          description: The coordinator did not answer before the request timeout.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
      x-added-in-version: "8.10"
    delete:
      x-eventually-consistent: false
      tags:
        - Cluster
      operationId: cancelClusterRebalance
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Stop the running rebalance
      description: >-
        Asks the running rebalance to stop once the transfer in flight has finished. Partitions
        already transferred keep their new leaders, and those the rebalance had not yet reached keep
        their current ones.


        Cancellation requests are idempotent and always accepted. The `wasRunning` response field
        can be used to distinguish a cancellation that found a running rebalance from one that did
        not.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials are
        valid here.
      responses:
        "200":
          description: The cancellation was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalanceCancellationResponse'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "502":
          description: The coordinator was reached, but its response was absent or unusable.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "503":
          description: No coordinator is currently available or reachable.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "504":
          description: The coordinator did not answer before the request timeout.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
      x-added-in-version: "8.10"

## Schema definitions

components:
  responses:
    ClusterHistoryBackupForbidden:
      description: >-
        The cluster's secondary storage is neither Elasticsearch nor OpenSearch and therefore
        cannot serve history backups, or a targeted physical tenant's snapshot repository is absent
        from the store — configured under a name the store does not have, or not configured at all.
        Both are deployment faults the caller cannot correct by changing its request; narrow the
        request with `physicalTenantId` to work with the tenants whose repository is usable. Unlike
        the per-physical-tenant backup endpoints, the cluster-admin surface performs no fine-grained
        authorization, so a missing `BACKUP` permission is never the reason.
      content:
        application/problem+json:
          schema:
            $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'

  parameters:
    PhysicalTenantIdParameter:
      name: physicalTenantId
      in: query
      required: false
      description: >-
        The physical tenant to apply the change to. When omitted, or when passed with an empty
        value, the change is applied to every physical tenant of the cluster.
      schema:
        type: string
        example: default

  schemas:
    ClusterStatusResponse:
      description: The aggregated status of the whole cluster.
      type: object
      required:
        - status
      properties:
        status:
          description: >-
            `HEALTHY` when every physical tenant is healthy, `DOWN` when no physical tenant can
            process work, `DEGRADED` in every other case.
          type: string
          example: HEALTHY
          enum:
            - HEALTHY
            - DEGRADED
            - DOWN
    ClusterRestoreRequest:
      description: >-
        Describes a restore request issued by a cluster admin. The backup selection at the top level
        applies to every targeted physical tenant, except for the ones listed in `overrides`.
      type: object
      allOf:
        - $ref: 'cluster.yaml#/components/schemas/RestoreRequest'
      properties:
        overrides:
          description: >-
            The backup selection to apply to individual physical tenants, keyed by physical tenant
            id. Only allowed for a cluster-wide restore, that is when no `physicalTenantId`
            parameter is given.
          type: object
          nullable: true
          additionalProperties:
            $ref: 'cluster.yaml#/components/schemas/RestoreRequest'
          example:
            tenant-a:
              backupIds: [ 55 ]

    ClusterTopologyResponse:
      description: The topology of the whole cluster, aggregated over all physical tenants.
      type: object
      required:
        - brokers
        - clusterId
        - clusterSize
        - gatewayVersion
        - physicalTenants
      properties:
        brokers:
          description: The brokers that are part of this cluster, across all physical tenants.
          type: array
          items:
            $ref: '#/components/schemas/ClusterBrokerInfo'
        clusterId:
          description: The cluster Id.
          type: string
          nullable: true
        clusterSize:
          description: The number of brokers in the cluster.
          type: integer
          format: int32
          example: 3
        gatewayVersion:
          description: The version of the Orchestration Cluster Gateway.
          type: string
          nullable: true
          example: 8.10.0
        physicalTenants:
          description: The topology of each physical tenant of this cluster.
          type: array
          items:
            $ref: '#/components/schemas/PhysicalTenantTopology'

    ClusterBrokerInfo:
      description: Provides information on a broker node, independent of any physical tenant.
      type: object
      required:
        - brokerId
        - host
        - port
        - version
      properties:
        brokerId:
          description: >
            The unique (within a cluster) broker identifier. When the cluster is not zoned, then it's
            a string that represents the nodeId (an integer). When the cluster is zoned, instead,
            it's of the form "$zoneName_$nodeId", providing uniqueness even across zones.
          type: string
          example: "eu-west-1_0"
        host:
          description: The hostname for reaching the broker.
          type: string
          example: zeebe-0.zeebe-broker-service
        port:
          description: The port for reaching the broker.
          type: integer
          format: int32
          example: 26501
        version:
          description: The broker version.
          type: string
          example: 8.10.0

    PhysicalTenantTopology:
      description: The topology of a single physical tenant.
      type: object
      required:
        - physicalTenantId
        - partitionsCount
        - replicationFactor
        - lastCompletedChangeId
        - brokers
      properties:
        physicalTenantId:
          description: The id of the physical tenant.
          type: string
          example: default
        partitionsCount:
          description: The number of partitions spread across this physical tenant.
          type: integer
          format: int32
          example: 3
        replicationFactor:
          description: The configured replication factor for this physical tenant.
          type: integer
          format: int32
          example: 3
        lastCompletedChangeId:
          description: ID of the last completed change of this physical tenant.
          type: string
          example: "-1"
        brokers:
          description: The brokers holding partitions of this physical tenant.
          type: array
          items:
            $ref: '#/components/schemas/PhysicalTenantBrokerTopology'

    PhysicalTenantBrokerTopology:
      description: The partitions of one physical tenant that one broker manages or replicates.
      type: object
      required:
        - brokerId
        - partitions
      properties:
        brokerId:
          description: >
            The unique (within a cluster) identifier of the broker, as reported in the cluster-level
            broker list.
          type: string
          example: "eu-west-1_0"
        partitions:
          description: The partitions of this physical tenant managed or replicated on this broker.
          type: array
          items:
            $ref: 'cluster.yaml#/components/schemas/Partition'

    ClusterTakeRuntimeBackupResponse:
      description: >-
        The outcome of triggering a runtime backup on every targeted physical tenant. Returned both
        when every tenant was triggered and when only some were, so a partial trigger is never
        silent: the status code says whether the request succeeded, the body says what is running.
      type: object
      required:
        - physicalTenants
      properties:
        physicalTenants:
          description: >-
            The outcome for each targeted physical tenant, ordered by physical tenant id. Carries no
            cluster-level backup id: in generated-id mode each tenant generates its own.
          type: array
          items:
            $ref: '#/components/schemas/ClusterRuntimeBackupTakeResult'

    ClusterRuntimeBackupTakeResult:
      description: >-
        Whether one physical tenant's runtime backup was triggered, and under which id it can be
        monitored and deleted.
      type: object
      required:
        - physicalTenantId
        - backupId
        - outcome
        - reason
      properties:
        physicalTenantId:
          description: The id of the physical tenant.
          type: string
          example: default
        backupId:
          description: >-
            The id to monitor or delete this physical tenant's backup by: the id it is running under
            when `TRIGGERED` — the requested one, or the one the tenant generated when ids are
            generated — and the requested id to check when `UNKNOWN`. Null when the tenant is known to
            be running no backup, and also when an `UNKNOWN` tenant generates its own ids, because
            the id it may be running under was never reported; list that tenant's backups to find it.
          nullable: true
          allOf:
            - $ref: 'backups.yaml#/components/schemas/BackupId'
        outcome:
          description: What this physical tenant did with the trigger.
          allOf:
            - $ref: '#/components/schemas/ClusterRuntimeBackupTakeOutcome'
        reason:
          description: >-
            Why this physical tenant reported no triggered backup. Null when it was triggered.
          type: string
          nullable: true
          example: ""

    ClusterRuntimeBackupTakeOutcome:
      title: Cluster Runtime Backup Take Outcome
      description: >-
        What a physical tenant did with the trigger. `TRIGGERED` says the backup is running, not that
        it completed — poll `GET /cluster/v2/backups/runtime/{backupId}` for that. A `FAILED` tenant
        is running no backup for this request and needs no cleanup. `UNKNOWN` means the broker may or
        may not have accepted the request — the connection was cut mid-flight, or the gateway timed
        out waiting — so that tenant's backups have to be checked before retrying; it is reported
        separately from `FAILED` precisely because calling it failed would claim nothing is running
        there. Tenants that were triggered are never rolled back.
      type: string
      enum:
        - TRIGGERED
        - FAILED
        - UNKNOWN
      example: TRIGGERED

    ClusterRuntimeBackupInfo:
      description: >-
        A runtime backup id, what each physical tenant reports for it, and the state aggregated over
        every targeted tenant — folded from the per-tenant states by the same rules a per-tenant state
        is folded from its partitions.
      type: object
      required:
        - backupId
        - state
        - failureReason
        - physicalTenants
      properties:
        backupId:
          description: The id of the backup.
          allOf:
            - $ref: 'backups.yaml#/components/schemas/BackupId'
        state:
          description: >-
            The state aggregated over every targeted physical tenant, whether the backup id was
            looked up directly or listed. A tenant holding nothing for this id counts as
            `DOES_NOT_EXIST`, so the aggregate is `INCOMPLETE` unless every targeted tenant holds
            the backup.
          allOf:
            - $ref: 'backups.yaml#/components/schemas/StateCode'
        failureReason:
          description: Reason for failure if the aggregated state is 'FAILED'.
          type: string
          nullable: true
          example: ""
        physicalTenants:
          description: >-
            What each physical tenant reports for this backup id, ordered by physical tenant id.
            Every targeted tenant is listed, including the ones reporting `DOES_NOT_EXIST`.
          type: array
          items:
            $ref: '#/components/schemas/ClusterRuntimeBackupTenantInfo'

    ClusterRuntimeBackupTenantInfo:
      description: What a single physical tenant reports for a runtime backup id.
      type: object
      required:
        - physicalTenantId
        - state
        - failureReason
        - details
      properties:
        physicalTenantId:
          description: The id of the physical tenant.
          type: string
          example: default
        state:
          description: The state of the backup on this physical tenant, aggregated over its partitions.
          allOf:
            - $ref: 'backups.yaml#/components/schemas/StateCode'
        failureReason:
          description: Reason for failure if the state is 'FAILED'.
          type: string
          nullable: true
          example: ""
        details:
          description: >-
            Detailed status of the backup per partition of this physical tenant. Contains every
            partition of the tenant when the backup id was looked up directly, including for a tenant
            that holds no such backup. Empty for a tenant that holds nothing for a listed id: a
            listing asks each tenant for the backups it has, so there is nothing to report per
            partition for one it does not.
          type: array
          items:
            $ref: 'backups.yaml#/components/schemas/PartitionBackupInfo'

    ClusterRuntimeBackupState:
      description: >-
        The checkpoint and backup state of each physical tenant. Nothing is aggregated across
        tenants: checkpoint ids and log positions only mean anything within one tenant's partitions.
      type: object
      required:
        - physicalTenants
      properties:
        physicalTenants:
          description: >-
            The runtime backup state of each targeted physical tenant, ordered by physical tenant id.
          type: array
          items:
            $ref: '#/components/schemas/ClusterRuntimeBackupTenantState'

    ClusterRuntimeBackupTenantState:
      description: The checkpoint and backup state of one physical tenant.
      type: object
      required:
        - physicalTenantId
        - state
      properties:
        physicalTenantId:
          description: The id of the physical tenant.
          type: string
          example: default
        state:
          description: The checkpoint and backup state of this physical tenant's partitions.
          allOf:
            - $ref: 'backups.yaml#/components/schemas/RuntimeBackupState'

    ClusterTakeHistoryBackupResponse:
      description: >-
        The snapshots scheduled on every targeted physical tenant. No cluster-level state is
        aggregated from the per-tenant outcomes.
      type: object
      required:
        - backupId
        - physicalTenants
      properties:
        backupId:
          description: The id requested for the backup on every targeted physical tenant.
          allOf:
            - $ref: 'backups.yaml#/components/schemas/BackupId'
        physicalTenants:
          description: The outcome for each targeted physical tenant, ordered by physical tenant id.
          type: array
          items:
            $ref: '#/components/schemas/ClusterHistoryBackupTakeResult'

    ClusterHistoryBackupTakeResult:
      description: >-
        The snapshots scheduled on a single physical tenant. Only successfully scheduled tenants are
        reported: the request fails as a whole if any targeted tenant could not schedule the backup.
      type: object
      required:
        - physicalTenantId
        - scheduledSnapshots
      properties:
        physicalTenantId:
          description: The id of the physical tenant.
          type: string
          example: default
        scheduledSnapshots:
          description: The names of the snapshots scheduled on this physical tenant.
          type: array
          items:
            type: string
            description: The name of a scheduled snapshot.
            example: camunda_webapps_1_8.10.0_part_1_of_6

    ClusterHistoryBackupInfo:
      description: >-
        A history backup id and what each physical tenant reports for it. No cluster-level state is
        aggregated from the per-tenant states.
      type: object
      required:
        - backupId
        - physicalTenants
      properties:
        backupId:
          description: The id of the backup.
          allOf:
            - $ref: 'backups.yaml#/components/schemas/BackupId'
        physicalTenants:
          description: >-
            What each physical tenant reports for this backup id, ordered by physical tenant id.
            When looking a backup id up directly, every targeted tenant is listed, including the
            ones reporting `NOT_FOUND`. Within a listing, only the tenants that hold the id are
            listed.
          type: array
          items:
            $ref: '#/components/schemas/ClusterHistoryBackupTenantInfo'

    ClusterHistoryBackupTenantInfo:
      description: What a single physical tenant reports for a history backup id.
      type: object
      required:
        - physicalTenantId
        - state
        - failureReason
        - details
      properties:
        physicalTenantId:
          description: The id of the physical tenant.
          type: string
          example: default
        state:
          description: The state of the backup on this physical tenant.
          allOf:
            - $ref: '#/components/schemas/ClusterHistoryBackupTenantState'
        failureReason:
          description: Reason for failure if the state is 'FAILED'.
          type: string
          nullable: true
          example: ""
        details:
          description: >-
            Detailed status of the backup per snapshot on this physical tenant. Empty when the
            tenant does not hold the backup.
          type: array
          items:
            $ref: 'backups.yaml#/components/schemas/HistoryBackupSnapshotInfo'

    ClusterHistoryBackupTenantState:
      title: Cluster History Backup Tenant State
      description: >-
        What a physical tenant reports for a history backup id: the per-tenant
        `HistoryBackupStateCode` extended with `NOT_FOUND` for a tenant that was read and does not
        hold the backup. `NOT_FOUND` is a successful observation, not a failure — a backup that only
        some physical tenants hold is a supported outcome. There is no state for a tenant that could
        not be read at all, because such a tenant fails the whole request.
      type: string
      enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
        - INCOMPLETE
        - INCOMPATIBLE
        - NOT_FOUND
      example: COMPLETED

    ClusterRebalanceRequest:
      description: >-
        The settings to run a given rebalance with. Every setting is optional; an absent request
        body is equivalent to a body with every field absent, and means "use the configured
        settings".
      type: object
      properties:
        replicationLagThreshold:
          description: >-
            The highest replication lag (in bytes) that a desired leader may have for its transfer
            to be accepted.
          type: integer
          format: int64
          minimum: 0
          example: 8388608
        replicationTimeout:
          description: >-
            How long a partition may stay frozen waiting for its desired leader to catch up (as a
            positive ISO-8601 duration).
          type: string
          example: "PT10S"
        maxTransferAttempts:
          description: >-
            How many times a current leader may prompt the desired leader to take over leadership
            before giving up.
          type: integer
          format: int32
          minimum: 1
          example: 3
        leaderWaitTimeout:
          description: >-
            How long the coordinator waits for a partition without a leader to acquire one before
            reporting `NO_LEADER` and moving on (as a positive ISO-8601 duration).
          type: string
          example: "PT1M"

    ClusterBalanceResponse:
      description: >-
        The cluster's current per-partition balance state, the running rebalance, and the last
        completed rebalance.
      type: object
      required:
        - state
        - partitions
        - runningRebalance
        - lastCompletedRebalance
      properties:
        state:
          description: The cluster's aggregate balance state as of the time of the request.
          type: string
          enum:
            - BALANCED
            - BALANCING
            - UNBALANCED
          example: "UNBALANCED"
        partitions:
          description: >-
            The balance state of each partition as of the time of the request.
          type: array
          items:
            $ref: '#/components/schemas/ClusterRebalancePartition'
        runningRebalance:
          description: >-
            Normally the rebalance currently running, or absent if no rebalance is running. For a
            dry-run response, this is instead the unexecuted plan of that dry run.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClusterRunningRebalance'
        lastCompletedRebalance:
          description: The last completed non-dry-run rebalance this coordinator finished.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClusterCompletedRebalance'

    ClusterRebalancePartition:
      description: >-
        One partition's leadership/balance status - its current leader, its desired leader, and
        whether a rebalance is currently moving it.
      type: object
      required:
        - partitionId
        - physicalTenantId
        - currentLeader
        - desiredLeader
        - state
      properties:
        partitionId:
          description: The unique ID of this partition, within its physical tenant.
          type: integer
          format: int32
          example: 1
        physicalTenantId:
          description: >-
            The partition group this partition belongs to. Partition IDs are unique only within a
            group, so this is needed to identify the partition.
          type: string
          example: default
        currentLeader:
          description: >-
            The broker ID currently leading this partition, or absent if it has no leader.
          type: string
          nullable: true
          example: "0"
        desiredLeader:
          description: The broker ID the current configuration wants to lead this partition.
          type: string
          example: "0"
        state:
          description: >-
            Whether this partition is being actively transferred, unbalanced, or balanced.
          type: string
          enum:
            - TRANSFERRING
            - UNBALANCED
            - BALANCED
          example: "UNBALANCED"


    ClusterRebalance:
      description: >-
        The fields common to a running and a completed rebalance.
      type: object
      required:
        - rebalanceId
        - partitions
        - startedAt
      properties:
        rebalanceId:
          description: The ID of this rebalance.
          type: integer
          format: int64
        partitions:
          description: Every partition in the rebalance plan and its progress within this rebalance.
          type: array
          items:
            $ref: '#/components/schemas/ClusterRebalanceOperationPartition'
        startedAt:
          description: When this rebalance was created.
          type: string
          format: date-time

    ClusterRunningRebalance:
      description: The rebalance currently running.
      allOf:
        - $ref: '#/components/schemas/ClusterRebalance'
        - type: object
          required:
            - dryRun
            - cancelRequested
          properties:
            dryRun:
              description: Whether this rebalance is a dry run.
              type: boolean
            cancelRequested:
              description: >-
                Whether cancellation has been requested.
              type: boolean

    ClusterRebalanceOperationPartition:
      description: One partition's plan, progress, and outcome within a rebalance.
      type: object
      required:
        - partitionId
        - physicalTenantId
        - currentLeader
        - desiredLeader
        - progress
        - result
      properties:
        partitionId:
          description: The unique ID of this partition, within its physical tenant.
          type: integer
          format: int32
          example: 1
        physicalTenantId:
          description: The partition group this partition belongs to.
          type: string
          example: default
        currentLeader:
          description: The leader last observed by this rebalance, or absent if there was no leader.
          type: string
          nullable: true
          example: "0"
        desiredLeader:
          description: The leader selected when this rebalance was planned.
          type: string
          example: "1"
        progress:
          description: Where this rebalance has reached for the partition.
          type: string
          enum:
            - PENDING
            - TRANSFERRING
            - COMPLETED
        result:
          description: The terminal outcome, present only when progress is COMPLETED.
          type: string
          nullable: true
          enum:
            - TRANSFERRED
            - ALREADY_LEADER
            - NOT_MEMBER
            - NOT_REPLICATING
            - UNREACHABLE
            - NOT_COORDINATOR
            - STALE_CONFIGURATION
            - TRANSFER_IN_PROGRESS
            - LAG_TOO_HIGH
            - LEADER_INITIALIZING
            - CONFIGURATION_CHANGE_IN_PROGRESS
            - PAUSE_FAILED
            - REPLICATION_TIMED_OUT
            - TIMEOUT_NOW_EXHAUSTED
            - LEADER_CHANGED
            - NO_LEADER
            - NO_RESPONSE
            - CANCELLED
            - PHYSICAL_TENANT_DISABLED
            - PHYSICAL_TENANT_RECOVERING

    ClusterCompletedRebalance:
      description: >-
        The last completed rebalance.
      allOf:
        - $ref: '#/components/schemas/ClusterRebalance'
        - type: object
          required:
            - finishedAt
            - result
          properties:
            finishedAt:
              description: When this rebalance finished.
              type: string
              format: date-time
            result:
              description: How the rebalance ended.
              type: string
              enum:
                - COMPLETED
                - CANCELLED
                - FAILED
              example: "COMPLETED"

    RebalanceCancellationResponse:
      description: Response to a rebalance cancellation request.
      type: object
      required:
        - wasRunning
      properties:
        wasRunning:
          description: Whether there was a rebalance to stop.
          type: boolean
          example: true
