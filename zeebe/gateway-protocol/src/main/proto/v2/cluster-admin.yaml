# Endpoint definitions for cluster-wide operations.
#
# These endpoints answer for the cluster as a whole, aggregated over every physical tenant, and are
# served on the bare root rather than under the document's `/v2` server base. The `/cluster/v2` base
# therefore lives in the path key, and each path item overrides `servers` to drop the document's
# `/v2` suffix.
#
# Do not "align" the override by moving the base into it: `{host}:{port}/cluster/v2` plus the path
# key resolves to `/cluster/v2/cluster/v2/status`. Shortening the keys to `/status`, `/mode` and
# `/restore` instead is not an option either — all three are already taken by `cluster.yaml` in the
# `rest-api.yaml` path map, and `OpenApiYamlLoader.KNOWN_ROOTS` matches on the literal `/cluster/v2/`
# prefix to skip the runtime `/v2` prefixing that every other path gets.
#
# Cluster endpoints that are scoped to a single physical tenant live in `cluster.yaml`, which also
# owns the parameters and schemas the three operations below share (`DryRunParameter`,
# `ModeParameter`, `RestoreRequest`, `ClusterModeChangeResponse`, `ClusterRestoreResponse`).
#
# The identical `servers` block below is duplicated per path item on purpose, not YAML-anchored.
# Two independent, concrete failures came out of trying to share it via a YAML anchor/alias:
# a plain value-alias (`servers: *anchor`) broke IntelliJ's Swagger UI preview for the aliased
# operation, and a later attempt produced a nested list (`servers: [*anchor]` where the anchor is
# already a list), which broke swagger-parser's Jackson deserialization and silently made
# openapi-generator-maven-plugin skip regenerating clients/java's model classes entirely. Don't
# re-attempt an anchor/alias/merge-key variant here — duplicate the literal block instead.
#
# Every authenticated operation below sits behind the cluster-admin security chain (see
# ClusterAdminBasicSecurityConfiguration / CLUSTER_ADMIN_API_PATTERN), a separate credential set
# from the Orchestration Cluster API. Where an operation reuses the `bearerAuth` / `basicAuth`
# scheme names from that API, it still resolves against different credentials — an Orchestration
# Cluster user session cannot authenticate against it. `getClusterStatus` below is the one
# exception: it is intentionally public (`security: []`), not cluster-admin-gated.

paths:
  /cluster/v2/status:
    servers:
      - url: "{schema}://{host}:{port}"
        variables:
          host:
            default: localhost
            description: The hostname of the Orchestration Cluster REST Gateway.
          port:
            default: "8080"
            description: The port of the Orchestration Cluster REST API server.
          schema:
            default: http
            description: The schema of the Orchestration Cluster REST API server.
    get:
      x-eventually-consistent: false
      tags:
        - Cluster
      operationId: getClusterStatus
      x-required-permissions: [ ]
      # Public health-check endpoint — declared unauthenticated at runtime
      # via SecurityPathAdapter. `security: []` overrides the conditional
      # enforcement on the global schemes for this operation.
      security: [ ]
      summary: Get the status of the whole cluster
      description: >-
        Checks the health status of the whole cluster, aggregated over all physical tenants. Returns
        `HEALTHY` when every physical tenant is healthy, `DOWN` when no physical tenant can process
        work, and `DEGRADED` in every other case. No per-tenant detail is reported; use
        `GET /cluster/v2/topology` for that.


        This endpoint is public and requires no authentication, unlike `PATCH /cluster/v2/mode`
        below, which needs cluster-admin credentials.
      responses:
        "200":
          description: The cluster can process work; the body reports whether it is fully healthy or degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatusResponse'
        "503":
          description: The cluster is DOWN because no physical tenant can process work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatusResponse'
      x-added-in-version: "8.10"

  /cluster/v2/topology:
    servers:
      - url: "{schema}://{host}:{port}"
        variables:
          host:
            default: localhost
            description: The hostname of the Orchestration Cluster REST Gateway.
          port:
            default: "8080"
            description: The port of the Orchestration Cluster REST API server.
          schema:
            default: http
            description: The schema of the Orchestration Cluster REST API server.
    get:
      x-eventually-consistent: false
      tags:
        - Cluster
      operationId: getClusterTopology
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Get the topology of the whole cluster
      description: >-
        Obtains the topology of the whole cluster, aggregated over all physical tenants. Cluster-level
        information is reported once; partition layout, replication and per-partition role, health and
        state are reported per physical tenant.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials are
        valid here. Use `GET /v2/topology` for the topology of a single physical tenant.
      responses:
        "200":
          description: The topology of the whole cluster, aggregated over all physical tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTopologyResponse'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.10"

  /cluster/v2/exporting:
    servers:
      - url: "{schema}://{host}:{port}"
        variables:
          host:
            default: localhost
            description: The hostname of the Orchestration Cluster REST Gateway.
          port:
            default: "8080"
            description: The port of the Orchestration Cluster REST API server.
          schema:
            default: http
            description: The schema of the Orchestration Cluster REST API server.
    get:
      x-eventually-consistent: false
      tags:
        - Exporting
      operationId: getClusterExportingStatus
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Get exporting status of the whole cluster
      description: >-
        Returns the exporting status of the whole cluster, folded over the exporting status of
        every physical tenant. Only `PAUSED` and `SOFT_PAUSED` confirm that exporting is paused
        cluster-wide; every other value means at least one physical tenant is not paused, so
        callers should keep polling. A physical tenant that itself reports `MIXED` makes the
        whole cluster `MIXED`.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials
        are valid here.
      responses:
        "200":
          description: The aggregated exporting status of the whole cluster.
          content:
            application/json:
              schema:
                $ref: 'exporting.yaml#/components/schemas/ExportingStatusResponse'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.10"

  /cluster/v2/exporting/pause:
    servers:
      - url: "{schema}://{host}:{port}"
        variables:
          host:
            default: localhost
            description: The hostname of the Orchestration Cluster REST Gateway.
          port:
            default: "8080"
            description: The port of the Orchestration Cluster REST API server.
          schema:
            default: http
            description: The schema of the Orchestration Cluster REST API server.
    post:
      x-eventually-consistent: false
      tags:
        - Exporting
      operationId: pauseClusterExporting
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Pause exporting across the whole cluster
      description: >-
        Pauses exporting on every physical tenant of the cluster in one call. With `soft=true`,
        every physical tenant is soft-paused instead.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials
        are valid here.
      parameters:
        - name: soft
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: If true, soft-pauses exporting instead of a hard pause.
      responses:
        "204":
          description: Exporting was successfully paused on every physical tenant.
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.10"

  /cluster/v2/exporting/resume:
    servers:
      - url: "{schema}://{host}:{port}"
        variables:
          host:
            default: localhost
            description: The hostname of the Orchestration Cluster REST Gateway.
          port:
            default: "8080"
            description: The port of the Orchestration Cluster REST API server.
          schema:
            default: http
            description: The schema of the Orchestration Cluster REST API server.
    post:
      x-eventually-consistent: false
      tags:
        - Exporting
      operationId: resumeClusterExporting
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Resume exporting across the whole cluster
      description: >-
        Resumes exporting on every physical tenant of the cluster in one call, after a pause or
        soft pause.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials
        are valid here.
      responses:
        "204":
          description: Exporting was successfully resumed on every physical tenant.
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.10"

  /cluster/v2/mode:
    servers:
      - url: "{schema}://{host}:{port}"
        variables:
          host:
            default: localhost
            description: The hostname of the Orchestration Cluster REST Gateway.
          port:
            default: "8080"
            description: The port of the Orchestration Cluster REST API server.
          schema:
            default: http
            description: The schema of the Orchestration Cluster REST API server.
    patch:
      x-eventually-consistent: false
      tags:
        - Recovery
      operationId: changeClusterModeAsClusterAdmin
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Change the cluster mode of one or every physical tenant
      description: >-
        Transitions physical tenants between processing and recovery mode.


        If the `physicalTenantId` parameter is not provided, all available physical tenants are
        transitioned individually.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials are
        valid here.
      parameters:
        - $ref: 'cluster.yaml#/components/parameters/ModeParameter'
        - $ref: '#/components/parameters/PhysicalTenantIdParameter'
        - $ref: 'cluster.yaml#/components/parameters/DryRunParameter'
      responses:
        "200":
          description: >-
            The mode change request was accepted; returns the planned cluster change covering every
            requested physical tenant.
          content:
            application/json:
              schema:
                $ref: 'cluster.yaml#/components/schemas/ClusterModeChangeResponse'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "404":
          description: The requested `physicalTenantId` does not exist in this cluster.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "409":
          description: >-
            The mode change conflicts with the cluster state, for example because another
            configuration change is in progress.
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.10"

  /cluster/v2/restore:
    servers:
      - url: "{schema}://{host}:{port}"
        variables:
          host:
            default: localhost
            description: The hostname of the Orchestration Cluster REST Gateway.
          port:
            default: "8080"
            description: The port of the Orchestration Cluster REST API server.
          schema:
            default: http
            description: The schema of the Orchestration Cluster REST API server.
    post:
      x-eventually-consistent: false
      tags:
        - Recovery
      operationId: restoreAsClusterAdmin
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Restore one or every physical tenant from a backup
      description: >-
        Restores physical tenants from backups. The restore is described either by a list of backup
        IDs or by a time range (`from`/`to`) that selects the backups to restore. Restores are only
        accepted while the targeted physical tenants are in recovery mode; requests are rejected
        otherwise. The request is validated and acknowledged, but the restore itself is performed
        asynchronously.


        If the `physicalTenantId` parameter is provided, only that physical tenant is restored and
        `overrides` must be omitted.


        If it is not provided, every physical tenant of the cluster is restored: those named in
        `overrides` with their own backup selection, all others with the selection at the top level
        of the request body.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials are
        valid here.
      parameters:
        - $ref: '#/components/parameters/PhysicalTenantIdParameter'
        - $ref: 'cluster.yaml#/components/parameters/DryRunParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterRestoreRequest'
        required: true
      responses:
        "202":
          description: >-
            The restore request was accepted; returns the planned cluster change covering every
            requested physical tenant.
          content:
            application/json:
              schema:
                $ref: 'cluster.yaml#/components/schemas/ClusterRestoreResponse'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "404":
          description: >-
            The requested `physicalTenantId`, or a physical tenant named in `overrides`, does not
            exist in this cluster.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "409":
          description: >-
            A targeted physical tenant is not in recovery mode, so the restore cannot be accepted.
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.10"

  /cluster/v2/backups/runtime:
    servers:
      - url: "{schema}://{host}:{port}"
        variables:
          host:
            default: localhost
            description: The hostname of the Orchestration Cluster REST Gateway.
          port:
            default: "8080"
            description: The port of the Orchestration Cluster REST API server.
          schema:
            default: http
            description: The schema of the Orchestration Cluster REST API server.
    post:
      x-eventually-consistent: false
      tags:
        - Backup
      operationId: takeRuntimeBackupAsClusterAdmin
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Take a runtime backup on one or every physical tenant
      description: >-
        Triggers a runtime backup on every physical tenant of the cluster, or on the one named by
        `physicalTenantId`. A cluster-wide backup is a set of independent per-tenant backups, not an
        atomic snapshot of the cluster: they are neither coordinated nor rolled back together, and
        each tenant stores its own, so the same `backupId` can be used for all of them.


        Every targeted physical tenant must be in the same backup-id mode. `backupId` must be
        omitted when every targeted tenant generates its own ids (because continuous backups and/or
        a backup or checkpoint schedule is enabled for it), and is required when none of them does.
        A cluster whose targeted tenants mix the two modes is rejected with 400 and has to be driven
        one tenant at a time through `POST /v2/backups/runtime`. In generated-id mode each tenant
        generates its own id, so the response reports an id per physical tenant rather than one for
        the cluster.


        The trigger is all-or-error, and never silent about a partial trigger: if any targeted tenant
        cannot be triggered the response carries an error status, but its body still lists every
        targeted tenant — which ones were triggered, under which `backupId` to monitor or delete
        them, and why the others failed. Nothing is rolled back, so the backups that were triggered
        keep running and have to be deleted explicitly. A request rejected before any tenant was
        triggered answers with a problem detail instead, and nothing is running.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials are
        valid here. Use `POST /v2/backups/runtime` to act as a single physical tenant.
      parameters:
        - $ref: '#/components/parameters/PhysicalTenantIdParameter'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'backups.yaml#/components/schemas/TakeRuntimeBackupRequest'
      responses:
        "202":
          description: The backup was triggered on every targeted physical tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTakeRuntimeBackupResponse'
        "400":
          description: >-
            The request names a `backupId` while at least one targeted physical tenant generates its
            own ids, or omits it while at least one does not, or the id is not a positive number. No
            tenant was triggered. A targeted tenant that rejects the request as invalid during the
            fan-out answers with the same status but the cluster body, listing the tenants that were
            triggered.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTakeRuntimeBackupResponse'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "404":
          description: >-
            The requested `physicalTenantId` does not exist in this cluster, so no tenant was
            triggered.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "409":
          description: >-
            At least one targeted physical tenant already holds a backup with this id or a higher
            one. Backups are triggered without a preceding check, so the tenants that accepted the
            id are listed in the body and keep running; delete them before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTakeRuntimeBackupResponse'
        "500":
          description: >-
            At least one targeted physical tenant could not be triggered, and the failures do not
            agree on a single status. The body lists the tenants that were triggered and keep
            running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTakeRuntimeBackupResponse'
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "502":
          description: >-
            The connection to the broker was cut mid-flight on at least one targeted physical tenant,
            which may or may not have accepted the request. Those tenants are reported as `UNKNOWN`
            with the id to check them under, and the tenants that were triggered keep running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTakeRuntimeBackupResponse'
        "503":
          description: >-
            At least one targeted physical tenant could not be reached. The body lists the tenants
            that were triggered and keep running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTakeRuntimeBackupResponse'
        "504":
          description: >-
            The request from gateway to broker timed out on at least one targeted physical tenant,
            which may or may not have accepted it. Those tenants are reported as `UNKNOWN` with the id
            to check them under, and the tenants that were triggered keep running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTakeRuntimeBackupResponse'
      x-added-in-version: "8.10"
    get:
      x-eventually-consistent: false
      tags:
        - Backup
      operationId: listRuntimeBackupsAsClusterAdmin
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: List runtime backups across physical tenants
      description: >-
        Lists the runtime backups of every physical tenant of the cluster, or of the one named by
        `physicalTenantId`, grouped by backup id. Every group reports every targeted tenant,
        including the ones holding nothing for that id, so a backup only some tenants hold aggregates
        to `INCOMPLETE` here exactly as it does when looked up directly — the state of a listed group
        can be trusted to say whether the cluster can be restored from it. A backup id that only some
        physical tenants hold is a supported outcome rather than a degraded one; tenants that
        generate their own backup ids never share one, so in that mode each backup forms its own
        group and the other tenants report `DOES_NOT_EXIST` under it.


        The request is all-or-nothing: a physical tenant whose backups cannot be read fails the whole
        request rather than silently dropping out of the listing. Narrow the request with
        `physicalTenantId` to list the backups of the tenants that can still be read.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials are
        valid here. Use `GET /v2/backups/runtime` to act as a single physical tenant.
      parameters:
        - $ref: '#/components/parameters/PhysicalTenantIdParameter'
        - name: prefix
          in: query
          required: false
          description: |
            A prefix that backup ids must match, ending in a single '*'. If omitted, all
            backups are returned.
          schema:
            $ref: 'backups.yaml#/components/schemas/BackupIdPrefix'
      responses:
        "200":
          description: >-
            The runtime backups of every targeted physical tenant, grouped by backup id and sorted in
            descending order of backup id, as the per-physical-tenant listing is. Empty when every
            targeted tenant was read and none of them holds a matching backup.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterRuntimeBackupInfo'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "404":
          description: The requested `physicalTenantId` does not exist in this cluster.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.10"

  /cluster/v2/backups/runtime/state:
    servers:
      - url: "{schema}://{host}:{port}"
        variables:
          host:
            default: localhost
            description: The hostname of the Orchestration Cluster REST Gateway.
          port:
            default: "8080"
            description: The port of the Orchestration Cluster REST API server.
          schema:
            default: http
            description: The schema of the Orchestration Cluster REST API server.
    get:
      x-eventually-consistent: false
      tags:
        - Backup
      operationId: getRuntimeBackupStateAsClusterAdmin
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Get runtime backup state across physical tenants
      description: >-
        Reports the checkpoint and backup state of every partition of every physical tenant of the
        cluster, or of the one named by `physicalTenantId`, grouped by physical tenant. Checkpoint
        ids and log positions only mean anything within one physical tenant's partitions, so nothing
        is aggregated across tenants.


        The request is all-or-nothing: a physical tenant whose state cannot be read fails the whole
        request rather than contributing an empty section, which an operator making a delete or
        restore decision could not tell apart from "nothing to report yet". Narrow the request with
        `physicalTenantId` to read the tenants that can still be reached.


        Requires the cluster-admin security chain. Although this operation lists `bearerAuth` /
        `basicAuth` like the rest of the Orchestration Cluster API, it does not accept an
        Orchestration Cluster user's credentials — only the separate cluster-admin credentials are
        valid here. Use `GET /v2/backups/runtime/state` to act as a single physical tenant.
      parameters:
        - $ref: '#/components/parameters/PhysicalTenantIdParameter'
      responses:
        "200":
          description: >-
            The runtime backup state of every targeted physical tenant, ordered by physical tenant
            id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterRuntimeBackupState'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "404":
          description: The requested `physicalTenantId` does not exist in this cluster.
          content:
            application/problem+json:
              schema:
                $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.10"
    delete:
      x-eventually-consistent: false
      tags:
        - Backup
      operationId: deleteRuntimeBackupStateAsClusterAdmin
      x-required-permissions: [ ]
      security:
        - bearerAuth: [ ]
        - basicAuth: [ ]
      summary: Delete runtime backup state across physical tenants
      description: >-
