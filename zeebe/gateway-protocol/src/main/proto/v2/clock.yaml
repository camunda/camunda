## Endpoint definitions

paths:
  /clock:
    get:
      x-eventually-consistent: false
      tags:
        - Clock
      operationId: getClock
      x-required-permissions:
        - { resourceType: SYSTEM, permissionType: READ }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Get internal clock
      description: |
        Returns the current time of the Zeebe engine's internal clock.
        If the clock is pinned, this is the pinned time. Otherwise, the clock ticks in real time
        and this is the engine's current time.

        Use this endpoint to check the time that the engine uses, for example after pinning the
        clock with `PUT /v2/clock`, adding time with `POST /v2/clock/add`, or resetting it with
        `POST /v2/clock/reset`. A pin, add, or reset reaches all partitions shortly after it is
        accepted, so a request sent right after it may still return the previous time.
      responses:
        "200":
          description: The current time of the clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockResult'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.11"
      x-scope: physical-tenant
    put:
      x-eventually-consistent: false
      tags:
        - Clock
      operationId: pinClock
      x-required-permissions:
        - { resourceType: SYSTEM, permissionType: UPDATE }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Pin internal clock (alpha)
      description: |
        Set a precise, static time for the Zeebe engine's internal clock.
        When the clock is pinned, it remains at the specified time and does not advance.
        To change the time, the clock must be pinned again with a new timestamp.
        To move the clock without stopping it, use `POST /v2/clock/add` instead.
        Use `GET /v2/clock` to read the current time of the clock.

        This endpoint is an alpha feature and may be subject to change
        in future releases.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockPinRequest'
      responses:
        "204":
          description: The clock was successfully pinned.
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.6"
      x-scope: physical-tenant

  /clock/add:
    post:
      x-eventually-consistent: false
      tags:
        - Clock
      operationId: addClock
      x-required-permissions:
        - { resourceType: SYSTEM, permissionType: UPDATE }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Add time to internal clock
      description: |
        Moves the Zeebe engine's internal clock forward or backward by the given offset.
        Unlike pinning, the clock keeps ticking in real time after the offset is added. If the
        clock is pinned, it stays pinned and moves to the pinned time plus the offset.

        Each request adds to the time of the clock, so adding `PT1H` twice moves the clock two
        hours ahead. Use `POST /v2/clock/reset` to remove all added time and return the clock to
        the system time.

        The response contains the new time of the clock. The change reaches all partitions
        shortly after it is accepted, so a request sent right after it may still use the previous
        time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockAddRequest'
      responses:
        "200":
          description: The time was added to the clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockResult'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "403":
          $ref: 'common-responses.yaml#/components/responses/Forbidden'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.11"
      x-scope: physical-tenant

  /clock/reset:
    post:
      x-eventually-consistent: false
      tags:
        - Clock
      operationId: resetClock
      x-required-permissions:
        - { resourceType: SYSTEM, permissionType: UPDATE }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Reset internal clock (alpha)
      description: |
        Resets the Zeebe engine's internal clock to the current system time, enabling it to tick in real-time.
        This operation is useful for returning the clock to
        normal behavior after it has been pinned to a specific time or moved with
        `POST /v2/clock/add`.
        Use `GET /v2/clock` to read the current time of the clock.

        This endpoint is an alpha feature and may be subject to change
        in future releases.
      responses:
        "204":
          description: The clock was successfully reset to the system time.
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.6"
      x-scope: physical-tenant

## Schema definitions

components:
  schemas:
    ClockAddRequest:
      type: object
      additionalProperties: false
      properties:
        offset:
          description: |
            The time to add to the clock, as an ISO 8601 duration in days, hours, minutes, and
            seconds (for example `PT1H` for one hour or `P1D` for one day). Use a negative
            duration such as `-PT1H` to move the clock backward. The request is rejected if the
            new time would be before 1970-01-01T00:00:00Z.
          type: string
          example: "PT1H"
      required:
        - offset
    ClockPinRequest:
      type: object
      additionalProperties: false
      properties:
        timestamp:
          description: The exact time in epoch milliseconds to which the clock should be pinned.
          type: integer
          format: int64
      required:
        - timestamp
    ClockResult:
      type: object
      properties:
        timestamp:
          description: The current time of the clock, as an ISO 8601 date-time.
          type: string
          format: date-time
          example: "2025-01-01T12:00:00.000Z"
      required:
        - timestamp
