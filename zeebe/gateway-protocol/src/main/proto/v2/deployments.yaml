## Endpoint definitions

paths:
  /deployments:
    post:
      x-eventually-consistent: false
      tags:
        - Resource
      operationId: createDeployment
      summary: Deploy resources
      description: |
        Deploys one or more resources (e.g. processes, decision models, or forms).
        This is an atomic call, i.e. either all resources are deployed or none of them are.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              type: object
              properties:
                resources:
                  type: array
                  description: |
                    The binary data to create the deployment resources. It is possible to have more than one form part with different form part names for the binary data to create a deployment.
                  items:
                    type: string
                    format: binary
                tenantId:
                  $ref: 'identifiers.yaml#/components/schemas/TenantId'
              required:
                - resources
      responses:
        "200":
          description: The resources are deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResult'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.6"

  /resources/{resourceKey}:
    get:
      x-eventually-consistent: false
      tags:
        - Resource
      operationId: getResource
      summary: Get resource
      description: |
        Returns a deployed resource.
        :::info
        Currently, this endpoint only supports RPA resources.
        :::
      parameters:
        - name: resourceKey
          in: path
          required: true
          description: The unique key identifying the resource.
          schema:
            $ref: '#/components/schemas/ResourceKey'
      responses:
        "200":
          description: The resource is successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResult'
        "404":
          description: A resource with the given key was not found.
          content:
            application/problem+json:
              schema:
                $ref: "problem-detail.yaml#/components/schemas/ProblemDetail"
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.7"

  /resources/{resourceKey}/content:
    get:
      x-eventually-consistent: false
      tags:
        - Resource
      operationId: getResourceContent
      summary: Get resource content
      description: |
        Returns the content of a deployed resource.
        :::info
        Currently, this endpoint only supports RPA resources.
        :::
      parameters:
        - name: resourceKey
          in: path
          required: true
          description: The unique key identifying the resource.
          schema:
            $ref: '#/components/schemas/ResourceKey'
      responses:
        "200":
          description: The resource content is successfully returned.
          content:
            application/json:
              schema:
                type: string
        "404":
          description: A resource with the given key was not found.
          content:
            application/problem+json:
              schema:
                $ref: "problem-detail.yaml#/components/schemas/ProblemDetail"
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
      x-added-in-version: "8.7"

  /resources/{resourceKey}/deletion:
    post:
      x-eventually-consistent: false
      tags:
        - Resource
      operationId: deleteResource
      summary: Delete resource
      description: |-
        Deletes a deployed resource. This can be a process definition, decision requirements
        definition, or form definition deployed using the deploy resources endpoint. Specify the
        resource you want to delete in the `resourceKey` parameter.

        Once a resource has been deleted it cannot be recovered. If the resource needs to be
        available again, a new deployment of the resource is required.

        By default, only the resource itself is deleted from the runtime state. To also delete the
        historic data associated with a resource, set the `deleteHistory` flag in the request body
        to `true`. History deletion is supported for process definitions and decision requirements
        definitions; for other resource types (forms, generic resources) the flag is ignored and no
        history is deleted.

        The two supported types differ in how the history is removed. For a decision requirements
        definition the history is deleted asynchronously via a batch operation whose details are
        returned in the `batchOperation` field of the response. For a process definition that still
        exists in the runtime state, the definition first drains its running instances and its
        history is deleted asynchronously once the definition is fully removed cluster-wide; no batch
        operation is returned in the response. If the process definition has already been removed
        from the runtime state and the deletion is later re-triggered with `deleteHistory` set to
        `true`, a batch operation is created immediately and returned in the `batchOperation` field.
      parameters:
        - name: resourceKey
          in: path
          required: true
          description: |
            The key of the resource to delete.
            This can be the key of a process definition, the key of a decision requirements
            definition or the key of a form definition
          schema:
            $ref: '#/components/schemas/ResourceKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteResourceRequest'
      responses:
        "200":
          description: The resource is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResourceResponse'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "404":
          description: The resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: "problem-detail.yaml#/components/schemas/ProblemDetail"
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.6"

## Schema definitions

components:
  schemas:
    DeploymentResult:
      type: object
      required:
        - deploymentKey
        - tenantId
        - deployments
      properties:
        deploymentKey:
          allOf:
            - $ref: '#/components/schemas/DeploymentKey'
          description: The unique key identifying the deployment.
        tenantId:
          description: The tenant ID associated with the deployment.
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/TenantId'
        deployments:
          description: Items deployed by the request.
          type: array
          items:
            $ref: '#/components/schemas/DeploymentMetadataResult'

    DeploymentMetadataResult:
      type: object
      required:
        - processDefinition
        - decisionDefinition
        - decisionRequirements
        - form
        - resource
      properties:
        processDefinition:
          nullable: true
          description: Deployed process.
          allOf:
            - $ref: '#/components/schemas/DeploymentProcessResult'
        decisionDefinition:
          nullable: true
          description: Deployed decision.
          allOf:
            - $ref: '#/components/schemas/DeploymentDecisionResult'
        decisionRequirements:
          nullable: true
          description: Deployed decision requirement definition.
          allOf:
            - $ref: '#/components/schemas/DeploymentDecisionRequirementsResult'
        form:
          nullable: true
          description: Deployed form.
          allOf:
            - $ref: '#/components/schemas/DeploymentFormResult'
        resource:
          nullable: true
          description: Deployed resource.
          allOf:
            - $ref: '#/components/schemas/DeploymentResourceResult'

    DeploymentProcessResult:
      description: A deployed process.
      x-semantic-provider:
        - processDefinitionKey
        - processDefinitionId
      type: object
      required:
        - processDefinitionId
        - processDefinitionVersion
        - resourceName
        - processDefinitionKey
        - tenantId
      properties:
        processDefinitionId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/ProcessDefinitionId'
          description: |
            The bpmn process ID, as parsed during deployment, together with the version forms a
            unique identifier for a specific process definition.
        processDefinitionVersion:
          type: integer
          format: int32
          description: The assigned process version.
        resourceName:
          type: string
          description: The resource name from which this process was parsed.
        tenantId:
          description: The tenant ID of the deployed process.
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/TenantId'
        processDefinitionKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/ProcessDefinitionKey'
          description: The assigned key, which acts as a unique identifier for this process.

    DeploymentDecisionResult:
      description: A deployed decision.
      type: object
      x-semantic-provider:
        - decisionDefinitionKey
        - decisionRequirementsKey
      required:
        - decisionDefinitionId
        - decisionDefinitionKey
        - decisionRequirementsId
        - decisionRequirementsKey
        - name
        - tenantId
        - version
      properties:
        decisionDefinitionId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/DecisionDefinitionId'
          description: |
            The dmn decision ID, as parsed during deployment, together with the version forms a
            unique identifier for a specific decision.
        version:
          type: integer
          format: int32
          description: The assigned decision version.
        name:
          type: string
          description: The DMN name of the decision, as parsed during deployment.
        tenantId:
          description: The tenant ID of the deployed decision.
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/TenantId'
        decisionRequirementsId:
          type: string
          description: |
            The dmn ID of the decision requirements graph that this decision is part of, as parsed during deployment.
        decisionDefinitionKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/DecisionDefinitionKey'
          description: |
            The assigned decision key, which acts as a unique identifier for this decision.
        decisionRequirementsKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/DecisionRequirementsKey'
          description: |
            The assigned key of the decision requirements graph that this decision is part of.

    DeploymentDecisionRequirementsResult:
      description: Deployed decision requirements.
      type: object
      x-semantic-provider:
        - decisionRequirementsKey
      required:
        - decisionRequirementsId
        - decisionRequirementsKey
        - decisionRequirementsName
        - resourceName
        - tenantId
        - version
      properties:
        decisionRequirementsId:
          description: The id of the deployed decision requirements.
          type: string
        decisionRequirementsName:
          description: The name of the deployed decision requirements.
          type: string
        version:
          type: integer
          format: int32
          description: The version of the deployed decision requirements.
        resourceName:
          description: The name of the resource.
          type: string
        tenantId:
          description: The tenant ID of the deployed decision requirements.
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/TenantId'
        decisionRequirementsKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/DecisionRequirementsKey'
          description: |
            The assigned decision requirements key, which acts as a unique identifier for this decision requirements.

    DeploymentFormResult:
      description: A deployed form.
      type: object
      x-semantic-provider:
        - formKey
      required:
        - formId
        - formKey
        - resourceName
        - tenantId
        - version
      properties:
        formId:
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/FormId'
          description: |
            The form ID, as parsed during deployment, together with the version forms a
            unique identifier for a specific form.
        version:
          description: The version of the deployed form.
          type: integer
          format: int32
        resourceName:
          description: The name of the resource.
          type: string
        tenantId:
          $ref: 'identifiers.yaml#/components/schemas/TenantId'
        formKey:
          allOf:
            - $ref: 'keys.yaml#/components/schemas/FormKey'
          description: The assigned key, which acts as a unique identifier for this form.

    DeploymentResourceResult:
      description: A deployed Resource.
      x-semantic-provider:
        - resourceKey
      type: object
      required:
        - resourceId
        - resourceKey
        - resourceName
        - tenantId
        - version
      properties:
        resourceId:
          description: The resource id of the deployed resource.
          type: string
        resourceName:
          description: The name of the deployed resource.
          type: string
        version:
          description: The description of the deployed resource.
          type: integer
          format: int32
        tenantId:
          $ref: 'identifiers.yaml#/components/schemas/TenantId'
        resourceKey:
          allOf:
            - $ref: '#/components/schemas/ResourceKey'
          description: The assigned key, which acts as a unique identifier for this Resource.

    DeleteResourceRequest:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        operationReference:
          $ref: 'keys.yaml#/components/schemas/OperationReference'
        deleteHistory:
          description: |
            Indicates if the historic data associated with the resource should also be deleted
            asynchronously.

            This flag is effective for process definitions and decision requirements definitions.
            For other resource types (forms, generic resources) it is ignored and no history is
            deleted. For a decision requirements definition the `batchOperation` field in the
            response carries the created batch operation. For a process definition the history is
            deleted as part of the definition's draining/deletion lifecycle and no batch operation is
            returned.
          type: boolean
          default: false

    DeleteResourceResponse:
      type: object
      required:
        - resourceKey
        - batchOperation
      properties:
        resourceKey:
          allOf:
            - $ref: '#/components/schemas/ResourceKey'
          description: The system-assigned key for this resource, requested to be deleted.
        batchOperation:
          nullable: true
          allOf:
            - $ref: 'batch-operations.yaml#/components/schemas/BatchOperationCreatedResult'
          description: |
            The batch operation created for asynchronously deleting the historic data.

            Populated when `deleteHistory` is `true` and either the resource is a decision
            requirements definition, or the resource is a process definition that is already fully
            deleted from the runtime state (its history is purged directly by a batch operation).

            For a process definition that still exists in the runtime state, deletion first drains
            the definition and its history is removed asynchronously as part of that lifecycle, so no
            batch operation is returned and this field is `null`. It is also `null` for forms and
            generic resources.

    ResourceResult:
      type: object
      required:
        - resourceName
        - version
        - versionTag
        - resourceId
        - tenantId
        - resourceKey
      properties:
        resourceName:
          description: The resource name from which this resource was parsed.
          type: string
        version:
          description: The assigned resource version.
          type: integer
          format: int32
        versionTag:
          nullable: true
          description: The version tag of this resource.
          type: string
        resourceId:
          description: The resource ID of this resource.
          type: string
        tenantId:
          description: The tenant ID of this resource.
          allOf:
            - $ref: 'identifiers.yaml#/components/schemas/TenantId'
        resourceKey:
          allOf:
            - $ref: '#/components/schemas/ResourceKey'
          description: The unique key of this resource.

    ## Keys

    DeploymentKey:
      description: Key for a deployment.
      format: DeploymentKey
      x-semantic-type: DeploymentKey
      type: string
      allOf:
        - $ref: 'keys.yaml#/components/schemas/LongKey'

    ResourceKey:
      type: string
      oneOf:
        - $ref: 'keys.yaml#/components/schemas/ProcessDefinitionKey'
        - $ref: 'keys.yaml#/components/schemas/DecisionRequirementsKey'
        - $ref: 'keys.yaml#/components/schemas/FormKey'
        - $ref: 'keys.yaml#/components/schemas/DecisionDefinitionKey'
      description: The system-assigned key for this resource.
      format: ResourceKey

    ## Filters

    DeploymentKeyFilterProperty:
      description: DeploymentKey property with full advanced search capabilities.
      oneOf:
        - type: string
          title: Exact match
          description: Matches the value exactly.
          allOf:
            - $ref: "#/components/schemas/DeploymentKey"
        - $ref: '#/components/schemas/AdvancedDeploymentKeyFilter'

    AdvancedDeploymentKeyFilter:
      title: Advanced filter
      description: Advanced DeploymentKey filter.
      type: object
      properties:
        $eq:
          description: Checks for equality with the provided value.
          allOf:
            - $ref: '#/components/schemas/DeploymentKey'
        $neq:
          description: Checks for inequality with the provided value.
          allOf:
            - $ref: '#/components/schemas/DeploymentKey'
        $exists:
          description: Checks if the current property exists.
          type: boolean
        $in:
          description: Checks if the property matches any of the provided values.
          type: array
          items:
            $ref: '#/components/schemas/DeploymentKey'
        $notIn:
          description: Checks if the property matches none of the provided values.
          type: array
          items:
            $ref: '#/components/schemas/DeploymentKey'

    ResourceKeyFilterProperty:
      description: ResourceKey property with full advanced search capabilities.
      oneOf:
        - type: string
          title: Exact match
          description: Matches the value exactly.
          allOf:
            - $ref: "#/components/schemas/ResourceKey"
        - $ref: "#/components/schemas/AdvancedResourceKeyFilter"

    AdvancedResourceKeyFilter:
      title: Advanced filter
      description: Advanced ResourceKey filter.
      type: object
      properties:
        $eq:
          description: Checks for equality with the provided value.
          allOf:
            - $ref: "#/components/schemas/ResourceKey"
        $neq:
          description: Checks for inequality with the provided value.
          allOf:
            - $ref: "#/components/schemas/ResourceKey"
        $exists:
          description: Checks if the current property exists.
          type: boolean
        $in:
          description: Checks if the property matches any of the provided values.
          type: array
          items:
            $ref: "#/components/schemas/ResourceKey"
        $notIn:
          description: Checks if the property matches none of the provided values.
          type: array
          items:
            $ref: "#/components/schemas/ResourceKey"
