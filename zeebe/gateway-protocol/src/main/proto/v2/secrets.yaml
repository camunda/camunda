## Endpoint definitions

paths:
  /secrets/resolve:
    post:
      x-eventually-consistent: false
      tags:
        - Secret
      operationId: resolveSecrets
      x-permission-enforcement: filter
      x-required-permissions:
        - { resourceType: SECRET, permissionType: REVEAL }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Resolve secrets
      description: |
        Resolve a deduplicated batch of `camunda.secrets.*` references for the caller's
        physical tenant in a single round-trip.

        Each reference is authorized and resolved independently. For valid requests, the endpoint
        always responds with HTTP 200: successfully resolved references are returned in `resolved`,
        while references that could not be resolved (for example not found, malformed or over-long,
        or the caller lacks `SECRET:REVEAL` on that reference) are returned in `errors`. A failure of
        one reference never fails the others. Only structurally invalid requests are rejected with
        HTTP 400: a missing or non-array `references` field, more than 20 references, or a null entry.

        References are resolved against the secret stores configured for the caller's physical
        tenant, served from the gateway's secret cache when the value is already cached and read
        from the store otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretResolveRequest'
      responses:
        "200":
          description: |
            The batch was processed. Per-reference outcomes are split between `resolved` and
            `errors`; this status is returned even when some or all references failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResolveResult'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.10"
      x-scope: physical-tenant

  /secrets/list:
    post:
      x-eventually-consistent: false
      tags:
        - Secret
      operationId: listSecrets
      x-permission-enforcement: filter
      x-required-permissions:
        - { resourceType: SECRET, permissionType: READ }
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: List secrets
      description: |
        List the `camunda.secrets.*` references known for the caller's physical tenant.

        Only references the caller holds `SECRET:READ` on are returned. This endpoint never
        returns secret values, only the reference names.

        The references are read from the secret stores configured for the caller's physical tenant.
        A store may hold names outside the reference name charset (for example one containing a
        dot); those are omitted, since `/secrets/resolve` would reject them and no permission can
        be granted on them.

        A returned reference is usable verbatim with `/secrets/resolve`, although a secret that its
        store does not report as `ACTIVE` may fail to resolve there. In a FEEL expression,
        however, a name that is not a bare identifier has to be backtick-escaped, since FEEL reads
        a bare dash as the minus operator: a listed `camunda.secrets.db-password` is written
        `` =camunda.secrets.`db-password` `` in a BPMN input mapping.

        Pass `filter.status` to list only the secrets in the matching states, either as a single
        status or with the advanced operators (`$in`, `$neq`, ...). A store that does not report
        states reports every secret as `ACTIVE`, so a filter that excludes `ACTIVE` returns
        nothing from it. The status filter does not widen access: a reference the caller may not read is
        never returned, with or without a filter.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretListRequest'
      responses:
        "200":
          description: The references the caller is authorized to see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretListResult'
        "400":
          $ref: 'common-responses.yaml#/components/responses/InvalidData'
        "401":
          $ref: 'common-responses.yaml#/components/responses/Unauthorized'
        "500":
          $ref: 'common-responses.yaml#/components/responses/InternalServerError'
        "503":
          $ref: 'common-responses.yaml#/components/responses/ServiceUnavailable'
      x-added-in-version: "8.10"
      x-scope: physical-tenant

components:
  schemas:
    SecretResolveRequest:
      type: object
      required:
        - references
      properties:
        references:
          type: array
          maxItems: 20
          description: |
            The secret references to resolve, each of the form `camunda.secrets.<name>`.
            Duplicate references are deduplicated by the server and resolved once.
            At most 20 references may be requested in a single batch.
          items:
            type: string
            maxLength: 256
            description: |
              A secret reference of the form `camunda.secrets.<name>`, where `<name>` is a
              non-empty token of letters, digits, `_` and `-`. A reference outside that form is
              reported in `errors` with `INVALID_REFERENCE` rather than failing the request.
    SecretResolveResult:
      type: object
      required:
        - resolved
        - errors
      description: The per-reference outcome of a resolve request.
      properties:
        resolved:
          type: array
          description: The references that were successfully resolved.
          items:
            $ref: '#/components/schemas/ResolvedSecret'
        errors:
          type: array
          description: The references that could not be resolved, each with a typed error code.
          items:
            $ref: '#/components/schemas/SecretResolutionError'
    ResolvedSecret:
      type: object
      required:
        - reference
        - value
      properties:
        reference:
          type: string
          description: The resolved secret reference of the form `camunda.secrets.<name>`.
        value:
          type: string
          description: The resolved secret value.
    SecretResolutionError:
      type: object
      required:
        - reference
        - code
        - message
      properties:
        reference:
          type: string
          description: The secret reference that could not be resolved.
        code:
          $ref: '#/components/schemas/SecretErrorCode'
        message:
          type: string
          description: |
            A human-readable description of the failure. Never contains the secret value;
            only error metadata (codes, names) is included.
    SecretErrorCode:
      type: string
      description: |
        The typed reason a reference could not be resolved.

        - `NOT_FOUND`: no secret exists for the reference.
        - `ACCESS_DENIED`: the caller lacks `SECRET:REVEAL` on the reference.
        - `INVALID_REFERENCE`: the reference is malformed, or the configured store rejected it as
          an invalid secret identifier.
        - `UNREADABLE`: the configured store could not return a value for the reference, for
          example because it rejected the cluster's own store credentials or the stored value could
          not be read. Whether the secret exists is not implied.
      enum:
        - NOT_FOUND
        - ACCESS_DENIED
        - INVALID_REFERENCE
        - UNREADABLE
    SecretListRequest:
      type: object
      additionalProperties: false
      description: |
        Options for listing secrets. The request body is optional: omitting it, or sending an empty
        object, lists every secret the caller may read.
      properties:
        filter:
          description: |
            Narrows the listed secrets. Omit it to list secrets in every state. Clusters before 8.11
            reject this property with `400`.
          allOf:
            - $ref: '#/components/schemas/SecretListFilter'
      x-properties-added-in-version:
        - propertyName: filter
          addedInVersion: "8.11"
    SecretListFilter:
      type: object
      additionalProperties: false
      description: Secret list filter.
      properties:
        status:
          description: Only list secrets in the matching states. Omit it to list secrets in every state.
          allOf:
            - $ref: '#/components/schemas/SecretStatusFilterProperty'
    SecretStatusFilterProperty:
      description: SecretStatusEnum property with full advanced search capabilities.
      oneOf:
        - type: string
          title: Exact match
          description: Matches the value exactly.
          allOf:
            - $ref: '#/components/schemas/SecretStatusEnum'
        - $ref: '#/components/schemas/AdvancedSecretStatusFilter'
    AdvancedSecretStatusFilter:
      title: Advanced filter
      description: Advanced SecretStatusEnum filter.
      type: object
      properties:
        $eq:
          description: Checks for equality with the provided value.
          allOf:
            - $ref: '#/components/schemas/SecretStatusEnum'
        $neq:
          description: Checks for inequality with the provided value.
          allOf:
            - $ref: '#/components/schemas/SecretStatusEnum'
        $exists:
          description: |
            Checks if the current property exists. Every listed secret has a status, so `true`
            matches every secret and `false` matches none.
          type: boolean
        $in:
          description: Checks if the property matches any of the provided values.
          type: array
          items:
            $ref: '#/components/schemas/SecretStatusEnum'
        $notIn:
          description: Checks if the property matches none of the provided values.
          type: array
          items:
            $ref: '#/components/schemas/SecretStatusEnum'
        $like:
          $ref: 'filters.yaml#/components/schemas/LikeFilter'
    SecretStatusEnum:
      type: string
      description: |
        The state a secret store reports for a secret.

        - `ACTIVE`: the store reports the secret as usable.
        - `DISABLED`: the secret was disabled in its store.
        - `EXPIRED`: the secret's expiry date has passed.
        - `NOT_YET_ACTIVE`: the secret's activation date is in the future.

        A secret has exactly one status. When several apply, `DISABLED` wins over `EXPIRED`, and
        `EXPIRED` over `NOT_YET_ACTIVE`: a secret that is both disabled and expired is listed only
        as `DISABLED`, so an `EXPIRED` filter skips it.

        A store that cannot report states reports every secret as `ACTIVE`.
      enum:
        - ACTIVE
        - DISABLED
        - EXPIRED
        - NOT_YET_ACTIVE
    SecretListResult:
      type: object
      required:
        - references
      description: |
        The secret references the caller is authorized to see.

        Unbounded: the response carries the configured stores' full enumeration for the physical
        tenant.
      properties:
        references:
          type: array
          description: The secret references, each of the form `camunda.secrets.<name>`.
          items:
            type: string
            description: A secret reference of the form `camunda.secrets.<name>`.
