# Domain file for the clearable-schema-accepts-empty-string and
# clearable-reference-declares-no-format rule tests. Both rules key on
# x-clearable, so no paths are needed. Each schema below exercises one valid or
# invalid shape.
openapi: "3.0.3"
info:
  title: Clearable schema test schemas
  version: "1.0"
paths: {}

components:
  schemas:

    # ── Valid: well-formed clearable schema ────────────────────────────
    ValidClearableDateTime:
      description: A date-time, or an empty string to clear the value.
      type: string
      nullable: true
      anyOf:
        - type: string
          format: date-time
          nullable: true
        - type: string
          maxLength: 0
          nullable: true
      x-clearable: true

    # ── Valid: property referencing a clearable schema ─────────────────
    ValidClearableReference:
      type: object
      properties:
        dueDate:
          allOf:
            - $ref: '#/components/schemas/ValidClearableDateTime'
          description: The due date of the task. Clear by providing an empty String.

    # ── Valid: ordinary date-time property, not clearable ──────────────
    ValidOrdinaryDateTime:
      type: object
      properties:
        creationDate:
          type: string
          format: date-time
          description: The creation date.

    # ── Valid: format next to a reference to a non-clearable schema ────
    ValidFormatNextToOrdinaryReference:
      type: object
      properties:
        startedAt:
          allOf:
            - $ref: '#/components/schemas/OrdinaryString'
          format: date-time
          description: When it started.

    OrdinaryString:
      description: A plain string.
      type: string

    # ── Invalid: x-clearable is not the boolean true ───────────────────
    InvalidClearableFlagNotTrue:
      description: A date-time, or an empty string to clear the value.
      type: string
      anyOf:
        - type: string
          format: date-time
        - type: string
          maxLength: 0
      x-clearable: "true"

    # ── Invalid: no anyOf member accepts the empty string ──────────────
    InvalidClearableWithoutEmptyBranch:
      description: A date-time that claims to be clearable.
      type: string
      anyOf:
        - type: string
          format: date-time
      x-clearable: true

    # ── Invalid: clearable schema declares its own format ──────────────
    InvalidClearableWithOwnFormat:
      description: A clearable date-time that also declares a format.
      type: string
      format: date-time
      anyOf:
        - type: string
          format: date-time
        - type: string
          maxLength: 0
      x-clearable: true

    # ── Invalid: property adds a format next to a clearable reference ──
    InvalidFormatNextToClearableReference:
      type: object
      properties:
        followUpDate:
          allOf:
            - $ref: '#/components/schemas/ValidClearableDateTime'
          format: date-time
          description: The follow-up date of the task.
