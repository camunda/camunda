# Entry point for require-eventually-consistent rule tests.
# Mirrors the real spec structure: paths $ref to domain files.
openapi: "3.0.3"
info:
  title: Test Fixture — require-eventually-consistent
  version: "1.0"
tags:
  - name: Test

paths:
  # ── Valid cases ──────────────────────────────────────────────
  # Query declaring x-eventually-consistent: true
  /valid/thing/{thingKey}:
    $ref: 'things.yaml#/paths/~1valid~1thing~1{thingKey}'

  # Command declaring x-eventually-consistent: false
  /valid/thing:
    $ref: 'things.yaml#/paths/~1valid~1thing'

  # Path-level parameters/servers must not be treated as operations
  /valid/path-level/{thingKey}:
    $ref: 'things.yaml#/paths/~1valid~1path-level~1{thingKey}'

  # ── Invalid cases ───────────────────────────────────────────
  # Missing x-eventually-consistent
  /invalid/missing:
    $ref: 'things.yaml#/paths/~1invalid~1missing'

  # x-eventually-consistent as a string instead of a boolean
  /invalid/string:
    $ref: 'things.yaml#/paths/~1invalid~1string'

  # x-eventually-consistent with no value (null)
  /invalid/null:
    $ref: 'things.yaml#/paths/~1invalid~1null'
