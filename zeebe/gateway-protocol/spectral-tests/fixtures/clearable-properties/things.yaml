# Domain file for clearable-properties-accept-empty-string rule test fixture.
# The rule matches any property (resolved: false, given: $..properties[*]), so
# no paths are needed. Each schema below exercises one valid or invalid shape.
openapi: "3.0.3"
info:
  title: Clearable-properties test schemas
  version: "1.0"
paths: {}

components:
  schemas:

    # ── Clearable schema referenced by the valid cases ────────────────

    ClearableDateTime:
      description: A date-time, or an empty string to clear the value.
      type: string
      nullable: true
      anyOf:
        - type: string
          format: date-time
          nullable: true
        - type: string
          maxLength: 0
          nullable: true
      x-clearable: true

    # ── Valid: clear/reset description on a clearable-schema reference ─
    ValidClearableReference:
      type: object
      properties:
        dueDate:
          allOf:
            - $ref: '#/components/schemas/ClearableDateTime'
          description: The due date. Clear by providing an empty String.
        followUpDate:
          allOf:
            - $ref: '#/components/schemas/ClearableDateTime'
          description: The follow-up date. Reset by providing an empty String.

    # ── Valid: ordinary date-time with no clear/reset semantics ────────
    ValidOrdinaryDateTime:
      type: object
      properties:
        creationDate:
          type: string
          format: date-time
          description: The creation date.

    # ── Valid: clear/reset by empty string, but no format declared ─────
    ValidClearablePlainString:
      type: object
      properties:
        assignee:
          type: string
          description: The assignee. Clear by providing an empty String.

    # ── Valid: cleared by an empty list, not an empty string ───────────
    ValidClearedByEmptyList:
      type: object
      properties:
        candidateGroups:
          type: array
          items:
            type: string
          description: The candidate groups. Reset by providing an empty list.

    # ── Invalid: "Clear ... empty String" with format: date-time ───────
    InvalidClearWithFormat:
      type: object
      properties:
        dueDate:
          type: string
          format: date-time
          description: The due date. Clear by providing an empty String.

    # ── Invalid: "Reset ... empty String" with format: date-time ───────
    InvalidResetWithFormat:
      type: object
      properties:
        followUpDate:
          type: string
          format: date-time
          description: The follow-up date. Reset by providing an empty String.

    # ── Invalid: lowercase "cleared ... empty string" with another format
    InvalidClearedLowercaseOtherFormat:
      type: object
      properties:
        callbackUrl:
          type: string
          format: uri
          description: The callback URL, cleared by providing an empty string.
