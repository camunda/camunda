syntax = 'proto3';
package rebalance_requests;

option java_package = "io.camunda.zeebe.dynamic.config.rebalance.protocol";

message TriggerRebalanceRequest {
  RebalanceOverrides overrides = 1;
  bool dryRun = 2;
}

// Each override is absent unless the operator set it. The first three are applied by the leader of
// every partition this rebalance transfers, in place of its own configured setting; the last is
// applied by the coordinator, in place of its own default.
message RebalanceOverrides {
  optional int64 replicationLagThresholdBytes = 1;
  optional int64 replicationTimeoutMillis = 2;
  optional int32 maxTransferAttempts = 3;
  optional int64 leaderWaitTimeoutMillis = 4;
}

message RebalanceStatusResponse {
  // Absent while no rebalance is running.
  RunningRebalance running = 1;
  // Absent until a rebalance has run on this coordinator.
  CompletedRebalance lastCompleted = 2;
}

message RunningRebalance {
  int64 rebalanceId = 1;
  RebalanceOverrides overrides = 2;
  bool dryRun = 3;
  bool cancelRequested = 4;
  // Empty until the rebalance has been planned.
  repeated PartitionRebalance partitions = 5;
}

message CompletedRebalance {
  int64 rebalanceId = 1;
  RebalanceOutcome outcome = 2;
  bool dryRun = 3;
  repeated PartitionRebalance partitions = 4;
}

message PartitionRebalance {
  // Nested so that its values do not collide with RebalanceOutcome's: proto enum values are
  // scoped to the enclosing message, not to the enum.
  enum State {
    PENDING = 0;
    TRANSFERRING = 1;
    TRANSFERRED = 2;
    SKIPPED = 3;
    FAILED = 4;
    CANCELLED = 5;
  }

  // The partition group the partition belongs to; partition ids are unique only within a group.
  string physicalTenantId = 1;
  int32 partitionId = 2;
  // Absent while the partition has no leader.
  optional string currentLeader = 3;
  // Absent if the configuration names no desired leader for the partition.
  optional string desiredLeader = 4;
  State state = 5;
  // Why the partition ended in this state. Absent where the state speaks for itself.
  optional string reason = 6;
}

message CancelRebalanceResponse {
  bool wasRunning = 1;
}

enum RebalanceOutcome {
  // Proto3 defaults an absent field to zero, so zero must not mean a real outcome.
  REBALANCE_OUTCOME_UNSPECIFIED = 0;
  COMPLETED = 1;
  CANCELLED = 2;
  FAILED = 3;
}

message Response {
  oneof response {
    RebalanceErrorResponse error = 1;
    RebalanceStatusResponse status = 2;
    CancelRebalanceResponse cancelled = 3;
  }
}

message RebalanceErrorResponse {
  RebalanceErrorCode errorCode = 1;
  string errorMessage = 2;
}

enum RebalanceErrorCode {
  INTERNAL_ERROR = 0;
  REBALANCE_IN_PROGRESS = 1;
  NOT_COORDINATOR = 2;
}
