# Isolation stack: Elasticsearch + Keycloak + Identity + camunda (no frontend / backend).
# Adds the two auth JVMs (Keycloak, Identity) back on top of the camunda-only baseline to
# test whether their startup contention is what tips camunda past the readiness gate.
#
# Knobs (override via env when running):
#   CAMUNDA_IMAGE            image to run (default camunda/camunda:SNAPSHOT; set to camunda/camunda:current-test for a source build)
#   CAMUNDA_PULL_POLICY      missing (pull if absent) or never (use a locally built image)
#   CAMUNDA_SPRING_PROFILES  spring profiles; drop 'dev-data' to remove the demo-data generator load
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.19.16}
    container_name: elasticsearch
    environment:
      - TZ=Europe/Berlin
      - xpack.security.enabled=false
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - cluster.name=elasticsearch
      - cluster.routing.allocation.disk.watermark.high=95%
      - cluster.routing.allocation.disk.watermark.high.max_headroom=150GB
      - action.destructive_requires_name=false
      - http.port=9200
      - ES_JAVA_OPTS=-Xms${ELASTIC_JVM_MEMORY:-1}g -Xmx${ELASTIC_JVM_MEMORY:-1}g -XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
      - CLI_JAVA_OPTS=-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200
      - 9300:9300
    restart: always
    cpu_count: 4
    mem_limit: 2g
    healthcheck:
      test: ['CMD-SHELL', "curl -f http://localhost:9200/_cat/health | grep -qE 'green|yellow'"]
      interval: 30s
      timeout: 5s
      retries: 3
  keycloak:
    container_name: keycloak
    image: camunda/keycloak:quay-26@sha256:3eba2912da4668619c8a7b6cdc00138d20a1f293ce3fcba980ce70ec2ed7f8d0
    command: [start]
    ports:
      - '18080:8080'
    healthcheck:
      test: bash -c "echo -e 'GET /auth HTTP/1.0\r\n\r\n' >/dev/tcp/127.0.0.1/8080 || exit 1"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_CACHE: ispn
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      JAVA_OPTS_APPEND: '-Dquarkus.http.http2=false'
  identity:
    depends_on:
      - keycloak
    restart: on-failure
    container_name: identity
    image: camunda/identity:${CAMUNDA_VERSION:-SNAPSHOT}
    ports:
      - '8081:8081'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--tries=1', '--spider', 'http://localhost:8082/actuator/health']
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 60s
    environment:
      SERVER_PORT: 8081
      KEYCLOAK_URL: http://keycloak:8080/auth
      IDENTITY_AUTH_PROVIDER_BACKEND_URL: http://keycloak:8080/auth/realms/camunda-platform
      KEYCLOAK_INIT_OPTIMIZE_SECRET: XALaRPl5qwTEItdwCMiPS62nVpKs7dL7
      KEYCLOAK_INIT_OPTIMIZE_ROOT_URL: http://localhost:3000
      KEYCLOAK_USERS_0_USERNAME: 'demo'
      KEYCLOAK_USERS_0_PASSWORD: 'demo'
      KEYCLOAK_USERS_0_EMAIL: 'demo@example.com'
      KEYCLOAK_USERS_0_FIRST_NAME: 'demo'
      KEYCLOAK_USERS_0_ROLES_0: 'Optimize'
      KEYCLOAK_USERS_0_ROLES_1: 'ManagementIdentity'
  camunda:
    image: ${CAMUNDA_IMAGE:-camunda/camunda:SNAPSHOT}
    pull_policy: ${CAMUNDA_PULL_POLICY:-missing}
    container_name: camunda
    environment:
      - SPRING_PROFILES_ACTIVE=${CAMUNDA_SPRING_PROFILES:-broker,operate,tasklist,consolidated-auth,dev-data}
      - CAMUNDA_SECURITY_AUTHENTICATION_METHOD=basic
      - CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI=false
      - CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED=true
      - CAMUNDA_SECURITY_MULTITENANCY_CHECKSENABLED=false
      - CAMUNDA_SECURITY_INITIALIZATION_USERS_0_USERNAME=demo
      - CAMUNDA_SECURITY_INITIALIZATION_USERS_0_PASSWORD=demo
      - CAMUNDA_SECURITY_INITIALIZATION_USERS_0_NAME=Demo
      - CAMUNDA_SECURITY_INITIALIZATION_USERS_0_EMAIL=demo@example.com
      - CAMUNDA_SECURITY_INITIALIZATION_DEFAULTROLES_ADMIN_USERS_0=demo
      - JAVA_TOOL_OPTIONS=-Xms1g -Xmx2g
      - CAMUNDA_DATA_SECONDARYSTORAGE_TYPE=elasticsearch
      - CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - JAVA_OPTS=-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
    ports:
      - "26500:26500"
      - "9600:9600"
      - "8080:8080"
    # Intentionally more tolerant than the smoke's 1s probe so the gate reflects actual
    # readiness rather than probe brittleness under CI load.
    healthcheck:
      test: ['CMD-SHELL', "wget -O - -q 'http://localhost:9600/actuator/health/readiness'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      - elasticsearch
    restart: always
    volumes:
      - ../zeebe-application.yml:/usr/local/camunda/config/application.yaml
