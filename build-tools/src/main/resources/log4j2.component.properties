#
# Shared by the tests of every module, as zeebe-build-tools is a test dependency of all of them.
# When the queue of an Async appender in a log4j2-test.xml is full, drop events up to INFO instead
# of waiting, so a stalled stdout costs log lines rather than liveness. WARN and ERROR still wait.
log4j2.asyncQueueFullPolicy=Discard
log4j2.discardThreshold=INFO
