<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Analytics — datasets & reports</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #f6f6f6; }
    header { background: #000; color: #fff; padding: 14px 22px; font-weight: 700; letter-spacing: .5px; }
    main { max-width: 980px; margin: 22px auto; padding: 0 16px; display: grid; gap: 22px; }
    .card { background: #fff; border: 1px solid #e3e3e3; border-radius: 8px; padding: 16px 18px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    label { display: inline-block; min-width: 120px; color: #555; }
    input, select { padding: 6px 8px; border: 1px solid #ccc; border-radius: 5px; min-width: 200px; }
    .row { margin: 6px 0; }
    button { background: #ff5000; color: #fff; border: 0; border-radius: 5px; padding: 7px 14px; cursor: pointer; }
    button.secondary { background: #2563eb; }
    ul { list-style: none; padding: 0; margin: 8px 0 0; }
    li { padding: 6px 0; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; }
    .bar { display: inline-block; height: 12px; background: #ff5000; border-radius: 2px; vertical-align: middle; }
    .muted { color: #888; font-size: 12px; }
    code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
<header>CAMUNDA · Analytics — declare a dataset, build a report</header>
<main>
  <section class="card">
    <h2>1 · Define a dataset</h2>
    <div class="row"><label>Name</label><input id="ds-name" placeholder="e.g. Process completions"/></div>
    <div class="row"><label>Window</label>
      <select id="ds-window">
        <option value="3600000">Hourly</option>
        <option value="86400000">Daily</option>
        <option value="60000">Per minute</option>
      </select>
      <span class="muted">fact: process-instance execution time</span>
    </div>
    <div class="row"><button onclick="createDataset()">Create dataset</button></div>
    <ul id="datasets"></ul>
  </section>

  <section class="card">
    <h2>2 · Build a report</h2>
    <div class="row"><label>Name</label><input id="r-name" placeholder="e.g. Execution time by region"/></div>
    <div class="row"><label>Dataset</label><select id="r-dataset"></select></div>
    <div class="row"><label>Process filter</label><input id="r-process" placeholder="(optional) bpmnProcessId"/></div>
    <div class="row"><label>Region filter</label><input id="r-region" placeholder="(optional) e.g. EU — blank = all regions"/></div>
    <div class="row"><button onclick="createReport()">Create report</button></div>
    <ul id="reports"></ul>
  </section>

  <section class="card">
    <h2>3 · View report</h2>
    <div id="report-view"><span class="muted">Pick a report above to view it.</span></div>
  </section>
</main>

<script>
  const api = (p, opts) => fetch('/api' + p, opts).then(r => r.json());
  const post = (p, body) => api(p, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const fmt = ms => new Date(Number(ms)).toISOString().replace('T', ' ').slice(0, 16);

  async function refresh() {
    const datasets = await api('/datasets');
    document.getElementById('datasets').innerHTML =
      datasets.map(d => `<li><b>${d.name}</b> <span class="muted">#${d.id} · window ${d.windowSizeMs}ms</span></li>`).join('');
    document.getElementById('r-dataset').innerHTML =
      datasets.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    const reports = await api('/reports');
    document.getElementById('reports').innerHTML =
      reports.map(r => `<li><b>${r.name}</b> <span class="muted">#${r.id}${r.bpmnProcessId ? ' · ' + r.bpmnProcessId : ''}${r.region ? ' · region ' + r.region : ''}</span>
        <button class="secondary" onclick="viewReport(${r.id}, '${r.name.replace(/'/g, "")}')">View</button></li>`).join('');
  }

  async function createDataset() {
    const name = document.getElementById('ds-name').value || 'Untitled dataset';
    const windowSizeMs = Number(document.getElementById('ds-window').value);
    await post('/datasets', {name, dimensions: 'definition', windowSizeMs});
    document.getElementById('ds-name').value = '';
    refresh();
  }

  async function createReport() {
    const name = document.getElementById('r-name').value || 'Untitled report';
    const datasetId = Number(document.getElementById('r-dataset').value);
    const bpmnProcessId = document.getElementById('r-process').value || null;
    const region = document.getElementById('r-region').value || null;
    if (!datasetId) { alert('Create a dataset first.'); return; }
    await post('/reports', {name, datasetId, vizType: 'table', bpmnProcessId, region, fromWindow: null, toWindow: null});
    document.getElementById('r-name').value = '';
    document.getElementById('r-region').value = '';
    refresh();
  }

  // stable color per region label, so the same region keeps its colour across bars and rows
  const REGION_PALETTE = ['#ff5000', '#2563eb', '#16a34a', '#9333ea', '#ca8a04', '#dc2626', '#0891b2', '#db2777'];
  const regionColor = (() => {
    const seen = {};
    return r => (seen[r] ??= REGION_PALETTE[Object.keys(seen).length % REGION_PALETTE.length]);
  })();

  // bars are average execution time, coloured by region — the "execution time grouped by region" view
  function barChart(rows, max) {
    const W = Math.max(440, rows.length * 64), H = 260, pad = 34, top = 22, chartH = H - top - 70;
    const step = (W - pad * 2) / rows.length, bw = Math.min(40, step * 0.6);
    const bars = rows.map((r, i) => {
      const h = Math.round(chartH * r.averageDurationMs / max);
      const x = pad + i * step + (step - bw) / 2, y = top + (chartH - h);
      const proc = r.bpmnProcessId.length > 8 ? r.bpmnProcessId.slice(0, 7) + '…' : r.bpmnProcessId;
      const lbl = r.region + ' · ' + proc + ' ' + fmt(r.windowStart).slice(11);
      const ly = top + chartH + 12;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${regionColor(r.region)}"></rect>
        <text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" font-size="10">${Math.round(r.averageDurationMs)}</text>
        <text x="${x + bw / 2}" y="${ly}" text-anchor="end" font-size="10" fill="#555" transform="rotate(-35 ${x + bw / 2} ${ly})">${lbl}</text>`;
    }).join('');
    return `<svg width="${W}" height="${H}" style="max-width:100%">
      <text x="${pad}" y="12" font-size="11" fill="#888">average execution time (ms) per region · process · window</text>
      <line x1="${pad}" y1="${top + chartH}" x2="${W - pad}" y2="${top + chartH}" stroke="#ccc"></line>
      ${bars}</svg>`;
  }

  function legend(rows) {
    const regions = [...new Set(rows.map(r => r.region))];
    return '<div class="row" style="margin-top:6px">' + regions.map(reg =>
      `<span style="margin-right:14px"><span class="bar" style="width:12px;background:${regionColor(reg)}"></span> ${reg}</span>`).join('') + '</div>';
  }

  async function viewReport(id, name) {
    const rows = await api(`/reports/${id}/data`);
    const view = document.getElementById('report-view');
    if (rows.length === 0) {
      view.innerHTML = `<h3 style="margin:0 0 4px">${name}</h3><p class="muted">No data yet — run the pipeline against this dataset DB.</p>`;
      return;
    }
    const max = Math.max(1, ...rows.map(r => r.averageDurationMs));
    const table = `<table><thead><tr><th>Region</th><th>Process</th><th>Window</th><th>Completed</th><th>Avg (ms)</th><th>Max (ms)</th></tr></thead><tbody>` +
      rows.map(r => `<tr>
          <td><span class="bar" style="width:10px;background:${regionColor(r.region)}"></span> <b>${r.region}</b></td>
          <td><code>${r.bpmnProcessId}</code></td>
          <td>${fmt(r.windowStart)}</td>
          <td>${r.completedCount}</td>
          <td><span class="bar" style="width:${Math.round(120 * r.averageDurationMs / max)}px;background:${regionColor(r.region)}"></span> ${r.averageDurationMs.toFixed(1)}</td>
          <td>${r.maxDurationMs}</td>
        </tr>`).join('') + '</tbody></table>';
    view.innerHTML = `<h3 style="margin:0 0 4px">${name}</h3>` + barChart(rows, max) + legend(rows) + table
      + `<div class="row" style="margin-top:8px"><button class="secondary" onclick="viewReport(${id}, '${name.replace(/'/g, "")}')">↻ Refresh</button></div>`;
  }

  refresh();
</script>
</body>
</html>
