[project]
name = "load-test-report"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "pydantic==2.12.5",
  "pyyaml==6.0.3",
]

[project.scripts]
load-test-report = "load_test_report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
pythonpath = ["src"]
