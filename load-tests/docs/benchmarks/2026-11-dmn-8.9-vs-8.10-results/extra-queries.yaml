# Scratch query set for the DMN 8.9 vs 8.10 benchmark review (not for merge).
queries:
  - key: namespace
    header: Namespace
    valueLabel: namespace
    description: namespace
    query: |-
      max_over_time(kube_namespace_created{namespace="$NAMESPACE"}[$DURATION_S])
  - key: k6_evaluations
    header: k6_evaluations
    description: k6_evaluations
    query: |-
      sum(increase(k6_http_reqs_total{namespace="$NAMESPACE", size=~".+"}[$DURATION_S]))
  - key: k6_evaluations_non_200
    header: k6_evaluations_non_200
    description: k6_evaluations_non_200
    query: |-
      sum(increase(k6_http_reqs_total{namespace="$NAMESPACE", size=~".+", status!="200"}[$DURATION_S])) or vector(0)
  - key: k6_requests_by_status_200
    header: k6_requests_by_status_200
    description: k6_requests_by_status_200
    query: |-
      sum(increase(k6_http_reqs_total{namespace="$NAMESPACE", size=~".+", status="200"}[$DURATION_S]))
  - key: k6_check_status_200_min
    header: k6_check_status_200_min
    description: k6_check_status_200_min
    query: |-
      min(min_over_time(k6_checks_rate{namespace="$NAMESPACE", check="status is 200"}[$DURATION_S]))
  - key: k6_check_status_200_avg
    header: k6_check_status_200_avg
    description: k6_check_status_200_avg
    query: |-
      avg(avg_over_time(k6_checks_rate{namespace="$NAMESPACE", check="status is 200"}[$DURATION_S]))
  - key: k6_check_rate_expected_min
    header: k6_check_rate_expected_min
    description: k6_check_rate_expected_min
    query: |-
      min(min_over_time(k6_checks_rate{namespace="$NAMESPACE", check="rate is expected"}[$DURATION_S]))
  - key: k6_check_rate_expected_avg
    header: k6_check_rate_expected_avg
    description: k6_check_rate_expected_avg
    query: |-
      avg(avg_over_time(k6_checks_rate{namespace="$NAMESPACE", check="rate is expected"}[$DURATION_S]))
  - key: k6_check_series
    header: k6_check_series
    description: k6_check_series
    query: |-
      count(last_over_time(k6_checks_rate{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: k6_checks_total_any
    header: k6_checks_total_any
    description: k6_checks_total_any
    query: |-
      sum(increase(k6_checks_total{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: k6_http_req_failed_max
    header: k6_http_req_failed_max
    description: k6_http_req_failed_max
    query: |-
      max(max_over_time(k6_http_req_failed_rate{namespace="$NAMESPACE", size=~".+"}[$DURATION_S]))
  - key: k6_dropped_iterations
    header: k6_dropped_iterations
    description: k6_dropped_iterations
    query: |-
      sum(increase(k6_dropped_iterations_total{namespace="$NAMESPACE"}[$DURATION_S])) or vector(0)
  - key: k6_iterations
    header: k6_iterations
    description: k6_iterations
    query: |-
      sum(increase(k6_iterations_total{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: k6_req_duration_p50_ms
    header: k6_req_duration_p50_ms
    description: k6_req_duration_p50_ms
    query: |-
      histogram_quantile(0.50, sum(rate(k6_http_req_duration_seconds{namespace="$NAMESPACE", size=~".+"}[$DURATION_S]))) * 1000
  - key: k6_req_duration_p99_ms
    header: k6_req_duration_p99_ms
    description: k6_req_duration_p99_ms
    query: |-
      histogram_quantile(0.99, sum(rate(k6_http_req_duration_seconds{namespace="$NAMESPACE", size=~".+"}[$DURATION_S]))) * 1000
  - key: k6_req_duration_avg_ms
    header: k6_req_duration_avg_ms
    description: k6_req_duration_avg_ms
    query: |-
      histogram_avg(sum(rate(k6_http_req_duration_seconds{namespace="$NAMESPACE", size=~".+"}[$DURATION_S]))) * 1000
  - key: k6_req_duration_p99_ms_classic
    header: k6_req_duration_p99_ms_classic
    description: k6_req_duration_p99_ms_classic
    query: |-
      histogram_quantile(0.99, sum by (le) (rate(k6_http_req_duration_seconds_bucket{namespace="$NAMESPACE", size=~".+"}[$DURATION_S]))) * 1000
  - key: k6_req_duration_p99_gauge_ms
    header: k6_req_duration_p99_gauge_ms
    description: k6_req_duration_p99_gauge_ms
    query: |-
      max(max_over_time(k6_http_req_duration_p99{namespace="$NAMESPACE", size=~".+"}[$DURATION_S])) * 1000
  - key: broker_restarts_in_window
    header: broker_restarts_in_window
    description: broker_restarts_in_window
    query: |-
      sum(increase(kube_pod_container_status_restarts_total{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"}[$DURATION_S])) or vector(0)
  - key: broker_restarts_total
    header: broker_restarts_total
    description: broker_restarts_total
    query: |-
      sum(max_over_time(kube_pod_container_status_restarts_total{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"}[$DURATION_S]))
  - key: all_pod_restarts_total
    header: all_pod_restarts_total
    description: all_pod_restarts_total
    query: |-
      sum(max_over_time(kube_pod_container_status_restarts_total{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: broker_oom_killed
    header: broker_oom_killed
    description: broker_oom_killed
    query: |-
      max(max_over_time(kube_pod_container_status_last_terminated_reason{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", reason="OOMKilled"}[$DURATION_S])) or vector(0)
  - key: broker_cpu_total_avg
    header: broker_cpu_total_avg
    description: broker_cpu_total_avg
    query: |-
      sum(rate(container_cpu_usage_seconds_total{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", container!=""}[$DURATION_S]))
  - key: broker_cpu_busiest_avg
    header: broker_cpu_busiest_avg
    description: broker_cpu_busiest_avg
    query: |-
      max(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", container!=""}[$DURATION_S])))
  - key: proc_busy_seconds_per_second
    header: proc_busy_seconds_per_second
    description: proc_busy_seconds_per_second
    query: |-
      sum(rate(zeebe_stream_processor_processing_duration_seconds_sum{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: proc_mean_ms_all
    header: proc_mean_ms_all
    description: proc_mean_ms_all
    query: |-
      sum(rate(zeebe_stream_processor_processing_duration_seconds_sum{namespace="$NAMESPACE"}[$DURATION_S])) / sum(rate(zeebe_stream_processor_processing_duration_seconds_count{namespace="$NAMESPACE"}[$DURATION_S])) * 1000
  - key: proc_mean_ms_decision
    header: proc_mean_ms_decision
    description: proc_mean_ms_decision
    query: |-
      sum(rate(zeebe_stream_processor_processing_duration_seconds_sum{namespace="$NAMESPACE", valueType="DECISION_EVALUATION"}[$DURATION_S])) / sum(rate(zeebe_stream_processor_processing_duration_seconds_count{namespace="$NAMESPACE", valueType="DECISION_EVALUATION"}[$DURATION_S])) * 1000
  - key: proc_p99_ms_decision
    header: proc_p99_ms_decision
    description: proc_p99_ms_decision
    query: |-
      histogram_quantile(0.99, sum by (le) (rate(zeebe_stream_processor_processing_duration_seconds_bucket{namespace="$NAMESPACE", valueType="DECISION_EVALUATION"}[$DURATION_S]))) * 1000
  - key: proc_decision_count
    header: proc_decision_count
    description: proc_decision_count
    query: |-
      sum(increase(zeebe_stream_processor_processing_duration_seconds_count{namespace="$NAMESPACE", valueType="DECISION_EVALUATION"}[$DURATION_S]))
  - key: proc_decision_seconds_per_second
    header: proc_decision_seconds_per_second
    description: proc_decision_seconds_per_second
    query: |-
      sum(rate(zeebe_stream_processor_processing_duration_seconds_sum{namespace="$NAMESPACE", valueType="DECISION_EVALUATION"}[$DURATION_S]))
  - key: proc_count_by_type
    header: proc_count_by_type
    description: proc_count_by_type
    query: |-
      count(sum by (valueType, intent) (increase(zeebe_stream_processor_processing_duration_seconds_count{namespace="$NAMESPACE"}[$DURATION_S])) > 0)
  - key: queue_wait_le_25ms_ratio
    header: queue_wait_le_25ms_ratio
    description: queue_wait_le_25ms_ratio
    query: |-
      sum(rate(zeebe_stream_processor_latency_seconds_bucket{namespace="$NAMESPACE", le="0.025"}[$DURATION_S])) / sum(rate(zeebe_stream_processor_latency_seconds_count{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: queue_wait_le_100ms_ratio
    header: queue_wait_le_100ms_ratio
    description: queue_wait_le_100ms_ratio
    query: |-
      sum(rate(zeebe_stream_processor_latency_seconds_bucket{namespace="$NAMESPACE", le="0.1"}[$DURATION_S])) / sum(rate(zeebe_stream_processor_latency_seconds_count{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: queue_wait_le_1s_ratio
    header: queue_wait_le_1s_ratio
    description: queue_wait_le_1s_ratio
    query: |-
      sum(rate(zeebe_stream_processor_latency_seconds_bucket{namespace="$NAMESPACE", le="1.0"}[$DURATION_S])) / sum(rate(zeebe_stream_processor_latency_seconds_count{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: queue_wait_mean_ms
    header: queue_wait_mean_ms
    description: queue_wait_mean_ms
    query: |-
      sum(rate(zeebe_stream_processor_latency_seconds_sum{namespace="$NAMESPACE"}[$DURATION_S])) / sum(rate(zeebe_stream_processor_latency_seconds_count{namespace="$NAMESPACE"}[$DURATION_S])) * 1000
  - key: export_pickup_le_25ms_ratio
    header: export_pickup_le_25ms_ratio
    description: export_pickup_le_25ms_ratio
    query: |-
      sum(rate(zeebe_exporting_latency_seconds_bucket{namespace="$NAMESPACE", le="0.025"}[$DURATION_S])) / sum(rate(zeebe_exporting_latency_seconds_count{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: export_pickup_le_100ms_ratio
    header: export_pickup_le_100ms_ratio
    description: export_pickup_le_100ms_ratio
    query: |-
      sum(rate(zeebe_exporting_latency_seconds_bucket{namespace="$NAMESPACE", le="0.1"}[$DURATION_S])) / sum(rate(zeebe_exporting_latency_seconds_count{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: export_pickup_le_1s_ratio
    header: export_pickup_le_1s_ratio
    description: export_pickup_le_1s_ratio
    query: |-
      sum(rate(zeebe_exporting_latency_seconds_bucket{namespace="$NAMESPACE", le="1.0"}[$DURATION_S])) / sum(rate(zeebe_exporting_latency_seconds_count{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: export_pickup_mean_ms
    header: export_pickup_mean_ms
    description: export_pickup_mean_ms
    query: |-
      sum(rate(zeebe_exporting_latency_seconds_sum{namespace="$NAMESPACE"}[$DURATION_S])) / sum(rate(zeebe_exporting_latency_seconds_count{namespace="$NAMESPACE"}[$DURATION_S])) * 1000
  - key: gc_pause_fraction_max_pod
    header: gc_pause_fraction_max_pod
    description: gc_pause_fraction_max_pod
    query: |-
      max(sum by (pod) (rate(jvm_gc_pause_seconds_sum{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"}[$DURATION_S])))
  - key: gc_pauses_per_second_max_pod
    header: gc_pauses_per_second_max_pod
    description: gc_pauses_per_second_max_pod
    query: |-
      max(sum by (pod) (rate(jvm_gc_pause_seconds_count{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"}[$DURATION_S])))
  - key: gc_pause_max_ms
    header: gc_pause_max_ms
    description: gc_pause_max_ms
    query: |-
      max(max_over_time(jvm_gc_pause_seconds_max{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"}[$DURATION_S])) * 1000
  - key: gc_concurrent_fraction_max_pod
    header: gc_concurrent_fraction_max_pod
    description: gc_concurrent_fraction_max_pod
    query: |-
      max(sum by (pod) (rate(jvm_gc_concurrent_phase_time_seconds_sum{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"}[$DURATION_S])))
  - key: gc_collectors
    header: gc_collectors
    description: gc_collectors
    query: |-
      count(sum by (gc) (rate(jvm_gc_pause_seconds_count{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"}[$DURATION_S])) > 0)
  - key: heap_live_after_gc_gib_max
    header: heap_live_after_gc_gib_max
    description: heap_live_after_gc_gib_max
    query: |-
      max(max_over_time(jvm_gc_live_data_size_bytes{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"}[$DURATION_S])) / 1024 / 1024 / 1024
  - key: heap_floor_gib_max_pod
    header: heap_floor_gib_max_pod
    description: heap_floor_gib_max_pod
    query: |-
      max(min_over_time((sum by (pod) (jvm_memory_used_bytes{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", area="heap"}))[$DURATION_S:15s])) / 1024 / 1024 / 1024
  - key: heap_committed_gib_max
    header: heap_committed_gib_max
    description: heap_committed_gib_max
    query: |-
      max(max_over_time((sum by (pod) (jvm_memory_committed_bytes{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", area="heap"}))[$DURATION_S:1m])) / 1024 / 1024 / 1024
  - key: heap_max_gib
    header: heap_max_gib
    description: heap_max_gib
    query: |-
      max(max_over_time((sum by (pod) (jvm_memory_max_bytes{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", area="heap"}))[$DURATION_S:1m])) / 1024 / 1024 / 1024
  - key: nonheap_used_gib_max
    header: nonheap_used_gib_max
    description: nonheap_used_gib_max
    query: |-
      max(max_over_time((sum by (pod) (jvm_memory_used_bytes{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", area="nonheap"}))[$DURATION_S:1m])) / 1024 / 1024 / 1024
  - key: direct_buffers_gib_max
    header: direct_buffers_gib_max
    description: direct_buffers_gib_max
    query: |-
      max(max_over_time((sum by (pod) (jvm_buffer_memory_used_bytes{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", id="direct"}))[$DURATION_S:1m])) / 1024 / 1024 / 1024
  - key: rss_avg_gib_max_pod
    header: rss_avg_gib_max_pod
    description: rss_avg_gib_max_pod
    query: |-
      max(avg_over_time((sum by (pod) (container_memory_rss{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", container!=""}))[$DURATION_S:1m])) / 1024 / 1024 / 1024
  - key: working_set_gib_max
    header: working_set_gib_max
    description: working_set_gib_max
    query: |-
      max(max_over_time((sum by (pod) (container_memory_working_set_bytes{namespace="$NAMESPACE", pod=~"camunda-[0-9]+", container!=""}))[$DURATION_S:1m])) / 1024 / 1024 / 1024
  - key: es_docs_indexed_total
    header: es_docs_indexed_total
    description: es_docs_indexed_total
    query: |-
      sum(increase(elasticsearch_indices_indexing_index_total{namespace="$NAMESPACE"}[$DURATION_S]))
  - key: jvm_info_version
    header: jvm_info_version
    description: jvm_info_version
    query: |-
      count by (version, runtime) (jvm_info{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"})
  - key: jvm_version
    header: jvm_version
    valueLabel: version
    description: jvm
    query: |-
      count by (version) (max_over_time(jvm_info{namespace="$NAMESPACE", pod=~"camunda-[0-9]+"}[$DURATION_S]))
  - key: restarted_pod
    header: restarted_pod
    valueLabel: pod
    description: restarted_pod
    query: |-
      topk(1, max by (pod) (max_over_time(kube_pod_container_status_restarts_total{namespace="$NAMESPACE"}[$DURATION_S])) > 0)
  - key: restarted_container
    header: restarted_container
    valueLabel: container
    description: restarted_container
    query: |-
      topk(1, max by (container) (max_over_time(kube_pod_container_status_restarts_total{namespace="$NAMESPACE"}[$DURATION_S])) > 0)
  - key: restarted_reason
    header: restarted_reason
    valueLabel: reason
    description: restarted_reason
    query: |-
      topk(1, max by (reason) (max_over_time(kube_pod_container_status_last_terminated_reason{namespace="$NAMESPACE"}[$DURATION_S])) > 0)
  - key: k6_check_failing_series
    header: k6_check_failing_series
    description: k6 check series whose cumulative pass ratio was below 1 at any point in the window
    query: |-
      count(min_over_time(k6_checks_rate{namespace="$NAMESPACE"}[$DURATION_S]) < 1) or vector(0)
  - key: k6_check_failing_series_at_start
    header: k6_check_failing_series_at_start
    description: same, evaluated at the window start
    query: |-
      count(last_over_time(k6_checks_rate{namespace="$NAMESPACE"}[$DURATION_S] offset $DURATION_S) < 1) or vector(0)
  - key: k6_check_failing_target
    header: k6_check_failing_target
    valueLabel: target
    description: target tag of a failing k6 check series
    query: |-
      topk(1, 1 - min by (target, check) (min_over_time(k6_checks_rate{namespace="$NAMESPACE"}[$DURATION_S])) > 0)
  - key: k6_check_failing_check
    header: k6_check_failing_check
    valueLabel: check
    description: check name of a failing k6 check series
    query: |-
      topk(1, 1 - min by (target, check) (min_over_time(k6_checks_rate{namespace="$NAMESPACE"}[$DURATION_S])) > 0)
  - key: k6_wrong_result_series
    header: k6_wrong_result_series
    description: series whose "rate is expected" pass ratio is below the "status is 200" pass ratio (wrong result with HTTP 200)
    query: |-
      count((min by (target, depth, size) (last_over_time(k6_checks_rate{namespace="$NAMESPACE", check="rate is expected"}[$DURATION_S]))) < (min by (target, depth, size) (last_over_time(k6_checks_rate{namespace="$NAMESPACE", check="status is 200"}[$DURATION_S])))) or vector(0)
  - key: k6_non_200_by_status
    header: k6_non_200_by_status
    valueLabel: status
    description: most frequent non-200 status
    query: |-
      topk(1, sum by (status) (increase(k6_http_reqs_total{namespace="$NAMESPACE", size=~".+", status!="200"}[$DURATION_S])) > 0)
  - key: k6_first_eval_time
    header: k6_first_eval_time
    description: unix time of the first k6 evaluation sample in the window
    query: |-
      min(min_over_time(timestamp(k6_http_reqs_total{namespace="$NAMESPACE", size=~".+"})[$DURATION_S:30s]))
