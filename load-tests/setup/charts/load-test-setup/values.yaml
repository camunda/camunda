# -- Global values propagated to the camunda-load-tests (load-tester) subchart.
global:
  # -- Extra configuration merged into the load test applications' config file.
  # Seeded as an empty map so callers can add keys via
  # `--set global.extraConfig.<key>=<value>` (e.g. the Makefile sets
  # `global.extraConfig.load-tester.monitor-data-availability=false` for the
  # `none` storage scenario). The subchart ships this key as `null`, and
  # `load-tester-values-defaults.yaml` supplies a `global:` block without `extraConfig`.
  # Without a map default here, Helm's global coalescing silently drops the
  # `--set` value, so the load-test-config ConfigMap (and its starter/workers
  # wiring) never renders for the `none` scenario. An empty map is falsy, so the
  # ConfigMap still only renders when a key is actually set.
  extraConfig: {}

  # -- Container image defaults for the load-test driver pods this chart deploys
  # directly (currently the zeebe-secrets benchmark driver in
  # benchmark-zeebe-secrets-driver.yaml). These mirror the camunda-load-tests
  # subchart's own `global.image` defaults: Helm does not propagate a subchart's
  # global values up to the parent, so without this block the parent-owned
  # templates would render an empty image tag/pullPolicy. Real deployments
  # override `repository`/`tag` via `--set global.image.*` (see
  # load-test-install-camunda-platform.sh); this only supplies the fallback used
  # when nothing sets them (e.g. golden rendering).
  image:
    repository: gcr.io/zeebe-io
    tag: SNAPSHOT
    pullPolicy: Always
    pullSecrets: []

# -- Name of the load test.
name: ""

# -- Name or handle of the person owning this load-test deployment.
author: ""

# -- Date (YYYY-MM-DD) after which this load-test environment can be reclaimed.
deadlineDate: ""

# -- Optional Kubernetes topology zone to pin workloads to (e.g. `europe-west1-b`).
# When set, configures the `topology.kubernetes.io/zone` annotation on the namespace resources.
topologyZone: ""

# -- Internal URL of the Camunda management endpoint. Used by the
# `leader-balancer` CronJob to trigger periodic partition rebalancing via
# `POST {{ camundaManagementUrl }}/actuator/rebalance`.
camundaManagementUrl: http://camunda:9600

# -- The configuration for the load test metrics exporter
metricsExporter:
  image:
    # -- The registry hosting the load test metrics exporter Docker image
    registry: registry.camunda.cloud/team-reliability-testing
    # -- The repository hosting the load test metrics exporter Docker image
    repository: metrics-exporter
    # -- The tag of the load test metrics exporter Docker image
    tag: latest

  database:
    # -- URL of the database (Elasticsearch or OpenSearch) HTTP endpoint for metrics queries.
    # Defaults to the ECK-generated ClusterIP service name for Elasticsearch.
    url: http://elasticsearch-es-http:9200

# -- Configuration for the optional chaos-killer CronJob.
# When enabled, one randomly-selected matching pod is deleted per run to simulate
# unscheduled restarts (e.g. PostgreSQL, Zeebe broker, Elasticsearch).
chaosKiller:
  # -- Set to true to deploy the chaos-killer CronJob.
  enabled: false
  # -- Cron schedule for the chaos-killer (default: once per hour).
  schedule: "0 * * * *"
  # -- Space-separated shell glob patterns. One pod matching any pattern is deleted per run.
  targetPatterns: "camunda-* elastic-* postgresql-*"

# -- load-tester subchart toggle. Set to false to skip deploying the load
# generators (e.g. for a bare cluster setup).
load-tester:
  enabled: true

# -- Seed data for the secrets API benchmark scenario. When enabled, a Secret
# named `secretName` is created with `count` keys (`<keyPrefix>0`..`<keyPrefix>N-1`),
# each a deterministic per-namespace value. The orchestration cluster mounts this
# Secret as a file-based secret store (see camunda-platform-values-zeebe-secrets.yaml), so
# the zeebe-secrets driver's `camunda.secrets.<keyPrefix><i>` references resolve against
# real store reads. Only rendered for the `zeebe-secrets` scenario.
zeebeSecretsBenchmark:
  # -- Set to true to create the benchmark secret store data.
  enabled: false
  # -- Name of the Secret; must match the volume in camunda-platform-values-zeebe-secrets.yaml.
  secretName: benchmark-secrets
  # -- Number of distinct secrets to seed. Must be >= the driver's referencePoolSize.
  count: 100
  # -- Bare-name prefix; the driver resolves `camunda.secrets.<keyPrefix><i>`.
  keyPrefix: bench_

  # -- The secrets-resolution benchmark driver. When `zeebeSecretsBenchmark.enabled`
  # is true, a `zeebe-secrets` Deployment (benchmark-zeebe-secrets-driver.yaml) runs the
  # dedicated `{global.image.repository}/zeebe-secrets:{global.image.tag}` load-tester
  # image, driving POST /v2/secrets/resolve and /v2/secrets/list against the
  # orchestration cluster. It replaces the starter/workers for this scenario
  # (which the Makefile scales to 0) and reuses the `load-test-credentials`
  # Secret for OAuth. Each knob maps to a `LOAD_TESTER_ZEEBE_SECRETS_*` env var read
  # by `ZeebeSecretsDriverProperties`.
  driver:
    # -- Number of driver pods. Increase to scale request concurrency across
    # pods on top of per-pod `threads`.
    replicas: 1
    # -- Log level for the driver (`LOG_LEVEL`); empty keeps the image default.
    logLevel: ""
    # -- Target request rate (requests per `rateDuration`) the driver submits,
    # split across both endpoints. At 200/s with resolveRatio=0.5 each endpoint
    # receives ~100 req/s. Use the resolve-only preset to isolate one endpoint.
    rate: 200
    # -- The window over which `rate` requests are submitted (e.g. `1s`).
    rateDuration: 1s
    # -- Number of concurrent request-issuing threads per pod.
    threads: 2
    # -- Stop after this many seconds (0 = run until the pod is deleted).
    durationLimit: 0
    # -- Fraction of requests sent to /v2/secrets/resolve; the rest go to
    # /v2/secrets/list. 0.5 = an even resolve/list split (the default mixed
    # traffic), 1.0 = resolve only, 0.0 = list only.
    resolveRatio: 0.5
    # -- References per resolve batch (clamped to MAX_BATCH_SIZE=20 by the driver,
    # which is also the server-side maxItems cap on POST /v2/secrets/resolve).
    batchSize: 20
    # -- Fraction of each batch that repeats an already-included reference, to
    # exercise server-side batch de-duplication (0.0 = all distinct). 0.3 keeps
    # the default run exercising the gateway's de-duplication path.
    duplicateRatio: 0.3
    # -- Number of distinct references a run touches. A small pool relative to
    # the secret cache stays cache-first; a large pool forces store reads. Must
    # be <= `count`.
    referencePoolSize: 100
    # -- Reference prefix the gateway strips before the store lookup.
    referencePrefix: camunda.secrets.
    # -- Bare-name base; the driver resolves `<referencePrefix><referenceBaseName><i>`
    # and must match `keyPrefix` so references hit the seeded file store.
    referenceBaseName: bench_
    # -- Per-request timeout (empty keeps the driver default).
    requestTimeout: 20s
    # -- Pre-resolve the whole reference pool once before the measured load, so a
    # cache-first run does not pay first-touch store cost in its recorded latencies.
    warmup: false
    # -- CPU and memory resource requests and limits for the driver pod.
    resources:
      requests:
        cpu: "1"
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi

# -- Configuration for the load test applications.
loadTest:
  # -- Client configuration
  client:
    # -- OIDC configuration for the load test applications
    oidc:
      clientId: orchestration
      zeebeRestAddress: http://camunda:8080
      # -- The complete "/token" URL endpoint of the authentication server.
      # Either set the complete URL used to fetch OIDC token from the
      # authentication server, or keep it at the default empty value to use the
      # built-in Keycloak instance. (Keycloak *must* also be enabled in this case.)
      authServer:
      zeebeGrpcAddress: http://camunda:26500
      authorizationAudience: orchestration-api
      # -- The name of the key used to generate credentials for the load test client applications.
      # This key is used:
      # 1. During the cluster provisioning, to create a client ID/password through Keycloak
      # 2. While configuring the load test application, to create the same password as used by Keycloak.
      secret:
        key: orchestration-security-authentication-oidc-secret

# -- Configuration for the ECK-managed Elasticsearch cluster.
# When enabled, deploys an `Elasticsearch` custom resource managed by the ECK operator.
# The HTTP API is served over plain HTTP (TLS disabled) with anonymous superuser access —
# appropriate for load-test environments, not production.
elasticsearch:
  # -- Set to true to deploy an Elasticsearch cluster via the ECK operator.
  enabled: false

  # -- The name of the underlying Elasticsearch resource.
  # Changing this also changes the names of the other resources deployed by the
  # ECK Operator, like the Kubernetes Services exposing the access to
  # Elasticsearch.
  name: elasticsearch

  # -- Elasticsearch version to deploy. Must be within the range supported by the installed ECK operator (>= 8.x)
  # See https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s#stack-compatibility
  version: 8.18.0

  # -- Number of Elasticsearch nodes in the cluster.
  count: 3

  # -- Environment variables injected into the Elasticsearch container.
  # Use ES_JAVA_OPTS to tune JVM heap size relative to the container memory limit.
  # See https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/manage-compute-resources#k8s-elasticsearch-memory
  env:
  - name: ES_JAVA_OPTS
    value: -Xms3g -Xmx3g

  # -- CPU and memory resource requests and limits for the Elasticsearch container.
  resources:
    limits:
      cpu: "7"
      memory: 8Gi
    requests:
      cpu: "7"
      memory: 8Gi

  # -- Persistent storage configuration for each Elasticsearch node.
  storage:
    # -- Kubernetes StorageClass for the PersistentVolumeClaim.
    storageClassName: benchmark-ssd-zonal-v1
    # -- Storage capacity requested per Elasticsearch node.
    requests: 256Gi

  # -- Node selector labels for Elasticsearch pod scheduling.
  # The top-level `topologyZone` value is also applied as `topology.kubernetes.io/zone`.
  nodeSelector:
    component: benchmark-n2-standard-8

  # -- Tolerations applied to Elasticsearch pods.
  tolerations:
  - effect: NoSchedule
    key: nodepool
    operator: Equal
    value: n2-standard-8

# -- Configure the Keycloak deployment.
keycloak:
  # -- Whether to deploy Keycloak or not.
  enabled: true

  # -- The Keycloak image to be deployed.
  image:
    registry: europe-west1-docker.pkg.dev/camunda-benchmark
    repository: dockerhub/camunda/keycloak
    tag: quay-optimized-26.6.4

  # -- CPU and memory resource requests and limits for the Keycloak instance.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

  http:
    # -- The port Keycloak listens on for HTTP traffic.
    # Use a non-default port to avoid conflict with Zeebe Gateway on port 8080
    # during port-forwarding.
    port: 18080

  # -- Node selector labels for Keycloak pod scheduling.
  # The top-level `topologyZone` value is also applied as
  # `topology.kubernetes.io/zone`.
  nodeSelector:
    component: benchmark-n2-standard-4

  # -- Tolerations applied to the Keycloak pod.
  tolerations:
    - key: nodepool
      operator: Equal
      value: n2-standard-4
      effect: NoSchedule

  adminUser:
    # -- The name of the initial "admin" user in Keycloak.
    # This should be the same user as configured in Identity's `global.identity.keycloak.auth.adminUser`.
    username: admin
    secret:
      # -- The name of the key used to generate credentials for the Keycloak admin user.
      # This key is used:
      # 1. To generate the "admin" password when creating the Keycloak instance
      # 2. To configure the credentials used by Identity when connecting to Keycloak.
      # It should match the key configured in Identity's
      # `global.identity.keycloak.auth.secret.existingSecretKey`.
      key: identity-keycloak-admin-password

  # -- The namespace to host the Keycloak instance.
  # We deploy Keycloak using the Keycloak Operator, which is currently limited
  # to managed custom resources in a single namespace only.
  # As such, we **have** to deploy Keycloak in the same namespace as the
  # Keycloak Operator and we can't simply deploy Keycloak in the load test
  # namespace.
  # This option allows configuring in which namespace Keycloak will be
  # managed.
  # This probably should not be changed.
  namespace: keycloak-operator

  # -- Configure the PostgreSQL cluster to be used by Keycloak.
  postgresql:
    # -- The name of the CNPG Cluster resource deployed for Keycloak.
    clusterName: postgresql-keycloak

    # -- The name of the PostgreSQL database created for Keycloak.
    databaseName: keycloak

    # -- The name of the PostgreSQL user Keycloak uses to connect to its database.
    databaseUser: keycloak

    # -- The PostgreSQL CNPG image to be used when creating a CNPG-based
    # PostgreSQL cluster.
    image:
      registry: europe-west1-docker.pkg.dev/camunda-benchmark
      repository: ghcrio/cloudnative-pg/postgresql
      tag: "18.4"

    # -- CPU and memory resource requests and limits for the PostgreSQL cluster.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 150m
        memory: 192Mi

    # -- Persistent storage configuration for the PostgreSQL cluster.
    storage:
      size: 1Gi
      storageClass: benchmark-ssd-zonal-v1

    # -- Node selector labels for PostgreSQL pod scheduling
    # The top-level `topologyZone` value is also applied as `topology.kubernetes.io/zone`.
    nodeSelector:
      component: benchmark-n2-standard-4

    # -- Tolerations applied to PostgreSQL pods.
    tolerations:
      - key: nodepool
        operator: Equal
        value: n2-standard-4
        effect: NoSchedule

# -- Configuration for OpenSearch
# See https://github.com/opensearch-project/helm-charts/tree/main/charts/opensearch
# and its default values: https://github.com/opensearch-project/helm-charts/blob/main/charts/opensearch/values.yaml
opensearch:
  # -- Set to true to deploy an OpenSearch cluster via the OpenSearch Helm Chart.
  enabled: false

  clusterName: opensearch
  nameOverride: opensearch
  masterService: opensearch

  majorVersion: "2.19.0"

  image:
    repository: europe-west1-docker.pkg.dev/camunda-benchmark/dockerhub/opensearchproject/opensearch
    tag: 2.19.0

  replicas: 3

  config:
    opensearch.yml: |
      cluster.name: opensearch
      network.host: 0.0.0.0
      plugins.security.disabled: true
      # Disable deprecation logging to avoid filling up the logs with warnings about deprecated features that we might be using in our tests
      logger.org.opensearch.deprecation: "OFF"

    # Log as JSON
    log4j2.properties: |
      appender.console.type = Console
      appender.console.name = console
      appender.console.layout.type = OpenSearchJsonLayout
      appender.console.layout.type_name = json_logger

      rootLogger.level = info
      rootLogger.appenderRef.console.ref = console

  extraEnvs:
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      value: "yourStrongPassword123!"

  opensearchJavaOpts: "-Xms3g -Xmx3g"

  sysctlInit:
    enabled: true

  sysctlVmMaxMapCount: 262144

  resources:
    requests:
      cpu: 7000m
      memory: 8Gi
    limits:
      cpu: 7000m
      memory: 8Gi

  persistence:
    enabled: true
    size: 256Gi
    storageClass: benchmark-ssd-zonal-v1

  nodeSelector:
    component: benchmark-n2-standard-8

  tolerations:
    - key: nodepool
      operator: Equal
      value: n2-standard-8
      effect: NoSchedule

  antiAffinity: "hard"

  protocol: http

  securityConfig:
    enabled: false


# -- Configuration for the Prometheus exporter for Elasticsearch
# See https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus-elasticsearch-exporter
prometheus-elasticsearch-exporter:
  # -- Enable/disable the Prometheus exporter for Elasticsearch
  # This should most probably be enabled if you deploy Elasticsearch or OpenSearch.
  enabled: false

  # Other options for the Prometheus exporter for Elasticsearch.
  # See https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-elasticsearch-exporter/values.yaml for the list of options.
  fullnameOverride: prom-els-exporter

  commonLabels:
    camunda.io/purpose: load-test

  image:
    # Route through colocated GAR pull-through cache to avoid quay.io rate limiting
    # Original: quay.io/prometheuscommunity/elasticsearch-exporter
    repository: europe-west1-docker.pkg.dev/camunda-benchmark/quayio/prometheuscommunity/elasticsearch-exporter

  log:
    format: json

  serviceMonitor:
    enabled: true
    # Same label as when the exporter is deployed as a standalone Helm Chart (not as a dependency).
    jobLabel: elasticsearch-exporter
    # Labels used by the service monitor, specific to our prometheus installation
    labels:
      release: monitoring

# -- Configure the PostgreSQL cluster used by Camunda as secondary storage.
# If you want to use PostgreSQL as secondary storage for Camunda, you must
# enable this resource and configure it according to your needs.
#
# This cluster is **independent** from the PostgreSQL cluster used by Keycloak,
# configured via `keycloak.postgresql`.
postgresql:
  # -- Set to true to deploy this CNPG-managed PostgreSQL cluster.
  # Only needed when the load test uses PostgreSQL as secondary storage.
  enabled: false

  # -- The name of the CNPG Cluster resource deployed for Camunda's secondary storage.
  # Changing this name will also change the Kubernetes Service deployed by the
  # CNPG operator, and thus will require to adjust the JDBC URL used to connect
  # Camunda to PostgreSQL.
  clusterName: postgresql

  # -- The PostgreSQL CNPG image to be used when creating a CNPG-based
  # PostgreSQL cluster.
  image:
    registry: europe-west1-docker.pkg.dev/camunda-benchmark
    repository: dockerhub/postgres
    tag: "18.4"

  # -- The UID and GID used by the PostgreSQL container.
  # This should match the UID/GID in use by the specified Docker image.
  postgresUID: 999
  postgresGID: 999

  # -- CPU and memory resource requests and limits for the PostgreSQL cluster.
  resources:
    requests:
      memory: 8Gi
      cpu: 3000m
    limits:
      cpu: 3000m
      memory: 12Gi

  # -- Persistent storage configuration for the PostgreSQL cluster.
  storage:
    size: 256Gi
    storageClass: benchmark-ssd-zonal-v1

  # -- The PostgreSQL database and user used by Camunda to connect to this cluster.
  database:
    # -- The name of the PostgreSQL database created for Camunda.
    name: camunda
    # -- The name of the PostgreSQL user Camunda uses to connect to its database.
    user: camunda
    # -- The password for the PostgreSQL user used by Camunda. Shared verbatim with
    # `orchestration.data.secondaryStorage.rdbms.secret.inlineSecret` in the
    # `camunda-platform-values-rdbms.yaml` values files, independently of the
    # underlying RDBMS database.
    password: camunda

  # -- PostgreSQL extensions loaded at server startup.
  shared_preload_libraries:
    - pg_stat_statements

  # -- PostgreSQL server configuration parameters (`postgresql.conf`), tuned for the
  # load test's expected write/update volume.
  parameters:
    # WAL Performance Tuning
    wal_buffers: 128MB
    max_wal_size: 4GB
    min_wal_size: 1GB
    checkpoint_timeout: 20min
    checkpoint_completion_target: "0.9"
    wal_writer_delay: 200ms
    wal_writer_flush_after: 1MB

    # Memory Settings
    shared_buffers: 2GB
    effective_cache_size: 7GB
    work_mem: 32MB
    maintenance_work_mem: 1GB

    # Autovacuum - Aggressive for high UPDATE/DELETE volume
    autovacuum_max_workers: "6"
    autovacuum_naptime: 15s
    autovacuum_vacuum_scale_factor: "0.03"
    autovacuum_analyze_scale_factor: "0.02"
    autovacuum_vacuum_cost_limit: "5000"

    # Monitoring
    pg_stat_statements.track: all
    pg_stat_statements.max: "10000"
    track_io_timing: "on"
    track_functions: all

    # Logging - default to silent, but keep the values to easily turn them on
    # during investigations.
    log_statement: none
    log_connections: "off"
    log_disconnections: "off"

  # -- Node selector labels for PostgreSQL pod scheduling.
  # The top-level `topologyZone` value is also applied as `topology.kubernetes.io/zone`.
  nodeSelector:
    component: benchmark-n2-standard-4

  # -- Tolerations applied to PostgreSQL pods.
  tolerations:
    - key: nodepool
      operator: Equal
      value: n2-standard-4
      effect: NoSchedule
