{{- if .Values.dmnK6.enabled }}
# In-cluster k6 DMN decision-evaluation load generator.
#
# ISOLATION — the generator must not steal CPU from the brokers, or the latency
# numbers are meaningless. Two guarantees keep k6 off the broker nodes:
#   1. It does NOT tolerate the `nodepool=n2-standard-4:NoSchedule` taint the
#      benchmark broker nodes carry, so the scheduler cannot place it there.
#   2. podAntiAffinity against `app.kubernetes.io/component: zeebe-broker`
#      (hostname topology) — belt-and-braces even if the taint changes.
# If it stays Pending, the cluster has no spare (non-broker) node — add one; do
# NOT relax the isolation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmn-k6-scripts
data:
  dmn-evaluation.js: |
{{ .Files.Get "dmn-k6/dmn-evaluation.js" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmn-k6-resources
data:
  small_decision.dmn: |
{{ .Files.Get "dmn-k6/resources/small_decision.dmn" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dmn-k6
  labels:
    app.kubernetes.io/component: dmn-k6
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dmn-k6
    spec:
      restartPolicy: Never
      # (1) No broker-nodepool toleration -> cannot land on a broker node.
      # (2) Never co-schedule with a broker pod.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - zeebe-broker
              topologyKey: kubernetes.io/hostname
      {{- if .Values.topologyZone }}
      nodeSelector:
        topology.kubernetes.io/zone: "{{ .Values.topologyZone }}"
      {{- end }}
      initContainers:
        # Deploy the bundled decision(s), then poll an evaluation until it
        # resolves (200) so k6 never races an undeployed decision.
        - name: deploy-decisions
          image: {{ .Values.dmnK6.deployImage }}
          imagePullPolicy: IfNotPresent
          env:
{{ include "dmn-k6.authEnv" . | indent 12 }}
            - name: DMN_DECISION_ID
              value: "{{ .Values.dmnK6.decisionId }}"
          command:
            - /bin/sh
            - -ceu
            - |-
              # A fresh cluster (image pull + broker/Keycloak boot) can take a few
              # minutes to accept requests. Retry token -> deploy -> evaluate as one
              # idempotent loop for up to ~10 minutes; succeed as soon as an
              # evaluation returns 200 so k6 never races an unready cluster.
              for i in $(seq 1 120); do
                AUTH=""
                if [ -n "${CAMUNDA_CLIENT_ID:-}" ]; then
                  TOKEN="$(curl -s "${CAMUNDA_OAUTH_URL}" \
                    -d grant_type=client_credentials \
                    -d audience="${CAMUNDA_TOKEN_AUDIENCE}" \
                    -d client_id="${CAMUNDA_CLIENT_ID}" \
                    -d client_secret="${CAMUNDA_CLIENT_SECRET}" \
                    | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
                  if [ -z "$TOKEN" ]; then echo "attempt $i: token not ready"; sleep 5; continue; fi
                  AUTH="Authorization: Bearer $TOKEN"
                fi
                # (Re)deploy the decision(s); redeploying the same file is cheap and idempotent.
                for f in /resources/*.dmn; do
                  curl -s -o /dev/null -X POST "${CAMUNDA_BASE_URL}/v2/deployments" \
                    ${AUTH:+-H "$AUTH"} -F "resources=@$f" || true
                done
                code="$(curl -s -o /dev/null -w '%{http_code}' \
                  -X POST "${CAMUNDA_BASE_URL}/v2/decision-definitions/evaluation" \
                  ${AUTH:+-H "$AUTH"} -H 'Content-Type: application/json' \
                  -d "{\"decisionDefinitionId\":\"${DMN_DECISION_ID}\",\"variables\":{}}")"
                if [ "$code" = "200" ]; then echo "Decision '${DMN_DECISION_ID}' is evaluable."; exit 0; fi
                echo "attempt $i: evaluation HTTP $code, retrying ..."; sleep 5
              done
              echo "ERROR: decision '${DMN_DECISION_ID}' never became evaluable"; exit 1
          volumeMounts:
            - name: resources
              mountPath: /resources
      containers:
        - name: k6
          image: {{ .Values.dmnK6.image }}
          imagePullPolicy: IfNotPresent
          command: ["k6", "run", "/scripts/dmn-evaluation.js"]
          resources:
{{ toYaml .Values.dmnK6.resources | indent 12 }}
          env:
{{ include "dmn-k6.authEnv" . | indent 12 }}
            - name: DMN_RATE
              value: "{{ .Values.dmnK6.rate }}"
            - name: DMN_DURATION
              value: "{{ .Values.dmnK6.duration }}"
            - name: DMN_MAX_VUS
              value: "{{ .Values.dmnK6.maxVUs }}"
            - name: DMN_DECISION_ID
              value: "{{ .Values.dmnK6.decisionId }}"
            {{- if .Values.dmnK6.mix }}
            - name: DMN_MIX
              value: {{ .Values.dmnK6.mix | quote }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: dmn-k6-scripts
        - name: resources
          configMap:
            name: dmn-k6-resources
{{- end }}
