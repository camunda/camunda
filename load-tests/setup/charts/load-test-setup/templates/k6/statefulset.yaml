{{- $root := . }}
{{- range $testName, $test := .Values.k6.tests }}
{{- $mode := include "load-test-setup.k6.mode" $test }}
{{- if and $test.enabled (eq $mode "statefulset") }}
{{- $replicas := dig "runner" "statefulset" "replicas" 1 $test | int }}
{{- $segments := list "0" }}
{{- range untilStep 1 (add $replicas 1 | int) 1 }}
{{- $segments = append $segments (printf "%d/%d" . $replicas) }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "k6-{{ $testName }}"
  labels:
    app.kubernetes.io/component: k6
spec:
  replicas: {{ $replicas }}
  # The default `OrderedReady` starts the pods one after the other, which would delay the start of
  # the later execution segments. All the segments must run at the same time.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # All the pods restart at once when the number of replicas changes: they all run a different
      # execution segment of the test afterwards.
      maxUnavailable: {{ max 1 $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "k6-{{ $testName }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "k6-{{ $testName }}"
        app.kubernetes.io/component: k6
      annotations:
        checksum/k6-files: {{ print (include (print $root.Template.BasePath "/k6/configmap-scripts.yaml") $root) (include (print $root.Template.BasePath "/k6/configmap-data.yaml") $root) | sha256sum }}
    spec:
      containers:
        - name: k6
          image: europe-west1-docker.pkg.dev/camunda-benchmark/dockerhub/grafana/k6:2.4.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            # Each pod runs its own execution segment of the test, so that the load of the test is
            # split between the replicas. The tags are the ones the k6 operator sets on the metrics
            # of a TestRun.
            - |
              instance_id=`expr "$K8S_POD_INDEX" + 1`
              exec k6 run --quiet /scripts/{{ $test.script }} \
                --tag namespace="$K8S_NAMESPACE" \
                --tag testrun_name=k6-{{ $testName }} \
                --tag instance_id="$instance_id" \
                --execution-segment "$K8S_POD_INDEX/$STATEFULSET_REPLICAS:$instance_id/$STATEFULSET_REPLICAS" \
                --execution-segment-sequence "{{ $segments | join "," }}"
          env:
            {{- include "load-test-setup.k6.env" $root | nindent 12 }}
            - name: STATEFULSET_REPLICAS
              value: "{{ $replicas }}"
            - name: K8S_POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['apps.kubernetes.io/pod-index']"
          resources:
            {{- toYaml ($test.resources | default $root.Values.k6.resources) | nindent 12 }}
          volumeMounts:
            - name: k6-scripts
              mountPath: /scripts
            - name: k6-data
              mountPath: /data
      nodeSelector:
        {{- if $root.Values.topologyZone }}
        topology.kubernetes.io/zone: "{{ $root.Values.topologyZone }}"
        {{- end }}
        {{- with $root.Values.k6.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      tolerations:
        {{- toYaml $root.Values.k6.tolerations | nindent 8 }}
      volumes:
        - name: k6-scripts
          configMap:
            name: k6-scripts
        - name: k6-data
          configMap:
            name: k6-data
{{- end }}
{{- end }}
