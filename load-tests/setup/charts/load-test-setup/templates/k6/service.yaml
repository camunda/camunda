{{- $root := . }}
{{- range $testName, $test := .Values.k6.tests }}
{{- if $test.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: "k6-{{ $testName }}"
  labels:
    app.kubernetes.io/component: k6
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: "k6-{{ $testName }}"
  ports:
    - name: http-api
      port: 6565
      targetPort: http-api
{{- end }}
{{- end }}
