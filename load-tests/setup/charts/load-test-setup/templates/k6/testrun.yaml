{{- $root := . }}
{{- range $testName, $test := .Values.k6.tests }}
{{- $mode := include "load-test-setup.k6.mode" $test }}
{{- if and $test.enabled (eq $mode "testrun") }}
{{/* Spec: https://github.com/grafana/k6-operator/blob/main/docs/crd-generated.md */}}
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: "k6-{{ $testName }}"
  labels:
    app.kubernetes.io/component: k6
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-scripts
      file: "{{ $test.script }}"

  args:
    # Always expose the current namespace as a dedicated tag/label.
    - --tag
    - namespace={{ $root.Release.Namespace }}

  starter:
    image: europe-west1-docker.pkg.dev/camunda-benchmark/ghcrio/grafana/k6-operator:starter-v1.7.0
    imagePullPolicy: IfNotPresent

  runner:
    image: europe-west1-docker.pkg.dev/camunda-benchmark/dockerhub/grafana/k6:2.4.0
    imagePullPolicy: IfNotPresent

    env:
      {{- include "load-test-setup.k6.env" $root | nindent 6 }}

    resources:
      {{- toYaml ($test.resources | default $root.Values.k6.resources) | nindent 6 }}

    nodeSelector:
      {{- if $root.Values.topologyZone }}
      topology.kubernetes.io/zone: "{{ $root.Values.topologyZone }}"
      {{- end }}
      {{- with $root.Values.k6.nodeSelector }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

    tolerations:
      {{- toYaml $root.Values.k6.tolerations | nindent 6 }}

    volumes:
      - name: k6-data
        configMap:
          name: k6-data

    volumeMounts:
      - name: k6-data
        mountPath: /data

{{- end }}
{{- end }}
