{{- $root := . }}
{{- range $testName, $test := .Values.k6.tests }}
{{- if $test.enabled }}
{{/* Spec: https://github.com/grafana/k6-operator/blob/main/docs/crd-generated.md */}}
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: "k6-{{ $testName }}"
  labels:
    app.kubernetes.io/component: k6
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-scripts
      file: "{{ $test.script }}"

  args:
    # Always expose the current namespace as a dedicated tag/label.
    - --tag
    - namespace={{ $root.Release.Namespace }}
    {{- if $root.Values.k6.profiling }}
    # pprof endpoints under /debug/pprof/ on the k6 REST API (port 6565 of the runner pod).
    - --profiling-enabled
    {{- end }}

  starter:
    image: "{{ $root.Values.k6.images.starter }}"
    imagePullPolicy: IfNotPresent

  runner:
    image: "{{ $root.Values.k6.images.runner }}"
    imagePullPolicy: IfNotPresent

    env:
      - name: K6_LOG_FORMAT
        value: json

      # Export to Prometheus
      - name: K6_OUT
        value: experimental-prometheus-rw

      # The Prometheus endpoint to report metrics to
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: "{{ $root.Values.k6.prometheus.endpoint }}"

      # Mark Prometheus as "stale" when they are not updated anymore.
      - name: K6_PROMETHEUS_RW_STALE_MARKERS
        value: "true"

      # System tags set automatically on every metric (see `k6.tags.system` in values.yaml).
      - name: K6_SYSTEM_TAGS
        value: "{{ $root.Values.k6.tags.system | join "," }}"

      # Found empirically: without these three settings, k6 memory grows without bound
      # on long runs and the pod is OOM-killed.
      - name: K6_NO_THRESHOLDS
        value: "true"
      - name: K6_SUMMARY_MODE
        value: disabled
      - name: K6_FEATURES
        value: native-histograms

      # The Camunda address is a headless service, so DNS returns pod IPs. k6 caches DNS
      # answers for 5m by default: after a broker restart, requests go to old pod IPs.
      - name: K6_DNS
        value: "{{ $root.Values.k6.dns }}"

      - name: DATA_DIR
        value: /data

      # Credentials
      - name: CAMUNDA_BASE_URL
        valueFrom:
          secretKeyRef:
            key: zeebeRestAddress
            name: load-test-credentials
      - name: CAMUNDA_CLIENT_ID
        valueFrom:
          secretKeyRef:
            key: clientId
            name: load-test-credentials
      - name: CAMUNDA_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            key: clientSecret
            name: load-test-credentials
      - name: CAMUNDA_OAUTH_URL
        valueFrom:
          secretKeyRef:
            key: authServer
            name: load-test-credentials
      - name: CAMUNDA_TOKEN_AUDIENCE
        valueFrom:
          secretKeyRef:
            key: authorizationAudience
            name: load-test-credentials
      - name: ZEEBE_GRPC_ADDRESS
        valueFrom:
          secretKeyRef:
            key: zeebeGrpcAddress
            name: load-test-credentials
      {{- range $name, $value := $test.env }}
      - name: {{ $name }}
        value: {{ $value | quote }}
      {{- end }}

    resources:
      {{- toYaml ($test.resources | default $root.Values.k6.resources) | nindent 6 }}

    nodeSelector:
      {{- if $root.Values.topologyZone }}
      topology.kubernetes.io/zone: "{{ $root.Values.topologyZone }}"
      {{- end }}
      {{- with $root.Values.k6.nodeSelector }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

    tolerations:
      {{- toYaml $root.Values.k6.tolerations | nindent 6 }}

    volumes:
      - name: k6-data
        configMap:
          name: k6-data

    volumeMounts:
      - name: k6-data
        mountPath: /data

{{- end }}
{{- end }}
