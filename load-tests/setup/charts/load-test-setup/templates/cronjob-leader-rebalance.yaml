apiVersion: batch/v1
kind: CronJob
metadata:
  name: leader-balancer
  labels:
    app: leader-balancer
spec:
  concurrencyPolicy: Allow
  jobTemplate:
    metadata:
      name: leader-balancer
    spec:
      template:
        metadata:
          labels:
            app: leader-balancer
        spec:
          containers:
          - name: leader-balancer
            image: curlimages/curl:7.87.0
            command: ["/bin/sh", "-c"]
            {{- if eq .Values.leaderBalancer.endpoint "actuator" }}
            args:
              - |-
                curl -L -v -X POST "{{ .Values.camundaManagementUrl }}/actuator/rebalance"
            {{- else }}
            env:
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientId
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientSecret
            - name: AUTH_SERVER
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authServer
            - name: AUTHORIZATION_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authorizationAudience
            - name: ZEEBE_REST_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: zeebeRestAddress
            args:
              - |-
                set -eu
                response=$(curl -sS -f -X POST "$AUTH_SERVER" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  --data-urlencode "grant_type=client_credentials" \
                  --data-urlencode "client_id=$CLIENT_ID" \
                  --data-urlencode "client_secret=$CLIENT_SECRET" \
                  --data-urlencode "audience=$AUTHORIZATION_AUDIENCE")
                token=$(echo "$response" | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
                if [ -z "$token" ]; then
                  echo "Failed to obtain an access token for the cluster-admin API" >&2
                  exit 1
                fi
                curl -L -v -f -X POST "$ZEEBE_REST_ADDRESS/cluster/v2/rebalance" \
                  -H "Authorization: Bearer $token"
            {{- end }}

          restartPolicy: OnFailure
  schedule: '*/10 * * * *'
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  suspend: false
