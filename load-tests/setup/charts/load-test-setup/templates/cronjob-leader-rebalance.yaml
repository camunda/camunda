apiVersion: batch/v1
kind: CronJob
metadata:
  name: leader-balancer
  labels:
    app: leader-balancer
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      name: leader-balancer
    spec:
      template:
        metadata:
          labels:
            app: leader-balancer
        spec:
          containers:
          - name: leader-balancer
            image: alpine:3.24
            command: ["/bin/sh", "-c"]
            {{- if eq .Values.leaderBalancer.endpoint "actuator" }}
            args:
              - |-
                apk add --quiet --progress=no curl
                curl -L -v --connect-timeout 10 --max-time 60 -X POST "{{ .Values.camundaManagementUrl }}/actuator/rebalance"
            {{- else }}
            env:
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: leader-balancer-credentials
                  key: clientId
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: leader-balancer-credentials
                  key: clientSecret
            - name: AUTH_SERVER
              valueFrom:
                secretKeyRef:
                  name: leader-balancer-credentials
                  key: authServer
            - name: AUTHORIZATION_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: leader-balancer-credentials
                  key: authorizationAudience
            - name: ZEEBE_REST_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: leader-balancer-credentials
                  key: zeebeRestAddress
            args:
              - |-
                apk add --quiet --progress=no curl jq
                {{- regexReplaceAll "(?m)^[ \t]+$" (.Files.Get "scripts/rebalance-v2.sh" | trimSuffix "\n" | nindent 16) "" }}
            {{- end }}

          restartPolicy: OnFailure
      activeDeadlineSeconds: 180
  schedule: '*/10 * * * *'
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  suspend: false
