{{/*
Seeds a file-store-shaped Secret for the secrets-connector-e2e benchmark. Each key becomes one
file when the Secret is mounted as a volume, and the file-based secret store reads one secret
per file (file name = bare secret name, contents = value). The orchestration cluster mounts
this Secret and points camunda.secrets.stores.file.default.path at the mount, so the
connectorSecretResolution process's secrets.<keyPrefix>0 reference resolves against a real
store read.

Values (see values.yaml, secretsConnectorBenchmark):
- enabled:    render this Secret only for the secrets-connector-e2e benchmark scenario
- secretName: name of the Secret, referenced by the platform values volume
- count:      number of distinct secrets to seed
- keyPrefix:  bare-name prefix; the process resolves secrets.<keyPrefix><i>

Values are derived deterministically per namespace via the shared generate-secret helper, so a
re-install produces the same set rather than rotating every secret and invalidating the cache.
*/}}
{{- if and .Values.secretsConnectorBenchmark .Values.secretsConnectorBenchmark.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretsConnectorBenchmark.secretName }}
type: Opaque
stringData:
{{- $prefix := .Values.secretsConnectorBenchmark.keyPrefix }}
{{- $namespace := .Release.Namespace }}
{{- range $i := until (int .Values.secretsConnectorBenchmark.count) }}
  {{ printf "%s%d" $prefix $i }}: "{{ include "generate-secret" (dict "namespace" $namespace "user" (printf "benchmark-secret-%s%d" $prefix $i)) }}"
{{- end }}
{{- end }}
