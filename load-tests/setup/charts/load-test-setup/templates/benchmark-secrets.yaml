{{/*
Seeds a file-store-shaped Secret for the secrets API benchmark. Each key becomes one file when the
Secret is mounted as a volume, and the file-based secret store reads one secret per file (file name
= bare secret name, contents = value). The orchestration cluster mounts this Secret and points
camunda.secrets.stores.file.default.path at the mount, so the zeebe-secrets benchmark driver's
camunda.secrets.<keyPrefix><i> references resolve against real store reads.

Values (see values.yaml, zeebeSecretsBenchmark):
- enabled:    render this Secret only for the zeebe-secrets benchmark scenario
- secretName: name of the Secret, referenced by the platform values volume
- count:      number of distinct secrets to seed; must be >= the driver's referencePoolSize
- keyPrefix:  bare-name prefix; the driver resolves camunda.secrets.<keyPrefix><i>

Values are derived deterministically per namespace via the shared generate-secret helper, so a
re-install produces the same set rather than rotating every secret and invalidating the cache.
*/}}
{{- if .Values.zeebeSecretsBenchmark.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.zeebeSecretsBenchmark.secretName }}
type: Opaque
stringData:
{{- $prefix := .Values.zeebeSecretsBenchmark.keyPrefix }}
{{- $namespace := .Release.Namespace }}
{{- range $i := until (int .Values.zeebeSecretsBenchmark.count) }}
  {{ printf "%s%d" $prefix $i }}: "{{ include "generate-secret" (dict "namespace" $namespace "user" (printf "benchmark-secret-%s%d" $prefix $i)) }}"
{{- end }}
{{- end }}
