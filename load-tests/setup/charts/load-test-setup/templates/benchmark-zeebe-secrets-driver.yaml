{{/*
Deploys the secrets-resolution benchmark driver for the `zeebe-secrets` scenario.

The driver is a dedicated load-tester image (gcr.io/zeebe-io/zeebe-secrets, built from
camunda/camunda with --spring.profiles.active=zeebe-secrets baked in) that drives
POST /v2/secrets/resolve and /v2/secrets/list against the orchestration cluster
to benchmark the secret-resolution API against the file secret store.

It replaces the process starter/workers for this scenario (which are scaled to 0
via the Makefile), so it lives in the load-test-setup chart rather than the
camunda-load-tests subchart: the subchart only knows about the starter/worker
roles, and adding a role there would require a cross-repo change. The driver
reuses the same `load-test-credentials` Secret (OAuth) and the same
`app.kubernetes.io/component: zeebe-client` label as the subchart clients, so the
existing `clients` ServiceMonitor scrapes its metrics with no extra wiring.

Driver knobs come from `.Values.zeebeSecretsBenchmark.driver` and map to the
LOAD_TESTER_ZEEBE_SECRETS_* env vars read by ZeebeSecretsDriverProperties.
*/}}
{{- if .Values.zeebeSecretsBenchmark.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeebe-secrets
  labels:
    app: zeebe-secrets
spec:
  replicas: {{ .Values.zeebeSecretsBenchmark.driver.replicas }}
  selector:
    matchLabels:
      app: zeebe-secrets
  template:
    metadata:
      labels:
        app: zeebe-secrets
        # Reuses the subchart clients ServiceMonitor selector so the driver's
        # zeebe_secrets_* metrics are scraped without a dedicated monitor.
        app.kubernetes.io/component: zeebe-client
    spec:
      {{- if .Values.global.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.image.pullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.global.tolerations }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      {{- end }}
      # Keycloak provisions the `orchestration` OIDC client asynchronously, after
      # its own pod is up. The driver's OAuth provider latches a non-retryable
      # failure on the first 401 and then fails fast forever, so a driver that
      # starts before the client exists generates zero traffic for the whole run.
      # Gate startup on the token endpoint actually issuing a token for the
      # client. Reuses the driver image (it ships curl) so no extra image is
      # pulled, and the same load-test-credentials Secret the driver uses.
      initContainers:
        - name: wait-for-oidc-client
          image: "{{ .Values.global.image.repository }}/zeebe-secrets:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Waiting for the orchestration OIDC client to be provisioned in Keycloak..."
              i=0
              until [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$AUTH_SERVER_URL" \
                    -d grant_type=client_credentials \
                    -d "client_id=$CLIENT_ID" \
                    -d "client_secret=$CLIENT_SECRET" \
                    -d "audience=$TOKEN_AUDIENCE")" = "200" ]; do
                i=$((i + 1))
                if [ "$i" -ge 120 ]; then
                  echo "Token endpoint did not issue a token after ~10m; giving up." >&2
                  exit 1
                fi
                echo "attempt $i: token endpoint not ready, retrying in 5s"
                sleep 5
              done
              echo "orchestration client is ready; starting the zeebe-secrets driver."
          env:
            - name: AUTH_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authServer
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientId
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientSecret
            - name: TOKEN_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authorizationAudience
      containers:
        - name: zeebe-secrets
          image: "{{ .Values.global.image.repository }}/zeebe-secrets:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          # The zeebe-secrets driver image bakes --spring.profiles.active=zeebe-secrets, so
          # only the Spring Boot compatible env vars below apply (there is no
          # HOCON app for it).
          env:
            - name: JDK_JAVA_OPTIONS
              value: "-XX:+HeapDumpOnOutOfMemoryError"
            {{- if .Values.zeebeSecretsBenchmark.driver.logLevel }}
            - name: LOG_LEVEL
              value: {{ .Values.zeebeSecretsBenchmark.driver.logLevel | quote }}
            - name: LOGGING_LEVEL_IO_CAMUNDA_ZEEBE
              value: {{ .Values.zeebeSecretsBenchmark.driver.logLevel | quote }}
            {{- end }}
            # OAuth credentials, from the load-test-credentials Secret created by
            # this chart (see load-test-credentials.yaml), same as the subchart
            # starter's saas path.
            - name: CAMUNDA_CLIENT_MODE
              value: "saas"
            - name: CAMUNDA_CLIENT_AUTH_METHOD
              value: "oidc"
            - name: ZEEBE_REST_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: zeebeRestAddress
            - name: ZEEBE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientId
            - name: ZEEBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientSecret
            - name: ZEEBE_AUTHORIZATION_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authServer
            - name: ZEEBE_TOKEN_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authorizationAudience
            - name: ZEEBE_AUTH_TYPE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authType
            - name: ZEEBE_GRPC_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: zeebeGrpcAddress
            - name: CAMUNDA_CLIENT_PREFER_REST_OVER_GRPC
              value: {{ .Values.global.preferRest.enabled | quote }}
            {{- range $keyValue := .Values.global.extraEnvVars }}
            - name: {{ $keyValue.name }}
              {{- if $keyValue.valueFrom }}
              valueFrom:
                {{- toYaml $keyValue.valueFrom | nindent 16 }}
              {{- else }}
              value: {{ $keyValue.value | quote }}
              {{- end }}
            {{- end }}
            ##
            ## Zeebe zeebe-secrets driver configuration (zeebeSecretsBenchmark.driver.* -> LOAD_TESTER_ZEEBE_SECRETS_*)
            ##
            - name: LOAD_TESTER_ZEEBE_SECRETS_ENABLED
              value: "true"
            - name: LOAD_TESTER_ZEEBE_SECRETS_RATE
              value: {{ .Values.zeebeSecretsBenchmark.driver.rate | quote }}
            {{- if .Values.zeebeSecretsBenchmark.driver.rateDuration }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_RATE_DURATION
              value: {{ .Values.zeebeSecretsBenchmark.driver.rateDuration | quote }}
            {{- end }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_THREADS
              value: {{ .Values.zeebeSecretsBenchmark.driver.threads | quote }}
            {{- if .Values.zeebeSecretsBenchmark.driver.durationLimit }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_DURATION_LIMIT
              value: {{ .Values.zeebeSecretsBenchmark.driver.durationLimit | quote }}
            {{- end }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_RESOLVE_RATIO
              value: {{ .Values.zeebeSecretsBenchmark.driver.resolveRatio | quote }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_BATCH_SIZE
              value: {{ .Values.zeebeSecretsBenchmark.driver.batchSize | quote }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_DUPLICATE_RATIO
              value: {{ .Values.zeebeSecretsBenchmark.driver.duplicateRatio | quote }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_REFERENCE_POOL_SIZE
              value: {{ .Values.zeebeSecretsBenchmark.driver.referencePoolSize | quote }}
            {{- if .Values.zeebeSecretsBenchmark.driver.referencePrefix }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_REFERENCE_PREFIX
              value: {{ .Values.zeebeSecretsBenchmark.driver.referencePrefix | quote }}
            {{- end }}
            {{- if .Values.zeebeSecretsBenchmark.driver.referenceBaseName }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_REFERENCE_BASE_NAME
              value: {{ .Values.zeebeSecretsBenchmark.driver.referenceBaseName | quote }}
            {{- end }}
            {{- if .Values.zeebeSecretsBenchmark.driver.requestTimeout }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_REQUEST_TIMEOUT
              value: {{ .Values.zeebeSecretsBenchmark.driver.requestTimeout | quote }}
            {{- end }}
            - name: LOAD_TESTER_ZEEBE_SECRETS_WARMUP
              value: {{ .Values.zeebeSecretsBenchmark.driver.warmup | quote }}
          resources:
            {{- toYaml .Values.zeebeSecretsBenchmark.driver.resources | nindent 12 }}
          ports:
            - containerPort: 9600
              name: "http"
{{- end }}
