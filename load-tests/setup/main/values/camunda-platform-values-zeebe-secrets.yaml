# Platform overrides for the secrets API benchmark scenario (scenario=zeebe-secrets).
#
# Requires the camunda-platform chart to be sourced from git main (via
# LOAD_TEST_PLATFORM_CHART_GIT_REF in newLoadTest.sh): orchestration.secretStore
# is unreleased at the pinned chart version. See load-tests/docs/zeebe-secrets-benchmark.md.
orchestration:
  # First-class file-based secret store (camunda-platform-helm#6721). The chart
  # mounts the existing `benchmark-secrets` Secret read-only at `path` (one file
  # per secret) and writes camunda.secrets.stores.file.default.path into the
  # application configuration, so no extraVolumes/extraConfiguration are needed.
  # The store id MUST be `default` — that is the id a `camunda.secrets.<name>`
  # reference addresses. The Secret itself is seeded by the load-test-setup chart
  # (zeebeSecretsBenchmark), whose keys (bench_0, bench_1, ...) become the file names.
  secretStore:
    file:
      default:
        path: /etc/camunda/secrets
        secret:
          existingSecret: benchmark-secrets

  security:
    initialization:
      # Helm does not merge lists, so this REPLACES the defaults' authorizations
      # rather than merging. It repeats the defaults' entries and adds the SECRET
      # one. Keep the repeated entries in sync with camunda-platform-values-defaults.yaml.
      authorizations:
        # --- Repeated from camunda-platform-values-defaults.yaml ---
        - ownerType: CLIENT
          ownerId: orchestration
          resourceType: RESOURCE
          resourceId: "*"
          permissions:
            - CREATE
        - ownerType: CLIENT
          ownerId: orchestration
          resourceType: PROCESS_DEFINITION
          resourceId: "*"
          permissions:
            - CREATE_PROCESS_INSTANCE
            - UPDATE_PROCESS_INSTANCE
            - READ_PROCESS_INSTANCE
            - READ_PROCESS_DEFINITION
        - ownerType: CLIENT
          ownerId: orchestration
          resourceType: MESSAGE
          resourceId: "*"
          permissions:
            - CREATE
        # --- Added for the zeebe-secrets benchmark ---
        # REVEAL is checked per reference by /v2/secrets/resolve; READ gates
        # /v2/secrets/list. resourceId "*" authorizes every seeded reference so
        # the driver's whole pool resolves.
        - ownerType: CLIENT
          ownerId: orchestration
          resourceType: SECRET
          resourceId: "*"
          permissions:
            - READ
            - REVEAL
