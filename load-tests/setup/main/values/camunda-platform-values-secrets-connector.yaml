# Platform overrides for the secrets-connector-e2e benchmark scenario (scenario=secrets-connector).
#
# Requires the camunda-platform chart to be sourced from git main (via
# LOAD_TEST_PLATFORM_CHART_GIT_REF in newLoadTest.sh): orchestration.secretStore is unreleased
# at the pinned chart version. See load-tests/docs/secrets-connector-benchmark.md.
#
# Unlike the earlier zeebe-secrets scenario (which added a standalone HTTP driver to hammer
# /v2/secrets/resolve and /v2/secrets/list directly), this scenario resolves secrets through the
# real outbound-connector code path: the connectorSecretResolution BPMN process (deployed by the
# load-tester Starter, see load-tester-values-secrets-connector.yaml) activates an
# io.camunda:http-json:1 job whose header input contains a {{secrets.BENCHMARK_TOKEN0}}
# placeholder. The connectors component resolves it via CentralStoreSecretProvider (legacy
# FALLBACK mode) before issuing the HTTP call, calling the same gateway
# /v2/secrets/resolve endpoint the old driver benchmarked directly, but through the client that
# actually calls it in production (connectors), not a bespoke driver impersonating orchestration.
connectors:
  env:
    # Required for CentralStoreSecretProvider to be added to the secret-provider chain.
    - name: CAMUNDA_CONNECTOR_SECRET_RESOLVER_LEGACY_MODE
      value: FALLBACK
    # Both STRICT and LAX derive their per-element allow-list by statically regex-scanning the
    # BPMN XML's zeebe:input source text for literal {{secrets.<name>}} occurrences
    # (ProcessDefinitionSecretKeyCache/SecretUtil.retrieveSecretKeysInInput in connectors). This
    # scenario's BPMN builds each placeholder at runtime via a FEEL expression
    # ("{{secrets." + keyPrefix + string(...) + "}}"), so no literal name ever appears in the BPMN
    # XML: the scan finds zero secret names for the element, both modes cache that empty allow-list,
    # and every reference is filtered out from then on (LazyLoadingSecretFilter only falls back to
    # allow-all on an exception during the scan, not on a legitimately-empty result) — confirmed
    # empirically: with STRICT, a full dedup run produced zero /v2/secrets/resolve calls and zero
    # camunda_secret_cache_result_total increments on any orchestration pod, while jobs kept
    # "succeeding" because the target (connectors:8080/actuator/health) never validates headers.
    # DISABLED is the only mode that skips the filter (SecretFilter.allowAll()), so it is the only
    # one compatible with this scenario's dynamically-parameterized secret names.
    - name: CAMUNDA_CONNECTOR_SECRET_RESOLVER_SECRET_FILTER_MODE
      value: DISABLED
    # SpringConnectorJobHandler logs "Received job"/"Completing job" at INFO for every job, each
    # line carrying 4 MDC fields (processInstanceKey, jobKey, elementInstanceKey,
    # processDefinitionKey). No other scenario drives the connectors component this hard, so
    # nothing else hits this: at starter.rate=100/s that's 200 lines/s per pod, which tripped
    # GKE's "excessive logging" alert (>256 kB/s) within minutes. Invocation counts/latency are
    # already on camunda_connector_outbound_invocations_total and _execution_time_seconds, so
    # this logger adds no benchmark signal — drop it to WARN.
    #
    # Must be set via SPRING_APPLICATION_JSON, not a LOGGING_LEVEL_* env var: Spring Boot's
    # environment-variable relaxed binding lowercases the whole property name before matching it
    # against the "logging.level" map, so LOGGING_LEVEL_..._SPRINGCONNECTORJOBHANDLER resolves to
    # the key "...springconnectorjobhandler" (all lowercase). SLF4J/Logback logger names are
    # case-sensitive and equal the FQCN (with its capitalised class-name segment), so the
    # lowercase key never matches the real logger and the level silently has no effect.
    # SPRING_APPLICATION_JSON is parsed as JSON, which preserves case.
    - name: SPRING_APPLICATION_JSON
      value: >-
        {"logging":{"level":{"io.camunda.connector.runtime.outbound.job.SpringConnectorJobHandler":"WARN"}}}

orchestration:
  # First-class file-based secret store (camunda-platform-helm#6721). The chart mounts the
  # existing `benchmark-secrets` Secret read-only at `path` (one file per secret) and writes
  # camunda.secrets.stores.file.default.path into the application configuration, so no
  # extraVolumes/extraConfiguration are needed. The store id MUST be `default` — that is the id a
  # `secrets.<name>` reference addresses. The Secret itself is seeded by the load-test-setup
  # chart (secretsConnectorBenchmark), whose single key (BENCHMARK_TOKEN0) becomes the file name.
  secretStore:
    file:
      default:
        path: /etc/camunda/secrets
        secret:
          existingSecret: benchmark-secrets

  security:
    initialization:
      # Helm does not merge lists, so this REPLACES the defaults' authorizations rather than
      # merging. It repeats the defaults' orchestration entries and adds a matching set for the
      # connectors client (which activates/completes the io.camunda:http-json:1 job) plus the
      # SECRET grant. Keep the repeated entries in sync with camunda-platform-values-defaults.yaml.
      authorizations:
        # --- Repeated from camunda-platform-values-defaults.yaml ---
        - ownerType: CLIENT
          ownerId: orchestration
          resourceType: RESOURCE
          resourceId: "*"
          permissions:
            - CREATE
        - ownerType: CLIENT
          ownerId: orchestration
          resourceType: PROCESS_DEFINITION
          resourceId: "*"
          permissions:
            - CREATE_PROCESS_INSTANCE
            - UPDATE_PROCESS_INSTANCE
            - READ_PROCESS_INSTANCE
            - READ_PROCESS_DEFINITION
        - ownerType: CLIENT
          ownerId: orchestration
          resourceType: MESSAGE
          resourceId: "*"
          permissions:
            - CREATE
        # --- Added for the secrets-connector-e2e benchmark ---
        # The connectors client activates and completes the io.camunda:http-json:1 job created
        # by the connectorSecretResolution process, so it needs the same job-lifecycle grant the
        # orchestration client has for its own workers.
        - ownerType: CLIENT
          ownerId: connectors
          resourceType: PROCESS_DEFINITION
          resourceId: "*"
          permissions:
            - UPDATE_PROCESS_INSTANCE
            - READ_PROCESS_DEFINITION
        # REVEAL is checked per reference by /v2/secrets/resolve; READ gates /v2/secrets/list.
        # Granted to the connectors client, which is the one actually calling
        # /v2/secrets/resolve in this scenario (the old zeebe-secrets scenario granted this to
        # orchestration instead, because its driver reused the orchestration client's
        # credentials).
        - ownerType: CLIENT
          ownerId: connectors
          resourceType: SECRET
          resourceId: "*"
          permissions:
            - READ
            - REVEAL
