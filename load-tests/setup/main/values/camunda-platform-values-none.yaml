# Values for Camunda Platform Chart.
# https://github.com/camunda/camunda-platform-helm
#
# This file is used to override the default values of the chart.
# The values are optimized for running the load tests with a Camunda cluster on GKE.
#
# This is a YAML-formatted file.

########################################################################################
################################################### Global cluster configuration
########################################################################################
global:
  noSecondaryStorage: true
  # INC-8994 experiment: a standalone gateway (bin/gateway, 3 replicas, 1 CPU each) in front of brokers without embedded gateway.
  # It reuses the broker ConfigMap (cluster name, contact points, OIDC) and the broker credentials secret.
  extraManifests:
    - |
      apiVersion: v1
      kind: Service
      metadata:
        name: camunda-sgw
        labels:
          app: camunda-platform
          app.kubernetes.io/component: zeebe-gateway
      spec:
        # Headless, so the clients resolve every gateway pod and round-robin over them. A ClusterIP gives one virtual IP, one HTTP/2 connection and one busy gateway.
        clusterIP: None
        type: ClusterIP
        selector:
          app: camunda-sgw
        ports:
          - name: grpc
            port: 26500
            targetPort: 26500
          - name: http
            port: 8080
            targetPort: 8080
          - name: server
            port: 9600
            targetPort: 9600
    - |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: camunda-sgw
        labels:
          app: camunda-sgw
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: camunda-sgw
        template:
          metadata:
            labels:
              app: camunda-sgw
              camunda.io/purpose: load-test
          spec:
            imagePullSecrets:
              - name: harbor-registry
            serviceAccountName: camunda
            nodeSelector:
              component: benchmark-n2-standard-8
              topology.kubernetes.io/zone: __AVAILABILITY_ZONE__
            tolerations:
              - key: nodepool
                operator: Equal
                value: n2-standard-8
                effect: NoSchedule
            securityContext:
              fsGroup: 1001
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: gateway
                image: registry.camunda.cloud/team-zeebe/camunda:ck-bp-ctl-3-20261105-90c0c3a9
                imagePullPolicy: Always
                command: ["/usr/local/camunda/bin/gateway"]
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  readOnlyRootFilesystem: true
                env:
                  - name: LC_ALL
                    value: C.UTF-8
                  - name: K8S_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: K8S_SERVICE_NAME
                    value: camunda
                  - name: K8S_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: VALUES_ORCHESTRATION_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: camunda-credentials
                        key: orchestration-security-authentication-oidc-secret
                  # The mounted broker application.yaml activates the broker profile and binds an empty node id to an int.
                  - name: SPRING_PROFILES_ACTIVE
                    value: consolidated-auth
                  - name: VALUES_ORCHESTRATION_NODE_ID
                    value: "100"
                  - name: ZEEBE_GATEWAY_CLUSTER_MEMBERID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: ZEEBE_GATEWAY_CLUSTER_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: CAMUNDA_CLUSTER_NETWORK_ADVERTISEDHOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: JAVA_TOOL_OPTIONS
                    value: "-XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"
                  - name: ZEEBE_LOG_APPENDER
                    value: Stackdriver
                  - name: ZEEBE_LOG_STACKDRIVER_SERVICENAME
                    value: zeebe-gateway
                  - name: ZEEBE_LOG_LEVEL
                    value: INFO
                  - name: ATOMIX_LOG_LEVEL
                    value: INFO
                  - name: SPRING_CONFIG_ADDITIONALLOCATION
                    value: /usr/local/camunda/config/application.yml,optional:/usr/local/camunda/config/application-override.yml
                ports:
                  - containerPort: 26500
                    name: grpc
                  - containerPort: 26502
                    name: internal
                  - containerPort: 8080
                    name: http
                  - containerPort: 9600
                    name: server
                readinessProbe:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 9600
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 6
                  timeoutSeconds: 2
                resources:
                  requests:
                    cpu: 1000m
                    memory: 1Gi
                  limits:
                    cpu: 1000m
                    memory: 1Gi
                volumeMounts:
                  - name: config
                    mountPath: /usr/local/camunda/config/application.yaml
                    subPath: application.yaml
                  - name: config
                    mountPath: /usr/local/camunda/config/application.yml
                    subPath: application.yml
                  - name: config
                    mountPath: /usr/local/camunda/config/application-override.yml
                    subPath: application-override.yml
                  - name: tmp
                    mountPath: /tmp
                  - name: data
                    mountPath: /usr/local/camunda/data
                  - name: logs
                    mountPath: /usr/local/camunda/logs
            volumes:
              - name: config
                configMap:
                  name: camunda-configuration
                  defaultMode: 492
              - name: tmp
                emptyDir: {}
              - name: data
                emptyDir: {}
              - name: logs
                emptyDir: {}

optimize:
  enabled: false

connectors:
  enabled: false

########################################################################################
################################################### Orchestration cluster configuration
########################################################################################
orchestration:
  exporters:
    camunda:
      enabled: false
  # No secondary storage backend — pairs with `global.noSecondaryStorage: true` above.
  data:
    secondaryStorage:
      type: none
  # We set extra configuration to configure additional settings for Camunda application, that are part
  # of the orchestration cluster.
  # This allows adding configurations without the need of overwriting all environment variables from the Platform chart.
  extraConfiguration:
    - file: application.yml
      content: |
        # Enable execution metrics exporter to be able to see the execution metrics, like process instance and job completion times
        zeebe.broker.executionMetricsExporterEnabled: "true"
        camunda.flags.jfr.metrics: "true"
        # Define when the broker should start to reject requests when the disk is almost full, for both processing and replication.
        zeebe.broker.data.disk.freeSpace.processing: "3GB"
        zeebe.broker.data.disk.freeSpace.replication: "2GB"
        # We want to have this for long running load tests, to detect consistency issues early on and to have the foreign key checks enabled for better data integrity.
        # Like endurance / soak tests  but not for our maximum stress tests, where we want to push the system to the limits and consistency checks might cause too much overhead.
        zeebe.broker.experimental.consistencyChecks.enablePreconditions: "true"
        zeebe.broker.experimental.consistencyChecks.enableForeignKeyChecks: "true"
        # Configure a rate limit for all writes, so that we can visualize flow control metrics.
        # Uses the unified `camunda.*` property tree rather than the legacy `zeebe.broker.*` one, because otherwise only the default physical tenant
        # receives this configuration.
        camunda.processing.flow-control.write.enabled: "true"
        camunda.processing.flow-control.write.limit: 10000
        camunda.processing.flow-control.write.throttle.enabled: "true"
        # Grant the dedicated leader-balancer client (declared via `identity.clients`) cluster-admin
        # access, so it can call the coordinated `/cluster/v2/rebalance` endpoint.
        camunda.security.cluster-admin.oidc.clients[0]: leader-balancer
    # This file is loaded after application.yml (higher priority). It is empty by default,
    # but can be overridden via --set-file for specific scenarios (e.g. max) to change settings
    # like disabling consistency checks without duplicating the full application.yml content.
    - file: application-override.yml
      content: |
        # INC-8994 experiment: brokers run without the embedded gateway, a standalone gateway Deployment (global.extraManifests) serves the clients.
        zeebe.broker.gateway.enable: "false"
  history:
    retention:
      enabled: false
