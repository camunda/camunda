# In-cluster k6 load generator for DMN decision evaluation.
#
# Runs the k6 script (mounted from the `k6-dmn-scripts` ConfigMap that run.sh
# builds from dmn-evaluation.js) as a one-shot Job against the Orchestration
# Cluster's REST gateway service.
#
# ISOLATION — the generator must not steal CPU from the brokers, or the latency
# numbers are meaningless. Two guarantees keep k6 off the broker nodes:
#   1. It does NOT tolerate the `nodepool=n2-standard-4:NoSchedule` taint the
#      benchmark broker nodes carry, so the scheduler cannot place it there.
#   2. podAntiAffinity against `app.kubernetes.io/component: zeebe-broker`
#      (hostname topology) — belt-and-braces even if the taint changes.
# If it stays Pending, the cluster has no spare (non-broker) node — add one; do
# NOT relax the isolation.
#
# Apply with run.sh (recommended) or:
#   kubectl create configmap k6-dmn-scripts --from-file=dmn-evaluation.js
#   kubectl apply -f job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-dmn-evaluation
  labels:
    app.kubernetes.io/component: k6-dmn
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: k6-dmn
    spec:
      restartPolicy: Never
      # (1) No broker-nodepool toleration -> cannot land on a broker node.
      affinity:
        podAntiAffinity:
          # (2) Never co-schedule with a broker pod.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - zeebe-broker
              topologyKey: kubernetes.io/hostname
      containers:
        - name: k6
          image: grafana/k6:latest
          imagePullPolicy: IfNotPresent
          command: ["k6", "run", "/scripts/dmn-evaluation.js"]
          # Bound the generator so it can never contend beyond its own node.
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1Gi
          env:
            # In-cluster REST gateway of the Orchestration Cluster.
            - name: CAMUNDA_BASE_URL
              value: "http://camunda-gateway:8080"

            # --- Load profile (override per run) ---
            - name: DMN_RATE
              value: "100"
            - name: DMN_DURATION
              value: "60s"
            - name: DMN_MAX_VUS
              value: "200"
            - name: DMN_DECISION_ID
              value: "small_decision"

            # --- Auth (optional) ---
            # Uncomment for basic auth:
            # - name: CAMUNDA_BASIC_AUTH
            #   value: "demo:demo"
            #
            # Or OAuth2 client-credentials, reusing the load-test-credentials secret:
            # - name: CAMUNDA_CLIENT_ID
            #   valueFrom: { secretKeyRef: { name: load-test-credentials, key: clientId } }
            # - name: CAMUNDA_CLIENT_SECRET
            #   valueFrom: { secretKeyRef: { name: load-test-credentials, key: clientSecret } }
            # - name: CAMUNDA_OAUTH_URL
            #   valueFrom: { secretKeyRef: { name: load-test-credentials, key: authServer } }
            # - name: CAMUNDA_TOKEN_AUDIENCE
            #   valueFrom: { secretKeyRef: { name: load-test-credentials, key: authorizationAudience } }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-dmn-scripts
