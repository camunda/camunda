########################################################################################
################################################### Global cluster configuration
########################################################################################
global:
  # Disable Elasticsearch secondary storage when using OpenSearch.
  elasticsearch:
    enabled: false

  opensearch:
    enabled: true
    url:
      protocol: http
      host: "opensearch"
      port: 9200

########################################################################################
################################################### Orchestration cluster configuration
########################################################################################
orchestration:
  # We need to explicitly set the secondary storage type to OpenSearch
  # overriding the default value of elasticsearch
  data:
    secondaryStorage:
      type: opensearch
