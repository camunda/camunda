---
# Source: load-test-setup/templates/k6/testrun.yaml
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: "k6-default"
  labels:
    app.kubernetes.io/component: k6
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-scripts
      file: "test.default.js"

  args:
    # Always expose the current namespace as a dedicated tag/label.
    - --tag
    - namespace=c8-golden-stable-87-max

  starter:
    image: europe-west1-docker.pkg.dev/camunda-benchmark/ghcrio/grafana/k6-operator:starter-v1.6.0
    imagePullPolicy: IfNotPresent

  runner:
    image: europe-west1-docker.pkg.dev/camunda-benchmark/dockerhub/grafana/k6:2.3.0
    imagePullPolicy: IfNotPresent

    env:
      - name: K6_LOG_FORMAT
        value: json

      # Export to Prometheus
      - name: K6_OUT
        value: experimental-prometheus-rw

      # The Prometheus endpoint to report metrics to
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"

      # Mark Prometheus as "stale" when they are not updated anymore.
      - name: K6_PROMETHEUS_RW_STALE_MARKERS
        value: "true"

      # System tags set automatically on every metric (see `k6.tags.system` in values.yaml).
      - name: K6_SYSTEM_TAGS
        value: "check,error,error_code,expected_response,group,method,proto,scenario,service,status,subproto,tls_version"

      # Found empirically: without these three settings, k6 memory grows without bound
      # on long runs and the pod is OOM-killed.
      - name: K6_NO_THRESHOLDS
        value: "true"
      - name: K6_SUMMARY_MODE
        value: disabled
      - name: K6_FEATURES
        value: native-histograms

      # Credentials
      - name: CAMUNDA_BASE_URL
        valueFrom:
          secretKeyRef:
            key: zeebeRestAddress
            name: load-test-credentials
      - name: CAMUNDA_CLIENT_ID
        valueFrom:
          secretKeyRef:
            key: clientId
            name: load-test-credentials
      - name: CAMUNDA_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            key: clientSecret
            name: load-test-credentials
      - name: CAMUNDA_OAUTH_URL
        valueFrom:
          secretKeyRef:
            key: authServer
            name: load-test-credentials
      - name: CAMUNDA_TOKEN_AUDIENCE
        valueFrom:
          secretKeyRef:
            key: authorizationAudience
            name: load-test-credentials
      - name: ZEEBE_GRPC_ADDRESS
        valueFrom:
          secretKeyRef:
            key: zeebeGrpcAddress
            name: load-test-credentials

    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 200m
        memory: 128Mi

    nodeSelector:
      topology.kubernetes.io/zone: "europe-west1-d"
      component: benchmark-n2-standard-4-stable

    tolerations:
      - effect: NoSchedule
        key: nodepool
        operator: Equal
        value: n2-standard-4-stable
