  warnings: |-
    [camunda][warning] UNKNOWN VALUES KEY: postgresql. Helm ignores this key. Remove or correct it. Starting with chart v17 (Camunda 8.12), unknown keys fail the render by default.
    [camunda][warning] "orchestration.partitioning.scheme" is fixed for the life of the cluster: zone-aware brokers are identified by the composite "<zone>_<index>", round-robin ones by a plain node ID. Switching an existing release between the two re-identifies every broker against Raft state written under its old ID. To convert one in place, retain the round-robin brokers with "orchestration.partitioning.keepUnzonedBrokers=true" and follow the zone-aware migration procedure.
