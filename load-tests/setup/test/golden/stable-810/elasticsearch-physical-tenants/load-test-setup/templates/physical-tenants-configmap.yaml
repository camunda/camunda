---
# Source: load-test-setup/templates/physical-tenants-configmap.yaml
kind: ConfigMap
metadata:
  name: physical-tenants
  labels:
apiVersion: v1
data:
  physical-tenants.yml: |
    # Configuration for the Camunda "physical tenants" feature.
    camunda.data.secondary-storage.elasticsearch.index-prefix: default-

    ## Configuration for physical tenant: pt1
    camunda.physical-tenants.pt1.data.secondary-storage.elasticsearch.history.policy-name: pt1-camunda-retention-policy
    camunda.physical-tenants.pt1.data.secondary-storage.elasticsearch.history.usage-metrics-policy-name: pt1-camunda-usage-metrics-retention-policy
    camunda.physical-tenants.pt1.data.secondary-storage.elasticsearch.index-prefix: pt1-
    # pt1: grant the orchestration client the same permissions as the default tenant
    camunda.physical-tenants.pt1.security.initialization.authorizations[0].ownerType: CLIENT
    camunda.physical-tenants.pt1.security.initialization.authorizations[0].ownerId: orchestration
    camunda.physical-tenants.pt1.security.initialization.authorizations[0].resourceType: RESOURCE
    camunda.physical-tenants.pt1.security.initialization.authorizations[0].resourceId: "*"
    camunda.physical-tenants.pt1.security.initialization.authorizations[0].permissions[0]: CREATE
    camunda.physical-tenants.pt1.security.initialization.authorizations[1].ownerType: CLIENT
    camunda.physical-tenants.pt1.security.initialization.authorizations[1].ownerId: orchestration
    camunda.physical-tenants.pt1.security.initialization.authorizations[1].resourceType: PROCESS_DEFINITION
    camunda.physical-tenants.pt1.security.initialization.authorizations[1].resourceId: "*"
    camunda.physical-tenants.pt1.security.initialization.authorizations[1].permissions[0]: CREATE_PROCESS_INSTANCE
    camunda.physical-tenants.pt1.security.initialization.authorizations[1].permissions[1]: UPDATE_PROCESS_INSTANCE
    camunda.physical-tenants.pt1.security.initialization.authorizations[1].permissions[2]: READ_PROCESS_INSTANCE
    camunda.physical-tenants.pt1.security.initialization.authorizations[1].permissions[3]: READ_PROCESS_DEFINITION
    camunda.physical-tenants.pt1.security.initialization.authorizations[2].ownerType: CLIENT
    camunda.physical-tenants.pt1.security.initialization.authorizations[2].ownerId: orchestration
    camunda.physical-tenants.pt1.security.initialization.authorizations[2].resourceType: MESSAGE
    camunda.physical-tenants.pt1.security.initialization.authorizations[2].resourceId: "*"
    camunda.physical-tenants.pt1.security.initialization.authorizations[2].permissions[0]: CREATE
    # pt1: assign the default OIDC provider (Keycloak) so this tenant can authenticate
    camunda.physical-tenants.pt1.security.authentication.providers.assigned[0]: oidc
