---
# Source: load-test-setup/templates/benchmark-zeebe-secrets-driver.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeebe-secrets
  labels:
    app: zeebe-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zeebe-secrets
  template:
    metadata:
      labels:
        app: zeebe-secrets
        # Reuses the subchart clients ServiceMonitor selector so the driver's
        # zeebe_secrets_* metrics are scraped without a dedicated monitor.
        app.kubernetes.io/component: zeebe-client
    spec:
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        component: benchmark-n2-standard-4
        topology.kubernetes.io/zone: europe-west1-c
      tolerations:
        - effect: NoSchedule
          key: nodepool
          operator: Equal
          value: n2-standard-4
      # Keycloak provisions the `orchestration` OIDC client asynchronously, after
      # its own pod is up. The driver's OAuth provider latches a non-retryable
      # failure on the first 401 and then fails fast forever, so a driver that
      # starts before the client exists generates zero traffic for the whole run.
      # Gate startup on the token endpoint actually issuing a token for the
      # client. Reuses the driver image (it ships curl) so no extra image is
      # pulled, and the same load-test-credentials Secret the driver uses.
      initContainers:
        - name: wait-for-oidc-client
          image: "registry.camunda.cloud/team-zeebe/zeebe-secrets:SNAPSHOT"
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Waiting for the orchestration OIDC client to be provisioned in Keycloak..."
              i=0
              until [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$AUTH_SERVER_URL" \
                    -d grant_type=client_credentials \
                    -d "client_id=$CLIENT_ID" \
                    -d "client_secret=$CLIENT_SECRET" \
                    -d "audience=$TOKEN_AUDIENCE")" = "200" ]; do
                i=$((i + 1))
                if [ "$i" -ge 120 ]; then
                  echo "Token endpoint did not issue a token after ~10m; giving up." >&2
                  exit 1
                fi
                echo "attempt $i: token endpoint not ready, retrying in 5s"
                sleep 5
              done
              echo "orchestration client is ready; starting the zeebe-secrets driver."
          env:
            - name: AUTH_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authServer
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientId
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientSecret
            - name: TOKEN_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authorizationAudience
      containers:
        - name: zeebe-secrets
          image: "registry.camunda.cloud/team-zeebe/zeebe-secrets:SNAPSHOT"
          imagePullPolicy: Always
          # The zeebe-secrets driver image bakes --spring.profiles.active=zeebe-secrets, so
          # only the Spring Boot compatible env vars below apply (there is no
          # HOCON app for it).
          env:
            - name: JDK_JAVA_OPTIONS
              value: "-XX:+HeapDumpOnOutOfMemoryError"
            # OAuth credentials, from the load-test-credentials Secret created by
            # this chart (see load-test-credentials.yaml), same as the subchart
            # starter's saas path.
            - name: CAMUNDA_CLIENT_MODE
              value: "saas"
            - name: CAMUNDA_CLIENT_AUTH_METHOD
              value: "oidc"
            - name: ZEEBE_REST_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: zeebeRestAddress
            - name: ZEEBE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientId
            - name: ZEEBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientSecret
            - name: ZEEBE_AUTHORIZATION_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authServer
            - name: ZEEBE_TOKEN_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authorizationAudience
            - name: ZEEBE_AUTH_TYPE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authType
            - name: ZEEBE_GRPC_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: zeebeGrpcAddress
            - name: CAMUNDA_CLIENT_PREFER_REST_OVER_GRPC
              value: "false"
            - name: LOAD_TESTER_LOG_APPENDER
              value: "Stackdriver"
            - name: LOAD_TESTER_LOG_STACKDRIVER_SERVICENAME
              value: "load-tester"
            - name: LOAD_TESTER_LOG_STACKDRIVER_SERVICEVERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPTIMIZE_LOADTEST_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: identity-optimize-loadtest-client-secret
                  name: camunda-credentials
            ##
            ## Zeebe zeebe-secrets driver configuration (zeebeSecretsBenchmark.driver.* -> LOAD_TESTER_ZEEBE_SECRETS_*)
            ##
            - name: LOAD_TESTER_ZEEBE_SECRETS_ENABLED
              value: "true"
            - name: LOAD_TESTER_ZEEBE_SECRETS_RATE
              value: "200"
            - name: LOAD_TESTER_ZEEBE_SECRETS_RATE_DURATION
              value: "1s"
            - name: LOAD_TESTER_ZEEBE_SECRETS_THREADS
              value: "2"
            - name: LOAD_TESTER_ZEEBE_SECRETS_RESOLVE_RATIO
              value: "0.5"
            - name: LOAD_TESTER_ZEEBE_SECRETS_BATCH_SIZE
              value: "20"
            - name: LOAD_TESTER_ZEEBE_SECRETS_DUPLICATE_RATIO
              value: "0.3"
            - name: LOAD_TESTER_ZEEBE_SECRETS_REFERENCE_POOL_SIZE
              value: "100"
            - name: LOAD_TESTER_ZEEBE_SECRETS_REFERENCE_PREFIX
              value: "camunda.secrets."
            - name: LOAD_TESTER_ZEEBE_SECRETS_REFERENCE_BASE_NAME
              value: "bench_"
            - name: LOAD_TESTER_ZEEBE_SECRETS_REQUEST_TIMEOUT
              value: "20s"
            - name: LOAD_TESTER_ZEEBE_SECRETS_WARMUP
              value: "false"
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: "1"
              memory: 512Mi
          ports:
            - containerPort: 9600
              name: "http"
