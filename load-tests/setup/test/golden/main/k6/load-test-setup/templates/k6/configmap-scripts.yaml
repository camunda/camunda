---
# Source: load-test-setup/templates/k6/configmap-scripts.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scripts
  labels:
    app.kubernetes.io/component: k6
data:
  lib.camunda.js: |
    /* Client for the Camunda API, including its authentication.
     *
     * Expose the Camunda API endpoints via convenient functions to be used during tests.
     * Create the client in the test script at module level: that code runs once per VU, so each VU
     * has its own instance.
     */
    import http from "k6/http";
    import { sleep } from "k6";
  
    export class Client {
      /**
       * @param {string} [envPrefix="CAMUNDA"] - Prefix of the environment variables that configure the
       *   client: `<prefix>_BASE_URL`, `_CLIENT_ID`, `_CLIENT_SECRET`, `_OAUTH_URL` and
       *   `_TOKEN_AUDIENCE`. The optional `<prefix>_TOKEN_SCOPE` is sent as the token `scope`.
       */
      constructor(envPrefix = "CAMUNDA") {
        this.envPrefix = envPrefix;
        this.#ensureEnvVars();
        this.baseURL = __ENV[`${envPrefix}_BASE_URL`];
        // Empty token. The first request fetches the actual token.
        this.token = { accessToken: null, renewalDate: 0 };
      }
  
      get(endpoint, params) {
        return this.request("GET", endpoint, undefined, params);
      }
  
      post(endpoint, payload, params) {
        return this.request("POST", endpoint, payload, params);
      }
  
      /**
       * Send an authenticated JSON request to a Camunda endpoint, renewing the token if needed.
       *
       * @param {string} method - HTTP method.
       * @param {string} endpoint - Path appended to the base URL. Also used as the `name` tag, so that
       *   metrics are grouped per endpoint.
       * @param {*} [payload] - Request body. Serialized as JSON, unless `params.multipart` is true: the
       *   payload is then passed to k6 as is, and k6 encodes the `http.file()` values as
       *   multipart/form-data.
       * @param {object} [params] - k6 request params, merged into the default ones. Its `headers` and
       *   `tags` take precedence over the default headers and tags.
       * @param {boolean} [params.multipart=false] - Send the payload as multipart/form-data.
       * @returns {import("k6/http").RefinedResponse} The k6 response.
       */
      request(method, endpoint, payload, { multipart = false, ...params } = {}) {
        this.#renewToken();
  
        const contentTypeHeader = multipart
          ? {}
          : { "Content-Type": "application/json" };
  
        // Create a new k6 params object based on the passed parameters and default values.
        const mergedParams = {
          ...params,
          headers: {
            ...contentTypeHeader,
            Authorization: `Bearer ${this.token.accessToken}`,
            ...params.headers,
          },
          tags: { name: endpoint, ...params.tags },
        };
  
        let body = null;
        if (payload !== undefined) {
          // Do not build a `FormData` here: it can use **way** more memory than
          // the plain object that k6 encodes.
          body = multipart ? payload : JSON.stringify(payload);
        }
  
        return http.request(method, this.baseURL + endpoint, body, mergedParams);
      }
  
      // https://docs.camunda.io/docs/apis-tools/orchestration-cluster-api-rest/specifications/create-deployment/
      deploy(name, resourceContent) {
        return this.post(
          "/v2/deployments",
          { resources: http.file(resourceContent, name) },
          { multipart: true },
        );
      }
  
      // https://docs.camunda.io/docs/apis-tools/orchestration-cluster-api-rest/specifications/search-process-definitions/
      searchProcessDefinitions() {
        return this.post("/v2/process-definitions/search", {
          sort: [
            {
              field: "processDefinitionKey",
              order: "ASC",
            },
          ],
          page: {
            limit: 10,
          },
        });
      }
  
      // https://docs.camunda.io/docs/next/apis-tools/orchestration-cluster-api-rest/specifications/search-process-instances/
      searchProcessInstances(processDefinitionId) {
        return this.post("/v2/process-instances/search", {
          sort: [{ field: "startDate", order: "DESC" }],
          filter: {
            processDefinitionId: processDefinitionId,
            $or: [{ state: "ACTIVE" }, { hasIncident: true }],
          },
          page: {
            limit: 100,
          },
        });
      }
  
      // https://docs.camunda.io/docs/next/apis-tools/orchestration-cluster-api-rest/specifications/get-topology/
      topology() {
        return this.get("/v2/topology");
      }
  
      /* Wait for Camunda to be ready. Intended to be called from `setup()`. */
      waitUntilReady() {
        const waitTime = 10; // seconds
        while (true) {
          try {
            const response = this.topology();
            if (response.status !== 200) {
              throw new Error(
                `Camunda topology endpoint returned status: ${response.status}`,
              );
            }
            break;
          } catch (e) {
            console.error(
              `Error waiting for Camunda to be ready (will retry in ${waitTime}s).`,
              e,
            );
            sleep(waitTime);
          }
        }
        console.log("Camunda seems to be ready ✅");
      }
  
      #ensureEnvVars() {
        const vars = [
          "BASE_URL",
          "CLIENT_ID",
          "CLIENT_SECRET",
          "OAUTH_URL",
          "TOKEN_AUDIENCE",
        ].map((name) => `${this.envPrefix}_${name}`);
  
        const missing = vars.filter((name) => {
          const value = __ENV[name];
          if (value === undefined || value === "") {
            console.error(`Environment variable ${name} is not defined or empty.`);
            return true;
          }
          return false;
        });
  
        if (missing.length > 0) {
          throw Error(`Missing environment variables: ${missing.join(", ")}`);
        }
      }
  
      #fetchToken() {
        const env = (name) => __ENV[`${this.envPrefix}_${name}`];
        const tokenURL = env("OAUTH_URL");
        console.debug(`Fetching authentication token from: ${tokenURL}`);
  
        const payload = {
          grant_type: "client_credentials",
          audience: env("TOKEN_AUDIENCE"),
          client_id: env("CLIENT_ID"),
          client_secret: env("CLIENT_SECRET"),
        };
        if (env("TOKEN_SCOPE")) {
          payload.scope = env("TOKEN_SCOPE");
        }
  
        const params = {
          tags: { name: "token-request" },
        };
  
        console.debug(
          `Requesting token from ${tokenURL} using client ID=${payload.client_id}`,
        );
        const response = http.post(tokenURL, payload, params);
        if (response.status != 200) {
          throw new Error(
            `unable to fetch token, got HTTP status=${response.status}, body=${response.body}`,
          );
        }
  
        const accessToken = response.json("access_token");
  
        // Stagger token renewal.
        const expiresIn = response.json("expires_in");
        const renewalJitterSeconds = 1 + Math.floor(Math.random() * 60);
        const renewIn = expiresIn - renewalJitterSeconds;
  
        this.token.accessToken = accessToken;
        this.token.renewalDate = Date.now() + renewIn * 1000;
  
        console.log(
          `Authentication token fetched successfully; expire in ${expiresIn}s, will renew in ${renewIn}s`,
        );
      }
  
      #renewToken() {
        if (this.token.renewalDate > Date.now()) {
          return;
        }
  
        console.debug("Token will expire soon, will renew now.");
        try {
          this.#fetchToken();
        } catch (e) {
          console.error(`Error while renewing the token.`, e);
          // Known limitation: during an OAuth outage, each VU retries and sleeps 1s per call
          // until the old token expires, which can cause dropped iterations.
          sleep(1);
          // Without a previous token, requests would send "Bearer null".
          if (this.token.accessToken === null) {
            throw e;
          }
        }
      }
    }
  lib.data.js: |
    /* Load static resources from a data directory.
     *
     * The `open()` function is relative to the location of the script, unless the path it tries to open is absolute.
     *
     * By default, it tries to open a file in the `../data` directory (which is convenient when testing locally with `k6 run`).
     *
     * When run from within Kubernetes, the DATA_DIR environment variable is explicitly configured to where the data files are mounted in.
     *
     * To override the DATA_DIR environment variable:
     *
     * * Either set it before calling `k6`: `DATA_DIR=/path/to/data k6 run ...`
     * * Or use the `-e` option to set it for the test: `k6 run -e DATA_DIR=/path/to/data ...`
     *
     */
    const DATA_DIR = __ENV.DATA_DIR || "../data";
  
    /* Read the file `name` from the data directory and return its content as a string.
     *
     * k6 only allows reading files in the `init` context, once per-VU: call this at module level. */
    export function loadData(name) {
      const path = `${DATA_DIR}/${name}`;
      console.log(`Loading data file ${path}...`);
      return open(path);
    }
  lib.optimize.js: |
    /* Client for the internal Optimize REST API used by the Optimize web application.
     *
     * Authentication uses the `OPTIMIZE_*` environment variables, see `Client`.
     */
    import { Client } from "./lib.camunda.js";
  
    const HEADERS = {
      "X-Optimize-Client-Timezone": "UTC",
      "X-Optimize-Client-Locale": "en",
    };
  
    export class OptimizeClient {
      #client = new Client("OPTIMIZE");
  
      #get(endpoint, params) {
        return this.#client.get(endpoint, { ...params, headers: HEADERS });
      }
  
      #post(endpoint, payload, params) {
        return this.#client.post(endpoint, payload, {
          ...params,
          headers: HEADERS,
        });
      }
  
      // Internal API, not part of the public Optimize API specification.
      managementDashboard() {
        return this.#get("/api/dashboard/management", {
          tags: { page: "homepage", phase: "dashboard" },
        });
      }
  
      instantDashboard(processDefinitionKey) {
        return this.#get(`/api/dashboard/instant/${processDefinitionKey}`, {
          tags: {
            name: "/api/dashboard/instant/{key}",
            page: "detailed",
            phase: "dashboard",
          },
        });
      }
  
      processOverview() {
        return this.#get("/api/process/overview");
      }
  
      evaluateReport(reportId, page) {
        return this.#post(
          `/api/report/${reportId}/evaluate`,
          {},
          {
            tags: {
              name: "/api/report/{id}/evaluate",
              page,
              phase: "report_evaluate",
              report_id: reportId,
            },
          },
        );
      }
    }
  test.data-read.js: |
    import { check, sleep } from "k6";
  
    import { Client } from "./lib.camunda.js";
  
    // Module-level code runs once per VU, so each VU has its own client.
    const client = new Client();
  
    // Ignore process definitions that are created by k6 itself: they are not
    // relevant for these tests as they are not expected to create any process
    // instances.
    const IGNORED_PREFIX = "k6-";
  
    /* Tests reading data from Camunda, which requires a secondary storage.
     * This test is disabled when running with `secondary_storage=none`. */
    export const options = {
      // Give enough time for Camunda to be ready and for a process definition to
      // exist before continuing with the test.
      setupTimeout: "20m",
      scenarios: {
        /* Search for process instances.
         * Run a basic search for process instances at a low rate. */
        searchProcessInstances: {
          exec: "searchProcessInstances",
          executor: "constant-arrival-rate",
          duration: "60d", // As long as the longest benchmark we run
          rate: 1,
          timeUnit: "1s",
          preAllocatedVUs: 10,
          maxVUs: 100,
        },
      },
    };
  
    export function setup() {
      client.waitUntilReady();
  
      // Process definition to search process instances for. Retries until one exists.
      const waitTime = 10; // seconds
      let processDefinitionId;
      while (processDefinitionId === undefined) {
        const response = client.searchProcessDefinitions();
        if (response.status == 200) {
          const items = response
            .json()
            .items.filter((i) => !i.processDefinitionId.startsWith(IGNORED_PREFIX));
          if (items.length > 0) {
            processDefinitionId = items[0].processDefinitionId;
            break;
          }
          console.info(
            `No process definition found yet (will retry in ${waitTime}s).`,
          );
        } else {
          console.error(
            `Unable to list process definitions (will retry in ${waitTime}s), got HTTP status=${response.status}`,
          );
        }
        sleep(waitTime);
      }
      console.log(
        `Will search process instances from process definition ${processDefinitionId}.`,
      );
  
      return { processDefinitionId };
    }
  
    export function searchProcessInstances(data) {
      const response = client.searchProcessInstances(data.processDefinitionId);
      check(response, { "status is 200": (r) => r.status === 200 });
    }
  test.default.js: |
    import { check } from "k6";
  
    import { Client } from "./lib.camunda.js";
    import { loadData } from "./lib.data.js";
  
    // Module-level code runs once per VU, so each VU has its own client.
    const client = new Client();
  
    const FILENAME = "micro.bpmn";
    const bpmn = loadData(FILENAME);
  
    export const options = {
      // Give enough time for Camunda to be ready before continuing with the test.
      setupTimeout: "15m",
      scenarios: {
        /* Poll the topology endpoint to check whether the cluster is alive.
         * This is very basic, but should also work almost all the time. */
        topology: {
          exec: "checkTopology",
          executor: "constant-arrival-rate",
          duration: "60d",
          rate: 10,
          timeUnit: "1s",
          preAllocatedVUs: 10,
          maxVUs: 100,
        },
        deploy: {
          exec: "deploy",
          executor: "constant-arrival-rate",
          duration: "60d",
          rate: 1,
          timeUnit: "1s",
          preAllocatedVUs: 1,
          maxVUs: 20,
        },
      },
    };
  
    export function setup() {
      client.waitUntilReady();
    }
  
    export function checkTopology() {
      const response = client.topology();
      check(response, { "status is 200": (r) => r.status === 200 });
    }
  
    export function deploy() {
      /* Sanity check of the `/v2/deployments` API, not a load test: the same
       * unchanged resource is deployed on purpose, so Zeebe deduplicates it. */
      const response = client.deploy(FILENAME, bpmn);
      check(response, { "status is 200": (r) => r.status === 200 });
    }
  test.optimize.js: |
    import { check, sleep } from "k6";
  
    import { OptimizeClient } from "./lib.optimize.js";
  
    // Module-level code runs once per VU, so each VU has its own client.
    const client = new OptimizeClient();
  
    // Ignore process definitions that are created by k6 itself: they never have instances.
    const IGNORED_PREFIX = "k6-";
  
    /* Opens the Optimize dashboards like the web application does and evaluates every report on them.
     * Requires Optimize. Latency is in the `http_req_duration` metric, tagged with `page`, `phase`
     * and `report_id`. */
    export const options = {
      // Give enough time for Optimize to import a process definition.
      setupTimeout: "30m",
      scenarios: {
        /* Management dashboard shown after login, and its reports. */
        homepage: {
          exec: "evaluateHomepage",
          executor: "constant-arrival-rate",
          startTime: "10s",
          duration: "60d", // As long as the longest benchmark we run
          rate: 1,
          timeUnit: "1m",
          preAllocatedVUs: 1,
          maxVUs: 2,
        },
        /* Instant dashboard of one process definition, and its reports. */
        detailed: {
          exec: "evaluateDetailed",
          executor: "constant-arrival-rate",
          startTime: "10s",
          duration: "60d",
          rate: 1,
          timeUnit: "1m",
          preAllocatedVUs: 1,
          maxVUs: 2,
        },
      },
    };
  
    export function setup() {
      const configured = __ENV.OPTIMIZE_PROCESS_DEFINITION_KEY;
      if (configured) {
        console.log(`Will evaluate the process definition ${configured}.`);
        return { processDefinitionKey: configured };
      }
  
      const waitTime = 10; // seconds
      let processDefinitionKey;
      while (processDefinitionKey === undefined) {
        const response = client.processOverview();
        if (response.status == 200) {
          const items = response
            .json()
            .filter((i) => !i.processDefinitionKey.startsWith(IGNORED_PREFIX));
          if (items.length > 0) {
            processDefinitionKey = items[0].processDefinitionKey;
            break;
          }
          console.info(
            `No process definition found in Optimize yet (will retry in ${waitTime}s).`,
          );
        } else {
          console.error(
            `Unable to get the Optimize process overview (will retry in ${waitTime}s), got HTTP status=${response.status}`,
          );
        }
        sleep(waitTime);
      }
      console.log(`Will evaluate the process definition ${processDefinitionKey}.`);
  
      return { processDefinitionKey };
    }
  
    export function evaluateHomepage() {
      evaluateReports(client.managementDashboard(), "homepage");
    }
  
    export function evaluateDetailed(data) {
      evaluateReports(
        client.instantDashboard(data.processDefinitionKey),
        "detailed",
      );
    }
  
    function evaluateReports(dashboard, page) {
      const ok = check(dashboard, { "status is 200": (r) => r.status === 200 });
      if (!ok) {
        return;
      }
      // Text and image tiles have no report, so no `id`.
      const tiles = (dashboard.json("tiles") ?? []).filter((tile) => tile.id);
      for (const tile of tiles) {
        const response = client.evaluateReport(tile.id, page);
        check(response, { "status is 200": (r) => r.status === 200 });
      }
    }
