# Source: load-test-setup/templates/k6/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "k6-data-read"
  labels:
    app.kubernetes.io/component: k6
spec:
  replicas: 1
  # The default `OrderedReady` starts the pods one after the other, which would delay the start of
  # the later execution segments. All the segments must run at the same time.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # All the pods restart at once when the number of replicas changes: they all run a different
      # execution segment of the test afterwards.
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "k6-data-read"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "k6-data-read"
        app.kubernetes.io/component: k6
      annotations:
        checksum/k6-files: 002f74168a7ec8dcbe6060be47c5b4716a70b6c0f2c9d21a285af5d2e10c3cd3
    spec:
      containers:
        - name: k6
          image: europe-west1-docker.pkg.dev/camunda-benchmark/dockerhub/grafana/k6:2.4.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            # Each pod runs its own execution segment of the test, so that the load of the test is
            # split between the replicas. The tags are the ones the k6 operator sets on the metrics
            # of a TestRun.
            - |
              instance_id=`expr "$K8S_POD_INDEX" + 1`
              exec k6 run --quiet /scripts/test.data-read.js \
                --tag namespace="$K8S_NAMESPACE" \
                --tag testrun_name=k6-data-read \
                --tag instance_id="$instance_id" \
                --execution-segment "$K8S_POD_INDEX/$STATEFULSET_REPLICAS:$instance_id/$STATEFULSET_REPLICAS" \
                --execution-segment-sequence "0,1/1"
          env:
            - name: K6_LOG_FORMAT
              value: json
            # Export to Prometheus
            - name: K6_OUT
              value: experimental-prometheus-rw
            # The Prometheus endpoint to report metrics to
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
            # Mark Prometheus as "stale" when they are not updated anymore.
            - name: K6_PROMETHEUS_RW_STALE_MARKERS
              value: "true"
            # System tags set automatically on every metric (see `k6.tags.system` in values.yaml).
            - name: K6_SYSTEM_TAGS
              value: "check,error,error_code,expected_response,group,method,proto,scenario,service,status,subproto,tls_version"
            # Found empirically: without these three settings, k6 memory grows without bound
            # on long runs and the pod is OOM-killed.
            - name: K6_NO_THRESHOLDS
              value: "true"
            - name: K6_SUMMARY_MODE
              value: disabled
            - name: K6_FEATURES
              value: native-histograms
            - name: DATA_DIR
              value: /data
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Credentials
            - name: CAMUNDA_BASE_URL
              valueFrom:
                secretKeyRef:
                  key: zeebeRestAddress
                  name: load-test-credentials
            - name: CAMUNDA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: load-test-credentials
            - name: CAMUNDA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: load-test-credentials
            - name: CAMUNDA_OAUTH_URL
              valueFrom:
                secretKeyRef:
                  key: authServer
                  name: load-test-credentials
            - name: CAMUNDA_TOKEN_AUDIENCE
              valueFrom:
                secretKeyRef:
                  key: authorizationAudience
                  name: load-test-credentials
            - name: ZEEBE_GRPC_ADDRESS
              valueFrom:
                secretKeyRef:
                  key: zeebeGrpcAddress
                  name: load-test-credentials
            - name: STATEFULSET_REPLICAS
              value: "1"
            - name: K8S_POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['apps.kubernetes.io/pod-index']"
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: k6-scripts
              mountPath: /scripts
            - name: k6-data
              mountPath: /data
      nodeSelector:
        topology.kubernetes.io/zone: "europe-west1-b"
        component: benchmark-n2-standard-4-stable
      tolerations:
        - effect: NoSchedule
          key: nodepool
          operator: Equal
          value: n2-standard-4-stable
      volumes:
        - name: k6-scripts
          configMap:
            name: k6-scripts
        - name: k6-data
          configMap:
            name: k6-data

