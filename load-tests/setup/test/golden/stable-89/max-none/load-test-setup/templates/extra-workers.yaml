---
# Source: load-test-setup/templates/extra-workers.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeout-probe-worker
  labels:
    app: timeout-probe-worker
    camunda.io/created-by: golden-test
    camunda.io/purpose: load-test
spec:
  selector:
    matchLabels:
      app: timeout-probe-worker
  replicas: 1
  template:
    metadata:
      labels:
        app: timeout-probe-worker
        # Matches the selector of the `clients` Service and ServiceMonitor of the
        # load-tester subchart, so Prometheus scrapes this pod like the workers.
        app.kubernetes.io/component: zeebe-client
        camunda.io/created-by: golden-test
        camunda.io/purpose: load-test
    spec:
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        component: benchmark-n2-standard-4
        topology.kubernetes.io/zone: europe-west1-b
      tolerations:
        - effect: NoSchedule
          key: nodepool
          operator: Equal
          value: n2-standard-4
      containers:
        - name: timeout-probe-worker
          image: "registry.camunda.cloud/team-zeebe/worker:SNAPSHOT"
          imagePullPolicy: Always
          env:
            - name: JDK_JAVA_OPTIONS
              value: >-
                -XX:+ExitOnOutOfMemoryError
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/heap-dumps
            - name: ZEEBE_REST_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: zeebeRestAddress
            - name: ZEEBE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientId
            - name: ZEEBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientSecret
            - name: ZEEBE_AUTHORIZATION_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authServer
            - name: ZEEBE_TOKEN_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authorizationAudience
            - name: ZEEBE_AUTH_TYPE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authType
            - name: ZEEBE_GRPC_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: zeebeGrpcAddress
            - name: LOAD_TESTER_LOG_APPENDER
              value: "Stackdriver"
            - name: LOAD_TESTER_LOG_STACKDRIVER_SERVICENAME
              value: "load-tester"
            - name: LOAD_TESTER_LOG_STACKDRIVER_SERVICEVERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPTIMIZE_LOADTEST_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: identity-optimize-loadtest-client-secret
                  name: camunda-credentials
            - name: CAMUNDA_CLIENT_PREFER_REST_OVER_GRPC
              value: "true"
            - name: CAMUNDA_CLIENT_MODE
              value: "saas"
            - name: CAMUNDA_CLIENT_AUTH_METHOD
              value: "oidc"
            - name: LOAD_TESTER_PERFORM_READ_BENCHMARKS
              value: "false"
            - name: LOAD_TESTER_WORKER_WORKER_NAME
              value: "timeout-probe"
            - name: LOAD_TESTER_WORKER_JOB_TYPE
              value: "timeout-probe"
            - name: LOAD_TESTER_WORKER_CAPACITY
              value: "1000"
            - name: LOAD_TESTER_WORKER_TIMEOUT
              value: "30s"
            - name: LOAD_TESTER_WORKER_COMPLETE_JOBS
              value: "false"
            - name: LOGGING_LEVEL_IO_CAMUNDA_ZEEBE
              value: "INFO"
          resources:
            limits:
              cpu: 250m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 2Gi
          ports:
            - containerPort: 9600
              name: "http"
          volumeMounts:
            - name: heap-dumps
              mountPath: /heap-dumps
      volumes:
        - name: heap-dumps
          emptyDir: {}
