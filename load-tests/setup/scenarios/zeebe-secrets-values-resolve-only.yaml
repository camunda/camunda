# Resolve-only preset for the zeebe-secrets benchmark.
#
# The default zeebe-secrets scenario drives mixed traffic: an even resolve/list
# split (resolveRatio=0.5) at 200 req/s (~100 req/s per endpoint) with in-batch
# duplicates (duplicateRatio=0.3) so the gateway's server-side de-duplication is
# exercised. Layer this file on top of that scenario to instead drive resolve-only
# traffic with no in-batch duplicates, isolating POST /v2/secrets/resolve against
# distinct references at a single 100 req/s budget.
#
# Usage (from a scaffolded run directory):
#   make install scenario=zeebe-secrets \
#     additional_load_test_setup_configuration="-f zeebe-secrets-values-resolve-only.yaml"
#
# It is layered after the scenario's own --set flags, so it only overrides the
# rate and the two ratios and leaves zeebeSecretsBenchmark.enabled and the
# scaled-to-0 starter/workers untouched.
zeebeSecretsBenchmark:
  driver:
    # -- Total request rate (per rateDuration). Resolve-only, so the full budget
    # goes to /v2/secrets/resolve; 100/s matches the classic single-endpoint run.
    rate: 100
    # -- Fraction of requests sent to /v2/secrets/resolve; 1.0 = resolve only, so
    # the /v2/secrets/list series stay at 0.
    resolveRatio: 1.0
    # -- Fraction of references within each resolve batch that repeat. 0.0 = all
    # distinct, so every reference reaches the store/cache (no de-duplication).
    duplicateRatio: 0.0
