# Secrets-connector-e2e benchmark scenario values for the load-tester subchart.
#
# Drives the outbound-connector secret-resolution code path (the code path a real customer
# actually uses, e.g. Connectors resolving a legacy secret before an outbound HTTP call) with
# real process-instance throughput created by the vendored Starter application, instead of
# deploying a bespoke driver alongside it. No worker is deployed: the connectorSecretResolution
# process's only task is an io.camunda:http-json:1 job, which is activated and completed by the
# `connectors` component (already part of every load-test cluster; see
# camunda-platform-values-secrets-connector.yaml for its configuration).
#
# payloadPath sets batchSize/uniquePerBatch/poolSize/keyPrefix (see the BPMN's documentation and
# load-tests/docs/secrets-connector-benchmark.md). This default reproduces the original
# single-secret, always-cache-first behavior. Override payloadPath (and, for poolSize > the
# seeded count, secretsConnectorBenchmark.count) via additional_load_test_configuration to
# exercise the batch-dedup or store-miss presets, e.g.:
#   additional_load_test_configuration="--set load-tester.starter.payloadPath=bpmn/secrets/connectorSecretResolutionPayload-dedup.json"
#
# The connector runtime has no code path that ever calls /v2/secrets/list (its
# CentralStoreSecretProvider only resolves individual references), so it can never be exercised
# through the connector as resolveSecret is. Rather than adding a new worker/job type/BPMN branch
# for it, this reuses the Starter's existing read-benchmark mechanism
# (DataReadMeter/DataReadMeterQueryProvider): performReadBenchmarks turns on a "secrets_list"
# query that the Starter already ships (io.camunda:CamundaClient#newListSecretsCommand(), once a
# second, independent of starter.rate so it neither delays nor is delayed by resolveSecret), and
# disabledQueries switches off the read-benchmark's other, process-instance-related default
# queries, which aren't relevant to this scenario and would add unrelated read load.
global:
  performReadBenchmarks: true
  extraEnvVars:
    - name: ZEEBE_DISABLED_QUERIES
      value: >-
        process_instances_active,process_instance_by_business_key,process_instance_by_key,
        process_definition_statistics,process_definition_element_statistics,
        process_instance_element_statistics,incident_by_error_statistics,
        audit_log_by_process_instance_key,audit_log_by_category,decision_instance_list

load-tester:
  workers:
    worker: null

  starter:
    replicas: 1
    rate: 100
    logLevel: "INFO"
    processId: "connectorSecretResolution"
    payloadPath: "bpmn/secrets/connectorSecretResolutionPayload.json"
    bpmnXmlPath: "bpmn/secrets/connectorSecretResolution.bpmn"
    businessKey: "businessKey"
