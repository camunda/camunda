# Secrets-connector-e2e benchmark scenario values for the load-tester subchart.
#
# Drives the outbound-connector secret-resolution code path (the code path a real customer
# actually uses, e.g. Connectors resolving a legacy secret before an outbound HTTP call) with
# real process-instance throughput created by the vendored Starter application, instead of
# deploying a bespoke driver alongside it. The connectorSecretResolution process forks into two
# parallel branches per instance (see the BPMN's documentation):
# - resolveSecret: an io.camunda:http-json:1 job, activated and completed by the `connectors`
#   component (already part of every load-test cluster; see
#   camunda-platform-values-secrets-connector.yaml for its configuration).
# - listSecrets: a benchmark-list-secrets job. The connector runtime has no code path that calls
#   /v2/secrets/list, so this is handled by a dedicated job worker (ListSecretsWorker) baked into
#   the load-tester image instead, deployed below as the "list-secrets" worker.
#
# The generic `worker` deployment (Worker.java, which just completes jobs with a static payload)
# is not used, but every load-tester pod bundles it regardless of which worker deployment it is,
# because it is not driven by a distinct job type here: its jobType is deliberately pointed at an
# unused type so it never picks up the real benchmark-list-secrets jobs meant for
# ListSecretsWorker (both are @JobWorker beans in the same jar; without this, whichever bean wins
# the race to poll a job would handle it, non-deterministically skipping the real list call).
#
# payloadPath sets batchSize/uniquePerBatch/poolSize/keyPrefix (see the BPMN's documentation and
# load-tests/docs/secrets-connector-benchmark.md). This default reproduces the original
# single-secret, always-cache-first behavior. Override payloadPath (and, for poolSize > the
# seeded count, secretsConnectorBenchmark.count) via additional_load_test_configuration to
# exercise the batch-dedup or store-miss presets, e.g.:
#   additional_load_test_configuration="--set load-tester.starter.payloadPath=bpmn/secrets/connectorSecretResolutionPayload-dedup.json"
load-tester:
  workers:
    worker: null

    #####
    # Exercises /v2/secrets/list once per instance, in parallel with the connector's resolveSecret
    # branch (see ListSecretsWorker.java and the BPMN's documentation).
    list-secrets:
      replicas: 1
      capacity: 30
      # Must match ListSecretsWorker.JOB_TYPE (hardcoded there, not read from this jobType
      # value): the generic Worker.java bean in the same pod polls this exact type too, so
      # pointing it anywhere else would leave it idle rather than racing ListSecretsWorker for
      # the real jobs.
      jobType: "unused-generic-worker-slot"
      payloadPath: "bpmn/emptyPayload.json"
      completionDelay: 0ms
      logLevel: "INFO"
      resources:
        limits:
          cpu: 250m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 256Mi

  starter:
    replicas: 1
    rate: 100
    logLevel: "INFO"
    processId: "connectorSecretResolution"
    payloadPath: "bpmn/secrets/connectorSecretResolutionPayload.json"
    bpmnXmlPath: "bpmn/secrets/connectorSecretResolution.bpmn"
    businessKey: "businessKey"
