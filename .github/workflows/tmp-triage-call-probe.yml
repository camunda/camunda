# description: Throwaway - calls triage from 8.9 lineage to prove the checkout fix. Deleted after use.
# type: CI
# owner: @camunda/test-automation-team
---
name: TMP triage call probe

on:
  push:
    branches:
      - ci/alwaysgreen-89-live-check

jobs:
  call-triage:
    # Same shape as the real pipeline: an 8.9-lineage caller invoking triage as a
    # reusable workflow. tooling_ref points at the branch under test so the checkout
    # picks up that copy rather than main.
    uses: camunda/camunda/.github/workflows/alwaysgreen-triage.yml@ci/alwaysgreen-89-triage
    secrets: inherit
    with:
      base_ref: stable/8.9
      dry_run: true
      tooling_ref: ci/alwaysgreen-89-triage
