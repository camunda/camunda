# description: Throwaway - dispatched caller invoking triage, the case that failed. Deleted after use.
# type: CI
# owner: @camunda/test-automation-team
---
name: TMP triage call probe

on:
  push:
    branches:
      - ci/alwaysgreen-89-live-check

jobs:
  call-triage:
    # No tooling_ref on purpose: this is the production shape, where the default has to
    # resolve to main even though the run itself was dispatched.
    uses: camunda/camunda/.github/workflows/alwaysgreen-triage.yml@ci/alwaysgreen-89-triage
    secrets: inherit
    with:
      base_ref: stable/8.9
      dry_run: true
