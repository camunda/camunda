# description: Runs a daily max-load stress test against main, currently in three variants: gRPC
#              and REST (both against Elasticsearch), and no-secondary-storage (exporters
#              disabled). After a 15-minute warmup, profiles the next 30 minutes of each variant
#              via async-profiler. After a 3-hour soak: snapshots metrics as a GitHub artifact,
#              posts a side-by-side summary table (with flamegraph links) to Slack (the scheduled
#              run always posts; a manual run only when opted in via the post-to-slack input),
#              then immediately deletes the namespaces to reduce cost.
#              Naming pattern: medic-daily-YYYY-MM-DD-<sha>
#              Each variant's full lifecycle (setup, warmup, profile, soak, collect-metrics,
#              cleanup) is delegated to the reusable stress-load-test.yml workflow via a
#              matrix — adding a variant is a one-line matrix entry, not a 6-job copy-paste.
#              The no-secondary-storage variant only runs this daily `max` leg; it deliberately
#              does not get its own multi-week weekly endurance rotation, since that long-horizon
#              engine coverage is not storage-specific and is already provided by the ES/OS/RDBMS
#              weekly runs.
# calls: stress-load-test.yml (per variant)
# type: CI
# owner: @camunda/reliability-testing
name: Daily Camunda Platform Load Tests
on:
  workflow_dispatch:
     inputs:
      reuse-tag:
        description: 'Docker image tag, that should be reused for the load tests. Allows to skip the docker image build step, can be used for recreating previous tests.'
        type: string
        default: ""
        required: false
      post-to-slack:
        description: 'Post the results to the reliability-testing Slack channel (useful for an end-to-end test run). Always posts on the scheduled run regardless of this input.'
        type: boolean
        default: false
        required: false
  schedule:
    # Runs at 2 am Monday-Friday https://crontab.guru/#0_2_*_*_1-5
    - cron: 0 2 * * 1-5

defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

env:
  TEST_OWNER: '@camunda/reliability-testing'
  REUSE_TAG: ${{ inputs.reuse-tag }}

jobs:
  benchmark-data:
    name: Collect benchmark data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    outputs:
      benchmark: ${{ steps.data.outputs.benchmark }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect benchmark data
        id: data
        run: |
          if [[ -z "${REUSE_TAG}" ]]; then
            echo "Creating new daily load test benchmark"
            echo "benchmark=medic-daily-$(date --utc "+%Y-%m-%d")-$(git rev-parse --short HEAD)-test" >> "$GITHUB_OUTPUT"
          else
            # Example:
            # $ echo ${tag%?}
            # medic-daily-2025-12-18-b1bd4006-test-b1bd400
            # $ echo ${tag%-*}
            # medic-daily-2025-12-18-b1bd4006-test
            var=${REUSE_TAG%-*}
            echo "Re-creating daily load test, with name: $var and tag: $REUSE_TAG"
            echo "benchmark=$var" >> "$GITHUB_OUTPUT"
          fi
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}


  run-variant:
    name: ${{ matrix.variant.label }}
    needs: benchmark-data
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Each entry fully describes one variant. Adding a variant (e.g. a future RDBMS leg) is
        # a new entry here — also add its "key:label" pair to VARIANT_ORDER in the
        # aggregate-metrics job below (in matrix order), or its metrics will be silently dropped
        # from the Slack summary and the combined artifact.
        variant:
          - key: grpc
            label: gRPC
            load-test-load: ''
            load-test-setup-helm-values: '--set elasticsearch.storage.requests=64Gi'
            secondary-storage-type: elasticsearch
          - key: rest
            label: REST
            load-test-load: '--set global.preferRest.enabled=true'
            load-test-setup-helm-values: '--set elasticsearch.storage.requests=64Gi'
            secondary-storage-type: elasticsearch
          - key: none
            label: None
            load-test-load: '--set load-tester.starter.rate=500'
            load-test-setup-helm-values: ''
            secondary-storage-type: none
    uses: ./.github/workflows/stress-load-test.yml
    secrets: inherit
    with:
      name: ${{ needs.benchmark-data.outputs.benchmark }}-${{ matrix.variant.key }}
      build-frontend: true
      load-test-load: ${{ matrix.variant.load-test-load }}
      load-test-setup-helm-values: ${{ matrix.variant.load-test-setup-helm-values }}
      secondary-storage-type: ${{ matrix.variant.secondary-storage-type }}

  # Aggregates every variant's metrics artifact into one place.
  aggregate-metrics:
    name: Aggregate variant metrics
    runs-on: ubuntu-latest
    needs: [ benchmark-data, run-variant ]
    if: always()
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download variant metrics artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # a variant whose collect-metrics never ran just yields fewer entries below
        with:
          pattern: stress-test-result-*
          path: variant-metrics
          # No merge-multiple: every artifact contains a file named stress-result.json, so each
          # needs its own per-artifact-name folder to avoid one variant's file overwriting another's.
      - name: Merge into the legacy combined artifact + variants manifest
        env:
          BENCHMARK: ${{ needs.benchmark-data.outputs.benchmark }}
          # Keep in sync with the `run-variant` matrix above (key:label pairs) — this determines
          # the Slack summary table's column order, which is not guaranteed by artifact download
          # order. key here must match the -<key> suffix used to build the run-variant name above.
          VARIANT_ORDER: 'grpc:gRPC rest:REST none:None'
        run: |
          manifest='[]'
          for entry in $VARIANT_ORDER; do
            key="${entry%%:*}"
            label="${entry#*:}"
            f="variant-metrics/stress-test-result-${BENCHMARK}-${key}/stress-result.json"
            if [ ! -f "$f" ]; then
              continue
            fi
            jq '.results' "$f" > "metrics-${key}.json"
            entry_json=$(jq --arg key "$key" --arg label "$label" '. + {key: $key, label: $label}' "$f")
            manifest=$(jq --argjson v "$entry_json" '. + [$v]' <<<"$manifest")
          done
          if [ "$manifest" = '[]' ]; then
            echo "::warning::No variant metrics artifacts found; Slack summary and legacy artifact will be empty"
          fi
          # Written to a FILE (not $GITHUB_OUTPUT): job outputs in this job are unsafe here — this
          # job also uses secrets.VAULT_* below (Observe build status), and GitHub Actions silently
          # drops any $GITHUB_OUTPUT write whose value happens to contain a substring matching a
          # secret registered anywhere in the job (see
          # https://github.com/orgs/community/discussions/26636). That bit the 2026-09-01 run: the
          # manifest was built correctly but the variants-json *output* came back empty, and
          # notify-results posted a header-only table even though every variant's data was intact
          # in this job's own artifact. Files aren't subject to output-masking, so the artifact is
          # the only reliable transport here — same reasoning already applied to
          # upload-variant-metrics above.
          echo "$manifest" > variants.json
      - name: Upload combined metrics artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # resolve-daily.py only checks this artifact for existence by name prefix — keep the
          # name stable even though its internal file layout changed.
          name: daily-load-test-metrics-${{ needs.benchmark-data.outputs.benchmark }}
          path: |
            metrics-*.json
            variants.json
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  # Post a side-by-side metrics table (one column per variant) to Slack.
  notify-results:
    name: Notify Slack with results
    runs-on: ubuntu-latest
    needs: [ benchmark-data, aggregate-metrics ]
    # Data-presence is checked inside the script after the manifest download, not here: the
    # job output that used to gate it is gone (see the comment in aggregate-metrics above).
    # Manual runs post only when explicitly asked; the scheduled run always posts.
    if: >
      always() &&
      needs.aggregate-metrics.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.post-to-slack == true)
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download variant manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daily-load-test-metrics-${{ needs.benchmark-data.outputs.benchmark }}
          path: variant-manifest
      - name: List flamegraph artifacts
        id: flamegraph-artifacts
        # Best-effort enhancement: a failure here shouldn't block the Slack results
        # notification, it just means the Slack message omits flamegraph links.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const runURL = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const links = data.artifacts
              .filter(a => a.name.startsWith('flamegraph-'))
              .map(a => `• <${runURL}/artifacts/${a.id}|${a.name}>`)
              .join('\n');
            core.setOutput('links', links);
      - name: Import Slack webhook from Vault
        id: slack-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda/ci/github-actions SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL;
      - name: Build and post Slack results table
        # queries.yaml is the canonical source of metric names/labels/formats;
        # the script reads it directly so the Slack table stays in sync.
        env:
          VARIANTS_JSON_FILE: variant-manifest/variants.json
          BENCHMARK: ${{ needs.benchmark-data.outputs.benchmark }}
          SLACK_WEBHOOK_URL: ${{ steps.slack-secrets.outputs.SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FLAMEGRAPH_LINKS: ${{ steps.flamegraph-artifacts.outputs.links }}
        run: python3 .github/scripts/post-load-test-results-to-slack.py
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ run-variant, aggregate-metrics, notify-results ]
    if: failure()
    timeout-minutes: 5
    permissions: { }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import Slack webhook from Vault
        id: slack-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda/ci/github-actions SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL;
      - id: slack-notify
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ steps.slack-secrets.outputs.SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Daily load test creation failed:*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "@reliability-testing-team Please check the related workflow execution: https://github.com/camunda/camunda/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
