# description: Runs the C8 Orchestration Cluster API, API (H2/RDBMS) and E2E test matrix against a local stack. Reusable; called by the on-demand workflow and the non-blocking PR check (on stable branches, from main).
# test location: /qa/c8-orchestration-cluster-e2e-test-suite
# called by: c8-orchestration-cluster-e2e-tests-on-demand.yml, c8-orchestration-cluster-e2e-tests-pr.yml
# type: CI
# owner: @camunda/test-automation-team
---
name: C8 Orchestration Cluster E2E Tests

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to check out for the test code."
        required: true
        type: string
      base:
        description: "Base branch the test matrix is sized for (main or stable/X.Y)."
        required: true
        type: string
      compare-base-sha:
        description: >-
          PR runs only: the PR's base commit. When a test step fails, its failed
          tests are re-run with the test code at this commit, in the same job,
          so the PR check's triage can tell a regression from a pre-existing
          failure. Empty (the default) skips the re-run.
        required: false
        type: string
        default: ""
      scripts-ref:
        description: >-
          PR runs only: the commit or branch to take the base re-run scripts
          (.github/scripts) from. A stable branch's PR check passes main,
          since stable branches do not carry them. Empty (the default) uses
          the calling workflow's commit.
        required: false
        type: string
        default: ""

permissions: {}

env:
  GHA_BEST_PRACTICES_LINTER: enabled
  TEST_OWNER: "@camunda/test-automation-team"
  TEST_PRODUCT: Orchestration Cluster
  TEST_TYPE: E2E

jobs:
  c8-orchestration-cluster-api-tests:
    name: C8 Orchestration Cluster API Tests (Mode ${{ matrix.camunda_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        camunda_mode: ${{ fromJSON( (inputs.base == 'stable/8.9' || inputs.base == 'stable/8.10' || inputs.base == 'main') && '["profiles","all-in-one"]' || '["profiles"]' ) }}
    steps:
      - name: Print input and base branch
        shell: bash
        env:
          BRANCH: ${{ inputs.ref }}
          BASE_BRANCH: ${{ inputs.base }}
          CAMUNDA_MODE: ${{ matrix.camunda_mode }}
        run: |
          echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "Input branch: $BRANCH"
          echo "Base branch: $BASE_BRANCH"
          echo "Camunda mode: $CAMUNDA_MODE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Print metadata
        uses: ./.github/actions/print-metadata
      # The base re-run's scripts: the checkout above is the tested branch,
      # which does not carry them when a stable branch's PR is tested.
      - name: Check out the suite CI scripts
        if: inputs.compare-base-sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.scripts-ref || github.workflow_sha }}
          path: .suite-ci
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set NON_STANDALONE variable
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base }}
        run: |
          if [[ "$BASE_BRANCH" == "stable/8.6" || "$BASE_BRANCH" == "stable/8.7" ]]; then
            echo "NON_STANDALONE=true" >> "$GITHUB_ENV"
          else
            echo "NON_STANDALONE=false" >> "$GITHUB_ENV"
          fi

      - name: Start Camunda
        shell: bash
        run: |
          # Retry to absorb transient Docker Hub registry timeouts during the
          # image pull (e.g. "Get https://registry-1.docker.io/v2/: context
          # deadline exceeded"). docker compose up -d is idempotent, so a retry
          # simply resumes the pull and starts the container.
          start_camunda() {
            if [[ "$NON_STANDALONE" == "true" ]]; then
              echo "Using single services for older branches (8.6/8.7)"
              DATABASE=elasticsearch docker compose up -d operate tasklist
            else
              echo "Using standalone camunda container"

              # Set CAMUNDA_MODE based on matrix parameter
              if [[ "$MATRIX_CAMUNDA_MODE" == "all-in-one" ]]; then
                export CAMUNDA_MODE="all-in-one"
                echo "Starting with CAMUNDA_MODE=all-in-one"
              else
                unset CAMUNDA_MODE
                echo "Starting with profiles SPRING_PROFILES_ACTIVE mode"
              fi

              DATABASE=elasticsearch docker compose up -d camunda
            fi
          }

          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if start_camunda; then
              echo "Camunda started on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/${attempts} to start Camunda failed."
            if [[ "$attempt" -lt "$attempts" ]]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done

          echo "Failed to start Camunda after ${attempts} attempts."
          exit 1
        env:
          MATRIX_CAMUNDA_MODE: ${{ matrix.camunda_mode }}
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: List running Docker containers
        shell: bash
        run: docker ps -a
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Wait for services to be ready
        id: wait-for-services
        shell: bash
        run: |
          echo "Checking if services are up..."
          if [[ "$NON_STANDALONE" == "true" ]]; then
            app_containers=(operate tasklist)
          else
            app_containers=(camunda)
          fi
          ready=false
          declare -A non_running
          for i in {1..90}; do
            # Fail fast if an app container crashed, instead of waiting out the
            # full ~15 min timeout. Resolve the container through compose rather
            # than by bare name: some branches set container_name to
            # operate-${DATABASE}, so `docker inspect operate` matches nothing
            # there. --all is required or compose omits an already-exited
            # container. Test Running rather than a status allowlist so a crash
            # loop is caught too (restart: always surfaces as `restarting`, never
            # `exited`) along with a container that was never created at all. Two
            # consecutive observations keep a single legitimate restart from
            # failing the job.
            for c in "${app_containers[@]}"; do
              cid="$(DATABASE=elasticsearch docker compose ps --all --quiet "$c" 2>/dev/null || true)"
              running=""
              if [[ -n "$cid" ]]; then
                running="$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || true)"
              fi
              if [[ "$running" == "true" ]]; then
                non_running["$c"]=0
                continue
              fi
              non_running["$c"]=$(( ${non_running["$c"]:-0} + 1 ))
              if (( ${non_running["$c"]} >= 2 )); then
                if [[ -z "$cid" ]]; then
                  echo "No container for service '$c' on two consecutive checks; it was never created or has been removed."
                else
                  echo "Container for service '$c' is not running on two consecutive checks; it will never become ready."
                  docker inspect "$cid" --format 'Container {{.Name}}: status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} restartCount={{.RestartCount}}' || true
                fi
                DATABASE=elasticsearch docker compose logs --tail 200 "$c" || true
                echo "Services failed to start: service '$c' is not running."
                exit 1
              fi
            done

            if [[ "$NON_STANDALONE" == "true" ]]; then
              tasklist_status=$(curl -s -m 5 http://localhost:8080 || echo "Failed")
              operate_status=$(curl -s -m 5 http://localhost:8081 || echo "Failed")
            else
              tasklist_status=$(curl -s -m 5 http://localhost:8080/tasklist || echo "Failed")
              operate_status=$(curl -s -m 5 http://localhost:8080/operate || echo "Failed")
              identity_status=$(curl -s -m 5 http://localhost:8080/identity || echo "Failed")
            fi
            if [[ "$NON_STANDALONE" == "true" ]]; then
              if [[ "$tasklist_status" != "Failed" && "$operate_status" != "Failed" ]]; then
                echo "Services are ready!"
                ready=true
                break
              fi
            else
              if [[ "$tasklist_status" != "Failed" && "$operate_status" != "Failed" && "$identity_status" != "Failed" ]]; then
                echo "Services are ready!"
                ready=true
                break
              fi
            fi
            echo "Waiting for services... ($i/90)"
            sleep 10
          done
          if [ "$ready" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Services failed to start in time."
            exit 1
          fi
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Print Docker logs before failing
        if: failure()
        shell: bash
        # DATABASE must be set: docker-compose.yml interpolates it into the
        # camunda service's depends_on / env_file, so an unset value makes the
        # compose project invalid ("depends on undefined service") and this
        # diagnostic step errors out instead of printing the container logs.
        run: |
          if [[ "$NON_STANDALONE" == "true" ]]; then
            DATABASE=elasticsearch docker compose logs tasklist
            DATABASE=elasticsearch docker compose logs operate
          else
            DATABASE=elasticsearch docker compose logs camunda
          fi
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: qa/c8-orchestration-cluster-e2e-test-suite/package-lock.json

      - name: Clean install dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Install Playwright Browsers
        shell: bash
        run: npx playwright install --with-deps chromium
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Run API tests
        shell: bash
        env:
          LOCAL_TEST: "false"
          CAMUNDA_AUTH_STRATEGY: "BASIC"
          CAMUNDA_BASIC_AUTH_USERNAME: "demo"
          CAMUNDA_BASIC_AUTH_PASSWORD: "demo"
          CAMUNDA_PROCESSINSTANCECREATION_BUSINESSIDUNIQUENESSENABLED: "true"
          COMPARE_BASE_SHA: ${{ inputs.compare-base-sha }}
          JOB_TIMEOUT_MIN: "45"
        run: |
          if [[ "$NON_STANDALONE" == "true" ]]; then
            export CORE_APPLICATION_TASKLIST_URL="http://localhost:8080"
            export CORE_APPLICATION_OPERATE_URL="http://localhost:8081"
            export ZEEBE_REST_ADDRESS="http://localhost:8089"
          else
            export CORE_APPLICATION_URL="http://localhost:8080"
            export ZEEBE_REST_ADDRESS="http://localhost:8080"
          fi

          echo "Running API tests"
          status=0
          npm run test -- --project=api-tests || status=$?
          # PR runs: compare the failed tests with the base test code while
          # the stack is still up. Never changes this step's result.
          if (( status != 0 )) && [[ -n "$COMPARE_BASE_SHA" ]]; then
            "$GITHUB_WORKSPACE/.suite-ci/.github/scripts/c8-e2e-suite-base-rerun.sh" --project=api-tests ||
              echo "::warning::The base re-run failed; the triage falls back to hints."
          fi
          exit "$status"

        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: C8 Orchestration Cluster API Test Result (Mode ${{ matrix.camunda_mode }})
          path: qa/c8-orchestration-cluster-e2e-test-suite/html-report
          retention-days: 10

      # Read by the PR triage (c8-e2e-suite-triage.sh, in the on-demand run's
      # report job). leg.txt names this job (its name with "/" replaced, as
      # artifact names cannot hold one) and the run attempt that wrote the
      # report, so the triage can tell the report's job and reject a stale one
      # from an earlier attempt.
      - name: Label JSON report
        if: always()
        shell: bash
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite
        env:
          LEG: C8 Orchestration Cluster API Tests (Mode ${{ matrix.camunda_mode }})
        run: |
          if [[ -f json-report/results.json ]]; then
            printf '%s\t%s\n' "$LEG" "$GITHUB_RUN_ATTEMPT" > json-report/leg.txt
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c8-e2e-suite-json-C8 Orchestration Cluster API Tests (Mode ${{ matrix.camunda_mode }})
          path: |
            qa/c8-orchestration-cluster-e2e-test-suite/json-report/results.json
            qa/c8-orchestration-cluster-e2e-test-suite/json-report/leg.txt
            qa/c8-orchestration-cluster-e2e-test-suite/json-report/base-rerun.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          job_name: ${{ format('{0} (Mode {1})', github.job, matrix.camunda_mode) }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  c8-orchestration-cluster-api-tests-rdbms:
    if: ${{ contains(fromJSON('["stable/8.9","stable/8.10","main"]'), inputs.base) }}
    name: C8 Orchestration Cluster API Tests (H2/RDBMS, Mode ${{ matrix.camunda_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        camunda_mode: ${{ fromJSON( (inputs.base == 'stable/8.9' || inputs.base == 'main' || inputs.base == 'stable/8.10') && '["profiles","all-in-one"]' || '["profiles"]' ) }}
    steps:
      - name: Print input and base branch
        shell: bash
        env:
          BRANCH: ${{ inputs.ref }}
          BASE_BRANCH: ${{ inputs.base }}
          CAMUNDA_MODE: ${{ matrix.camunda_mode }}
        run: |
          echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "Input branch: $BRANCH"
          echo "Base branch: $BASE_BRANCH"
          echo "Camunda mode: $CAMUNDA_MODE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Print metadata
        uses: ./.github/actions/print-metadata
      # The base re-run's scripts: the checkout above is the tested branch,
      # which does not carry them when a stable branch's PR is tested.
      - name: Check out the suite CI scripts
        if: inputs.compare-base-sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.scripts-ref || github.workflow_sha }}
          path: .suite-ci
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: ./.github/actions/setup-build
        with:
          maven-cache-key-modifier: e2e-h2-api-tests
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}

      - name: Build Camunda distribution
        shell: bash
        run: ./mvnw install -Dquickly -T1C

      - name: Extract distribution
        shell: bash
        run: |
          mkdir -p dev-dist
          exploded="dist/target/camunda-zeebe"
          if [ -d "$exploded/bin" ]; then
            cp -a "$exploded"/. dev-dist/
          else
            tarball=$(find dist/target -maxdepth 1 -name 'camunda-zeebe-*.tar.gz' | head -1)
            if [ -z "$tarball" ]; then
              echo "ERROR: No dist build output found."
              exit 1
            fi
            tar xzf "$tarball" --strip-components=1 -C dev-dist
          fi

      - name: Start Camunda with H2/RDBMS
        shell: bash
        env:
          MATRIX_CAMUNDA_MODE: ${{ matrix.camunda_mode }}
        run: |
          chmod +x dev-dist/bin/camunda

          if [[ "$MATRIX_CAMUNDA_MODE" == "all-in-one" ]]; then
            export CAMUNDA_MODE="all-in-one"
            echo "Starting with CAMUNDA_MODE=all-in-one"
          else
            unset CAMUNDA_MODE
            export SPRING_PROFILES_ACTIVE="broker,consolidated-auth,admin,tasklist,operate"
            echo "Starting with profiles SPRING_PROFILES_ACTIVE mode"
          fi

          export ZEEBE_CLOCK_CONTROLLED="true"

          # Auth configuration
          export CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI="false"
          export CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED="true"
          export CAMUNDA_SECURITY_AUTHENTICATION_METHOD="BASIC"
          export CAMUNDA_SECURITY_MULTITENANCY_CHECKSENABLED="false"
          export CAMUNDA_SECURITY_INITIALIZATION_USERS_0_USERNAME="demo"
          export CAMUNDA_SECURITY_INITIALIZATION_USERS_0_PASSWORD="demo"
          export CAMUNDA_SECURITY_INITIALIZATION_USERS_0_NAME="Demo"
          export CAMUNDA_SECURITY_INITIALIZATION_USERS_0_EMAIL="demo@example.com"
          export CAMUNDA_SECURITY_INITIALIZATION_DEFAULTROLES_ADMIN_USERS_0="demo"
          export CAMUNDA_SECURITY_INITIALIZATION_USERS_1_USERNAME="lisa"
          export CAMUNDA_SECURITY_INITIALIZATION_USERS_1_PASSWORD="lisa"
          export CAMUNDA_SECURITY_INITIALIZATION_USERS_1_NAME="lisa"
          export CAMUNDA_SECURITY_INITIALIZATION_USERS_1_EMAIL="lisa@example.com"
          export CAMUNDA_SECURITY_INITIALIZATION_DEFAULTROLES_ADMIN_USERS_1="lisa"

          # H2 in-memory database with RDBMS secondary storage
          export CAMUNDA_DATA_SECONDARY_STORAGE_TYPE="rdbms"
          export CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_URL="jdbc:h2:mem:cpt;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
          export CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_USERNAME="sa"
          export CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_PASSWORD=""
          export CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_AUTO_DDL="true"
          export CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_FLUSH_INTERVAL="PT0S"
          export CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_HISTORY_DEFAULT_HISTORY_TTL="PT60S"
          export CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_HISTORY_MIN_HISTORY_CLEANUP_INTERVAL="PT10S"
          export CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_HISTORY_MAX_HISTORY_CLEANUP_INTERVAL="PT60S"

          # Audit log
          export CAMUNDA_DATA_AUDITLOG_ENABLED="true"
          export CAMUNDA_DATA_AUDITLOG_USER_CATEGORIES_0="ADMIN"
          export CAMUNDA_DATA_AUDITLOG_USER_CATEGORIES_1="DEPLOYED_RESOURCES"
          export CAMUNDA_DATA_AUDITLOG_USER_CATEGORIES_2="USER_TASKS"
          export CAMUNDA_DATA_AUDITLOG_USER_EXCLUDES_0="VARIABLE"
          export CAMUNDA_DATA_AUDITLOG_USER_EXCLUDES_1="BATCH"
          export CAMUNDA_DATA_AUDITLOG_CLIENT_CATEGORIES_0="ADMIN"
          export CAMUNDA_DATA_AUDITLOG_CLIENT_EXCLUDES_0="PROCESS_INSTANCE"

          # Business ID uniqueness enforcement toggle
          export CAMUNDA_PROCESSINSTANCECREATION_BUSINESSIDUNIQUENESSENABLED="true"

          dev-dist/bin/camunda > dev-dist/camunda.log 2>&1 &
          echo $! > dev-dist/camunda.pid
          echo "Camunda starting (PID $(cat dev-dist/camunda.pid))..."

      - name: Wait for Camunda to be ready
        shell: bash
        run: |
          echo "Waiting for Camunda to be ready..."
          for i in $(seq 1 90); do
            if curl -sf -u demo:demo http://localhost:8080/v2/topology >/dev/null 2>&1; then
              echo "Camunda is ready!"
              exit 0
            fi
            echo "Waiting... ($i/90)"
            sleep 5
          done
          echo "Camunda failed to start in time."
          echo "=== Last 100 lines of log ==="
          tail -100 dev-dist/camunda.log
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: qa/c8-orchestration-cluster-e2e-test-suite/package-lock.json

      - name: Clean install dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Install Playwright Browsers
        shell: bash
        run: npx playwright install --with-deps chromium
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Run API tests
        shell: bash
        env:
          LOCAL_TEST: "false"
          CORE_APPLICATION_URL: "http://localhost:8080"
          ZEEBE_REST_ADDRESS: "http://localhost:8080"
          CAMUNDA_AUTH_STRATEGY: "BASIC"
          CAMUNDA_BASIC_AUTH_USERNAME: "demo"
          CAMUNDA_BASIC_AUTH_PASSWORD: "demo"
          CAMUNDA_PROCESSINSTANCECREATION_BUSINESSIDUNIQUENESSENABLED: "true"
          DATABASE: "RDBMS"
          COMPARE_BASE_SHA: ${{ inputs.compare-base-sha }}
          JOB_TIMEOUT_MIN: "45"
        run: |
          echo "Running API tests against H2/RDBMS backend"
          status=0
          npm run test -- --project=api-tests || status=$?
          # PR runs: compare the failed tests with the base test code while
          # the stack is still up. Never changes this step's result.
          if (( status != 0 )) && [[ -n "$COMPARE_BASE_SHA" ]]; then
            "$GITHUB_WORKSPACE/.suite-ci/.github/scripts/c8-e2e-suite-base-rerun.sh" --project=api-tests ||
              echo "::warning::The base re-run failed; the triage falls back to hints."
          fi
          exit "$status"
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Print Camunda logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Camunda logs ==="
          cat dev-dist/camunda.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: C8 Orchestration Cluster API Test Result (H2-RDBMS, Mode ${{ matrix.camunda_mode }})
          path: qa/c8-orchestration-cluster-e2e-test-suite/html-report
          retention-days: 10

      # Read by the PR triage (c8-e2e-suite-triage.sh, in the on-demand run's
      # report job). leg.txt names this job (its name with "/" replaced, as
      # artifact names cannot hold one) and the run attempt that wrote the
      # report, so the triage can tell the report's job and reject a stale one
      # from an earlier attempt.
      - name: Label JSON report
        if: always()
        shell: bash
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite
        env:
          LEG: C8 Orchestration Cluster API Tests (H2-RDBMS, Mode ${{ matrix.camunda_mode }})
        run: |
          if [[ -f json-report/results.json ]]; then
            printf '%s\t%s\n' "$LEG" "$GITHUB_RUN_ATTEMPT" > json-report/leg.txt
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c8-e2e-suite-json-C8 Orchestration Cluster API Tests (H2-RDBMS, Mode ${{ matrix.camunda_mode }})
          path: |
            qa/c8-orchestration-cluster-e2e-test-suite/json-report/results.json
            qa/c8-orchestration-cluster-e2e-test-suite/json-report/leg.txt
            qa/c8-orchestration-cluster-e2e-test-suite/json-report/base-rerun.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3

      - name: Stop Camunda
        if: always()
        shell: bash
        run: |
          if [ -f dev-dist/camunda.pid ]; then
            kill "$(cat dev-dist/camunda.pid)" 2>/dev/null || true
          fi

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          job_name: ${{ format('{0} (Mode {1})', github.job, matrix.camunda_mode) }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  c8-orchestration-cluster-e2e-tests:
    name: C8 Orchestration Cluster E2E Tests (Mode ${{ matrix.camunda_mode }}${{ matrix.tasklist_mode && format(', Tasklist {0}', matrix.tasklist_mode) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON( inputs.base == 'main' && '[{"camunda_mode":"profiles"},{"camunda_mode":"all-in-one"}]' || (inputs.base == 'stable/8.6' || inputs.base == 'stable/8.7') && '[{"camunda_mode":"profiles","tasklist_mode":"v1"}]' || inputs.base == 'stable/8.9' && '[{"camunda_mode":"profiles","tasklist_mode":"v1"},{"camunda_mode":"all-in-one","tasklist_mode":"v1"},{"camunda_mode":"profiles","tasklist_mode":"v2"},{"camunda_mode":"all-in-one","tasklist_mode":"v2"}]' || inputs.base == 'stable/8.8' && '[{"camunda_mode":"profiles","tasklist_mode":"v1"},{"camunda_mode":"profiles","tasklist_mode":"v2"}]' || '[{"camunda_mode":"profiles","tasklist_mode":"v2"}]' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    steps:
      - name: Print input and base branch
        shell: bash
        env:
          BRANCH: ${{ inputs.ref }}
          BASE_BRANCH: ${{ inputs.base }}
          CAMUNDA_MODE: ${{ matrix.camunda_mode }}
          TASKLIST_MODE: ${{ matrix.tasklist_mode }}
        run: |
          echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "Input branch: $BRANCH"
          echo "Base branch: $BASE_BRANCH"
          echo "Camunda mode: $CAMUNDA_MODE"
          if [[ -n "$TASKLIST_MODE" ]]; then
            echo "Tasklist mode: $TASKLIST_MODE"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Print metadata
        uses: ./.github/actions/print-metadata
      # The base re-run's scripts: the checkout above is the tested branch,
      # which does not carry them when a stable branch's PR is tested.
      - name: Check out the suite CI scripts
        if: inputs.compare-base-sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.scripts-ref || github.workflow_sha }}
          path: .suite-ci
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set NON_STANDALONE variable
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base }}
        run: |
          if [[ "$BASE_BRANCH" == "stable/8.6" || "$BASE_BRANCH" == "stable/8.7" ]]; then
            echo "NON_STANDALONE=true" >> "$GITHUB_ENV"
          else
            echo "NON_STANDALONE=false" >> "$GITHUB_ENV"
          fi

      - name: Start Camunda
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base }}
          MATRIX_CAMUNDA_MODE: ${{ matrix.camunda_mode }}
          MATRIX_TASKLIST_MODE: ${{ matrix.tasklist_mode }}
        run: |
          # Retry to absorb transient Docker Hub registry timeouts during the
          # image pull (e.g. "Get https://registry-1.docker.io/v2/: context
          # deadline exceeded"). docker compose up -d is idempotent, so a retry
          # simply resumes the pull and starts the container.
          start_camunda() {
            if [[ "$NON_STANDALONE" == "true" ]]; then
              echo "Using single services for older branches (8.6/8.7)"
              DATABASE=elasticsearch docker compose up -d operate tasklist
            else
              echo "Using standalone camunda container"

              # Set CAMUNDA_MODE based on matrix parameter
              if [[ "$MATRIX_CAMUNDA_MODE" == "all-in-one" ]]; then
                export CAMUNDA_MODE="all-in-one"
                echo "Starting with CAMUNDA_MODE=all-in-one"
              else
                unset CAMUNDA_MODE
                echo "Starting with profiles SPRING_PROFILES_ACTIVE mode"
              fi

              if [[ ("$BASE_BRANCH" == "stable/8.8" || "$BASE_BRANCH" == "stable/8.9") && "$MATRIX_TASKLIST_MODE" == "v1" ]]; then
                echo "Starting with Tasklist V1 mode enabled"
                CAMUNDA_TASKLIST_V2_MODE_ENABLED=false DATABASE=elasticsearch docker compose up -d camunda
              else
                DATABASE=elasticsearch docker compose up -d camunda
              fi

              # Optimize is a separate application (reads exported data from
              # Elasticsearch). Start it too, but only on branches whose compose
              # defines the service, so this is a no-op elsewhere.
              if DATABASE=elasticsearch docker compose config --services | grep -qx optimize; then
                echo "Starting Optimize"
                DATABASE=elasticsearch docker compose up -d optimize
              else
                echo "optimize service not defined in this branch's compose; skipping"
              fi
            fi
          }

          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if start_camunda; then
              echo "Camunda started on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/${attempts} to start Camunda failed."
            if [[ "$attempt" -lt "$attempts" ]]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done

          echo "Failed to start Camunda after ${attempts} attempts."
          exit 1
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: List running Docker containers
        run: docker ps -a
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Wait for services to be ready
        id: wait-for-services
        shell: bash
        run: |
          echo "Checking if services are up..."
          if [[ "$NON_STANDALONE" == "true" ]]; then
            app_containers=(operate tasklist)
          else
            app_containers=(camunda)
          fi
          ready=false
          declare -A non_running
          for i in {1..90}; do
            # Fail fast if an app container crashed, instead of waiting out the
            # full ~15 min timeout. Resolve the container through compose rather
            # than by bare name: some branches set container_name to
            # operate-${DATABASE}, so `docker inspect operate` matches nothing
            # there. --all is required or compose omits an already-exited
            # container. Test Running rather than a status allowlist so a crash
            # loop is caught too (restart: always surfaces as `restarting`, never
            # `exited`) along with a container that was never created at all. Two
            # consecutive observations keep a single legitimate restart from
            # failing the job.
            for c in "${app_containers[@]}"; do
              cid="$(DATABASE=elasticsearch docker compose ps --all --quiet "$c" 2>/dev/null || true)"
              running=""
              if [[ -n "$cid" ]]; then
                running="$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || true)"
              fi
              if [[ "$running" == "true" ]]; then
                non_running["$c"]=0
                continue
              fi
              non_running["$c"]=$(( ${non_running["$c"]:-0} + 1 ))
              if (( ${non_running["$c"]} >= 2 )); then
                if [[ -z "$cid" ]]; then
                  echo "No container for service '$c' on two consecutive checks; it was never created or has been removed."
                else
                  echo "Container for service '$c' is not running on two consecutive checks; it will never become ready."
                  docker inspect "$cid" --format 'Container {{.Name}}: status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} restartCount={{.RestartCount}}' || true
                fi
                DATABASE=elasticsearch docker compose logs --tail 200 "$c" || true
                echo "Services failed to start: service '$c' is not running."
                exit 1
              fi
            done

            if [[ "$NON_STANDALONE" == "true" ]]; then
              tasklist_status=$(curl -s -m 5 http://localhost:8080 || echo "Failed")
              operate_status=$(curl -s -m 5 http://localhost:8081 || echo "Failed")
            else
              tasklist_status=$(curl -s -m 5 http://localhost:8080/tasklist || echo "Failed")
              operate_status=$(curl -s -m 5 http://localhost:8080/operate || echo "Failed")
              identity_status=$(curl -s -m 5 http://localhost:8080/identity || echo "Failed")
            fi
            if [[ "$NON_STANDALONE" == "true" ]]; then
              if [[ "$tasklist_status" != "Failed" && "$operate_status" != "Failed" ]]; then
                echo "Services are ready!"
                ready=true
                break
              fi
            else
              if [[ "$tasklist_status" != "Failed" && "$operate_status" != "Failed" && "$identity_status" != "Failed" ]]; then
                echo "Services are ready!"
                ready=true
                break
              fi
            fi
            echo "Waiting for services... ($i/90)"
            sleep 10
          done
          if [ "$ready" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Services failed to start in time."
            exit 1
          fi
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Print Docker logs before failing
        if: failure()
        shell: bash
        # DATABASE must be set: docker-compose.yml interpolates it into the
        # camunda service's depends_on / env_file, so an unset value makes the
        # compose project invalid ("depends on undefined service") and this
        # diagnostic step errors out instead of printing the container logs.
        run: |
          if [[ "$NON_STANDALONE" == "true" ]]; then
            DATABASE=elasticsearch docker compose logs tasklist
            DATABASE=elasticsearch docker compose logs operate
          else
            DATABASE=elasticsearch docker compose logs camunda
          fi
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: qa/c8-orchestration-cluster-e2e-test-suite/package-lock.json

      - name: Clean install dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Install Playwright Browsers
        shell: bash
        run: npx playwright install --with-deps chromium
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Run tests
        shell: bash
        env:
          LOCAL_TEST: "false"
          CAMUNDA_AUTH_STRATEGY: "BASIC"
          CAMUNDA_BASIC_AUTH_USERNAME: "demo"
          CAMUNDA_BASIC_AUTH_PASSWORD: "demo"
          MATRIX_TASKLIST_MODE: ${{ matrix.tasklist_mode }}
          BASE_BRANCH: ${{ inputs.base }}
          OPTIMIZE_BASE_URL: "http://localhost:8083"
          COMPARE_BASE_SHA: ${{ inputs.compare-base-sha }}
          JOB_TIMEOUT_MIN: "45"
        run: |
          if [[ "$NON_STANDALONE" == "true" ]]; then
            export CORE_APPLICATION_TASKLIST_URL="http://localhost:8080"
            export CORE_APPLICATION_OPERATE_URL="http://localhost:8081"
            export ZEEBE_REST_ADDRESS="http://localhost:8089"
            TEST_ARGS=(--project=chromium)
          else
            export CORE_APPLICATION_URL="http://localhost:8080"
            export ZEEBE_REST_ADDRESS="http://localhost:8080"
            TEST_ARGS=(--project=chromium)

            if [[ "$BASE_BRANCH" == "main" ]]; then
              echo "Running current-generation tests"
              TEST_ARGS+=(tests/)
            elif [[ "$MATRIX_TASKLIST_MODE" == "v2" ]]; then
              export CAMUNDA_TASKLIST_V2_MODE_ENABLED=true
              echo "Running V2 mode tests"
              if [[ "$BASE_BRANCH" == "stable/8.8" ]]; then
                # stable/8.8: run all tests excluding @v1-only tagged tests
                TEST_ARGS+=(tests/ --grep-invert '@v1-only')
              else
                # stable/8.9: run all tests excluding v1/ directories
                TEST_ARGS+=(tests/ --grep-invert 'v1/')
              fi
            else
              if [[ "$BASE_BRANCH" == "stable/8.8" || "$BASE_BRANCH" == "stable/8.9" ]]; then
                export CAMUNDA_TASKLIST_V2_MODE_ENABLED=false
              fi
              echo "Running V1 mode tests"
              if [[ "$BASE_BRANCH" == "stable/8.9" ]]; then
                # stable/8.9: has v1/ directories, run only v1-specific tests
                TEST_ARGS+=(tests/tasklist/v1/ tests/common-flows/v1/)
              elif [[ "$BASE_BRANCH" == "stable/8.8" ]]; then
                # stable/8.8: no v1/ directories, run regular directories for V1 mode
                TEST_ARGS+=(tests/tasklist/ tests/common-flows/)
              fi
            fi
          fi
          # Include the Optimize startup check in the same Playwright run when
          # the Optimize container is up (branches whose compose defines it).
          if docker ps --format '{{.Names}}' | grep -qx optimize; then
            echo "Optimize container detected; waiting for readiness before adding the optimize-startup project"
            # Optimize redirects an unauthenticated root request to the OIDC login
            # (HTTP 302); that is the expected ready state (a 200 would signal auth
            # is not wired as expected).
            for i in {1..60}; do
              optimize_status="$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8083/ || true)"
              optimize_status="${optimize_status:-000}"
              if [[ "$optimize_status" == "302" ]]; then
                echo "Optimize is ready (HTTP $optimize_status)."
                break
              fi
              echo "Waiting for Optimize... ($i/60) HTTP $optimize_status"
              sleep 10
            done
            TEST_ARGS+=(--project=optimize-startup)
          fi

          echo "Running tests with args: ${TEST_ARGS[*]}"
          mapfile -t PROJECT_ARGS < <(printf '%s\n' "${TEST_ARGS[@]}" | grep '^--project=')
          status=0
          npm run test -- "${TEST_ARGS[@]}" || status=$?
          # PR runs: compare the failed tests with the base test code while
          # the stack is still up. Never changes this step's result.
          if (( status != 0 )) && [[ -n "$COMPARE_BASE_SHA" ]]; then
            "$GITHUB_WORKSPACE/.suite-ci/.github/scripts/c8-e2e-suite-base-rerun.sh" "${PROJECT_ARGS[@]}" ||
              echo "::warning::The base re-run failed; the triage falls back to hints."
          fi
          exit "$status"
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: C8 Orchestration Cluster E2E Test Result (Mode ${{ matrix.camunda_mode }}${{ matrix.tasklist_mode && format(', Tasklist {0}', matrix.tasklist_mode) || '' }})
          path: qa/c8-orchestration-cluster-e2e-test-suite/html-report
          retention-days: 10

      # Read by the PR triage (c8-e2e-suite-triage.sh, in the on-demand run's
      # report job). leg.txt names this job (its name with "/" replaced, as
      # artifact names cannot hold one) and the run attempt that wrote the
      # report, so the triage can tell the report's job and reject a stale one
      # from an earlier attempt.
      - name: Label JSON report
        if: always()
        shell: bash
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite
        env:
          LEG: C8 Orchestration Cluster E2E Tests (Mode ${{ matrix.camunda_mode }}${{ matrix.tasklist_mode && format(', Tasklist {0}', matrix.tasklist_mode) || '' }})
        run: |
          if [[ -f json-report/results.json ]]; then
            printf '%s\t%s\n' "$LEG" "$GITHUB_RUN_ATTEMPT" > json-report/leg.txt
          fi

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c8-e2e-suite-json-C8 Orchestration Cluster E2E Tests (Mode ${{ matrix.camunda_mode }}${{ matrix.tasklist_mode && format(', Tasklist {0}', matrix.tasklist_mode) || '' }})
          path: |
            qa/c8-orchestration-cluster-e2e-test-suite/json-report/results.json
            qa/c8-orchestration-cluster-e2e-test-suite/json-report/leg.txt
            qa/c8-orchestration-cluster-e2e-test-suite/json-report/base-rerun.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          job_name: "c8-orchestration-cluster-e2e-tests${{ matrix.tasklist_mode && format('/{0}', matrix.tasklist_mode) || '' }}"
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
