name: Operate a11y tests
on:
  push:
    branches:
      - "main"
      - "stable/**"
      - "release/**"
    paths:
      - '.github/workflows/operate-a11y.yml'
      - 'operate/client/**'
  pull_request:
    paths:
      - '.github/workflows/operate-a11y.yml'
      - 'operate/client/**'

# Limit workflow to 1 concurrent run per ref (branch): new commit -> old runs are canceled to save costs
# Exception for main branch: complete builds for every commit needed for confidenence
concurrency:
  cancel-in-progress: true
  group: ${{ format('{0}-{1}', github.workflow, github.ref == 'refs/heads/main' && github.sha || github.ref) }}

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.47.2
      options: --user 1001:1000
    steps:
      - name: Check out repository code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: camunda/infra-global-github-actions/setup-yarn-cache@67d00e9260887361a31f6446252fffbecae4a02e # setup-yarn-cache-1.0.2
        with:
          directory: operate/client
      - name: Install node dependencies
        working-directory: ./operate/client
        run: yarn
      - name: Build frontend
        working-directory: ./operate/client
        run: yarn build
      - name: Start server
        working-directory: ./operate/client
        run: yarn start:visual-regression &
      - name: Run A11y tests
        working-directory: ./operate/client
        run: yarn playwright e2e-playwright/a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Playwright report
          path: operate/client/playwright-report/
          retention-days: 30
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
