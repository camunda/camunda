# type: Preview Environment
# owner: @camunda/engineering-operations
---
name: Preview Env Clean

on:
  schedule:
  - cron: 0 6,22 * * *
  workflow_call:
    inputs:
      pull-request:
        description: |
          Limit cleanup to a single pull request (number) and a minimal mode.
          Useful for quickly eliminating inconsistencies while waiting for the full cleanup cycle to run.
        required: false
        type: number
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_JWT_ROLE:
        required: true
      VAULT_JWT_PATH:
        required: true
      VAULT_JWT_AUDIENCE:
        required: true
  workflow_dispatch:

env:
  TEST_OWNER: '@camunda/engineering-operations'

jobs:
  preview-env-clean:
    concurrency:
      group: clean-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
    permissions:
      contents: read
      id-token: write # Vault JWT login
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Generate a GitHub token
      id: github-token
      uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@405ecc95af077cd030bfe3249511e802fd9e4585 # generate-github-app-token-from-vault-secrets-1.3.1
      with:
        github-app-id-vault-key: GITHUB_PREVIEW_ENVIRONMENTS_APP_ID
        github-app-id-vault-path: secret/data/products/camunda/ci/camunda
        github-app-private-key-vault-key: GITHUB_PREVIEW_ENVIRONMENTS_APP_PRIVATE_KEY
        github-app-private-key-vault-path: secret/data/products/camunda/ci/camunda
        vault-auth-method: jwt
        vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
        vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
        vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        vault-url: ${{ secrets.VAULT_ADDR }}

    - uses: camunda/infra-global-github-actions/preview-env/clean@742815e8e42387c77e70b69f8747141dbf216607 # preview-env-1.1.2
      with:
        labels: deploy-preview
        pull-request: ${{ inputs.pull-request }}
        token: ${{ steps.github-token.outputs.token }}
        ttl: 21d
        warning-ttl: 14d

    - name: Import secrets
      id: secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        secrets: |
          secret/data/products/camunda/ci/camunda ARGOCD_TOKEN;

    # Clean up any (remaining) smoke-test preview environments older than 12 hours
    - uses: camunda/infra-global-github-actions/argocd-delete-applications@47164bc3d1bce866f4f189f19fac7895ae51956d # argocd-delete-applications-1.0.2
      with:
        argocd-token: ${{ steps.secrets.outputs.ARGOCD_TOKEN }}
        github-token: ${{ github.token }}
        label-selector: |
          preview=smoke-test
          repo=camunda_camunda
        min-age: 12h

    - name: Observe build status
      if: always()
      continue-on-error: true
      uses: ./.github/actions/observe-build-status
      with:
        build_status: ${{ job.status }}
        job_name: preview-env-clean
        secret_vault_address: ${{ secrets.VAULT_ADDR }}
        secret_vault_jwtRole: ${{ secrets.VAULT_JWT_ROLE }}
        secret_vault_jwtPath: ${{ secrets.VAULT_JWT_PATH }}
        secret_vault_jwtAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
