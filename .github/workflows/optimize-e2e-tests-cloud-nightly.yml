# description: Nightly E2E smoke run for Optimize in Cloud (SaaS) mode against the Auth0 dev tenant.
# test location: /optimize/client/e2e/cloud-tests
# type: CI
# owner: @camunda/optimize-frontend
#
# Deliberately not part of the general PR gate (it used to be the `e2e-cloud-test` job in
# ci-optimize.yml). The only thing this run covers beyond the self-managed smoke job is the Auth0
# login path, and its outcome depends on a shared, external Auth0 dev tenant that no ordinary pull
# request can influence. Gating every Optimize merge on that tenant's availability produced false
# failures rather than signal.
#
# It does run on pull requests that change the cloud test or this workflow, since those are exactly
# the changes it can invalidate - and without that the test would be unverifiable until after merge.
name: Optimize E2E Cloud (Nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/optimize-e2e-tests-cloud-nightly.yml"
      - "optimize/client/e2e/cloud-tests/**"
      - "optimize/client/e2e/config.js"
      - "optimize/client/scripts/start-backend.js"

# One bucket for the whole workflow: every run authenticates the same user against the same Auth0
# tenant, and concurrent logins are what trip its per-IP throttling. In-flight runs are left to
# finish rather than cancelled - each one is a real login, and discarding it midway loses the signal
# it was started for.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  TEST_OWNER: '@camunda/optimize-frontend'
  TEST_PRODUCT: 'optimize'
  TEST_TYPE: 'E2E'
  GHA_BEST_PRACTICES_LINTER: enabled

jobs:
  e2e-cloud:
    name: "E2E Cloud (Smoke) [${{ matrix.branch }}]"
    # Two guards:
    # - The backport copies on stable/* carry the same `schedule`. Only the default branch's cron
    #   fires today, but pinning the branch here keeps those copies inert even if that changes.
    # - Forks cannot read the Vault secrets this job needs, so it would only ever fail for them.
    if: >-
      (github.event_name != 'schedule' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Generous because the build eats most of it and the test may burn three login attempts before
    # it passes; a retry killed by the timeout would report as the hard failure retries exist to avoid.
    timeout-minutes: 45
    permissions: { }  # GITHUB_TOKEN unused in this job
    strategy:
      fail-fast: false
      # Every branch logs the same user into the same Auth0 dev tenant, so run them one at a time
      # to stay clear of Auth0's per-IP brute-force throttling.
      max-parallel: 1
      matrix:
        # Only the schedule sweeps every maintained branch. A dispatch or a pull request runs
        # against its own ref alone, so a change to the test is verified before merging and a manual
        # run costs one Auth0 login instead of three.
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main","stable/8.8","stable/8.9"]') || fromJSON(format('["{0}"]', github.head_ref || github.ref_name)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set branch slug
        run: echo "BRANCH_SLUG=$(echo '${{ matrix.branch }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Print metadata
        uses: ./.github/actions/print-metadata

      - name: Import secrets
        id: vault_secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/optimize/ci/camunda-optimize AUTH0_CLIENTSECRET | AUTH0_CLIENTSECRET;
            secret/data/products/optimize/ci/camunda-optimize AUTH0_USEREMAIL | AUTH0_USEREMAIL;
            secret/data/products/optimize/ci/camunda-optimize AUTH0_USERPASSWORD | AUTH0_USERPASSWORD;

      - name: Validate Auth0 secrets
        env:
          AUTH0_CLIENTSECRET: "${{ steps.vault_secrets.outputs.AUTH0_CLIENTSECRET }}"
          AUTH0_USEREMAIL: "${{ steps.vault_secrets.outputs.AUTH0_USEREMAIL }}"
          AUTH0_USERPASSWORD: "${{ steps.vault_secrets.outputs.AUTH0_USERPASSWORD }}"
        run: |
          set -euo pipefail
          for var in AUTH0_CLIENTSECRET AUTH0_USEREMAIL AUTH0_USERPASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required Auth0 secret: ${var}"
              exit 1
            fi
          done

      - name: Setup Maven
        uses: ./.github/actions/setup-build
        with:
          java-distribution: zulu
          maven-cache-key-modifier: optimize-e2e-cloud-nightly
          time-zone: Europe/Berlin
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}

      - name: "Read Java / Version Info"
        id: "pom-info"
        uses: YunaBraska/java-info-action@085d09be3659b484e0a6d0c95aac6612687ce8d9 # 3.0.13
        with:
          work-dir: ./optimize

      - name: "Read Node version"
        id: "node-info"
        uses: YunaBraska/java-info-action@085d09be3659b484e0a6d0c95aac6612687ce8d9 # 3.0.13
        with:
          work-dir: ./parent

      - name: Read DB versions
        id: db-versions
        uses: ./.github/actions/read-db-versions

      - name: Start Elasticsearch
        uses: ./.github/actions/compose
        with:
          compose_file: .github/actions/compose/docker-compose.elasticsearch.yml
          project_name: elasticsearch
        env:
          ELASTIC_VERSION: ${{ steps.db-versions.outputs.elasticsearch-8 }}
          ELASTIC_JVM_MEMORY: 1
          ELASTIC_HTTP_PORT: ${{ steps.pom-info.outputs.x_new_database_port }}

      - name: Build frontend
        uses: ./.github/actions/build-frontend
        with:
          directory: ./optimize/client
          node-version: ${{ steps.node-info.outputs.x_version_node }}

      - uses: ./.github/actions/build-zeebe
        id: build-camunda
        with:
          maven-extra-args: -PskipFrontendBuild -Dskip.docker

      - name: Create backend logs file
        run: mkdir -p ./optimize/client/build && touch ./optimize/client/build/backendLogs.log

      - name: Start backend
        working-directory: ./optimize/client
        env:
          AUTH0_CLIENTSECRET: "${{ steps.vault_secrets.outputs.AUTH0_CLIENTSECRET }}"
        run: |
          yarn run start-backend-cloud ci &> ./build/backendLogs.log &

      - name: Start frontend
        working-directory: ./optimize/client
        run: yarn start &

      - name: Wait for backend to start
        run: ./.github/optimize/scripts/wait-for.sh http://localhost:8090/api/readyz

      - name: Wait for frontend to start
        run: ./.github/optimize/scripts/wait-for.sh http://localhost:3000/ready

      - name: Run E2E tests
        working-directory: ./optimize/client
        env:
          AUTH0_CLIENTSECRET: "${{ steps.vault_secrets.outputs.AUTH0_CLIENTSECRET }}"
          AUTH0_USEREMAIL: "${{ steps.vault_secrets.outputs.AUTH0_USEREMAIL }}"
          AUTH0_USERPASSWORD: "${{ steps.vault_secrets.outputs.AUTH0_USERPASSWORD }}"
        run: yarn run e2e:ci:cloud:headless

      - name: Upload logs and failure screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: optimize-e2e-cloud-nightly-logs-${{ env.BRANCH_SLUG }}
          path: |
            ./optimize/client/build/*.log
            ./optimize/client/build/screenshots/
          if-no-files-found: ignore

      - name: Docker log dump
        uses: ./.github/actions/docker-logs
        if: always()
        continue-on-error: true
        with:
          archive_name: optimize-e2e-cloud-nightly-docker-logs-${{ env.BRANCH_SLUG }}

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          job_name: ${{ github.job }}-${{ env.BRANCH_SLUG }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
