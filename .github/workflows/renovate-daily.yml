# description: Runs daily to assign Renovate PRs to team members and manage stale PRs
# type: CI Helper
# owner: @camunda/engineering-operations

---
name: Renovate Daily

on:
  schedule:
    - cron: '0 11 * * 1-5'  # Monday through Friday at 11:00 AM UTC
  pull_request:
    paths:
      - '.github/workflows/renovate-daily.yml'
      - '.ci/scripts/renovate-assignments.py'
  workflow_dispatch: {}

env:
  TEST_OWNER: '@camunda/engineering-operations'
  GHA_BEST_PRACTICES_LINTER: enabled

jobs:
  assign-renovate-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Vault JWT login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate a GitHub token
        id: github-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@405ecc95af077cd030bfe3249511e802fd9e4585 # generate-github-app-token-from-vault-secrets-1.3.1
        with:
          github-app-id-vault-key: MONOREPO_RENOVATE_AUTOMATION_APP_ID
          github-app-id-vault-path: secret/data/products/camunda/ci/camunda
          github-app-private-key-vault-key: MONOREPO_RENOVATE_AUTOMATION_APP_PRIVATE_KEY
          github-app-private-key-vault-path: secret/data/products/camunda/ci/camunda
          vault-auth-method: jwt
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Renovate assignments script
        env:
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: |
          python3 .ci/scripts/renovate-assignments.py

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwtRole: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwtPath: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwtAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  notify:
    name: Send Slack notification
    runs-on: ubuntu-latest
    needs: [assign-renovate-prs]
    if: ${{ always() && needs.assign-renovate-prs.result != 'success' && github.event_name == 'schedule' }}
    timeout-minutes: 5
    permissions:
      id-token: write # Vault JWT login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: ${{ secrets.VAULT_JWT_ROLE }}
          path: ${{ secrets.VAULT_JWT_PATH }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/camunda/ci/github-actions SLACK_TOPMONOREPOCI_WEBHOOK_URL;

      - name: Send failure Slack notification
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ steps.secrets.outputs.SLACK_TOPMONOREPOCI_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # For posting a rich message using Block Kit
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":alarm: *Renovate PR Assignments* automation failed on `main`!\n"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Please check this <https://github.com/camunda/camunda/actions/runs/${{ github.run_id }}|GHA workflow run> for details, and fix the problem."
                  }
                }
              ]
            }

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwtRole: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwtPath: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwtAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
