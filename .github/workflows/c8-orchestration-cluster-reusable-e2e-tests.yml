# description: Reusable workflow — C8 Orchestration Cluster E2E Tests (Nightly).
#              Called by the per-version nightly E2E workflows.
# test location: /qa/c8-orchestration-cluster-e2e-test-suite
# type: CI
# owner: @camunda/test-automation-team
---
name: C8 Orchestration Cluster - Reusable E2E Tests

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to test (e.g. stable/8.8, main)"
        required: true
        type: string
      tasklist_mode:
        description: "Tasklist UI mode to test: v1 or v2"
        required: true
        type: string

permissions:
  contents: read

env:
  TEST_OWNER: '@camunda/test-automation-team'

jobs:
  nightly-e2e-tests:
    name: E2E Tests (${{ inputs.branch }} - Tasklist ${{ inputs.tasklist_mode }} mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Set CAMUNDA_DOCKER_IMAGE and OPTIMIZE_DOCKER_IMAGE
        run: |
          branch="${{ inputs.branch }}"
          if [[ "$branch" == "main" ]]; then
            echo "CAMUNDA_DOCKER_IMAGE=camunda/camunda:SNAPSHOT" >> "$GITHUB_ENV"
            echo "OPTIMIZE_DOCKER_IMAGE=camunda/optimize:SNAPSHOT" >> "$GITHUB_ENV"
          elif [[ "$branch" == stable/* ]]; then
            minor="${branch#stable/}"
            echo "CAMUNDA_DOCKER_IMAGE=camunda/camunda:${minor}-SNAPSHOT" >> "$GITHUB_ENV"
            echo "OPTIMIZE_DOCKER_IMAGE=camunda/optimize:${minor}-SNAPSHOT" >> "$GITHUB_ENV"
          fi

      - name: Import Docker Hub secrets
        id: dockerhub-secrets
        uses: hashicorp/vault-action@79632e33d6953d190b940ffa440bf97821cabd80
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda/ci/github-actions REGISTRY_HUB_DOCKER_COM_USR | dockerhub-username;
            secret/data/products/camunda/ci/github-actions REGISTRY_HUB_DOCKER_COM_PSW_READ_ONLY | dockerhub-token;

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ steps.dockerhub-secrets.outputs.dockerhub-username }}
          password: ${{ steps.dockerhub-secrets.outputs.dockerhub-token }}

      - name: Start Camunda
        run: |
          # Authenticated pulls (see "Log in to Docker Hub" above) plus a
          # retry-with-backoff pre-pull absorb transient Docker Hub registry
          # outages observed in the nightly (e.g. "Get
          # https://registry-1.docker.io/v2/: context deadline exceeded").
          # Pulling is separated from `up -d` so a network blip only retries the
          # pull; both commands are idempotent.
          up_env=(DATABASE=elasticsearch)
          if [[ "${{ inputs.branch }}" == "stable/8.7" ]]; then
            echo "Using single services for Camunda 8.7"
            services=(operate tasklist)
          else
            echo "Using standalone camunda container"
            services=(camunda)
            if [[ "${{ inputs.tasklist_mode }}" == "v1" ]]; then
              echo "Starting with Tasklist V1 mode enabled"
              up_env+=(CAMUNDA_TASKLIST_V2_MODE_ENABLED=false)
            else
              echo "Starting with default Tasklist V2 mode"
            fi
          fi

          attempts=5
          delay=15
          pulled=false
          for attempt in $(seq 1 "$attempts"); do
            if env "${up_env[@]}" docker compose pull --include-deps "${services[@]}"; then
              pulled=true
              break
            fi
            echo "Attempt ${attempt}/${attempts} to pull Camunda images failed."
            if [[ "$attempt" -lt "$attempts" ]]; then
              echo "Retrying in ${delay}s..."
              sleep "$delay"
              delay=$(( delay * 2 ))
            fi
          done

          if [[ "$pulled" != "true" ]]; then
            echo "Failed to pull Camunda images after ${attempts} attempts."
            exit 1
          fi

          env "${up_env[@]}" docker compose up -d "${services[@]}"
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Start Optimize
        # Optimize is a separate application that only exists in the compose file
        # on branches where it has been added. Gate on its presence so this step
        # is a no-op on branches that do not (yet) define the service.
        run: |
          if ! DATABASE=elasticsearch docker compose config --services | grep -qx optimize; then
            echo "optimize service not defined in this branch's compose; skipping."
            exit 0
          fi

          start_optimize() {
            DATABASE=elasticsearch docker compose up -d optimize
          }

          attempts=5
          delay=15
          for attempt in $(seq 1 "$attempts"); do
            if start_optimize; then
              echo "Optimize started on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/${attempts} to start Optimize failed."
            if [[ "$attempt" -lt "$attempts" ]]; then
              echo "Retrying in ${delay}s (exponential backoff)..."
              sleep "$delay"
              delay=$(( delay * 2 ))
            fi
          done

          echo "Failed to start Optimize after ${attempts} attempts."
          exit 1
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: List running Docker containers
        run: docker ps -a
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Wait for services to be ready
        id: wait-for-services
        run: |
          echo "Checking if services are up..."
          if [[ "${{ inputs.branch }}" == "stable/8.7" ]]; then
            app_containers=(operate tasklist)
          else
            app_containers=(camunda)
          fi
          ready=false
          declare -A non_running
          for i in {1..90}; do
            # Fail fast if an app container crashed, instead of waiting out the
            # full ~15 min timeout. Resolve the container through compose rather
            # than by bare name: stable/8.7 sets container_name to
            # operate-${DATABASE}, so `docker inspect operate` matches nothing
            # there. --all is required or compose omits an already-exited
            # container. Test Running rather than a status allowlist so a crash
            # loop is caught too (8.7 sets restart: always, which surfaces as
            # `restarting`, never `exited`) along with a container that was never
            # created at all. Two consecutive observations keep a single
            # legitimate restart from failing the job.
            for c in "${app_containers[@]}"; do
              cid="$(DATABASE=elasticsearch docker compose ps --all --quiet "$c" 2>/dev/null || true)"
              running=""
              if [[ -n "$cid" ]]; then
                running="$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || true)"
              fi
              if [[ "$running" == "true" ]]; then
                non_running["$c"]=0
                continue
              fi
              non_running["$c"]=$(( ${non_running["$c"]:-0} + 1 ))
              if (( ${non_running["$c"]} >= 2 )); then
                if [[ -z "$cid" ]]; then
                  echo "No container for service '$c' on two consecutive checks; it was never created or has been removed."
                else
                  echo "Container for service '$c' is not running on two consecutive checks; it will never become ready."
                  docker inspect "$cid" --format 'Container {{.Name}}: status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} restartCount={{.RestartCount}}' || true
                fi
                DATABASE=elasticsearch docker compose logs --tail 200 "$c" || true
                echo "Services failed to start: service '$c' is not running."
                exit 1
              fi
            done

            if [[ "${{ inputs.branch }}" == "stable/8.7" ]]; then
              tasklist_status=$(curl -s -m 5 http://localhost:8080 || echo "Failed")
              operate_status=$(curl -s -m 5 http://localhost:8081 || echo "Failed")
            else
              tasklist_status=$(curl -s -m 5 http://localhost:8080/tasklist || echo "Failed")
              operate_status=$(curl -s -m 5 http://localhost:8080/operate || echo "Failed")
              identity_status=$(curl -s -m 5 http://localhost:8080/identity || echo "Failed")
            fi

            if [[ "${{ inputs.branch }}" == "stable/8.7" ]]; then
              if [[ "$tasklist_status" != "Failed" && "$operate_status" != "Failed" ]]; then
                echo "Services are ready!"
                ready=true
                break
              fi
            else
              if [[ "$tasklist_status" != "Failed" && "$operate_status" != "Failed" && "$identity_status" != "Failed" ]]; then
                echo "Services are ready!"
                ready=true
                break
              fi
            fi

            echo "Waiting for services... ($i/90)"
            echo "Response from Tasklist: $tasklist_status"
            echo "Response from Operate: $operate_status"
            [[ -n "$identity_status" ]] && echo "Response from Identity: $identity_status"
            sleep 10
          done

          if [ "$ready" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Services failed to start in time."
            exit 1
          fi
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Wait for Optimize to be ready
        # Only runs when Optimize was started (service present in this branch).
        run: |
          if ! docker ps --format '{{.Names}}' | grep -qx optimize; then
            echo "Optimize container not running; skipping wait."
            exit 0
          fi

          # An unauthenticated request to Optimize's root always redirects to the
          # OIDC login (HTTP 302); that is the expected ready state. A 200 would
          # mean auth is not wired as expected, so it is not treated as ready.
          echo "Waiting for Optimize to be reachable on http://localhost:8083 ..."
          for i in {1..60}; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8083/ || true)"
            status="${status:-000}"
            if [[ "$status" == "302" ]]; then
              echo "Optimize is ready (HTTP $status)."
              exit 0
            fi
            echo "Waiting for Optimize... ($i/60) HTTP $status"
            sleep 10
          done

          echo "Optimize failed to become ready in time."
          docker logs optimize --tail 100 || true
          exit 1
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Print Docker logs before failing
        if: failure()
        # DATABASE must be set: docker-compose.yml interpolates it into the
        # camunda service's depends_on / env_file, so an unset value makes the
        # compose project invalid ("depends on undefined service") and this
        # diagnostic step errors out instead of printing the container logs.
        run: |
          if [[ "${{ inputs.branch }}" == "stable/8.7" ]]; then
            DATABASE=elasticsearch docker compose logs tasklist
            DATABASE=elasticsearch docker compose logs operate
          else
            DATABASE=elasticsearch docker compose logs camunda
          fi
          if docker ps -a --format '{{.Names}}' | grep -qx optimize; then
            DATABASE=elasticsearch docker compose logs optimize
          fi
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite/config

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/c8-orchestration-cluster-e2e-test-suite/package-lock.json

      - name: Clean install dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@79632e33d6953d190b940ffa440bf97821cabd80
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/github.com/organizations/camunda TESTRAIL_QA_EMAIL;
            secret/data/github.com/organizations/camunda TESTRAIL_QA_PSW;
            secret/data/products/camunda/ci/github-actions SLACK_CORE_DOMAIN_BOT_TOKEN;

      - name: Install Playwright Browsers
        shell: bash
        run: npx playwright install --with-deps chromium
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Python setup
        if: always()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Run E2E tests
        shell: bash
        env:
          LOCAL_TEST: "false"
          CAMUNDA_AUTH_STRATEGY: "BASIC"
          CAMUNDA_BASIC_AUTH_USERNAME: "demo"
          CAMUNDA_BASIC_AUTH_PASSWORD: "demo"
          INCLUDE_SLACK_REPORTER: true
          SLACK_BOT_USER_OAUTH_TOKEN: ${{ steps.secrets.outputs.SLACK_CORE_DOMAIN_BOT_TOKEN }}
          VERSION: ${{ inputs.branch }}
          CAMUNDA_TASKLIST_V2_MODE_ENABLED: ${{ inputs.tasklist_mode == 'v2' && 'true' || 'false' }}
          OPTIMIZE_BASE_URL: "http://localhost:8083"
        run: |
          if [[ "${{ inputs.branch }}" == "stable/8.7" ]]; then
            export CORE_APPLICATION_TASKLIST_URL="http://localhost:8080"
            export CORE_APPLICATION_OPERATE_URL="http://localhost:8081"
            export ZEEBE_REST_ADDRESS="http://localhost:8089"
          else
            export CORE_APPLICATION_URL="http://localhost:8080"
            export ZEEBE_REST_ADDRESS="http://localhost:8080"
          fi

          # Include the Optimize startup check in the same Playwright run (so it
          # shares one JUnit/JSON/HTML report) only when the Optimize container is
          # running — i.e. on branches whose compose defines the service.
          OPTIMIZE_ARGS=""
          if docker ps --format '{{.Names}}' | grep -qx optimize; then
            echo "Optimize container detected; including the optimize-startup project."
            OPTIMIZE_ARGS="--project=optimize-startup"
          else
            echo "Optimize container not running; optimize-startup project will be skipped."
          fi

          if [[ "${{ inputs.tasklist_mode }}" == "v2" ]]; then
            if [[ "${{ inputs.branch }}" == "main" ]]; then
              echo "Running all tests in V2 mode on main"
              npm run test -- --project=chromium $OPTIMIZE_ARGS
            elif [[ "${{ inputs.branch }}" == "stable/8.9" ]]; then
              echo "Running all tests in V2 mode on ${{ inputs.branch }}, excluding V1-specific tests"
              npm run test -- --project=chromium $OPTIMIZE_ARGS --grep-invert "tests/(common-flows/v1|tasklist/v1)/"
            else
              echo "Running all tests in V2 mode: excluding @v1-only tests"
              npm run test -- --project=chromium $OPTIMIZE_ARGS --grep-invert "@v1-only"
            fi
          else
            if [[ "${{ inputs.branch }}" == "stable/8.9" ]]; then
              echo "Running V1 specific tests only: common-flows/v1/ and tests/tasklist/v1/"
              npm run test -- --project=chromium tests/common-flows/v1/ tests/tasklist/v1/
            elif [[ "${{ inputs.branch }}" == "stable/8.8" ]]; then
              echo "Running focused tests in V1 mode"
              npm run test -- --project=chromium tests/tasklist/ tests/common-flows/
            else
              echo "Running all tests in V1 mode"
              npm run test -- --project=chromium $OPTIMIZE_ARGS
            fi
          fi
        working-directory: qa/c8-orchestration-cluster-e2e-test-suite

      - name: Publish test results to TestRail
        if: always()
        shell: bash
        env:
          TESTRAIL_HOST: "https://camunda.testrail.com/"
          TESTRAIL_USERNAME: ${{ steps.secrets.outputs.TESTRAIL_QA_EMAIL }}
          TESTRAIL_KEY: ${{ steps.secrets.outputs.TESTRAIL_QA_PSW }}
          JUNIT_RESULTS_FILE: "qa/c8-orchestration-cluster-e2e-test-suite/test-results/junit-report.xml"
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          pip install trcli==1.14.1
          log=$(mktemp)
          set +e
          trcli -y -h "$TESTRAIL_HOST" \
            --project 'C8' \
            --username "$TESTRAIL_USERNAME" \
            --key "$TESTRAIL_KEY" \
            --batch-size 500 \
            --timeout 180 \
            parse_junit --suite-id 17050 \
            --title "Nightly C8 Orchestration Cluster Test Results - $BRANCH_NAME (Tasklist ${{ inputs.tasklist_mode }} mode) - $(date '+%Y-%m-%d %H:%M:%S')" \
            --close-run \
            -f "$JUNIT_RESULTS_FILE" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          # trcli's --close-run is not idempotent: past its client timeout it retries
          # silently and TestRail rejects the retry because the first close landed.
          # Requiring the Done line means a mid-upload rejection still fails the step.
          if [ "$status" -ne 0 ] &&
            grep -qE 'Adding results: [0-9]+/[0-9]+, Done\.' "$log" &&
            grep -qF 'The test run is already completed' "$log"; then
            echo "::warning::TestRail close raced its own retry; all results were uploaded"
            exit 0
          fi
          exit "$status"

      - name: Sanitize branch name for artifact names
        id: sanitize
        if: always()
        shell: bash
        run: |
          branch="${{ inputs.branch }}"
          safe_branch="${branch//\//-}"
          echo "safe_branch=$safe_branch" >> "$GITHUB_OUTPUT"

      - name: Upload json report to GitHub Actions Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: json-report-nightly-e2e-${{ steps.sanitize.outputs.safe_branch }}-${{ inputs.tasklist_mode }}
          path: qa/c8-orchestration-cluster-e2e-test-suite/json-report/**
          retention-days: 60

      - name: Upload HTML report to GitHub Actions Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-report-nightly-e2e-${{ steps.sanitize.outputs.safe_branch }}-${{ inputs.tasklist_mode }}
          path: qa/c8-orchestration-cluster-e2e-test-suite/html-report/**
          retention-days: 60

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          job_name: "c8-orchestration-cluster-e2e-nightly-tests/${{ inputs.branch }}/${{ inputs.tasklist_mode }}"
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
