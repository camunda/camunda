# description: Verifies a load test deployment is healthy. Cleanup is delegated to
#              load-test-delete.yml and runs regardless of verify outcome.
# called-by: load-test-scheduled-release.yml
# type: CI
# owner: @camunda/reliability-testing
name: "Load Test: Verify and Cleanup"
run-name: "Load Test: Verify and Cleanup: ${{ inputs.namespace }}"

on:
  workflow_call:
    inputs:
      namespace:
        description: 'Kubernetes namespace where the load test is deployed'
        type: string
        required: true

env:
  TEST_OWNER: '@camunda/reliability-testing'
  CLUSTER: camunda-benchmark-prod
  TELEPORT_JOIN_TOKEN: infra-benchmark-prod-github-action-zeebe

jobs:
  verify:
    name: Verify
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: ./.github/workflows/load-test-verify.yml
    secrets: inherit
    with:
      namespace: ${{ inputs.namespace }}

  cleanup:
    name: Cleanup
    needs: verify
    if: always()
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/load-test-delete.yml
    secrets: inherit
    with:
      namespace: ${{ inputs.namespace }}
