# type: CI
# owner: @camunda/reliability-testing
#
# Single entry-point workflow for PR benchmarks across all supported secondary-storage
# backends. A dispatcher job inspects the triggering event and produces a matrix that
# contains *only* the relevant DB(s). Irrelevant DBs do not appear as matrix legs, so
# they cannot emit "skipped" checks that would mask an in-progress benchmark from a
# previous workflow run for the same PR.
#
# Two kinds of labels start different pipelines, each with its own matrix:
#   regression-load-test-<storage>-<protocol>: one cluster at the SLO rate, compared with the daily run
#                                              (camunda-pr-load-test.yaml)
#   maximum-load-test-<storage>-<protocol>:    3 base and 3 PR clusters above capacity, medians compared
#                                              (camunda-pr-maximum-load-test.yaml)
#
# Event -> matrix mapping:
#   labeled:     single-entry matrix for the added DB
#   unlabeled:   single-entry matrix for the removed DB (triggers cleanup)
#   synchronize: all currently-labeled DBs (restarts all benchmarks)
#   closed:      all currently-labeled DBs (cleanup for all)
#
# Job-level concurrency (keyed on matrix.db + matrix.protocol + PR, one group per label kind:
# pr-benchmark-* and pr-maximum-*) ensures:
#   - adding/removing a label for one DB never cancels a benchmark for another DB
#   - pushing a commit restarts each labeled DB's benchmark independently
#   - unlabeling a DB cancels its in-progress run; the reusable pipeline then runs cleanup
#
# No workflow-level concurrency: all event-triggered runs coexist independently. The reusable
# pipeline's job conditions ensure correct create vs. delete behavior per DB per event.
name: Camunda PR Benchmark
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - closed

defaults:
  run:
    shell: bash

env:
  TEST_OWNER: '@camunda/reliability-testing'

jobs:
  dispatch:
    name: Dispatch benchmark matrix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      any: ${{ steps.build.outputs.any }}
      maximum-matrix: ${{ steps.build.outputs.maximum-matrix }}
      maximum-any: ${{ steps.build.outputs.maximum-any }}
    steps:
      - id: build
        name: Build matrix from event
        env:
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # Regression load test label -> "<secondary-storage-type> <protocol>". gRPC labels exist only for the
          # storages with a daily gRPC run. Without a daily run of the same setup, the comparison is
          # not correct.
          declare -A label_to_setup=(
            [regression-load-test-elasticsearch-rest]="elasticsearch rest"
            [regression-load-test-elasticsearch-grpc]="elasticsearch grpc"
            [regression-load-test-opensearch-rest]="opensearch rest"
            [regression-load-test-postgresql-rest]="postgresql rest"
            [regression-load-test-mysql-rest]="mysql rest"
            [regression-load-test-mariadb-rest]="mariadb rest"
            [regression-load-test-mssql-rest]="mssql rest"
            [regression-load-test-oracle-rest]="oracle rest"
            [regression-load-test-none-rest]="none rest"
            [regression-load-test-none-grpc]="none grpc"
          )

          # Maximum load test label -> "<secondary-storage-type> <protocol> <offered PI/s>". The rate
          # must stay above the capacity of the setup, otherwise a faster build is hidden because the
          # offered rate is already sustained. Same setups as the regression labels, they have a daily
          # run. The Elasticsearch rates are placeholders until the capacity of that setup is measured.
          declare -A label_to_maximum=(
            [maximum-load-test-none-rest]="none rest 900"
            [maximum-load-test-none-grpc]="none grpc 900"
            [maximum-load-test-elasticsearch-rest]="elasticsearch rest 450"
            [maximum-load-test-elasticsearch-grpc]="elasticsearch grpc 450"
          )

          entries=()
          maximum_entries=()
          add_entry() {
            local label="$1"
            local setup="${label_to_setup[$label]:-}"
            local maximum="${label_to_maximum[$label]:-}"
            if [[ -n "$setup" ]]; then
              local db protocol
              read -r db protocol <<< "$setup"
              entries+=("{\"label\":\"${label}\",\"db\":\"${db}\",\"protocol\":\"${protocol}\"}")
            elif [[ -n "$maximum" ]]; then
              local db protocol rate
              read -r db protocol rate <<< "$maximum"
              maximum_entries+=("{\"label\":\"${label}\",\"db\":\"${db}\",\"protocol\":\"${protocol}\",\"rate\":\"${rate}\"}")
            else
              echo "::warning title=Unknown Load Test Label::Label '$label' is not a recognized load test trigger. Ignoring."
            fi
          }

          case "$ACTION" in
            labeled|unlabeled)
              # Single DB: the one whose label changed
              add_entry "$EVENT_LABEL"
              ;;
            synchronize|closed)
              # All currently-labeled DBs
              while IFS= read -r label; do
                [[ -n "$label" ]] && add_entry "$label"
              done < <(echo "$PR_LABELS" | jq -r '.[]?')
              ;;
            *)
              ;;
          esac

          if (( ${#entries[@]} == 0 )); then
            matrix='{"include":[]}'
            any=false
          else
            joined=$(IFS=,; echo "${entries[*]}")
            matrix="{\"include\":[${joined}]}"
            any=true
          fi

          if (( ${#maximum_entries[@]} == 0 )); then
            maximum_matrix='{"include":[]}'
            maximum_any=false
          else
            joined=$(IFS=,; echo "${maximum_entries[*]}")
            maximum_matrix="{\"include\":[${joined}]}"
            maximum_any=true
          fi

          {
            echo "matrix=$matrix"
            echo "any=$any"
            echo "maximum-matrix=$maximum_matrix"
            echo "maximum-any=$maximum_any"
          } >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $matrix"
          echo "Generated maximum matrix: $maximum_matrix"

  benchmark:
    name: Benchmark (${{ matrix.db }}, ${{ matrix.protocol }})
    needs: dispatch
    if: needs.dispatch.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dispatch.outputs.matrix) }}
    concurrency:
      group: pr-benchmark-${{ matrix.db }}-${{ matrix.protocol }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: read # list daily workflow runs and artifacts
      contents: read
      id-token: write # Teleport cluster auth
      pull-requests: write # post benchmark comments
    uses: ./.github/workflows/camunda-pr-load-test.yaml
    secrets: inherit
    with:
      label: ${{ matrix.label }}
      secondary-storage-type: ${{ matrix.db }}
      protocol: ${{ matrix.protocol }}
      ref: ${{ github.event.pull_request.head.ref }}

  maximum:
    name: Maximum (${{ matrix.db }}, ${{ matrix.protocol }})
    needs: dispatch
    if: needs.dispatch.outputs.maximum-any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dispatch.outputs.maximum-matrix) }}
    concurrency:
      group: pr-maximum-${{ matrix.db }}-${{ matrix.protocol }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # Teleport cluster auth
      pull-requests: write # post the comparison comment
    uses: ./.github/workflows/camunda-pr-maximum-load-test.yaml
    secrets: inherit
    with:
      label: ${{ matrix.label }}
      secondary-storage-type: ${{ matrix.db }}
      protocol: ${{ matrix.protocol }}
      rate: ${{ matrix.rate }}
