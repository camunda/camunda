# description: Build and deploy Docusaurus documentation site to GitHub Pages
# type: ci
# owner: @camunda/engineering-operations
---
name: Docs Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Commplete builds for every commit needed for confidenence
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}


defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

env:
  TEST_OWNER: '@camunda/engineering-operations'
  # renovate: datasource=node-version depName=node
  NODE_VERSION: '26.13.0'
  DOCS_DIR: monorepo-docs-site

jobs:
  # Detect changes to avoid unnecessary builds
  detect-changes:
    outputs:
      docs-changes: ${{ steps.filter.outputs.docs-changes }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Detect changes against the base branch
      - name: Detect changes
        uses: ./.github/actions/paths-filter
        id: filter

  build-and-deploy:
    if: needs.detect-changes.outputs.docs-changes == 'true' || github.event_name == 'workflow_dispatch'
    name: Build and Deploy Documentation
    needs: detect-changes
    runs-on: ubuntu-latest
    # Covers build/deploy plus up to two Pages runs (TIMEOUT_SECONDS each) in "Verify Pages build"
    timeout-minutes: 30
    # Serializes every writer to the gh-pages branch. The group name must stay identical
    # in docs-preview.yml and docs-preview-cleanup.yml, or the mutual exclusion breaks.
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      # write is needed to request a Pages rebuild in "Verify Pages build"
      pages: write
      # read is needed to watch GitHub's pages-build-deployment run in "Verify Pages build"
      actions: read
    environment:
      name: github-pages
      url: https://camunda.github.io/camunda/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.DOCS_DIR }}/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          directory: ${{ env.DOCS_DIR }}

      - name: Build documentation
        working-directory: ${{ env.DOCS_DIR }}
        run: npm run build

      # The deploy below replaces the whole gh-pages branch, so files from earlier builds
      # (moved pages, timestamped search indexes, old bundles) don't pile up and slow every
      # Pages build (INC-9073). PR previews share the branch, so the live ones are carried
      # into the build output first. The gh-pages-write lock held by this job guarantees no
      # preview is written between this checkout and the deploy push.
      - name: Checkout live PR previews from gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages-previews
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: /pr-preview/
          sparse-checkout-cone-mode: false

      - name: Carry PR previews into the deploy
        run: |
          set -euo pipefail
          # The committed tree is the source of truth; a sparse-checkout mismatch must fail
          # here rather than silently drop previews in the deploy.
          expected=$(git -C gh-pages-previews ls-tree -d --name-only HEAD pr-preview/ | sed 's#^pr-preview/##' | sort)
          if [[ -z "${expected}" ]]; then
            echo "No PR previews on gh-pages"
            exit 0
          fi
          cp -a gh-pages-previews/pr-preview "${DOCS_DIR}/build/"
          carried=$(find "${DOCS_DIR}/build/pr-preview" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [[ "${carried}" != "${expected}" ]]; then
            echo "::error::PR previews carried into the deploy don't match gh-pages; refusing to deploy."
            diff <(echo "${expected}") <(echo "${carried}") || true
            exit 1
          fi
          echo "Carried $(wc -l <<< "${carried}") PR previews into the deploy"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./monorepo-docs-site/build
          keep_files: false
          enable_jekyll: false

      # The deploy step above only confirms the push to gh-pages. GitHub then publishes the branch
      # with its own `pages-build-deployment` Actions run (legacy Pages mode), outside this workflow.
      # The Pages builds API (pages/builds) mirrors that run unreliably: it kept reporting `building`
      # for runs that had already failed and `errored` for runs that succeeded (INC-9073). So this
      # step watches GitHub's run itself and fails the job when the site wasn't published.
      # A failed or cancelled run is retried once with a fresh Pages build request. Nothing is
      # publishing at that point, so the request starts a new run instead of queueing behind one.
      - name: Verify Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub's run builds for ~1-2 min, and its deploy step gives up after 10 min.
          TIMEOUT_SECONDS: 780
          MAX_ATTEMPTS: 2
        run: |
          set -euo pipefail
          expected_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/gh-pages" --jq '.commit.sha')
          echo "Expecting a pages-build-deployment run for gh-pages HEAD: ${expected_sha}"

          # Polls the newest pages-build-deployment run of expected_sha not listed in seen_ids until it
          # completes or TIMEOUT_SECONDS pass; sets run_id, run_url and run_conclusion (timeout if not done).
          seen_ids=""
          wait_for_run() {
            local deadline=$(( $(date +%s) + TIMEOUT_SECONDS )) runs run status
            run_id="" run_url="" run_conclusion=""
            while :; do
              # A failed API call is retried on the next poll rather than failing the job.
              if ! runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${expected_sha}&per_page=50"); then
                echo "Listing Actions runs failed; retrying..."
              else
                run=$(jq -r --argjson seen "[${seen_ids}]" '
                    [.workflow_runs[]
                     | select(.path == "dynamic/pages/pages-build-deployment")
                     | select(.id as $id | $seen | index($id) | not)]
                    | max_by(.created_at) // empty
                    | [.id, .status, (.conclusion // "none"), .html_url] | @tsv' <<< "${runs}")
                if [[ -n "${run}" ]]; then
                  IFS=$'\t' read -r run_id status run_conclusion run_url <<< "${run}"
                  echo "Pages run ${run_id}: status=${status} conclusion=${run_conclusion}"
                  [[ "${status}" == completed ]] && return 0
                else
                  echo "Waiting for GitHub to start a pages-build-deployment run for ${expected_sha:0:12}..."
                fi
              fi
              if (( $(date +%s) >= deadline )); then
                run_conclusion=timeout
                return 0
              fi
              sleep 10
            done
          }

          for (( attempt = 1; attempt <= MAX_ATTEMPTS; attempt++ )); do
            wait_for_run
            case "${run_conclusion}" in
              success)
                echo "::notice::Pages deployed ${expected_sha} (attempt ${attempt}/${MAX_ATTEMPTS}): ${run_url}"
                exit 0 ;;
              timeout)
                if [[ -z "${run_id}" ]]; then
                  echo "::error::GitHub didn't start a pages-build-deployment run for ${expected_sha} within ${TIMEOUT_SECONDS}s (attempt ${attempt}/${MAX_ATTEMPTS})."
                else
                  echo "::error::Pages run ${run_url} didn't finish within ${TIMEOUT_SECONDS}s (attempt ${attempt}/${MAX_ATTEMPTS}); a rebuild request would only queue behind it."
                fi
                exit 1 ;;
            esac
            echo "::warning::Pages run for ${expected_sha} ended with ${run_conclusion} (attempt ${attempt}/${MAX_ATTEMPTS}): ${run_url}"
            # GitHub's own error lines, e.g. "Deployment failed, try again later." or "Timeout reached, aborting!"
            for job_id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq '.jobs[] | select(.conclusion == "failure") | .id' || true); do
              gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" | grep -F '##[error]' | sed 's/^[^ ]* /  /' | sort -u | head -5 || true
            done
            if (( attempt < MAX_ATTEMPTS )); then
              # Ignore every run that exists now, so attempt 2 only accepts the run this request starts.
              seen_ids+="${seen_ids:+,}${run_id}"
              if runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${expected_sha}&per_page=50"); then
                seen_ids+=$(jq -r '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | ",\(.id)"] | join("")' <<< "${runs}")
              fi
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
              echo "Requested a Pages rebuild of ${expected_sha:0:12}"
            fi
          done
          echo "::error::Pages deploy FAILED for ${expected_sha} after ${MAX_ATTEMPTS} attempts; last run: ${run_url}"
          exit 1

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
