# description: Build and deploy Docusaurus documentation site to GitHub Pages
# type: ci
# owner: @camunda/engineering-operations
---
name: Docs Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Commplete builds for every commit needed for confidenence
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}


defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

env:
  TEST_OWNER: '@camunda/engineering-operations'
  # renovate: datasource=node-version depName=node
  NODE_VERSION: '26.13.0'
  DOCS_DIR: monorepo-docs-site

jobs:
  # Detect changes to avoid unnecessary builds
  detect-changes:
    outputs:
      docs-changes: ${{ steps.filter.outputs.docs-changes }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Detect changes against the base branch
      - name: Detect changes
        uses: ./.github/actions/paths-filter
        id: filter

  build-and-deploy:
    if: needs.detect-changes.outputs.docs-changes == 'true' || github.event_name == 'workflow_dispatch'
    name: Build and Deploy Documentation
    needs: detect-changes
    runs-on: ubuntu-latest
    # Covers build/deploy plus up to two Pages build waits in "Verify Pages build"
    timeout-minutes: 25
    # Serializes every writer to the gh-pages branch. The group name must stay identical
    # in docs-preview.yml and docs-preview-cleanup.yml, or the mutual exclusion breaks.
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      # write is needed to request a Pages rebuild in "Verify Pages build"
      pages: write
    environment:
      name: github-pages
      url: https://camunda.github.io/camunda/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.DOCS_DIR }}/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          directory: ${{ env.DOCS_DIR }}

      - name: Build documentation
        working-directory: ${{ env.DOCS_DIR }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./monorepo-docs-site/build
          keep_files: true
          enable_jekyll: false

      # The deploy step above only confirms the push to gh-pages — the server-side Pages
      # build runs separately and its outcome is not surfaced anywhere in the Actions UI
      # (legacy Pages mode). Poll the Pages build API so a failed build becomes a visible
      # job failure rather than a green workflow with a dead docs site.
      # Pages builds occasionally fail transiently with a generic "Page build failed." and
      # succeed when rebuilt unchanged (INC-9039), so an errored build is retried once.
      - name: Verify Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          # Pages builds of this site have been observed taking ~8 minutes
          TIMEOUT_SECONDS: 600
          MAX_ATTEMPTS: 2
        run: |
          set -euo pipefail
          expected_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/gh-pages" --jq '.commit.sha')
          echo "Expecting Pages build for gh-pages HEAD: ${expected_sha}"

          # Polls until a build of expected_sha other than $1 (an already-errored build URL)
          # finishes or times out; sets build_status, build_url and build_error.
          wait_for_build() {
            local ignore_url=$1 response commit
            local deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
            while :; do
              response=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")
              build_status=$(jq -r '.status' <<< "${response}")
              build_url=$(jq -r '.url' <<< "${response}")
              build_error=$(jq -r '.error.message // ""' <<< "${response}")
              commit=$(jq -r '.commit' <<< "${response}")
              if [[ "${commit}" != "${expected_sha}" || "${build_url}" == "${ignore_url}" ]]; then
                echo "Latest build ${build_url##*/} is for ${commit:0:12} (status=${build_status}); waiting for a new build of ${expected_sha:0:12}..."
              else
                echo "Pages build ${build_url##*/} for ${commit:0:12}: status=${build_status}"
                case "${build_status}" in
                  built|errored)
                    return 0 ;;
                  building|queued|"")
                    : ;;
                  *)
                    echo "::error::Unknown Pages build status: ${build_status} — treating as failure"
                    exit 1 ;;
                esac
              fi
              if (( $(date +%s) >= deadline )); then
                build_status=timeout
                return 0
              fi
              sleep 10
            done
          }

          ignore_url=""
          for (( attempt = 1; attempt <= MAX_ATTEMPTS; attempt++ )); do
            wait_for_build "${ignore_url}"
            case "${build_status}" in
              built)
                echo "::notice::Pages build succeeded for ${expected_sha} (attempt ${attempt}/${MAX_ATTEMPTS})"
                exit 0 ;;
              timeout)
                echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for Pages build to complete (attempt ${attempt}/${MAX_ATTEMPTS})."
                exit 1 ;;
            esac
            echo "::warning::Pages build failed for ${expected_sha} (attempt ${attempt}/${MAX_ATTEMPTS}): ${build_error}"
            if (( attempt < MAX_ATTEMPTS )); then
              ignore_url=${build_url}
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
              echo "Requested a Pages rebuild of ${expected_sha:0:12}"
            fi
          done
          echo "::error::Pages build FAILED for ${expected_sha} after ${MAX_ATTEMPTS} attempts: ${build_error}"
          echo "::error::The API only exposes the generic message above; check Settings → Pages in the repo UI for any additional detail."
          exit 1

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
