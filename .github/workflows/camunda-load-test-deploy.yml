# description: Reusable workflow that deploys a load test (newLoadTest.sh + `make install`) to the
#              GKE benchmark cluster. Takes the image tags to deploy as inputs and does not build
#              anything.
# called-by: camunda-load-test.yml
# type: CI
# owner: @camunda/reliability-testing
#
# Infos from Infra:
# - Using the infra benchmark prod cluster requires to use Teleport to authenticate.
# - Camunda images are pushed to registry.camunda.cloud/team-zeebe and pulled from there.
#   To use them in a namespace, the namespace must be labeled with "registry=harbor"
#   You must also set the image pull secret to "harbor-registry" in the helm values.

name: Camunda load test deploy

on:
  workflow_call:
    inputs:
      name:
        description: 'Name of the load test (used as the Kubernetes namespace, prefixed with c8- when missing)'
        type: string
        required: true
      ref:
        description: 'Git ref (branch, tag or commit SHA) to check out the setup folder from'
        type: string
        default: 'main'
        required: false
      ttl:
        description: 'Days before the namespace is auto-deleted'
        type: number
        default: 1
        required: false
      scenario:
        description: 'Workload scenario to run'
        type: string
        default: ""
        required: false
      load-test-load:
        description: 'Helm args for the load test workload components (e.g. --set starter.rate=100)'
        type: string
        default: ""
        required: false
      platform-helm-values:
        description: 'Additional Helm values for the Camunda platform chart'
        type: string
        default: ""
        required: false
      load-test-setup-helm-values:
        description: 'Additional Helm values for the load-test-setup chart'
        type: string
        default: ""
        required: false
      perform-read-benchmarks:
        description: 'Run continuous read benchmarks on secondary storage'
        type: boolean
        default: true
        required: false
      stable-vms:
        description: 'Deploy to non-spot VMs'
        type: boolean
        default: false
        required: false
      enable-optimize:
        description: 'Enable Optimize for load testing'
        type: boolean
        default: true
        required: false
      enable-chaos:
        description: 'Enable chaos-killer to randomly kill pods'
        type: boolean
        default: false
        required: false
      physical-tenant-count:
        description: 'Number of extra physical tenants (pt1..ptN) to deploy'
        type: number
        default: 0
        required: false
      enable-optimize-report-metrics:
        description: 'Enable the load-tester Optimize report-evaluation meter'
        type: boolean
        default: false
        required: false
      secondary-storage-type:
        description: 'Secondary database backend of Camunda Platform'
        type: string
        default: elasticsearch
        required: false
      target-version:
        description: 'Setup version subfolder to use (load-tests/setup/<target-version>/)'
        type: string
        default: "main"
        required: false
      load-test-image-tag:
        description: 'Image tag of the load test client (starter and worker) and, when built, of the metrics exporter'
        type: string
        required: true
      load-test-image-repository:
        description: 'Repository of the load test client images (starter and worker)'
        type: string
        required: true
      orchestration-registry:
        description: 'Orchestration image registry. Empty keeps the value of the setup folder.'
        type: string
        default: ""
        required: false
      orchestration-repository:
        description: 'Orchestration image repository. Empty keeps the value of the setup folder.'
        type: string
        default: ""
        required: false
      orchestration-tag:
        description: 'Orchestration image tag. Empty keeps the value of the setup folder.'
        type: string
        default: ""
        required: false
      optimize-registry:
        description: 'Optimize image registry. Empty keeps the value of the setup folder.'
        type: string
        default: ""
        required: false
      optimize-repository:
        description: 'Optimize image repository. Empty keeps the value of the setup folder.'
        type: string
        default: ""
        required: false
      optimize-tag:
        description: 'Optimize image tag. Empty keeps the value of the setup folder.'
        type: string
        default: ""
        required: false
      identity-tag:
        description: 'Identity image tag. Empty keeps the value of the setup folder.'
        type: string
        default: ""
        required: false
      connectors-tag:
        description: 'Connectors image tag. Empty keeps the value of the setup folder.'
        type: string
        default: ""
        required: false
      metrics-exporter-built:
        description: 'Whether the metrics exporter image was built with load-test-image-tag. When false, the latest tag is used.'
        type: boolean
        default: false
        required: false

env:
  # Namespaces MUST start with c8 due to access policy
  NAMESPACE: ${{ startsWith(inputs.name, 'c8-') && inputs.name || format('c8-{0}', inputs.name) }}

  CLUSTER: camunda-benchmark-prod  # change this to "camunda-benchmark-dev" when experimenting
  TELEPORT_JOIN_TOKEN: infra-benchmark-prod-github-action-zeebe  # change this to "infra-benchmark-dev-github-action-zeebe" when experimenting

defaults:
  run:
    shell: bash

jobs:
  deploy-cluster-under-test:
    name: Deploy cluster under test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # Teleport cluster auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Helm
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          minimum_release_age: 15d
          install_args: helm
          cache_save: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/stable/') }}

      # Authenticate with Teleport
      - name: Set up Teleport
        uses: teleport-actions/setup@10b5e9f760190f027a1e04e342178d8d6e7eae30 # v2.0.0
        with:
            proxy: camunda.teleport.sh:443
            version: auto

      - name: Authenticate to Cluster using Teleport
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
            proxy: camunda.teleport.sh:443
            token: ${{ env.TELEPORT_JOIN_TOKEN }}
            kubernetes-cluster: ${{ env.CLUSTER }}

      - name: Print tool versions
        run: .github/scripts/load-test-print-tool-versions.sh

      - name: Scaffold load-test folder
        env:
          ENABLE_OPTIMIZE: ${{ inputs.enable-optimize }}
          SECONDARY_STORAGE_TYPE: ${{ inputs.secondary-storage-type }}
          TARGET_VERSION: ${{ inputs.target-version }}
          TTL: ${{ inputs.ttl }}
        run: |
          cd load-tests/setup
          # The namespace label created-by will not be able resolve the actual user which triggered
          # the GitHub action by default. We need to correctly configure the git user here to make it work
          git config user.name "${GITHUB_ACTOR}"
          # Render the load-test folder. newLoadTest.sh no longer creates the namespace — that
          # happens on `make install` via `kubectl apply -f resources/namespace.yaml`.
          ./newLoadTest.sh --target-version "${TARGET_VERSION}" "${NAMESPACE}" "${SECONDARY_STORAGE_TYPE}" "${TTL}" "${ENABLE_OPTIMIZE}"

      - name: Install latest Camunda Platform
        shell: bash --noprofile --norc -exo pipefail {0}
        env:
          CONNECTORS_TAG: ${{ inputs.connectors-tag }}
          ENABLE_CHAOS: ${{ inputs.enable-chaos }}
          ENABLE_OPTIMIZE: ${{ inputs.enable-optimize }}
          ENABLE_OPTIMIZE_METRICS: ${{ inputs.enable-optimize-report-metrics }}
          IDENTITY_TAG: ${{ inputs.identity-tag }}
          INSTALL_TARGET: ${{ inputs.stable-vms && 'install-stable' || 'install' }}
          LOAD_TEST_IMAGE_REPOSITORY: ${{ inputs.load-test-image-repository }}
          LOAD_TEST_IMAGE_TAG: ${{ inputs.load-test-image-tag }}
          LOAD_TEST_LOAD: ${{ inputs.load-test-load }}
          LOAD_TEST_SETUP_HELM_VALUES: ${{ inputs.load-test-setup-helm-values }}
          METRICS_EXPORTER_BUILT: ${{ inputs.metrics-exporter-built }}
          OPTIMIZE_REGISTRY: ${{ inputs.optimize-registry }}
          OPTIMIZE_REPOSITORY: ${{ inputs.optimize-repository }}
          OPTIMIZE_TAG: ${{ inputs.optimize-tag }}
          ORCHESTRATION_REGISTRY: ${{ inputs.orchestration-registry }}
          ORCHESTRATION_REPOSITORY: ${{ inputs.orchestration-repository }}
          ORCHESTRATION_TAG: ${{ inputs.orchestration-tag }}
          PERFORM_READ_BENCHMARKS: ${{ inputs.perform-read-benchmarks }}
          PHYSICAL_TENANT_COUNT: ${{ inputs.physical-tenant-count }}
          PLATFORM_HELM_VALUES: ${{ inputs.platform-helm-values }}
          SCENARIO: ${{ inputs.scenario }}
        run: |-
          .github/scripts/load-test-install-camunda-platform.sh \
            "${NAMESPACE}" \
            "${INSTALL_TARGET}" \
            "${LOAD_TEST_IMAGE_TAG}" \
            "${LOAD_TEST_IMAGE_REPOSITORY}" \
            "${PERFORM_READ_BENCHMARKS}" \
            "${ENABLE_OPTIMIZE}" \
            "${ENABLE_OPTIMIZE_METRICS}" \
            "${METRICS_EXPORTER_BUILT}" \
            "${ENABLE_CHAOS}" \
            "${PHYSICAL_TENANT_COUNT}" \
            --orchestration-registry "${ORCHESTRATION_REGISTRY}" \
            --orchestration-repository "${ORCHESTRATION_REPOSITORY}" \
            --orchestration-tag "${ORCHESTRATION_TAG}" \
            --optimize-registry "${OPTIMIZE_REGISTRY}" \
            --optimize-repository "${OPTIMIZE_REPOSITORY}" \
            --optimize-tag "${OPTIMIZE_TAG}" \
            --identity-tag "${IDENTITY_TAG}" \
            --connectors-tag "${CONNECTORS_TAG}" \
            --load-test-load "${LOAD_TEST_LOAD}" \
            --platform-helm-values "${PLATFORM_HELM_VALUES}" \
            --load-test-setup-helm-values "${LOAD_TEST_SETUP_HELM_VALUES}" \
            --scenario "${SCENARIO}"

      - name: Annotate namespace with workflow run URL
        run: |
          # Traceability annotation, applied after `make install` has created the namespace.
          kubectl annotate namespace "${NAMESPACE}" \
            "github.com/workflow-run-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --overwrite

      - name: Summarize load test deployment
        if: success()
        run: .github/scripts/load-test-summary.sh "${NAMESPACE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
