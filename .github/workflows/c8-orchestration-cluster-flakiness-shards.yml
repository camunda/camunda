# description: Reusable workflow — one validation pass of the OC flakiness fix agent.
#              Runs ONE test N times per shard, each shard on its own docker-compose
#              stack started the way the matching nightly starts it, for every cell
#              (e2e-v1 / e2e-v2 / e2e / api-profiles / api-all-in-one) the test was
#              flaky in. Called only by c8-orchestration-cluster-flakiness-fix.yml.
# test location: /qa/c8-orchestration-cluster-e2e-test-suite
# type: CI
# owner: @camunda/test-automation-team
---
name: C8 Orchestration Cluster - Flakiness Shards

on:
  workflow_call:
    inputs:
      version:
        description: "8.7, 8.8, 8.9, 8.10 or main — picks the SNAPSHOT image"
        required: true
        type: string
      test_ref:
        description: "Ref whose test code runs: the target branch, or the flaky-fix branch"
        required: true
        type: string
      cells:
        description: 'JSON array of cells, e.g. ["e2e-v1","e2e-v2"]'
        required: true
        type: string
      shards:
        description: 'JSON array of shard ids, e.g. [1,2,3,4,5]'
        required: true
        type: string
      repeat_each:
        required: true
        type: number
      workers:
        required: true
        type: number
      spec:
        description: "Spec file, relative to the suite root"
        required: true
        type: string
      title_path:
        description: "JSON array: describe titles followed by the test title"
        required: true
        type: string
      project:
        description: "Playwright project the nightly ran the test under"
        required: true
        type: string
      label:
        description: "baseline, iter1 or iter2 — prefixes the artifact names"
        required: true
        type: string
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_ROLE_ID:
        required: true
      VAULT_SECRET_ID:
        required: true
    outputs:
      verdict:
        description: "green, scored or blocked — see .github/scripts/oc-flakiness/score.mjs"
        value: ${{ jobs.score.outputs.verdict }}
      rate:
        description: "pooled pass rate in percent"
        value: ${{ jobs.score.outputs.rate }}

permissions:
  contents: read

env:
  TEST_OWNER: '@camunda/test-automation-team'

jobs:
  shard:
    name: ${{ inputs.label }} / ${{ matrix.cell }} / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(inputs.cells) }}
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      VERSION: ${{ inputs.version }}
      CELL: ${{ matrix.cell }}
      SUITE: qa/c8-orchestration-cluster-e2e-test-suite
    steps:
      - name: Checkout test code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_ref }}
          persist-credentials: false

      - name: Write shard metadata
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/shard"
          jq -n --arg cell "$CELL" --argjson shard "$SHARD" \
            '{cell: $cell, shard: $shard, stack_ok: false}' > "$RUNNER_TEMP/shard/meta.json"

      # The cell table: everything that differs between the nightly cells. Kept
      # in one step so a change to a nightly's setup has one place to land here.
      - name: Resolve the cell's stack and test environment
        run: |
          set -euo pipefail
          case "$VERSION" in
            main) tag=SNAPSHOT ;;
            8.7|8.8|8.9|8.10) tag="${VERSION}-SNAPSHOT" ;;
            *) echo "::error::unsupported version: $VERSION"; exit 1 ;;
          esac
          {
            echo "CAMUNDA_DOCKER_IMAGE=camunda/camunda:${tag}"
            echo "OPTIMIZE_DOCKER_IMAGE=camunda/optimize:${tag}"
          } >> "$GITHUB_ENV"

          if [[ "$VERSION" == "8.7" ]]; then
            services="operate tasklist"
            {
              echo "CORE_APPLICATION_TASKLIST_URL=http://localhost:8080"
              echo "CORE_APPLICATION_OPERATE_URL=http://localhost:8081"
              echo "ZEEBE_REST_ADDRESS=http://localhost:8089"
            } >> "$GITHUB_ENV"
          else
            services="camunda"
            {
              echo "CORE_APPLICATION_URL=http://localhost:8080"
              echo "ZEEBE_REST_ADDRESS=http://localhost:8080"
            } >> "$GITHUB_ENV"
          fi

          start_optimize=false
          case "$CELL" in
            e2e|e2e-v1|e2e-v2)
              start_optimize=true
              echo "OPTIMIZE_BASE_URL=http://localhost:8083" >> "$GITHUB_ENV"
              if [[ "$CELL" == "e2e-v1" && ( "$VERSION" == "8.8" || "$VERSION" == "8.9" ) ]]; then
                echo "CAMUNDA_TASKLIST_V2_MODE_ENABLED=false" >> "$GITHUB_ENV"
              elif [[ "$CELL" == "e2e-v2" ]]; then
                echo "CAMUNDA_TASKLIST_V2_MODE_ENABLED=true" >> "$GITHUB_ENV"
              fi
              ;;
            api-profiles|api-all-in-one)
              {
                echo "API_TESTS_ONLY=true"
                echo "DATABASE=Elasticsearch"
                echo "CAMUNDA_PROCESSINSTANCECREATION_BUSINESSIDUNIQUENESSENABLED=true"
              } >> "$GITHUB_ENV"
              if [[ "$CELL" == "api-all-in-one" && "$VERSION" != "8.7" ]]; then
                echo "CAMUNDA_MODE=all-in-one" >> "$GITHUB_ENV"
              fi
              ;;
            *) echo "::error::unsupported cell: $CELL"; exit 1 ;;
          esac
          {
            echo "STACK_SERVICES=${services}"
            echo "START_OPTIMIZE=${start_optimize}"
          } >> "$GITHUB_ENV"

      - name: Import Docker Hub secrets
        id: dockerhub-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda/ci/github-actions REGISTRY_HUB_DOCKER_COM_USR | dockerhub-username;
            secret/data/products/camunda/ci/github-actions REGISTRY_HUB_DOCKER_COM_PSW_READ_ONLY | dockerhub-token;

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ steps.dockerhub-secrets.outputs.dockerhub-username }}
          password: ${{ steps.dockerhub-secrets.outputs.dockerhub-token }}

      - name: Start the stack
        working-directory: ${{ env.SUITE }}/config
        run: |
          set -euo pipefail
          read -ra services <<< "$STACK_SERVICES"
          delay=15
          for attempt in 1 2 3 4 5; do
            if DATABASE=elasticsearch docker compose pull --include-deps "${services[@]}"; then
              break
            fi
            [[ "$attempt" -eq 5 ]] && { echo "::error::image pull failed 5 times"; exit 1; }
            sleep "$delay"; delay=$(( delay * 2 ))
          done
          DATABASE=elasticsearch docker compose up -d "${services[@]}"

          if [[ "$START_OPTIMIZE" == "true" ]] \
              && DATABASE=elasticsearch docker compose config --services | grep -qx optimize; then
            for attempt in 1 2 3; do
              DATABASE=elasticsearch docker compose up -d optimize && break
              [[ "$attempt" -eq 3 ]] && { echo "::error::Optimize did not start"; exit 1; }
              sleep 15
            done
          fi

      - name: Wait for the stack
        working-directory: ${{ env.SUITE }}/config
        run: |
          set -uo pipefail
          if [[ "$VERSION" == "8.7" ]]; then
            urls=(http://localhost:8080 http://localhost:8081)
          else
            urls=(http://localhost:8080/tasklist http://localhost:8080/operate http://localhost:8080/identity)
          fi
          for i in $(seq 1 90); do
            ok=true
            for url in "${urls[@]}"; do
              curl -s -m 5 -o /dev/null "$url" || ok=false
            done
            if [[ "$ok" == "true" ]]; then
              echo "Stack is ready after ${i} checks."
              break
            fi
            if [[ "$i" -eq 90 ]]; then
              echo "::error::stack not ready after 15 minutes"
              DATABASE=elasticsearch docker compose logs --tail 200 || true
              exit 1
            fi
            sleep 10
          done

          if docker ps --format '{{.Names}}' | grep -qx optimize; then
            for i in $(seq 1 60); do
              status="$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8083/ || true)"
              [[ "$status" == "302" ]] && exit 0
              sleep 10
            done
            echo "::error::Optimize not ready after 10 minutes"
            docker logs optimize --tail 100 || true
            exit 1
          fi

      - name: Mark the stack as up
        run: |
          jq '.stack_ok = true' "$RUNNER_TEMP/shard/meta.json" > "$RUNNER_TEMP/meta.tmp"
          mv "$RUNNER_TEMP/meta.tmp" "$RUNNER_TEMP/shard/meta.json"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ env.SUITE }}/package-lock.json

      - name: Install dependencies and Chromium
        working-directory: ${{ env.SUITE }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Selection, on THIS ref because a fix can move the test:
      # - by file:line, not --grep alone: --grep is case-insensitive and the
      #   suite has sibling titles that differ only in case;
      # - a test in a serial block runs with its whole outermost describe (or
      #   the whole file when the file itself is serial), because its earlier
      #   tests create the data it uses; the score counts the target only;
      # - when one line declares several tests (a test() in a loop), an
      #   anchored --grep on the title narrows it to the target.
      # --no-deps keeps the project's teardown project from running its own
      # specs in full.
      - name: Run the test ${{ inputs.repeat_each }} times
        working-directory: ${{ env.SUITE }}
        env:
          LOCAL_TEST: "false"
          CAMUNDA_AUTH_STRATEGY: "BASIC"
          CAMUNDA_BASIC_AUTH_USERNAME: "demo"
          CAMUNDA_BASIC_AUTH_PASSWORD: "demo"
          INCLUDE_SLACK_REPORTER: "false"
          C8E2E_GLOBAL_TIMEOUT_MIN: "50"
          SPEC: ${{ inputs.spec }}
          TITLE_PATH: ${{ inputs.title_path }}
          PROJECT: ${{ inputs.project }}
          REPEAT_EACH: ${{ inputs.repeat_each }}
          WORKERS: ${{ inputs.workers }}
          TEST_REF: ${{ inputs.test_ref }}
        run: |
          set -euo pipefail
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/list.json" npx playwright test --list --reporter=json \
            --no-deps --project="$PROJECT" "$SPEC" > /dev/null 2>&1 || true
          target=$(jq -c --argjson path "$TITLE_PATH" '
            def walk($p; $lines): (.specs[]? | {path: ($p + [.title]), line, file, suites: $lines}),
                                  (.suites[]? as $s | $s | walk($p + [$s.title]; $lines + [$s.line]));
            [.suites[] | walk([]; [])] as $all
            | ($all | map(select(.path == $path)) | first) as $t
            | if $t == null then empty
              else $t + {siblings: ($all | map(select(.file == $t.file and .line == $t.line)) | length)}
              end
          ' "$RUNNER_TEMP/list.json")
          if [[ -z "$target" ]]; then
            echo "::error::test $(jq -r 'join(" › ")' <<< "$TITLE_PATH") not found in $SPEC on $TEST_REF"
            exit 1
          fi

          file_path=$(find . -path ./node_modules -prune -o -type f -path "*${SPEC}" -print | head -1)
          location="${SPEC}:$(jq -r .line <<< "$target")"
          grep_args=()
          if [[ -n "$file_path" ]] && grep -qE '^test\.describe\.configure\(\{ *mode: *.serial' "$file_path"; then
            echo "The whole file is serial: running all of it."
            location="$SPEC"
          elif [[ -n "$file_path" ]] && grep -qE "describe\.serial|mode: *'serial'" "$file_path" \
              && [[ $(jq '.suites | length' <<< "$target") -gt 0 ]]; then
            echo "Serial describe: running the outermost describe so its earlier tests set up the data."
            location="${SPEC}:$(jq -r '.suites[0]' <<< "$target")"
          elif [[ $(jq .siblings <<< "$target") -gt 1 ]]; then
            title=$(jq -r '.path[-1]' <<< "$target")
            escaped=$(printf '%s' "$title" | sed -E 's/[][\.^$*+?(){}|/]/\\&/g')
            echo "Several tests share this line: narrowing with --grep."
            grep_args=(--grep "${escaped}\$")
          fi

          echo "Running ${location} ${REPEAT_EACH} times on ${WORKERS} worker(s) (project ${PROJECT})"
          rc=0
          npx playwright test "$location" "${grep_args[@]}" \
            --no-deps --project="$PROJECT" --forbid-only \
            --repeat-each="$REPEAT_EACH" --retries=0 --workers="$WORKERS" || rc=$?
          echo "Playwright exited ${rc}; the score reads the report, not the exit code."

      - name: Collect the shard's report
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shard/json-report" "$RUNNER_TEMP/shard/test-results"
          cp -r "$SUITE/json-report/." "$RUNNER_TEMP/shard/json-report/" 2>/dev/null || true
          cp -r "$SUITE/test-results/." "$RUNNER_TEMP/shard/test-results/" 2>/dev/null || true

      - name: Upload the shard's report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: flaky-${{ inputs.label }}-${{ matrix.cell }}-s${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/**
          retention-days: "7"

  score:
    name: ${{ inputs.label }} / score
    needs: [shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.score.outputs.verdict }}
      rate: ${{ steps.score.outputs.rate }}
    steps:
      - name: Checkout main for the scoring script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts/oc-flakiness

      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flaky-${{ inputs.label }}-*
          path: ${{ runner.temp }}/shards

      - name: Score the pass
        id: score
        env:
          SPEC: ${{ inputs.spec }}
          TITLE_PATH: ${{ inputs.title_path }}
          CELLS: ${{ inputs.cells }}
          SHARDS: ${{ inputs.shards }}
          REPEAT_EACH: ${{ inputs.repeat_each }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          planned=$(( $(jq 'length' <<< "$SHARDS") * REPEAT_EACH ))
          mkdir -p "$RUNNER_TEMP/score"
          node .github/scripts/oc-flakiness/score.mjs \
            --dir "$RUNNER_TEMP/shards" --file "$SPEC" --title-path "$TITLE_PATH" \
            --cells "$CELLS" --planned "$planned" > "$RUNNER_TEMP/score/score.json"
          jq . "$RUNNER_TEMP/score/score.json"
          {
            echo "verdict=$(jq -r .verdict "$RUNNER_TEMP/score/score.json")"
            echo "rate=$(jq -r .pooled.rate "$RUNNER_TEMP/score/score.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ${LABEL}: $(jq -r '"\(.verdict), \(.pooled.rate)% (\(.pooled.passed) passed, \(.pooled.failed) failed)"' "$RUNNER_TEMP/score/score.json")"
            echo
            echo "| cell | passed | failed | not run | rate | stacks up |"
            echo "|---|---|---|---|---|---|"
            jq -r '.cells | to_entries[] | "| \(.key) | \(.value.passed) | \(.value.failed) | \(.value.notRun) | \(.value.rate)% | \(.value.shardsOk)/\(.value.shards) |"' "$RUNNER_TEMP/score/score.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the score
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-score-${{ inputs.label }}
          path: ${{ runner.temp }}/score/score.json
          retention-days: 14
