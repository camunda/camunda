# type: CI Helper
# owner: @camunda/engineering-operations
---
name: Statistics Daily

on:
  schedule:
    - cron: '0 6 * * 2-5'  # Tuesdays to Fridays, to keep it actionable
  pull_request:
    paths:
      - '.github/workflows/statistics-daily.yml'
      - '.ci/scripts/ci/setup-medic-lookup.sh'
      - '.github/scripts/test-stats-summary/**'
  workflow_dispatch:
    inputs:
      slack_channel_id:
        description: 'Slack channel ID to post to, e.g. a private test channel. Empty posts to #top-monorepo-ci.'
        required: false
        type: string

env:
  TEST_OWNER: '@camunda/engineering-operations'
  GHA_BEST_PRACTICES_LINTER: enabled

jobs:
  flaky-tests:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}  # GITHUB_TOKEN unused in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup codeowners-cli
        uses: ./.github/actions/codeowners-setup-cli

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/camunda/ci/github-actions SLACK_C8_MONOREPO_NOTIFICATIONS_BOT_TOKEN;
            secret/data/products/camunda/ci/github-actions SLACK_TOPMONOREPOCI_CHANNEL_ID;
            secret/data/products/zeebe/ci/ci-analytics gcloud_sa_key;

      - name: Login to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ steps.secrets.outputs.gcloud_sa_key }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Print Google Cloud SDK version used
        shell: bash
        run: |
          gcloud info

      - name: Create messages with BigQuery data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/test-stats-summary/build.sh flaky "$RUNNER_TEMP/slack-messages.json"

      - name: Debug notification
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          jq -r '.[] | "=== \(.text)", (.blocks[] | .text.text // .elements[0].text // "---")' "$RUNNER_TEMP/slack-messages.json"

      - name: Send notification
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ steps.secrets.outputs.SLACK_C8_MONOREPO_NOTIFICATIONS_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.slack_channel_id || steps.secrets.outputs.SLACK_TOPMONOREPOCI_CHANNEL_ID }}
        run: bash .github/scripts/test-stats-summary/post.sh "$RUNNER_TEMP/slack-messages.json"

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
