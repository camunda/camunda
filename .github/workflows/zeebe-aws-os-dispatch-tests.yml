# description: Runs Integration tests on different versions of AWS OS
# test locations:
#  - /qa/acceptance-tests
#  - /search/search-client-opensearch,
#  - /zeebe/exporters/camunda-exporter,
#  - /zeebe/exporters/opensearch-exporter,
# type: CI
# owner: @camunda/core-features, @camunda/data-layer
name: AWS OpenSearch Manual/Scheduled Run Integration Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to test against
        type: string
        default: "main"
      opensearch-version:
        description: Version of AWS OpenSearch
        type: choice
        options:
          - "2.19"
          - "3.7"
          - "all"
  schedule:
    - cron: "0 4 * * Mon-Fri"

jobs:
  # Each matrix leg below is a separate call to the reusable workflow, i.e. a fully
  # independent job graph (check version -> cleanup -> integration tests -> slack
  # notification, sequential within that call). That's what makes the 2.19 and 3.7
  # chains run as two parallel, independent boxes instead of one shared job graph
  # gated on both versions at every step: a `needs:` on a matrixed job waits for ALL
  # of that job's matrix legs, not just the matching os_version, so keeping os_version
  # as a matrix dimension on shared jobs (as before) would still serialize 2.19 and 3.7
  # at each phase boundary even with per-version concurrency groups.
  run-aws-opensearch-tests:
    name: "AWS OpenSearch ${{ matrix.os_version }}"
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # "all" and the unset/schedule case both expand to both versions.
        os_version: ${{ fromJSON(format('[{0}]', (github.event.inputs.opensearch-version == 'all' || !github.event.inputs.opensearch-version) && '"2.19", "3.7"' || format('"{0}"', github.event.inputs.opensearch-version))) }}
    uses: ./.github/workflows/zeebe-aws-os-integration-tests-reusable.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      os_version: ${{ matrix.os_version }}

  # Auto-retry when a matrix leg failed because its self-hosted runner was
  # terminated mid-job (spot preemption / autoscaler scale-down / node eviction)
  # rather than a real test failure. The reusable action only re-runs the failed
  # jobs when one of the runner-shutdown messages is present in the run logs, so
  # genuine test failures are never masked. It re-runs failed jobs only
  # (rerun-whole-workflow defaults to false), so a shutdown in the 2.19 chain
  # leaves the already-green 3.7 chain untouched. Capped at two retries via
  # run_attempt.
  rerun-failed-jobs:
    name: "Rerun jobs killed by runner shutdown"
    needs: run-aws-opensearch-tests
    if: failure() && fromJSON(github.run_attempt) < 3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Rerun failed jobs on runner shutdown
        uses: camunda/infra-global-github-actions/rerun-failed-run@475528365f4010480dccff71ccac554cc3352e7c # rerun-failed-run-1.1.2
        with:
          error-messages: |
            The runner has received a shutdown signal
            lost communication with the server
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          vault-addr: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
