# description: Runs the C8 Orchestration Cluster E2E test suite on pull requests that change it, as jobs of this check through main's reusable test workflow, and comments on its failures. Non-blocking: not part of the Unified CI and not a required status check.
# test location: /qa/c8-orchestration-cluster-e2e-test-suite
# type: CI
# owner: @camunda/test-automation-team
---
name: C8 Orchestration Cluster E2E Tests PR Check

# The suite's own test code used to be validated only by the manual on-demand
# run, which was often skipped, so PRs with red suite tests got merged
# (camunda/team-test-automation#188). This runs the same test matrix on every
# PR that changes the suite, as jobs of this check, so each job's result shows
# on the PR. This branch has no suite workflows of its own: it calls main's
# reusable test workflow, which runs this version's matrix, and main's triage
# scripts.
#
# It stays outside ci.yml and is not a required check: it never blocks a
# merge, and so is exempt from the Unified CI rules, including their
# 30-minute job limit (the suite jobs run up to ~40 min).
on:
  pull_request:
    paths:
      - "qa/c8-orchestration-cluster-e2e-test-suite/**"
      - "!qa/c8-orchestration-cluster-e2e-test-suite/**/*.md"
      - ".github/workflows/c8-orchestration-cluster-e2e-tests-pr.yml"

# A newer push cancels the PR's run in progress.
concurrency:
  cancel-in-progress: true
  group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}

permissions: {}

env:
  GHA_BEST_PRACTICES_LINTER: enabled
  TEST_OWNER: "@camunda/test-automation-team"
  TEST_PRODUCT: Orchestration Cluster
  TEST_TYPE: E2E

jobs:
  # The triage comment lists this job's sub-jobs by their "tests / " prefix:
  # keep the job id.
  tests:
    # Fork PRs get no secrets; run main's on-demand workflow for those by hand.
    if: github.event.pull_request.head.repo.fork != true
    uses: camunda/camunda/.github/workflows/c8-orchestration-cluster-e2e-tests-reusable.yml@main
    secrets: inherit
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      base: ${{ github.base_ref }}
      compare-base-sha: ${{ github.event.pull_request.base.sha }}
      # This branch does not carry the base re-run scripts.
      scripts-ref: main

  # Per failed test, what re-running it with the base test code showed. A
  # problem here never changes the suite's result.
  triage:
    name: Triage comment
    needs: tests
    if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read # list this run's jobs
      contents: read
      pull-requests: write # post the triage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Print metadata
        uses: ./.github/actions/print-metadata
      - name: Check out the suite triage scripts from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .suite-ci
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download the suite reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: c8-e2e-suite-json-*
          path: pr-reports

      - name: Post the triage comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEST_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_CONCLUSION: ${{ needs.tests.result }}
          PR_REPORTS_DIR: pr-reports
        run: .suite-ci/.github/scripts/c8-e2e-suite-report.sh

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
