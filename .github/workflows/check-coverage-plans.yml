name: Check coverage plans

# A coverage plan under qa/coverage/ is a reviewed, machine-readable list of the
# automated cases an epic needs. The coverage gate in
# camunda/c8-cross-component-e2e-tests reads these plans and reports their
# statuses onto product PRs, so a case still marked `automated` after its test
# was deleted or renamed is reported as coverage that does not exist.
#
# Nothing wrote that status back, and nothing checked it. This job does: it runs
# the plan validator with its spec-file checks on, which is only possible in this
# repository, because here the plan and the suite it points at are in one
# checkout.
#
# See camunda/camunda#65183.

on:
  pull_request:
    paths:
      - 'qa/**'
      - 'configuration/src/main/**'
      - 'configuration/src/test/**'
      - 'operate/client/**'
      - 'service/src/main/**'
      - 'service/src/test/**'
      - 'webapp/client/**'
      - '.github/scripts/coverage-plan-check/**'
      - '.github/workflows/check-coverage-plans.yml'
  # Every directory the current plans point at. After adding a plan, check it
  # against what the plans actually reference rather than guessing:
  #
  #   grep -h '^\s*- path:' qa/coverage/*.yml | sed 's/.*path: *//' \
  #     | cut -d/ -f1-2 | sort -u
  #
  # That prints what is referenced, not the list below -- each entry here is
  # that widened to a prefix worth filtering on. It is a check, not a
  # generator.
  #
  # `configuration/` was missing, and the cost was real: the PR that moved
  # AuditLogTest.java into a `data` package touched no filtered path, so this
  # check never ran on it and it merged with a plan pointing at a file that no
  # longer existed. The unfiltered push run below caught it afterwards, on
  # main, as a paging alert.
  #
  # So the filter decides WHEN a break is caught, not whether. The push and
  # schedule runs are the backstop, which is why a stale filter costs one
  # merge of delay rather than silence.
  #
  # Kept deliberately broad: `webapp/client/**` rather than the
  # `webapp/client/apps/**` the paths strictly imply. Narrowing to exactly
  # what today's plans reference buys nothing and misses the next one.
  #
  # The `src/main/**` entries are NOT referenced by any plan, and are here
  # anyway. The planned-case report below matches a Maven test package against
  # the main package it mirrors, so the pull request it most wants to speak to
  # -- one that changes AuditLog.java and has no test yet -- touches only main
  # sources. Deriving this list from the plans alone left that pull request
  # starting no run at all, so the report advertised a match it could never
  # make. Whatever a plan points at under `<module>/src/test/`, the matching
  # `<module>/src/main/` belongs here too.
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1-5'  # weekdays at 06:00 UTC
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  CHECK_DIR: .github/scripts/coverage-plan-check
  # Default owner for CI Analytics / incident routing. observe-build-status
  # falls back to this when it cannot attribute a failure, so an auto-created
  # incident pings the test-automation medic instead of landing with no owner.
  TEST_OWNER: '@camunda/test-automation-team'

jobs:
  validate:
    name: Validate qa/coverage plans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install validator dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          directory: ${{ env.CHECK_DIR }}

      - name: Validate coverage plans
        id: validate
        run: |
          # Run from the repository root: the validator resolves every spec
          # `path` in a plan against the working directory, so this is what lets
          # it check the plan against the suite rather than only against itself.
          #
          # --no-case-ids: the validator can also require each case id to appear
          # in its spec file, which is a real check over a suite generated from
          # the plan, because the id is the first token of the generated test
          # title. This repository's suites predate the plans that point at
          # them -- the JUnit ITs, the vitest component tests, and the
          # hand-written Playwright API specs alike -- so no title carries an
          # id and only a comment could put one there. A comment makes the
          # grep pass without binding to any test that runs, so the check would
          # read as verification while verifying nothing. The existence check
          # below is the drift that is real here, and a comment cannot fake it.
          #
          # `shell: bash` runs with `pipefail`, so a validation failure still
          # fails this step through the tee.
          node "$CHECK_DIR/coverage-plan.mjs" validate qa/coverage --no-case-ids \
            2>&1 | tee "$RUNNER_TEMP/coverage-plans.txt"

      - name: Report result in summary
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          # The markdown this writes contains backticks inside single quotes —
          # a code fence and an inline path — which is what SC2016 flags.
          # shellcheck disable=SC2016
          {
            echo '## Coverage plans'
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/coverage-plans.txt" 2>/dev/null || echo '(no output)'
            echo '```'
            echo ''
            if [[ "$VALIDATE_OUTCOME" == 'failure' ]]; then
              echo 'A plan under `qa/coverage/` is wrong. With `--no-case-ids` this'
              echo 'step fails for two reasons only: a case marked `automated` or'
              echo '`stub` whose spec file is not on disk — deleted, moved or'
              echo 'renamed — or a plan that breaks the schema. The coverage gate'
              echo 'reports these statuses onto product PRs, so a wrong one is read'
              echo 'as fact.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Reporting, not gating. The validator above fails a pull request that
      # claims coverage it does not have; this says the opposite thing -- here
      # is coverage a reviewed plan asks for and nobody has written yet, in
      # files you are touching right now.
      #
      # It exists because of WHEN generation fires. A plan is only drafted once
      # its epic reaches Validate, and tests are only generated once a person
      # merges that plan -- both after the code was written. A unit or
      # component case then lands in a generated pull request weeks later,
      # against a file whose author has moved on. Those two levels are the ones
      # the author should write, because they wrote the code; this tells them
      # while they still have the change in their head.
      #
      # Pull-request runs only. On push, schedule and dispatch there is no
      # changed-file set to be relevant to, and a section listing every
      # outstanding case in the repository is the noise that gets a check
      # muted.
      - name: List the planned cases this pull request's files own
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # `git diff --name-only` over the merge base rather than the GitHub
          # API: the checkout is already here, it needs no token, and it does
          # not page at 300 files the way the files endpoint does.
          #
          # actions/checkout fetches one commit by default, so neither sha is
          # necessarily present. Fetch both and let the diff find their merge
          # base; a shallow clone can lack one, which is why the fallback
          # below reports nothing rather than diffing against the wrong tree.
          git fetch --no-tags --depth=100 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          if ! base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "::notice::could not find the merge base, so no planned-case report"
            exit 0
          fi
          git diff --name-only "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          echo "Changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"

          # Never fails the job. A plan is a plan, not a contract, and a case
          # may be deliberately deferred -- gating on one would be answered by
          # deleting the line from the plan, which is the opposite of what the
          # plan is for.
          node "$CHECK_DIR/planned-for-paths.mjs" qa/coverage "$RUNNER_TEMP/changed.txt" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
