# TEMPORARY — delete before merging this PR.
#
# A workflow_dispatch workflow cannot be dispatched until it is on the default
# branch; the API answers 404. That leaves a new scoped runner untestable on
# its own PR, which is how an incident gets found after merge rather than
# before. This runs the component runner's steps on `pull_request` instead, so
# the container, the install, the vitest invocation, the report path and the
# verdict are all exercised here.
#
# It runs only when the scoped-runner files change, so it is inert on every
# other pull request until it is deleted.
---
name: TEMP probe - scoped runners

on:
  pull_request:
    paths:
      - '.github/workflows/c8-component-scoped-run.yml'
      - '.github/scripts/scoped-run-junit-verdict.mjs'
      - '.github/workflows/zz-tmp-probe-scoped-runners.yml'

permissions: {}

defaults:
  run:
    shell: bash

env:
  CLIENT_DIR: webapp/client
  APP_DIR: webapp/client/apps/orchestration-cluster-webapp
  # The probe test this adds, and the id it carries.
  PROBE_SPEC: src/operate/scoped-run-probe.test.tsx
  PROBE_CASE: PROBE-01
  PROBE_INSTANCE: operate:carbon

jobs:
  probe:
    name: Probe the component scoped run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0
      options: --user 1001:1000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          directory: ${{ env.CLIENT_DIR }}
          max_attempts: "2"
          timeout_minutes: "6"

      # Written here rather than committed, so the probe leaves nothing behind
      # in the app even if this workflow outlives the PR by a few minutes.
      - name: Write a probe test carrying a case id
        run: |
          cat > "$APP_DIR/$PROBE_SPEC" <<'T'
          import {describe, expect, test} from 'vitest';

          // Deliberately inside a describe: vitest names a test after the
          // describes around it, which is what the verdict has to see through.
          describe('scoped run probe', () => {
            test('PROBE-01: is found by its case id and passes', () => {
              expect(1).toBe(1);
            });

            test('PROBE-02: a sibling that must not decide the verdict', () => {
              expect(2).toBe(2);
            });
          });
          T

      - name: Run the scoped case
        id: run
        working-directory: ${{ env.CLIENT_DIR }}
        env:
          PW_TEST_SCREENSHOT_NO_FONTS_READY: "1"
        run: |
          set +e
          npm run test:unit -w @camunda/orchestration-cluster-webapp -- \
            --project "$PROBE_INSTANCE" \
            -t "${PROBE_CASE}:" \
            "$PROBE_SPEC"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Read the verdict
        env:
          RUN_EXIT: ${{ steps.run.outputs.exit }}
        run: |
          report="$APP_DIR/TEST-unit.xml"
          if [[ ! -f "$report" ]]; then
            echo "::error::no JUnit report at $report (vitest exit ${RUN_EXIT:-unknown})"
            exit 1
          fi
          echo "--- what vitest wrote ---"
          grep -E '<testcase' "$report" || true
          echo "--- verdict ---"
          node .github/scripts/scoped-run-junit-verdict.mjs "$report" "$PROBE_CASE"

      - name: Remove the probe test
        if: always()
        run: rm -f "$APP_DIR/$PROBE_SPEC"
