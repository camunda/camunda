# description: Publishes the results of a set of stress test variants: merges the per-variant
#              metrics artifacts into one manifest, archives metrics and flamegraphs to the
#              camunda-benchmark-load-test-results-prod GCS bucket and posts a side-by-side
#              metrics table to the reliability-testing Slack channel.
# called-by: camunda-daily-load-tests.yml, camunda-stable-stress-tests.yml
# type: CI
# owner: @camunda/reliability-testing
name: Publish load test results
run-name: "Publish load test results: ${{ inputs.benchmark }}"

on:
  workflow_call:
    inputs:
      benchmark:
        description: 'Benchmark name, the prefix of the variants'' namespaces (e.g. medic-daily-YYYY-MM-DD-<sha>-test).'
        type: string
        required: true
      variant-order:
        description: 'Space separated key:label pairs, in the order of the Slack table columns. The key is the -<key> suffix of the variant name given to stress-load-test.yml, a variant missing here is dropped from the results.'
        type: string
        required: true
      metrics-artifact-name:
        description: 'Name of the combined metrics artifact this workflow creates.'
        type: string
        required: true
      gcs-path:
        description: 'Path in the results bucket the results are copied to, without the benchmark name (e.g. automated/daily/stress).'
        type: string
        required: true
      slack-title:
        description: 'Title of the Slack message.'
        type: string
        required: true
      post-to-slack:
        description: 'Whether to post the results to Slack.'
        type: boolean
        default: true
        required: false

defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

env:
  TEST_OWNER: '@camunda/reliability-testing'
  GCS_LOAD_TEST_RESULTS_BUCKET: camunda-benchmark-load-test-results-prod

jobs:
  # Aggregates every variant's metrics artifact into one place.
  aggregate-metrics:
    name: Aggregate variant metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Runs first, before any step below writes metrics-*.json/variants.json into
      # $GITHUB_WORKSPACE: checkout wipes the entire workspace contents whenever it finds no
      # existing .git directory there (regardless of the `clean` input), which would otherwise
      # delete those files before the GCS upload step gets to read them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Download variant metrics artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # a variant whose collect-metrics never ran just yields fewer entries below
        with:
          pattern: stress-test-result-*
          path: variant-metrics
          # No merge-multiple: every artifact contains a file named stress-result.json, so each
          # needs its own per-artifact-name folder to avoid one variant's file overwriting another's.
      - name: Merge into the legacy combined artifact + variants manifest
        env:
          BENCHMARK: ${{ inputs.benchmark }}
          VARIANT_ORDER: ${{ inputs.variant-order }}
        run: |
          manifest='[]'
          for entry in $VARIANT_ORDER; do
            key="${entry%%:*}"
            label="${entry#*:}"
            f="variant-metrics/stress-test-result-${BENCHMARK}-${key}/stress-result.json"
            if [ ! -f "$f" ]; then
              continue
            fi
            jq '.results' "$f" > "metrics-${key}.json"
            entry_json=$(jq --arg key "$key" --arg label "$label" '. + {key: $key, label: $label}' "$f")
            manifest=$(jq --argjson v "$entry_json" '. + [$v]' <<<"$manifest")
          done
          if [ "$manifest" = '[]' ]; then
            echo "::warning::No variant metrics artifacts found; Slack summary and legacy artifact will be empty"
          fi
          # Written to a FILE, not $GITHUB_OUTPUT: this job also uses secrets.VAULT_* below (Observe
          # build status), and GitHub Actions silently drops any $GITHUB_OUTPUT write whose value
          # happens to contain a substring matching a secret registered anywhere in the job (see
          # https://github.com/orgs/community/discussions/26636). Files aren't subject to that
          # masking, so the artifact is the only reliable transport here, same reasoning already
          # applied to upload-variant-metrics in stress-load-test.yml.
          echo "$manifest" > variants.json
      - name: Upload combined metrics artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.metrics-artifact-name }}
          path: |
            metrics-*.json
            variants.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  # Persists metrics, variant manifest, and flamegraphs to the long-term GCS archive. Runs as its
  # own job, separate from aggregate-metrics, so a real GCS failure fails this job for real (red in
  # the Actions UI, surfaced through the caller's `notify` job) instead of being
  # swallowed, while still not blocking notify-results, which only depends on aggregate-metrics.
  upload-results-to-gcs:
    name: Upload results to GCS
    runs-on: ubuntu-latest
    needs: aggregate-metrics
    if: needs.aggregate-metrics.result == 'success'
    timeout-minutes: 15 # covers auth, artifact downloads, and the full retry budget for the GCS upload
    permissions:
      contents: read
      id-token: write # GCP WIF auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Download metrics and variant manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.metrics-artifact-name }}
          path: data
      - name: Download flamegraph artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # profiling is best-effort; a run with no flamegraphs still persists its metrics
        with:
          pattern: flamegraph-*
          path: data/flamegraphs
          # No merge-multiple: every artifact contains identically-named files (flamegraph-cpu.html
          # etc.), so each needs its own per-artifact-name folder to avoid one pod's report
          # overwriting another's.
      - name: Authenticate to GCS load-test-results
        timeout-minutes: 3 # fail fast on a Vault/WIF hang instead of consuming the job's whole timeout
        uses: ./.github/actions/gcs-build-cache-auth
        with:
          vault-addr: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          secret-path: secret/data/products/camunda/ci/load-test-results/load-test-results-sa
      - name: Upload results to GCS
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          BENCHMARK: ${{ inputs.benchmark }}
          GCS_PATH: ${{ inputs.gcs-path }}
        with:
          max_attempts: 5
          retry_wait_seconds: 10
          timeout_minutes: 2
          shell: bash
          command: |
            target="gs://${GCS_LOAD_TEST_RESULTS_BUCKET}/${GCS_PATH}/${BENCHMARK}/"
            gcloud storage cp -r data/* "${target}"
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  # Post a side-by-side metrics table (one column per variant) to Slack.
  notify-results:
    name: Notify Slack with results
    runs-on: ubuntu-latest
    needs: aggregate-metrics
    # Data-presence is checked inside post-load-test-results-to-slack.py after the manifest
    # download, not here.
    if: >
      always() &&
      needs.aggregate-metrics.result == 'success' &&
      inputs.post-to-slack
    timeout-minutes: 5
    permissions:
      actions: read # list run artifacts via API
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download variant manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.metrics-artifact-name }}
          path: variant-manifest
      - name: List flamegraph artifacts
        id: flamegraph-artifacts
        # Best-effort enhancement: a failure here shouldn't block the Slack results
        # notification, it just means the Slack message omits flamegraph links.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100, // a run has about 37 artifacts, the default page holds 30
            });
            const runURL = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const links = data.artifacts
              .filter(a => a.name.startsWith('flamegraph-'))
              .sort((a, b) => a.name.localeCompare(b.name)) // group the links per leg
              .map(a => `• <${runURL}/artifacts/${a.id}|${a.name}>`)
              .join('\n');
            core.setOutput('links', links);
      - name: Import Slack webhook from Vault
        id: slack-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda/ci/github-actions SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL;
      - name: Build and post Slack results table
        # queries.yaml is the canonical source of metric names/labels/formats;
        # the script reads it directly so the Slack table stays in sync.
        env:
          VARIANTS_JSON_FILE: variant-manifest/variants.json
          BENCHMARK: ${{ inputs.benchmark }}
          SLACK_TITLE: ${{ inputs.slack-title }}
          SLACK_WEBHOOK_URL: ${{ steps.slack-secrets.outputs.SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FLAMEGRAPH_LINKS: ${{ steps.flamegraph-artifacts.outputs.links }}
        run: python3 .github/scripts/post-load-test-results-to-slack.py
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
