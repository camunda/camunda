# description: Weekly cleanup of orphaned and stale documentation preview deployments
# type: maintenance
# owner: @camunda/engineering-operations
---
name: Docs Preview Cleanup

on:
  schedule:
    # Run weekly on Sundays at 03:00 UTC for low-traffic cleanup window
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

# Prevent concurrent cleanup operations to avoid git conflicts and ensure consistent state
concurrency:
  group: docs-preview-cleanup
  cancel-in-progress: false

defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

env:
  TEST_OWNER: '@camunda/engineering-operations'
  # Previews of open PRs not redeployed for this long are removed; the next push to the PR redeploys them.
  # Every preview is a full site copy on gh-pages, and every Pages build processes the whole branch (INC-9073).
  PREVIEW_MAX_AGE_DAYS: 30

jobs:
  cleanup-orphaned-previews:
    name: Cleanup Orphaned and Stale Documentation Previews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with docs-build-deploy.yml and docs-preview.yml -- see the note there.
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        # Credentials stay: this job fetches gh-pages and git-auto-commit pushes to it.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cleanup orphaned and stale documentation previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch gh-pages branch
          git fetch origin gh-pages:gh-pages 2>/dev/null || {
            echo "ℹ️ No gh-pages branch found, nothing to clean up"
            exit 0
          }
          git checkout gh-pages

          # Check if pr-preview directory exists
          [[ ! -d "pr-preview" ]] && { echo "ℹ️ No pr-preview directory found"; exit 0; }

          echo "📁 Current pr-preview contents:"
          ls -la pr-preview/
          echo ""

          # Get open PRs and extract preview directories
          open_prs=$(gh pr list --state open --json number --jq '.[].number' --limit 500 | sort -n)
          cutoff=$(date -u -d "-${PREVIEW_MAX_AGE_DAYS} days" +%s)
          cleaned_count=0

          echo "Open PRs: $(echo "$open_prs" | tr '\n' ' ')"

          # Process each preview directory
          for dir in pr-preview/pr-*/; do
            [[ ! -d "$dir" ]] && continue

            pr_num=$(basename "$dir" | sed 's/pr-//')
            echo "Checking preview directory for PR #$pr_num"

            # Keep previews of open PRs that were redeployed within PREVIEW_MAX_AGE_DAYS
            if echo "$open_prs" | grep -Fxq "$pr_num"; then
              last_deploy=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=gh-pages&path=${dir%/}&per_page=1" --jq '.[0].commit.committer.date // empty')
              if [[ -z "$last_deploy" ]] || (( $(date -u -d "$last_deploy" +%s) >= cutoff )); then
                echo "✅ PR #$pr_num is open, preview last deployed ${last_deploy:-unknown}, keeping preview"
                continue
              fi
              echo "🗑️ PR #$pr_num is open but its preview was last deployed $last_deploy, more than ${PREVIEW_MAX_AGE_DAYS} days ago, removing preview"
            else
              echo "🗑️ PR #$pr_num not found in open PRs, removing preview"
            fi
            echo "   Directory contents:"
            ls -la "$dir" || echo "   Cannot list directory contents"
            echo "   Attempting to remove: $dir"
            if rm -rf "$dir"; then
              echo "   ✅ Successfully removed $dir"
              cleaned_count=$((cleaned_count + 1))
            else
              exit_code=$?
              echo "   ❌ Failed to remove $dir"
              echo "   Error code: $exit_code"
            fi
          done

          echo "Summary: Purged $cleaned_count orphaned or stale preview(s)"

      - name: Commit cleanup changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "docs: cleanup orphaned and stale documentation previews"
          branch: gh-pages
          file_pattern: "pr-preview/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout main branch for observe-build-status
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
