# description: CI for the load-tests/metrics-exporter Go module: runs unit tests, lints, and verifies the Docker image builds.
# type: CI
# owner: @camunda/reliability-testing
---
name: "Load test: metrics exporter: build/test"

on:
  push:
    branches:
      - main
    paths:
      - "load-tests/metrics-exporter/**"
      - ".github/workflows/camunda-load-test-metrics-exporter-ci.yaml"
  pull_request:
    paths:
      - "load-tests/metrics-exporter/**"
      - ".github/workflows/camunda-load-test-metrics-exporter-ci.yaml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./load-tests/metrics-exporter

env:
  TEST_OWNER: '@camunda/reliability-testing'

jobs:
  test:
    permissions:

      id-token: write
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ./load-tests/metrics-exporter/go.mod
          cache-dependency-path: ./load-tests/metrics-exporter/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Run IT
        run: make integration-test

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwtRole: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwtPath: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwtAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  lint:
    permissions:

      id-token: write
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ./load-tests/metrics-exporter/go.mod
          cache-dependency-path: ./load-tests/metrics-exporter/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Lint
        run: make lint

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwtRole: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwtPath: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwtAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}

  docker-build:
    permissions:

      id-token: write
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          dockerhub-readonly: true
          harbor: true
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      - name: Setup Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        run: make docker DOCKER_PUSH=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwtRole: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwtPath: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwtAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
