# description: Runs End to End tests on the C8 Orchestration Cluster (ie, Tasklist, Operate) This workflow is run manually
# type: CI
# owner: @camunda/test-automation-team
---
name: C8 Orchestration Cluster E2E Tests On Demand

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Enter the branch to test"
        required: true
        default: "main"

permissions:
  contents: read

env:
  GHA_BEST_PRACTICES_LINTER: enabled
  TEST_OWNER: "@camunda/test-automation-team"
  TEST_PRODUCT: Orchestration Cluster
  TEST_TYPE: E2E

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    # Unshallowed checkout plus six branch fetches; 5 minutes was sized for a
    # depth-1 clone.
    timeout-minutes: 15
    permissions: {}
    outputs:
      base: ${{ steps.detect-base.outputs.base }}
    steps:
      - name: Check if branch exists
        shell: bash
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking if branch '$BRANCH' exists..."
          branch_check=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/branches/$BRANCH")
          if [[ "$branch_check" != "200" ]]; then
            echo "Error: Branch '$BRANCH' does not exist (HTTP $branch_check)."
            exit 1
          fi
          echo "Branch '$BRANCH' exists."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Base detection counts commits back to each candidate's
          # merge-base, which a shallow clone cannot answer.
          fetch-depth: 0
      - name: Print metadata
        uses: ./.github/actions/print-metadata

      - name: Detect base branch
        id: detect-base
        shell: bash
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          echo "Detecting base branch for input branch: $BRANCH"
          # main first: an equal distance means the branch forked from trunk
          # at or before the point a stable line was cut, so it left main, not
          # that stable line. Strict < below keeps main on a tie.
          candidates=(main stable/8.10 stable/8.9 stable/8.8 stable/8.7 stable/8.6)
          git fetch origin "${candidates[@]}" "$BRANCH"

          base=""
          best=""
          for candidate in "${candidates[@]}"; do
            if ! merge_base=$(git merge-base "origin/$candidate" "origin/$BRANCH"); then
              echo "  $candidate: no common history, skipping"
              continue
            fi
            distance=$(git rev-list --count "$merge_base..origin/$BRANCH")
            echo "  $candidate: forked at ${merge_base:0:9}, $distance commit(s) since"
            if [[ -z "$best" || "$distance" -lt "$best" ]]; then
              best="$distance"
              base="$candidate"
            fi
          done

          if [[ -z "$base" ]]; then
            echo "Error: no candidate branch shares history with '$BRANCH'." >&2
            exit 1
          fi

          echo "Detected base branch: $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  tests:
    needs: validate-branch
    uses: ./.github/workflows/c8-orchestration-cluster-e2e-tests-reusable.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      ref: ${{ github.event.inputs.branch }}
      base: ${{ needs.validate-branch.outputs.base }}
