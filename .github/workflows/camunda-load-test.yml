# description: Central reusable workflow for deploying load tests. All load test creation
#              routes through this workflow. Builds Docker images (or reuses existing ones),
#              then deploys via newLoadTest.sh + `make install` to a GKE cluster.
# called-by: camunda-daily-load-tests.yml, camunda-weekly-load-tests.yml,
#            camunda-pr-load-test.yaml, camunda-release-load-test.yaml
# also: triggerable manually via workflow_dispatch for ad-hoc load tests
# monitoring: https://dashboard.benchmark.camunda.cloud/
# type: CI
# owner: @camunda/reliability-testing
#
# Infos from Infra:
# - Using the infra benchmark prod cluster requires to use Teleport to authenticate.
# - Camunda images are pushed to registry.camunda.cloud/team-zeebe and pulled from there.
#   To use them in a namespace, the namespace must be labeled with "registry=harbor"
#   You must also set the image pull secret to "harbor-registry" in the helm values.

name: Camunda load test
run-name: "Camunda load test: ${{ inputs.name }}"

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Name of the load test (used as the Kubernetes namespace)'
        required: true
      ref:
        description: 'Git ref (branch, tag or commit SHA) to build and test against'
        default: 'main'
        type: string
        required: false
      scenario:
        description: 'Workload scenario to run.'
        required: false
        type: choice
        options:
          - latency
          - realistic
          - typical
          - max
          - archiver
        default: max
      secondary-storage-type:
        description: 'Secondary database backend for Camunda Platform'
        type: choice
        options:
        - elasticsearch
        - opensearch
        - postgresql
        - mysql
        - mariadb
        - mssql
        - oracle
        - none
        default: elasticsearch
      reuse-tag:
        description: 'Pre-built image tag from the internal registry (registry.camunda.cloud). Skips the build step. ⚠ Cannot be used with orchestration-tag.'
        type: string
        default: ""
        required: false
      load-test-load:
        description: '── Configuration ─────────────────── Helm args for workload components (e.g. --set starter.rate=100).'
        required: false
      platform-helm-values:
        description: 'Additional Helm values for the Camunda platform chart (e.g. --set orchestration.resources.limits.memory=2Gi)'
        type: string
        default: ""
        required: false
      load-test-setup-helm-values:
        description: 'Additional Helm values for the load-test-setup chart (e.g. --set elasticsearch.storage.requests=64Gi)'
        type: string
        default: ""
        required: false
      stable-vms:
        description: 'Deploy to non-spot VMs (more stable, higher cost)'
        type: boolean
        required: false
        default: false
      enable-optimize:
        description: 'Enable Optimize for load testing'
        type: boolean
        required: false
        default: true
      enable-chaos:
        description: 'Enable chaos-killer to randomly kill pods'
        type: boolean
        required: false
        default: false
      physical-tenant-count:
        description: 'Number of extra physical tenants (pt1..ptN) to deploy alongside the default tenant, each with its own load tester.'
        type: number
        required: false
        default: 0
      enable-optimize-report-metrics:
        description: 'Enable the load-tester Optimize report-evaluation meter (requires Optimize backend)'
        type: boolean
        required: false
        default: false
      build-frontend:
        description: 'Build frontend assets as part of the load test image build'
        type: boolean
        required: false
        default: false
      perform-read-benchmarks:
        description: 'Run continuous read benchmarks on secondary storage (may affect exporter performance)'
        type: boolean
        required: false
        default: false
      ttl:
        description: '── Lifecycle & advanced ──────────── Days before the namespace is auto-deleted'
        type: number
        default: 1
        required: false
      target-version:
        description: 'Setup version subfolder to use. Corresponds to load-tests/setup/<target-version>/. Default: main.'
        type: string
        default: "main"
        required: false
      orchestration-tag:
        description: 'Official Docker Hub image tag (docker.io/camunda/camunda). Uses Docker Hub instead of building. ⚠ Cannot be used with reuse-tag.'
        type: string
        default: ""
        required: false
      optimize-tag:
        description: 'Override Optimize image tag (docker.io/camunda/optimize). Overrides build mode defaults.'
        type: string
        default: ""
        required: false
      identity-tag:
        description: 'Override Identity image tag (docker.io/camunda/identity). Defaults to Helm chart default.'
        type: string
        default: ""
        required: false
      connectors-tag:
        description: 'Override Connectors image tag (docker.io/camunda/connectors). Defaults to Helm chart default.'
        type: string
        default: ""
        required: false
      metrics-exporter-tag:
        description: 'Override Metrics Exporter image tag (registry.camunda.cloud/team-reliability-testing/metrics-exporter). Builds and pushes this tag from load-tests/metrics-exporter. Only set this to deliberately test a new metrics-exporter build — it is independent of the Camunda version under test and otherwise defaults to "latest".'
        type: string
        default: ""
        required: false
  workflow_call:
    inputs:
      ref:
        description: 'Specifies the ref (e.g. branch name, commit sha or tag) from which the docker image is built and used to run the load test against'
        default: 'main'
        type: string
        required: false
      name:
        description: 'Specifies the name of the load test'
        type: string
        required: true
      ttl:
        description: 'Specifies after how many days the load test namespace should be deleted'
        type: number
        default: 1
        required: false
      reuse-tag:
        description: 'Reuse Tag: Pre-built image tag from the internal registry (registry.camunda.cloud). Skips the docker image build step. Cannot be used together with orchestration-tag.'
        type: string
        default: ""
        required: false
      scenario:
        description: 'Workload scenario to run. Options: latency, realistic, typical, max, archiver.'
        type: string
        required: false
        default: ""
      load-test-load:
        description: 'Specifies which load test components to deploy. For example, `starter` can be assigned with the rate at which they start instances. Allows arbitrary helm arguments, like --set starter.rate=100. Can be combined with any scenario, or used alone when scenario is empty.'
        type: string
        required: false
      platform-helm-values:
        description: 'Allows to specify additional values/configurations for the Camunda platform Helm chart, which will be deployed. For example, the Orchestration cluster `resources` can be modified. Allows arbitrary helm arguments, like --set orchestration.resources.limits.memory=2Gi'
        type: string
        default: ""
        required: false
      load-test-setup-helm-values:
        description: 'Allows to specify additional values/configurations for the load-test-setup Helm chart, which deploys the secondary storage and supporting infra. For example, the Elasticsearch disk size can be reduced. Allows arbitrary helm arguments, like --set elasticsearch.storage.requests=64Gi'
        type: string
        default: ""
        required: false
      publish:
        description: 'Where to publish the results, can be "slack" or "comment"'
        default: ""
        type: string
        required: false
      perform-read-benchmarks:
        description: 'Perform continuous read benchmarks on secondary storage. This may influence the exporter performance as it puts more load on the secondary database. The metrics are available in the Data-Layer dashboard.'
        type: boolean
        required: false
        default: false
      stable-vms:
        description: 'Deploy to non-spot VMs'
        type: boolean
        required: false
        default: false
      enable-optimize:
        description: 'Enable Optimize for load testing'
        type: boolean
        required: false
        default: true
      enable-chaos:
        description: 'Enable chaos-killer to randomly kill pods'
        type: boolean
        required: false
        default: false
      physical-tenant-count:
        description: 'Number of extra physical tenants (pt1..ptN) to deploy alongside the default tenant, each with its own load tester.'
        type: number
        required: false
        default: 0
      enable-optimize-report-metrics:
        description: 'Enable the load-tester Optimize report-evaluation meter (requires Optimize backend)'
        type: boolean
        required: false
        default: false
      build-frontend:
        description: 'Build the frontend as part of the load test image build'
        type: boolean
        required: false
        default: false
      secondary-storage-type:
        description: 'Specifies the type of the secondary database used by Camunda Platform, can be "elasticsearch", "opensearch", "postgresql", "mysql", "mariadb", "mssql", "oracle" or "none"'
        # type choice is invalid here
        type: string
        required: false
        default: elasticsearch
      target-version:
        description: 'Setup version subfolder to use (main, stable-89, stable-88, stable-87). Default: main.'
        type: string
        default: "main"
        required: false
      orchestration-tag:
        description: 'Orchestration Tag: Docker image tag for official Camunda images from Docker Hub (docker.io/camunda/camunda). When set, official Docker Hub images are used instead of building from source. Cannot be used together with reuse-tag.'
        type: string
        default: ""
        required: false
      optimize-tag:
        description: 'Optimize Tag: Docker image tag for Optimize from Docker Hub (docker.io/camunda/optimize). When set, overrides the optimize image regardless of build mode. If not set, custom builds use the built image from the internal registry; official images use Helm chart defaults.'
        type: string
        default: ""
        required: false
      identity-tag:
        description: 'Identity Tag: Docker image tag for Identity from Docker Hub (docker.io/camunda/identity). If not set, defaults to the Helm chart default image.'
        type: string
        default: ""
        required: false
      connectors-tag:
        description: 'Connectors Tag: Docker image tag for Connectors from Docker Hub (docker.io/camunda/connectors). If not set, defaults to the Helm chart default image.'
        type: string
        default: ""
        required: false
      metrics-exporter-tag:
        description: 'Metrics Exporter Tag: Docker image tag for the load-test Metrics Exporter (registry.camunda.cloud/team-reliability-testing/metrics-exporter). When set, builds and pushes this tag from load-tests/metrics-exporter and deploys it. The metrics-exporter has its own independent versioning from the Camunda version under test, so leave unset to use the Helm chart default ("latest", kept fresh by CI on every merge to main); only set this to deliberately test a new metrics-exporter build.'
        type: string
        default: ""
        required: false

env:
  TEST_OWNER: '@camunda/reliability-testing'

  # Namespaces MUST start with c8 due to access policy
  NAMESPACE: ${{ startsWith(inputs.name, 'c8-') && inputs.name || format('c8-{0}', inputs.name) }}

  CLUSTER: camunda-benchmark-prod  # change this to "camunda-benchmark-dev" when experimenting
  TELEPORT_JOIN_TOKEN: infra-benchmark-prod-github-action-zeebe  # change this to "infra-benchmark-dev-github-action-zeebe" when experimenting

  BUILD_FRONTEND: ${{ inputs.build-frontend }}
  CONNECTORS_TAG: ${{ inputs.connectors-tag }}
  ENABLE_CHAOS: ${{ inputs.enable-chaos }}
  ENABLE_OPTIMIZE: ${{ inputs.enable-optimize }}
  ENABLE_OPTIMIZE_METRICS: ${{ inputs.enable-optimize-report-metrics }}
  HELM_CHART: camunda-platform-8.10
  IDENTITY_TAG: ${{ inputs.identity-tag }}
  IMAGE_REPOSITORY: registry.camunda.cloud/team-zeebe
  LOAD_TEST_LOAD: ${{ inputs.load-test-load }}
  LOAD_TEST_SETUP_HELM_VALUES: ${{ inputs.load-test-setup-helm-values }}
  METRICS_EXPORTER_TAG: ${{ inputs.metrics-exporter-tag }}
  NAME: ${{ inputs.name }}
  OPTIMIZE_TAG: ${{ inputs.optimize-tag }}
  ORCHESTRATION_TAG: ${{ inputs.orchestration-tag }}
  PERFORM_READ_BENCHMARKS: ${{ inputs.perform-read-benchmarks }}
  PHYSICAL_TENANT_COUNT: ${{ inputs.physical-tenant-count }}
  PLATFORM_HELM_VALUES: ${{ inputs.platform-helm-values }}
  REF: ${{ inputs.ref }}
  REUSE_TAG: ${{ inputs.reuse-tag}}
  SCENARIO: ${{ inputs.scenario }}
  SECONDARY_STORAGE_TYPE: ${{ inputs.secondary-storage-type }}
  STABLE_VMS: ${{ inputs.stable-vms }}
  TARGET_VERSION: ${{ inputs.target-version }}
  TTL: ${{ inputs.ttl }}

defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

jobs:
  show-summary:
    name: Summarize workflow inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Show summary
        run: |-
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Load test: \`${NAMESPACE}\`

          > 📊 **[Open Grafana Dashboard](https://dashboard.benchmark.camunda.cloud/d/zeebe-dashboard/zeebe?var-namespace=${NAMESPACE})**

          | Input | Value |
          |-------|-------|
          | Name | \`${NAME}\` |
          | Ref | \`${REF}\` |
          | Target version | \`${TARGET_VERSION}\` |
          | Scenario | \`${SCENARIO}\` |
          | Secondary storage | \`${SECONDARY_STORAGE_TYPE}\` |
          | Reuse tag | \`${REUSE_TAG:-—}\` |
          | Orchestration tag | \`${ORCHESTRATION_TAG:-—}\` |
          | Load test load | \`${LOAD_TEST_LOAD:-—}\` |
          | Platform Helm values | \`${PLATFORM_HELM_VALUES:-—}\` |
          | Load test setup Helm values | \`${LOAD_TEST_SETUP_HELM_VALUES:-—}\` |
          | TTL (days) | \`${TTL}\` |
          | Stable VMs | \`${STABLE_VMS}\` |
          | Enable Optimize | \`${ENABLE_OPTIMIZE}\` |
          | Enable Optimize report metrics | \`${ENABLE_OPTIMIZE_METRICS}\` |
          | Enable chaos | \`${ENABLE_CHAOS}\` |
          | Physical tenant count | \`${PHYSICAL_TENANT_COUNT}\` |
          | Build frontend | \`${BUILD_FRONTEND}\` |
          | Perform read benchmarks | \`${PERFORM_READ_BENCHMARKS}\` |
          | Optimize tag | \`${OPTIMIZE_TAG:-—}\` |
          | Identity tag | \`${IDENTITY_TAG:-—}\` |
          | Connectors tag | \`${CONNECTORS_TAG:-—}\` |
          | Metrics exporter tag | \`${METRICS_EXPORTER_TAG:-latest}\` |
          EOF

  calculate-image-tag:
    name: Calculate Image Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    outputs:
      image-tag: ${{ inputs.orchestration-tag != '' && inputs.orchestration-tag || (inputs.reuse-tag != '' && inputs.reuse-tag || steps.image-tag.outputs.image-tag) }}
    steps:
      - name: Validate mutually exclusive inputs
        if: ${{ inputs.orchestration-tag != '' && inputs.reuse-tag != '' }}
        run: |
          echo "::error::Invalid input combination: 'orchestration-tag' and 'reuse-tag' cannot both be provided. Use 'orchestration-tag' for official Docker Hub images or 'reuse-tag' for reusing pre-built images from the internal registry."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Get image tag
        id: image-tag
        if: ${{ inputs.orchestration-tag == '' && inputs.reuse-tag == '' }}
        run: |
          image_tag="${NAME}-$(git rev-parse --short HEAD)"
          echo "image-tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "**Built image tag:** \`${image_tag}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Docker image tags exist
        if: ${{ inputs.orchestration-tag != '' || inputs.optimize-tag != '' || inputs.identity-tag != '' || inputs.connectors-tag != '' }}
        # Add -x to trace the call to the script and make it easier to reproduce it locally.
        shell: bash --noprofile --norc -exo pipefail {0}
        run: |
          .github/scripts/load-test-validate-docker-image-tags.sh \
            "${ORCHESTRATION_TAG}" \
            "${OPTIMIZE_TAG}" \
            "${IDENTITY_TAG}" \
            "${CONNECTORS_TAG}" \
            "${ENABLE_OPTIMIZE}"

  build-camunda-image:
    name: Build Camunda
    needs: calculate-image-tag
    if: ${{ inputs.reuse-tag == '' && inputs.orchestration-tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      CALCULATED_IMAGE_TAG: ${{ needs.calculate-image-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          dockerhub-readonly: true
          harbor: true
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          minimus: true
      - uses: ./.github/actions/build-frontend
        name: Build Operate Frontend
        id: build-operate-fe
        if: ${{ inputs.build-frontend }}
        with:
          directory: ./operate/client
          package-manager: "npm"
      - uses: ./.github/actions/build-frontend
        name: Build Unified Webapp Frontend
        id: build-webapp-fe
        if: ${{ inputs.build-frontend }}
        with:
          directory: ./webapp/client
          package-manager: "npm"
      - uses: ./.github/actions/build-frontend
        name: Build Identity Frontend
        id: build-identity-fe
        if: ${{ inputs.build-frontend }}
        with:
          directory: ./identity/client
          package-manager: "npm"
      - uses: ./.github/actions/build-frontend
        name: Build Optimize Frontend
        id: build-optimize-fe
        if: ${{ inputs.build-frontend && inputs.enable-optimize }}
        with:
          directory: ./optimize/client
          package-manager: "yarn"
      - uses: ./.github/actions/build-zeebe
        name: Build Camunda Platform
        id: build-camunda
        with:
          maven-extra-args: -PskipFrontendBuild ${{ inputs.enable-optimize && '-Pinclude-optimize' || '-P\!include-optimize' }}
      - uses: ./.github/actions/build-platform-docker
        name: Build Camunda Docker Image
        with:
          repository: '${{ env.IMAGE_REPOSITORY }}/camunda'
          revision: ${{ inputs.ref }}
          push: true
          version: ${{ env.CALCULATED_IMAGE_TAG }}
          distball: ${{ steps.build-camunda.outputs.distball }}
          dockerfile: 'camunda.Dockerfile'
      - uses: ./.github/actions/build-platform-docker
        name: Build Optimize Docker Image
        if: ${{ inputs.enable-optimize }}
        with:
          repository: '${{ env.IMAGE_REPOSITORY }}/optimize'
          revision: ${{ inputs.ref }}
          push: true
          version: ${{ env.CALCULATED_IMAGE_TAG }}
          distball: 'optimize-distro/target/camunda-optimize-*.tar.gz'
          dockerfile: 'optimize.Dockerfile'
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  build-load-test-images:
    name: Build Starter and Worker
    if: ${{ inputs.reuse-tag == '' || inputs.orchestration-tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: calculate-image-tag
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      IMAGE_TAG: ${{ needs.calculate-image-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          dockerhub-readonly: true
          harbor: true
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
      - run: ./mvnw -B -D skipTests -D skipChecks -P\!include-optimize -pl load-tests/load-tester -am install
      # registry.camunda.cloud intermittently stops answering the manifest PUT at the end of the
      # push. jib's own retries all fall inside a ~5 minute window, so they re-hit the same bad
      # spell and the job fails. Each attempt here is capped well above the ~15s a healthy push
      # takes, so a hung one is abandoned quickly and the registry is sampled again a minute later.
      #
      # This is mitigation, not a fix — it makes a hanging registry survivable, it does not stop it
      # hanging. Drop both wrappers once these images are published to GAR instead
      # (camunda/team-infrastructure#992), which removes the dependency on this registry altogether.
      - name: Build Starter Image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 2
          shell: bash
          command: ./mvnw -pl load-tests/load-tester jib:build -P starter -P\!include-optimize -D image="${IMAGE_REPOSITORY}/starter:${IMAGE_TAG}"
      - name: Build Worker Image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 2
          shell: bash
          command: ./mvnw -pl load-tests/load-tester jib:build -P worker -P\!include-optimize -D image="${IMAGE_REPOSITORY}/worker:${IMAGE_TAG}"
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  build-metrics-exporter-image:
    name: Build Metrics Exporter
    # The metrics-exporter has its own independent versioning from the Camunda version
    # under test (it is normally kept at "latest" via the dedicated CI on main, see
    # camunda-load-test-metrics-exporter-ci.yaml). Only build here when a caller
    # explicitly asks to test a new metrics-exporter build via metrics-exporter-tag —
    # do not tie this to reuse-tag/orchestration-tag, which are about the Camunda images.
    if: ${{ inputs.metrics-exporter-tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-build
        with:
          dockerhub-readonly: true
          harbor: true
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push image
        working-directory: ./load-tests/metrics-exporter
        run: make docker "IMAGE=registry.camunda.cloud/team-reliability-testing/metrics-exporter:${IMAGE_TAG}" DOCKER_PUSH=true
        env:
          IMAGE_TAG: ${{ inputs.metrics-exporter-tag }}

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  deploy-cluster-under-test:
    name: Deploy cluster under test
    needs:
      - calculate-image-tag
      - build-camunda-image
      - build-load-test-images
      - build-metrics-exporter-image
    # To have the possibility to re-deploy the tests without rebuilding the images,
    # the deploy will be run, when build is skipped or successful.
    if: |
      always() &&
      needs.calculate-image-tag.result == 'success' &&
      (needs.build-camunda-image.result == 'success' || needs.build-camunda-image.result == 'skipped') &&
      (needs.build-load-test-images.result == 'success' || needs.build-load-test-images.result == 'skipped') &&
      (needs.build-metrics-exporter-image.result == 'success' || needs.build-metrics-exporter-image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Helm
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      # Authenticate with Teleport
      - name: Set up Teleport
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
            proxy: camunda.teleport.sh:443
            version: auto

      - name: Authenticate to Cluster using Teleport
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
            proxy: camunda.teleport.sh:443
            token: ${{ env.TELEPORT_JOIN_TOKEN }}
            kubernetes-cluster: ${{ env.CLUSTER }}

      - name: Print tool versions
        run: .github/scripts/load-test-print-tool-versions.sh

      - name: Scaffold load-test folder
        run: |
          cd load-tests/setup
          # The namespace label created-by will not be able resolve the actual user which triggered
          # the GitHub action by default. We need to correctly configure the git user here to make it work
          git config user.name "${GITHUB_ACTOR}"
          # Render the load-test folder. newLoadTest.sh no longer creates the namespace — that
          # happens on `make install` via `kubectl apply -f resources/namespace.yaml`.
          ./newLoadTest.sh --target-version "${TARGET_VERSION}" "${NAMESPACE}" "${SECONDARY_STORAGE_TYPE}" "${TTL}" "${ENABLE_OPTIMIZE}"

      - name: Install latest Camunda Platform
        shell: bash --noprofile --norc -exo pipefail {0}
        env:
          INSTALL_TARGET: ${{ inputs.stable-vms && 'install-stable' || 'install' }}
          CALCULATED_IMAGE_TAG: ${{ needs.calculate-image-tag.outputs.image-tag }}
          RESOLVED_IMAGE_REGISTRY: ${{ inputs.orchestration-tag != '' && 'docker.io' || 'registry.camunda.cloud' }}
          CAMUNDA_REPO: ${{ inputs.orchestration-tag != '' && 'camunda/camunda' || 'team-zeebe/camunda' }}
          OPTIMIZE_REPO: ${{ inputs.orchestration-tag != '' && 'camunda/optimize' || 'team-zeebe/optimize' }}
        run: |-
          .github/scripts/load-test-install-camunda-platform.sh \
            "${NAMESPACE}" \
            "${INSTALL_TARGET}" \
            "${CALCULATED_IMAGE_TAG}" \
            "${IMAGE_REPOSITORY}" \
            "${RESOLVED_IMAGE_REGISTRY}" \
            "${CAMUNDA_REPO}" \
            "${OPTIMIZE_REPO}" \
            "${PERFORM_READ_BENCHMARKS}" \
            "${ENABLE_OPTIMIZE}" \
            "${ENABLE_OPTIMIZE_METRICS}" \
            "${METRICS_EXPORTER_TAG}" \
            "${ENABLE_CHAOS}" \
            "${PHYSICAL_TENANT_COUNT}" \
            --optimize-tag "${OPTIMIZE_TAG}" \
            --orchestration-tag "${ORCHESTRATION_TAG}" \
            --identity-tag "${IDENTITY_TAG}" \
            --connectors-tag "${CONNECTORS_TAG}" \
            --load-test-load "${LOAD_TEST_LOAD}" \
            --platform-helm-values "${PLATFORM_HELM_VALUES}" \
            --load-test-setup-helm-values "${LOAD_TEST_SETUP_HELM_VALUES}" \
            --scenario "${SCENARIO}"

      - name: Annotate namespace with workflow run URL
        run: |
          # Traceability annotation, applied after `make install` has created the namespace.
          kubectl annotate namespace "${NAMESPACE}" \
            "github.com/workflow-run-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --overwrite

      - name: Summarize load test deployment
        if: success()
        run: .github/scripts/load-test-summary.sh "${NAMESPACE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
