# description: Collapses Renovate PRs that update the same dependency on different base branches onto a single assignee, so one engineer owns the whole bump instead of three reviewing a slice each.
# test location: .github/scripts/align-renovate-assignees.test.mjs
# type: CI Helper
# owner: @camunda/engineering-operations

---
name: Renovate Align Assignees

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log the intended assignee changes without applying them'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  align-assignees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      pull-requests: write # edit PR assignees
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Align assignees across sibling Renovate PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node .github/scripts/align-renovate-assignees.mjs

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
