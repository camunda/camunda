# description: Reusable workflow that re-runs the calling run's failed jobs when they were killed
#   by a runner shutdown (spot preemption, autoscaler scale-down, node eviction) rather than by a
#   real test failure. Self-hosted legs cut off this way log "The runner has received a shutdown
#   signal" or "lost communication with the server" and never report a verdict, so the run goes red
#   for a reason that says nothing about the code under test.
# type: CI
# owner: @camunda/data-layer
#
# The decision to rerun-failed-jobs workflow is made by .github/actions/detect-runner-shutdown,
# which reads the failed jobs' logs and only says yes when a shutdown message is present, so nights
# that fail for real cost nothing and genuine failures are never masked. Only failed jobs are
# re-run, so already-green jobs are left alone. Note the decision is per run rather than per job:
# once a shutdown is found anywhere, every failed job in the run is re-run, so a job that failed
# for real alongside a killed one is re-run too and simply fails again.
#
# Callers own the retry cap and the failure condition, since both live on the job that calls this
# workflow:
#
#   rerun-failed-jobs:
#     needs: [ job-a, job-b ]
#     if: failure() && fromJSON(github.run_attempt) < 3
#     uses: ./.github/workflows/rerun-failed-jobs-reusable.yml
#     with:
#       test_owner: '@camunda/data-layer'
#     secrets: inherit
#
# `needs`: list every job whose failure should be retried. Jobs on GitHub-hosted runners cannot be
# preempted, so they only need to be there when you want this job to see the whole failure surface.
# `github.run_id`: resolves to the caller's run even when the caller is itself a reusable workflow,
# which is what we want: the re-run then targets the run that actually holds the failed jobs.
#
# A Slack notification job in the same run should ask detect-runner-shutdown the same question and
# skip the send while `should-retry` is 'true'. Otherwise it alerts on the killed attempt, and again
# after the retry if that fails too, while a retry that passes leaves a false alarm behind.

name: Rerun failed jobs reusable

on:
  workflow_call:
    inputs:
      test_owner:
        required: true
        type: string
        description: >-
          Team owning the calling workflow, e.g. '@camunda/data-layer'. Used to attribute this job's
          build status in CI analytics.

jobs:
  rerun-failed-jobs:
    name: "Rerun jobs killed by runner shutdown"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Decide whether this run will be retried
        id: retry
        uses: ./.github/actions/detect-runner-shutdown
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The action dispatches a workflow in camunda/infra-global-github-actions that performs the
      # re-run asynchronously; nothing in this run learns whether it happened. With no
      # error-messages given it re-runs unconditionally, which is what we want here because the
      # decision has already been made above.
      - name: Rerun failed jobs on runner shutdown
        if: steps.retry.outputs.should-retry == 'true'
        uses: camunda/infra-global-github-actions/rerun-failed-run@7fe5cca167f7826bedbc078ae36ff2e974cc8cb5 # rerun-failed-run-1.1.3
        with:
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          vault-addr: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          job_name: "rerun-failed-jobs"
          build_status: ${{ job.status }}
          user_description: ${{ inputs.test_owner }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
