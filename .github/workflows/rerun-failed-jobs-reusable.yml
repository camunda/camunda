# description: Reusable workflow that re-runs the calling run's failed jobs when they were killed
#   by a runner shutdown (spot preemption, autoscaler scale-down, node eviction) rather than by a
#   real test failure. Self-hosted legs cut off this way log "The runner has received a shutdown
#   signal" or "lost communication with the server" and never report a verdict, so the run goes red
#   for a reason that says nothing about the code under test.
# type: CI
# owner: @camunda/data-layer
#
# The underlying action reads the run logs first and does nothing unless one of those messages is
# present, so nights that fail for real cost nothing and genuine failures are never masked. It
# re-runs failed jobs only, so already-green jobs are left alone. Note the log check is per run
# rather than per job: once a shutdown is found anywhere, every failed job in the run is re-run, so
# a job that failed for real alongside a killed one is re-run too and simply fails again.
#
# Callers own the retry cap and the failure condition, since both live on the job that calls this
# workflow:
#
#   rerun-failed-jobs:
#     needs: [ job-a, job-b ]
#     if: failure() && fromJSON(github.run_attempt) < 3
#     uses: ./.github/workflows/rerun-failed-jobs-reusable.yml
#     with:
#       test_owner: '@camunda/data-layer'
#     secrets: inherit
#
# `needs`: list every job whose failure should be retried. Jobs on GitHub-hosted runners cannot be
# preempted, so they only need to be there when you want this job to see the whole failure surface.
# `github.run_id`: resolves to the caller's run even when the caller is itself a reusable workflow,
# which is what we want: the re-run then targets the run that actually holds the failed jobs.

name: Rerun failed jobs reusable

on:
  workflow_call:
    inputs:
      test_owner:
        required: true
        type: string
        description: >-
          Team owning the calling workflow, e.g. '@camunda/data-layer'. Used to attribute this job's
          build status in CI analytics.

jobs:
  rerun-failed-jobs:
    name: "Rerun jobs killed by runner shutdown"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # A GitHub re-run always reuses this run's original commit; there is no way
      # to re-run on a newer one. If the branch is force-pushed after this run
      # started, that commit becomes unreachable and EVERY re-run of this run,
      # whether requested by the action below or by a human pressing "Re-run
      # failed jobs", dies as startup_failure with GitHub's generic "workflow
      # file issue" message that never mentions the real cause. So when the
      # commit is no longer on the branch, skip the doomed retry and leave a
      # warning annotation on this run saying what happened and what to do.
      - name: Check this run's commit is still on the branch
        id: rerunnable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          status=$(gh api "repos/${REPO}/compare/${SHA}...${BRANCH}" --jq .status 2>/dev/null || echo "unreachable")
          if [ "${status}" = "ahead" ] || [ "${status}" = "identical" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Auto-retry skipped, branch was force-pushed::Commit ${SHA} is no longer reachable from ${BRANCH} (compare status: ${status}). Re-running this run, including via the 'Re-run failed jobs' button, will fail at startup with GitHub's generic 'workflow file issue' message. Dispatch a fresh run of this workflow on ${BRANCH} instead."
          fi
      - name: Rerun failed jobs on runner shutdown
        if: steps.rerunnable.outputs.ok == 'true'
        uses: camunda/infra-global-github-actions/rerun-failed-run@7fe5cca167f7826bedbc078ae36ff2e974cc8cb5 # rerun-failed-run-1.1.3
        with:
          error-messages: |
            The runner has received a shutdown signal
            lost communication with the server
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          vault-addr: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          job_name: "rerun-failed-jobs"
          build_status: ${{ job.status }}
          user_description: ${{ inputs.test_owner }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
