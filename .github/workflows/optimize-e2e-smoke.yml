# description: Standalone Optimize Self-Managed E2E smoke tests. Extracted from the unified CI (ci-optimize.yml) so it runs independently and is not part of the merge-queue required checks.
# test location: /optimize/client/e2e/sm-tests
# type: CI
# owner: @camunda/bi-intelligence
name: Optimize E2E Smoke

on:
  push:
    branches:
      - main
      - stable/*
    paths:
      - optimize/**
      - configuration/**
      - webapps-common/**
      - webapps-schema/**
      - .github/actions/**
      - .github/optimize/scripts/**
      - .github/workflows/optimize-e2e-smoke.yml
  pull_request:
    paths:
      - optimize/**
      - configuration/**
      - webapps-common/**
      - webapps-schema/**
      - .github/actions/**
      - .github/optimize/scripts/**
      - .github/workflows/optimize-e2e-smoke.yml
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

permissions:
  contents: read

env:
  GHA_BEST_PRACTICES_LINTER: enabled
  TEST_PRODUCT: Optimize

jobs:
  optimize-e2e-smoke:
    name: "E2E / Self-Managed (Smoke)"
    runs-on: gcp-perf-core-8-default
    timeout-minutes: 30
    permissions: { }
    env:
      TEST_TYPE: E2E
      TEST_OWNER: '@camunda/bi-intelligence'

    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ee746fa695a43480b4294e944a6bf6e01b4f8459 # main
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Print metadata
        uses: ./.github/actions/print-metadata

      - uses: ./.github/actions/apt-fast-mirror-failover
      # Every network-bound, sudo'd step below is wrapped in its own `sudo timeout ...`
      # so a hang self-terminates inside the sudo'd root process tree instead of
      # requiring nick-fields/retry to kill across the privilege boundary -- doing
      # that externally throws `kill EPERM` and crashes instead of retrying, see
      # https://github.com/nick-fields/retry/issues/124. Budgeted against the 7-minute
      # outer timeout: 90s + 30s + 180s = 300s worst case, leaving 2 minutes of headroom
      # for the (fast, non-network) tee/verification steps and process overhead.
      # google-chrome-stable itself gets the largest share (180s): it and its
      # dependencies are a much bigger download than the other two apt calls.
      - name: Install Google Chrome
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 7
          shell: bash
          command: |
            set -euo pipefail

            if ! command -v google-chrome >/dev/null 2>&1; then
              sudo timeout 90 bash -c "apt-get update && apt-get install -y --no-install-recommends wget gnupg ca-certificates"

              sudo timeout 30 bash -o pipefail -c 'wget -qO- https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor --yes -o /usr/share/keyrings/google-chrome.gpg'

              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
                | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null

              sudo timeout 180 bash -c "apt-get update && apt-get install -y --no-install-recommends google-chrome-stable"
            fi

            google-chrome --version
            google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom about:blank >/dev/null

      - name: "Parse pom.xml for versions"
        id: "pom_info"
        uses: YunaBraska/java-info-action@085d09be3659b484e0a6d0c95aac6612687ce8d9 # 3.0.13
        with:
          work-dir: ./optimize

      - name: Setup Maven
        uses: ./.github/actions/setup-build
        with:
          maven-cache-key-modifier: optimize-e2e-smoke
          time-zone: Europe/Berlin
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}

      - name: Build frontend
        uses: ./.github/actions/build-frontend
        with:
          directory: ./optimize/client

      - name: Start services (Camunda, Keycloak, Identity and Elasticsearch)
        uses: ./.github/actions/compose
        with:
          compose_file: optimize/client/docker-compose.yml
          project_name: e2e
          additional_flags: "--profile self-managed"
        env:
          CAMUNDA_VERSION: ${{ steps.pom_info.outputs.x_camunda_docker_version }}

      - uses: ./.github/actions/build-zeebe
        id: build-camunda
        with:
          maven-extra-args: -PskipFrontendBuild -Dskip.docker

      - name: Create backend logs file
        run: mkdir -p ./optimize/client/build && touch ./optimize/client/build/backendLogs.log

      - name: Start backend
        working-directory: ./optimize/client
        run: |
          yarn run start-backend ci &> ./build/backendLogs.log &

      - name: Start frontend
        working-directory: ./optimize/client
        run: yarn start &

      - name: Wait for import to complete
        run: ./.github/optimize/scripts/wait-for-import.sh

      - name: Wait for frontend to start
        run: ./.github/optimize/scripts/wait-for.sh http://localhost:3000/ready

      - name: Run smoke tests
        working-directory: ./optimize/client
        run: yarn run e2e:ci:sm:smoke:headless

      - name: Upload logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: optimize-e2e-smoke-logs
          path: |
            ./optimize/client/build/*.log
            ./optimize/client/build/smoke-test-results.txt
            ./optimize/client/build/screenshots/
            ./optimize/client/build/videos/

      - name: Docker log dump
        uses: ./.github/actions/docker-logs
        if: always()
        continue-on-error: true
        with:
          archive_name: optimize-e2e-smoke-docker-logs

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
