# description: Optimize Self-Managed E2E tests (Playwright) against a real Camunda, Identity and Elasticsearch stack. Runs independently of the unified CI (ci-optimize.yml) and is not part of the merge-queue required checks.
# test location: /optimize/client/e2e
# type: CI
# owner: @camunda/bi-intelligence
name: Optimize E2E

on:
  push:
    branches:
      - main
      - stable/*
    paths:
      - optimize/**
      - configuration/**
      - webapps-common/**
      - webapps-schema/**
      - .github/actions/**
      - .github/optimize/scripts/**
      - .github/workflows/optimize-e2e-smoke.yml
  pull_request:
    paths:
      - optimize/**
      - configuration/**
      - webapps-common/**
      - webapps-schema/**
      - .github/actions/**
      - .github/optimize/scripts/**
      - .github/workflows/optimize-e2e-smoke.yml
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Re-render the visual baselines and upload them as an artifact instead of running the tests
        type: boolean
        default: false

# Limit workflow to 1 concurrent run per ref (branch) and trigger event (push/schedule/etc): new commit -> old runs are canceled to save costs
# Exception for main + stable/* branches: complete builds for every commit needed for confidenence
# Exception for deploy jobs that have to wait for each other to avoid overwriting
concurrency:
  cancel-in-progress: true
  group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name, (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/stable/')) && github.sha || github.ref) }}

defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

permissions:
  contents: read

env:
  GHA_BEST_PRACTICES_LINTER: enabled
  TEST_PRODUCT: Optimize
  TEST_OWNER: '@camunda/optimize'

jobs:
  optimize-e2e-smoke:
    name: "E2E / Self-Managed"
    runs-on: gcp-perf-core-8-default
    timeout-minutes: 30
    permissions: { }
    env:
      TEST_TYPE: E2E
      CAMUNDA_IMAGE: camunda/camunda:current-test
      CAMUNDA_PULL_POLICY: never

    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ee746fa695a43480b4294e944a6bf6e01b4f8459 # main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Print metadata
        uses: ./.github/actions/print-metadata

      - uses: ./.github/actions/apt-fast-mirror-failover

      - name: "Parse pom.xml for versions"
        id: "pom_info"
        uses: YunaBraska/java-info-action@085d09be3659b484e0a6d0c95aac6612687ce8d9 # 3.0.13
        with:
          work-dir: ./optimize

      - name: Setup Maven
        uses: ./.github/actions/setup-build
        with:
          maven-cache-key-modifier: optimize-e2e-smoke
          minimus: true
          time-zone: Europe/Berlin
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}

      # Built before the backend, which serves this build to clients without a session (e.g. login).
      - name: Build frontend
        uses: ./.github/actions/build-frontend
        with:
          directory: ./optimize/client

      # Fail fast on e2e lint/type errors before the expensive backend build.
      - name: Lint e2e tests
        working-directory: ./optimize/client
        run: yarn e2e:lint

      - name: Install Playwright browser
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 6
          shell: bash
          command: cd optimize/client && npx playwright install --with-deps chromium

      - uses: ./.github/actions/build-zeebe
        id: build-camunda
        with:
          maven-extra-args: -PskipFrontendBuild -Dskip.docker

      - name: Build Camunda image under test
        uses: ./.github/actions/build-platform-docker
        with:
          repository: camunda/camunda
          version: current-test
          distball: ${{ steps.build-camunda.outputs.distball }}

      - name: Start services (Camunda, Keycloak, Identity and Elasticsearch)
        uses: ./.github/actions/compose
        with:
          compose_file: optimize/client/docker-compose.yml
          project_name: e2e
          additional_flags: "--profile self-managed"
        env:
          CAMUNDA_VERSION: ${{ steps.pom_info.outputs.x_camunda_docker_version }}

      - name: Create backend logs file
        run: mkdir -p ./optimize/client/build && touch ./optimize/client/build/backendLogs.log

      - name: Start backend
        working-directory: ./optimize/client
        run: |
          yarn run start-backend ci &> ./build/backendLogs.log &

      - name: Wait for backend to start
        run: ./.github/optimize/scripts/wait-for.sh http://localhost:8090/api/readyz

      # Playwright starts the frontend dev server, seeds the data and waits for the import itself.
      - name: Run E2E tests
        if: ${{ !inputs.update-snapshots }}
        working-directory: ./optimize/client
        run: yarn e2e

      - name: Update visual baselines
        if: ${{ inputs.update-snapshots }}
        working-directory: ./optimize/client
        run: yarn e2e:visual:update

      - name: Upload visual baselines
        if: ${{ inputs.update-snapshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: optimize-e2e-visual-baselines
          path: ./optimize/client/e2e/visual/__screenshots__/

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: optimize-e2e-report
          path: |
            ./optimize/client/e2e/playwright-report/
            ./optimize/client/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: optimize-e2e-smoke-logs
          path: ./optimize/client/build/*.log

      - name: Docker log dump
        uses: ./.github/actions/docker-logs
        if: always()
        continue-on-error: true
        with:
          archive_name: optimize-e2e-smoke-docker-logs

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
