# description: Daily cleanup — closes open failing-test-fix PRs from the previous
#              day that were not merged. Runs before the morning triage so the triage
#              agent starts each day with no in-flight bot PRs blocking dispatch.
#
# Pairing:
#   03:00 UTC Mon-Fri  c8-orchestration-cluster-e2e-nightly-close-stale-fix-prs.yml (this)
#   04:00 UTC Mon-Fri  c8-orchestration-cluster-e2e-nightly-triage.yml
#
# Targets: PRs labelled "failing-test-fix" opened by the nightly fix agent.
#
# Single exception: PRs labelled "do-not-close" are kept across days. That label is
# the only way for a reviewer to hold a bot PR. Review comments alone do NOT keep a
# PR alive — merge it the same day or apply the label.
# type: CI
# owner: @camunda/test-automation-team
---
name: Close Stale Fix PRs

on:
  schedule:
    - cron: '0 3 * * 1-5' # 03:00 UTC Mon-Fri, 1h before triage
  workflow_dispatch:
    inputs:
      stale_days:
        description: 'Close PRs created more than N days ago (default 1 — daily fresh start)'
        default: '1'
        required: false
      dry_run:
        description: 'Print actions but do not close anything'
        type: boolean
        default: false
        required: false

permissions:
  # write, and only for one reason: `--delete-branch` on `gh pr close` deletes a
  # ref, which is a contents mutation. It was briefly reduced to read while the
  # sweeper kept branches so triage could reopen them; triage now restores the
  # branch from the PR's head commit instead, so deleting is safe again and this
  # has to go back. Nothing else here writes contents.
  contents: write
  pull-requests: write

env:
  TEST_OWNER: '@camunda/test-automation-team'

jobs:
  close-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Identify and close stale fix PRs
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          STALE_DAYS: ${{ inputs.stale_days || '1' }}
          # Read back by .github/scripts/nightly-fix-reopen.sh to identify a PR
          # this workflow closed, as opposed to one a human closed.
          STALE_CLOSED_LABEL: auto-closed-stale
          STALE_CLOSE_MARKER: stale-sweeper-closed
          DRY_RUN:    ${{ inputs.dry_run || 'false' }}
          REPO:       ${{ github.repository }}
        run: |
          set -euo pipefail

          cutoff_epoch=$(date -u -d "${STALE_DAYS} days ago" +%s 2>/dev/null \
                       || date -u -v-"${STALE_DAYS}"d +%s)
          echo "Closing PRs created before $(date -u -d "@${cutoff_epoch}" +%FT%TZ 2>/dev/null || echo "${STALE_DAYS} days ago")"
          echo "Dry-run: ${DRY_RUN}"

          # Pull all open PRs with the bot label, excluding those held by do-not-close.
          mapfile -t prs < <(
            gh pr list \
              --repo "$REPO" \
              --state open \
              --limit 200 \
              --json number,url,title,createdAt,labels \
              --jq '
                .[] |
                select(
                  ([.labels[].name] | any(. == "failing-test-fix"))
                  and ([.labels[].name] | any(. == "do-not-close") | not)
                ) |
                @json
              '
          )

          closed=0
          kept=0
          for raw in "${prs[@]}"; do
            number=$(echo "$raw"  | jq -r '.number')
            title=$(echo "$raw"   | jq -r '.title')
            created=$(echo "$raw" | jq -r '.createdAt')

            created_epoch=$(date -u -d "$created" +%s 2>/dev/null \
                          || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$created" +%s 2>/dev/null \
                          || echo 0)

            if [ "$created_epoch" -ge "$cutoff_epoch" ]; then
              echo "  KEEP   #$number — created $created (within window): $title"
              kept=$((kept + 1))
              continue
            fi

            echo "  CLOSE  #$number — created $created: $title"
            if [ "$DRY_RUN" != "true" ]; then
              # Labelled BEFORE the close, so the marker is on the PR even if
              # the close itself fails. Triage reads this label to tell a PR
              # THIS workflow closed from one a human closed deliberately: the
              # first may be reopened tonight, the second never may be.
              # Best-effort — the comment marker below covers a token that
              # cannot apply it, and PRs closed before this shipped.
              gh label create "$STALE_CLOSED_LABEL" \
                --repo "$REPO" --color "BFBFBF" \
                --description "Closed automatically by close-stale-fix-prs; triage may reopen it" \
                >/dev/null 2>&1 || true
              gh pr edit "$number" --repo "$REPO" \
                --add-label "$STALE_CLOSED_LABEL" >/dev/null 2>&1 || true

              close_comment=$(printf '%s\n\n%s\n\n%s' \
                "Closed by close-stale-fix-prs workflow: bot PRs are closed daily before triage. Add the \`do-not-close\` label to hold this PR across the daily reset, or re-trigger the fix agent to start fresh." \
                "The branch is deleted, but tonight's triage can still reopen this PR: it restores the branch from the PR's own head commit first." \
                "<!-- ${STALE_CLOSE_MARKER} at=$(date -u +%FT%TZ) v=1 -->")

              # --delete-branch is back: triage no longer needs the branch to
              # survive. `gh pr reopen` does need a live head ref, but the
              # commits remain reachable as refs/pull/<n>/head, so the reopen
              # path recreates the branch at the PR's recorded head commit
              # first (.github/scripts/nightly-fix-reopen.sh:restore_branch).
              # Keeping branches instead would leave every unmerged fix branch
              # lying around with nothing reaping them.
              gh pr close "$number" \
                --repo "$REPO" \
                --delete-branch \
                --comment "$close_comment" \
                || echo "::warning::Failed to close #$number"
            fi
            closed=$((closed + 1))
          done

          echo ""
          echo "Result: ${closed} closed, ${kept} kept"
          {
            printf '## Close Stale Fix PRs\n\n'
            printf 'Threshold: **%s days**, dry-run: **%s**\n\n' "$STALE_DAYS" "$DRY_RUN"
            printf -- '- Closed: **%s**\n' "$closed"
            printf -- "- Kept (within window or \`do-not-close\` label): **%s**\n" "$kept"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
