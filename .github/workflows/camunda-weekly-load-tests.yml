# description: Runs weekly load tests against main and every supported stable branch.
#              Main: parallel endurance tests (realistic, rdbms-realistic (PostgreSQL),
#              opensearch-realistic, ECS), TTL 28 days.
#              Stable branches (8.7, 8.8, 8.9): one realistic-workload load test each, TTL 7
#              days, as a stability signal between patch releases.
#              Naming pattern: medic-YYYY-WW-<sha> (main),
#              weekly-YYYY-WW-<sha>-stable-<branch> (stable).
# calls: camunda-load-test.yml (3 parallel calls, one per main scenario) +
#        camunda-ecs-weekly-load-test.yml (1 parallel call) — 4 load tests on main +
#        camunda-load-test.yml@stable/8.x (one call per stable branch, cross-branch ref) —
#        each stable branch's own copy already sparse-checks-out its
#        load-tests/setup/stable-8x folder from main, so no backport is needed to pick up
#        setup changes.
# type: CI
# owner: @camunda/reliability-testing
name: Camunda weekly load tests
on:
  workflow_dispatch:
     inputs:
      reuse-tag:
        description: 'Docker image tag, that should be reused for the weekly main load tests. Allows to skip the docker image build step, can be used for recreating previous weekly tests. Does not affect the stable-branch load tests.'
        type: string
        default: ""
        required: false
      ttl:
        description: 'Specifies after how many days the weekly main load test namespaces should be deleted. Useful to adjust if we recreate the weekly tests. Does not affect the stable-branch load tests, which are fixed at 7 days.'
        type: number
        default: 28
        required: false
  schedule:
    # Runs at 1am every monday https://crontab.guru/#0_1_*_*_1
    - cron: 0 1 * * 1

defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

env:
  TEST_OWNER: '@camunda/reliability-testing'
  IMAGE_REPOSITORY: registry.camunda.cloud/team-zeebe
  REUSE_TAG: ${{ inputs.reuse-tag }}

jobs:
  test-data:
    name: Collect test data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    outputs:
      image-tag: ${{ steps.data.outputs.image-tag }}
      week-id: ${{ steps.data.outputs.week-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect test data
        id: data
        run: |
          suffix="$(date --utc "+%G-%V")-$(git rev-parse --short HEAD)"
          echo "week-id=${suffix}" >> "$GITHUB_OUTPUT"
          if [[ -z "$REUSE_TAG" ]]; then
            echo "Creating new weekly test tag"
            echo "image-tag=medic-${suffix}" >> "$GITHUB_OUTPUT"
          else
            echo "Re-creating weekly test, with tag: $REUSE_TAG"
            echo "image-tag=$REUSE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  build-camunda-image:
    name: Build Camunda Image
    needs: test-data
    if: ${{ inputs.reuse-tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          dockerhub-readonly: true
          harbor: true
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          minimus: true
      - uses: ./.github/actions/build-frontend
        name: Build Operate Frontend
        with:
          directory: ./operate/client
          package-manager: "npm"
      - uses: ./.github/actions/build-frontend
        name: Build Unified Webapp Frontend
        with:
          directory: ./webapp/client
          package-manager: "npm"
      - uses: ./.github/actions/build-frontend
        name: Build Identity Frontend
        with:
          directory: ./identity/client
          package-manager: "npm"
      - uses: ./.github/actions/build-frontend
        name: Build Optimize Frontend
        with:
          directory: ./optimize/client
          package-manager: "yarn"
      - uses: ./.github/actions/build-zeebe
        name: Build Camunda Platform
        id: build-camunda
        with:
          maven-extra-args: -PskipFrontendBuild -Pinclude-optimize
      - uses: ./.github/actions/build-platform-docker
        name: Build and Push Camunda Docker Image
        with:
          repository: '${{ env.IMAGE_REPOSITORY }}/camunda'
          push: true
          version: ${{ needs.test-data.outputs.image-tag }}
          distball: ${{ steps.build-camunda.outputs.distball }}
          dockerfile: 'camunda.Dockerfile'
      - uses: ./.github/actions/build-platform-docker
        name: Build Optimize Docker Image
        with:
          repository: '${{ env.IMAGE_REPOSITORY }}/optimize'
          push: true
          version: ${{ needs.test-data.outputs.image-tag }}
          distball: 'optimize-distro/target/camunda-optimize-*.tar.gz'
          dockerfile: 'optimize.Dockerfile'
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  build-load-test-images:
    name: Build Starter and Worker
    needs: test-data
    if: ${{ inputs.reuse-tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          dockerhub-readonly: true
          harbor: true
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
      - run: ./mvnw -B -DskipTests -DskipChecks -P\!include-optimize -pl load-tests/load-tester -am install
      - name: Build Starter Image
        run: ./mvnw -pl load-tests/load-tester jib:build -P starter -P\!include-optimize -D image="${IMAGE_REPOSITORY}/starter:${IMAGE_TAG}"
        env:
          IMAGE_TAG: ${{ needs.test-data.outputs.image-tag }}
      - name: Build Worker Image
        run: ./mvnw -pl load-tests/load-tester jib:build -P worker -P\!include-optimize -D image="${IMAGE_REPOSITORY}/worker:${IMAGE_TAG}"
        env:
          IMAGE_TAG: ${{ needs.test-data.outputs.image-tag }}
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  setup-rdbms-realistic-load-test:
    name: Postgres realistic load test
    needs:
      - test-data
      - build-camunda-image
      - build-load-test-images
    if: |
      always() &&
      needs.test-data.result == 'success' &&
      (needs.build-camunda-image.result == 'success' || needs.build-camunda-image.result == 'skipped') &&
      (needs.build-load-test-images.result == 'success' || needs.build-load-test-images.result == 'skipped')
    uses: ./.github/workflows/camunda-load-test.yml
    secrets: inherit
    with:
      name: ${{ needs.test-data.outputs.image-tag }}-rdbms-realistic
      ttl: ${{ fromJSON(inputs.ttl || '28') }}
      reuse-tag: ${{ needs.test-data.outputs.image-tag }}
      secondary-storage-type: 'postgresql'
      scenario: realistic

  setup-opensearch-realistic-load-test:
    name: OpenSearch realistic load test
    needs:
      - test-data
      - build-camunda-image
      - build-load-test-images
    if: |
      always() &&
      needs.test-data.result == 'success' &&
      (needs.build-camunda-image.result == 'success' || needs.build-camunda-image.result == 'skipped') &&
      (needs.build-load-test-images.result == 'success' || needs.build-load-test-images.result == 'skipped')
    uses: ./.github/workflows/camunda-load-test.yml
    secrets: inherit
    with:
      name: ${{ needs.test-data.outputs.image-tag }}-opensearch-realistic
      ttl: ${{ fromJSON(inputs.ttl || '28') }}
      reuse-tag: ${{ needs.test-data.outputs.image-tag }}
      secondary-storage-type: 'opensearch'
      scenario: realistic

  setup-realistic-test:
    name: Realistic load test
    uses: ./.github/workflows/camunda-load-test.yml
    secrets: inherit
    needs:
      - test-data
      - build-camunda-image
      - build-load-test-images
    if: |
      always() &&
      needs.test-data.result == 'success' &&
      (needs.build-camunda-image.result == 'success' || needs.build-camunda-image.result == 'skipped') &&
      (needs.build-load-test-images.result == 'success' || needs.build-load-test-images.result == 'skipped')
    with:
      name: ${{ needs.test-data.outputs.image-tag }}-realistic
      ttl: ${{ fromJSON(inputs.ttl || '28') }}
      reuse-tag: ${{ needs.test-data.outputs.image-tag }}
      scenario: realistic

  setup-ecs-benchmark:
    name: ECS Weekly Benchmark
    needs:
      - test-data
      - build-camunda-image
      - build-load-test-images
    # ECS benchmark identity is derived from the current calendar week and a live scan of
    # running ECS services, with no notion of reuse-tag. Re-running with reuse-tag set is only
    # meant to recreate a specific week's Helm-based load tests; ECS doesn't support updating an
    # existing week's benchmark in place, so skip it entirely in that case.
    if: |
      always() &&
      inputs.reuse-tag == '' &&
      needs.test-data.result == 'success' &&
      (needs.build-camunda-image.result == 'success' || needs.build-camunda-image.result == 'skipped') &&
      (needs.build-load-test-images.result == 'success' || needs.build-load-test-images.result == 'skipped')
    uses: ./.github/workflows/camunda-ecs-weekly-load-test.yml
    secrets: inherit
    with:
      image_tag: ${{ needs.test-data.outputs.image-tag }}
      environment: prod
      skip_destroy_previous: false

  # One job per supported stable branch, each calling that branch's own copy of
  # camunda-load-test.yml (cross-branch `uses:`, matching camunda-scheduled-release-load-tests.yml).
  # `ref` is left unset, so it defaults to the branch itself, building fresh from its tip.
  # When a branch is deprecated, remove its job; when a new minor version becomes stable, add one.
  # Deliberately not passed `reuse-tag: needs.test-data.outputs.image-tag` — that tag is a build
  # of `main`, and reusing it here would deploy main's image under a stable branch.
  # Each job will build its own Docker image from that branch's tip.
  weekly-8-7:
    name: Weekly load test (stable/8.7)
    needs: test-data
    uses: camunda/camunda/.github/workflows/camunda-load-test.yml@stable/8.7
    secrets: inherit
    with:
      name: ${{ needs.test-data.outputs.image-tag }}-stable-87
      scenario: realistic
      secondary-storage-type: elasticsearch
      ttl: 7

  weekly-8-8:
    name: Weekly load test (stable/8.8)
    needs: test-data
    uses: camunda/camunda/.github/workflows/camunda-load-test.yml@stable/8.8
    secrets: inherit
    with:
      name: ${{ needs.test-data.outputs.image-tag }}-stable-88
      scenario: realistic
      secondary-storage-type: elasticsearch
      ttl: 7

  weekly-8-9:
    name: Weekly load test (stable/8.9)
    needs: test-data
    uses: camunda/camunda/.github/workflows/camunda-load-test.yml@stable/8.9
    secrets: inherit
    with:
      name: ${{ needs.test-data.outputs.image-tag }}-stable-89
      scenario: realistic
      secondary-storage-type: elasticsearch
      ttl: 7

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs:
      - build-camunda-image
      - build-load-test-images
      - setup-rdbms-realistic-load-test
      - setup-opensearch-realistic-load-test
      - setup-realistic-test
      - setup-ecs-benchmark
      - weekly-8-7
      - weekly-8-8
      - weekly-8-9
    if: failure()
    timeout-minutes: 5
    permissions: { }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import Slack webhook from Vault
        id: slack-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda/ci/github-actions SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL;
      - id: slack-notify
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ steps.slack-secrets.outputs.SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":warning: *Weekly load test creation failed:*"
              - type: section
                text:
                  type: mrkdwn
                  text: "@reliability-testing-team Please check the related workflow execution: https://github.com/camunda/camunda/actions/runs/${{ github.run_id }}"

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
