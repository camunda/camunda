# description: Orchestrates weekday release load tests across all active stable branches and main.
#              Each branch has a pinned release tag, defined once via the RELEASE_TAG_* env vars
#              below. These patch pins DO need periodic manual updates (e.g., 8.8.17 -> 8.8.18) to
#              avoid version skew between the load-test client and the pinned server tag. The Slack
#              "Tested versions" notification reads the same env vars (via the `versions` job's
#              outputs), so it stays in sync with the pinned tags automatically.
# calls: camunda-release-load-test.yaml (one call per branch),
#        camunda-verify-and-cleanup-load-test.yml (verify + delete namespace per branch)
# notifications: Slack (#reliability-testing-alerts) with per-branch results
# type: CI
# owner: @camunda/reliability-testing
name: Scheduled Camunda Release Load Tests
on:
  schedule:
    - cron: '0 2 * * 1-5' # every weekday (Mon-Fri) at 02:00 UTC
  workflow_dispatch: {}

defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

env:
  TEST_OWNER: '@camunda/reliability-testing'
  CLUSTER: camunda-benchmark-prod
  TELEPORT_JOIN_TOKEN: infra-benchmark-prod-github-action-zeebe
  # Single source of truth for the pinned release tag per branch. Update these when a patch
  # release should be picked up — see the `versions` job below for how they reach both the
  # `with: tag:` inputs and the Slack "Tested versions" notification without duplication.
  RELEASE_TAG_8_7: '8.7.37'
  RELEASE_TAG_8_8: '8.8.35'
  RELEASE_TAG_8_9: '8.9.16'
  RELEASE_TAG_MAIN: '8.9.16'

jobs:
  # Resolves the RELEASE_TAG_* env vars into job outputs. This indirection exists because
  # `with:` inputs on a job that calls a reusable workflow (`uses:`) cannot read the `env`
  # context directly — only `github`, `needs`, `inputs`, `strategy`, `matrix`, and `vars` are
  # available there. Exposing the tags as outputs of a small steps-based job lets every
  # consumer (the load-test jobs' `with: tag:` and the Slack payload) reference the exact same
  # value via `needs.versions.outputs.*`, so they can never drift apart.
  versions:
    name: Resolve release tags
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag_8_7: ${{ steps.tags.outputs.tag_8_7 }}
      tag_8_8: ${{ steps.tags.outputs.tag_8_8 }}
      tag_8_9: ${{ steps.tags.outputs.tag_8_9 }}
      tag_main: ${{ steps.tags.outputs.tag_main }}
    steps:
      - id: tags
        run: |
          echo "tag_8_7=${RELEASE_TAG_8_7}" >> "$GITHUB_OUTPUT"
          echo "tag_8_8=${RELEASE_TAG_8_8}" >> "$GITHUB_OUTPUT"
          echo "tag_8_9=${RELEASE_TAG_8_9}" >> "$GITHUB_OUTPUT"
          echo "tag_main=${RELEASE_TAG_MAIN}" >> "$GITHUB_OUTPUT"

  # Stable branch load tests — one job per active branch.
  # Release tags are pinned once via the RELEASE_TAG_* env vars above (surfaced here through the
  # `versions` job's outputs). These patch pins DO need periodic manual updates
  # (e.g., 8.8.17 -> 8.8.18) to avoid version skew between the load-test client and the pinned
  # server tag — bumping the env var above is the only change needed; the Slack notification
  # stays in sync automatically since it reads the same output.
  #
  # When to update:
  # - A patch release should be tested: bump the matching RELEASE_TAG_* env var above
  # - A new minor version is released (e.g., 8.10): add a new job + RELEASE_TAG_* env var and update verify-and-cleanup/notify
  # - A stable branch is deprecated: remove the corresponding job + env var and update verify-and-cleanup/notify
  release-load-test-8-7:
    name: Release load test (stable/8.7)
    needs: [versions]
    uses: camunda/camunda/.github/workflows/camunda-release-load-test.yaml@stable/8.7
    secrets: inherit
    with:
      name: schedule-release-8-7-x
      tag: ${{ needs.versions.outputs.tag_8_7 }}

  release-load-test-8-8:
    name: Release load test (stable/8.8)
    needs: [versions]
    uses: camunda/camunda/.github/workflows/camunda-release-load-test.yaml@stable/8.8
    secrets: inherit
    with:
      name: schedule-release-8-8-x
      tag: ${{ needs.versions.outputs.tag_8_8 }}

  release-load-test-8-9:
    name: Release load test (stable/8.9)
    needs: [versions]
    uses: camunda/camunda/.github/workflows/camunda-release-load-test.yaml@stable/8.9
    secrets: inherit
    with:
      name: schedule-release-8-9-x
      tag: ${{ needs.versions.outputs.tag_8_9 }}

  release-load-test-main:
    name: Release load test (main)
    needs: [versions]
    uses: ./.github/workflows/camunda-release-load-test.yaml
    secrets: inherit
    with:
      name: schedule-release-main
      tag: ${{ needs.versions.outputs.tag_main }}

  # Verify and cleanup jobs — one per branch, run in parallel.
  # Each job waits for pods + gateway connectivity, then deletes the namespace.
  verify-and-cleanup-8-7:
    name: Verify and cleanup (stable/8.7)
    needs: [release-load-test-8-7]
    if: always()
    uses: ./.github/workflows/camunda-verify-and-cleanup-load-test.yml
    secrets: inherit
    with:
      namespace: c8-schedule-release-8-7-x

  verify-and-cleanup-8-8:
    name: Verify and cleanup (stable/8.8)
    needs: [release-load-test-8-8]
    if: always()
    uses: ./.github/workflows/camunda-verify-and-cleanup-load-test.yml
    secrets: inherit
    with:
      namespace: c8-schedule-release-8-8-x

  verify-and-cleanup-8-9:
    name: Verify and cleanup (stable/8.9)
    needs: [release-load-test-8-9]
    if: always()
    uses: ./.github/workflows/camunda-verify-and-cleanup-load-test.yml
    secrets: inherit
    with:
      namespace: c8-schedule-release-8-9-x

  verify-and-cleanup-main:
    name: Verify and cleanup (main)
    needs: [release-load-test-main]
    if: always()
    uses: ./.github/workflows/camunda-verify-and-cleanup-load-test.yml
    secrets: inherit
    with:
      namespace: c8-schedule-release-main

  notify-on-success:
    name: Notify on success
    runs-on: ubuntu-latest
    needs: [versions, verify-and-cleanup-8-7, verify-and-cleanup-8-8, verify-and-cleanup-8-9, verify-and-cleanup-main]
    if: >-
      always() &&
      needs.verify-and-cleanup-8-7.result == 'success' &&
      needs.verify-and-cleanup-8-8.result == 'success' &&
      needs.verify-and-cleanup-8-9.result == 'success' &&
      needs.verify-and-cleanup-main.result == 'success'
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import Slack webhook from Vault
        id: slack-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda/ci/github-actions SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL;
      - id: slack-notify
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ steps.slack-secrets.outputs.SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |-
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":white_check_mark: *Daily release load tests completed successfully.*"

              - type: section
                text:
                  type: mrkdwn
                  text: |-
                    *Tested versions:*
                    • stable/8.7: `${{ needs.versions.outputs.tag_8_7 }}` (${{ needs.verify-and-cleanup-8-7.result }})
                    • stable/8.8: `${{ needs.versions.outputs.tag_8_8 }}` (${{ needs.verify-and-cleanup-8-8.result }})
                    • stable/8.9: `${{ needs.versions.outputs.tag_8_9 }}` (${{ needs.verify-and-cleanup-8-9.result }})
                    • main: `${{ needs.versions.outputs.tag_main }}` (${{ needs.verify-and-cleanup-main.result }})

              - type: context
                elements:
                  - type: mrkdwn
                    text: <https://github.com/camunda/camunda/actions/runs/${{ github.run_id }}|Workflow run>

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [verify-and-cleanup-8-7, verify-and-cleanup-8-8, verify-and-cleanup-8-9, verify-and-cleanup-main]
    if: >-
      always() &&
      (needs.verify-and-cleanup-8-7.result == 'failure' ||
      needs.verify-and-cleanup-8-8.result == 'failure' ||
      needs.verify-and-cleanup-8-9.result == 'failure' ||
      needs.verify-and-cleanup-main.result == 'failure')
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import Slack webhook from Vault
        id: slack-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda/ci/github-actions SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL;
      - id: slack-notify
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ steps.slack-secrets.outputs.SLACK_ZEEBOT_RELIABILITY_TESTING_ALERTS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |-
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":alarm: *Scheduled release load test verification failed:*"

              - type: section
                text:
                  type: mrkdwn
                  text: |-
                    *Job results:*
                    • stable/8.7: ${{ needs.verify-and-cleanup-8-7.result }}
                    • stable/8.8: ${{ needs.verify-and-cleanup-8-8.result }}
                    • stable/8.9: ${{ needs.verify-and-cleanup-8-9.result }}
                    • main: ${{ needs.verify-and-cleanup-main.result }}

              - type: section
                text:
                  type: mrkdwn
                  text: "@reliability-testing-team Please check: https://github.com/camunda/camunda/actions/runs/${{ github.run_id }}"

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
