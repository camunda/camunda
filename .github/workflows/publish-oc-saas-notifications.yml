# description: Publishes the raw TypeScript @camunda/oc-saas-notifications package to npm. Published at: https://www.npmjs.com/package/@camunda/oc-saas-notifications
# test location: webapp/client/packages/oc-saas-notifications
# type: CI Helper - Manual
# owner: @camunda/orchestration-cluster-webapps
---
name: Publish OC SaaS Notifications to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (does not publish)'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-oc-saas-notifications.yml'
      - 'webapp/client/packages/oc-saas-notifications/**'

permissions: {}

env:
  TEST_OWNER: '@camunda/orchestration-cluster-webapps'
  GHA_BEST_PRACTICES_LINTER: enabled
  CLIENT_DIR: webapp/client

jobs:
  publish-oc-saas-notifications:
    name: "Publish @camunda/oc-saas-notifications"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
        shell: bash
    env:
      TEST_PRODUCT: Camunda
      TEST_TYPE: Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print metadata
        uses: ./.github/actions/print-metadata

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@camunda'

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          directory: ${{ env.CLIENT_DIR }}

      - name: Validate package
        run: |
          npm run typecheck -w @camunda/oc-saas-notifications
          npm pack --dry-run -w @camunda/oc-saas-notifications

      - name: Publish to npm (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --tag next -w @camunda/oc-saas-notifications --provenance

      - name: Publish to npm
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: npm run publish:oc-saas-notifications -- --provenance

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
