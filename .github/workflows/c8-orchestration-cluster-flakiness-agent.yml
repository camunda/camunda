# description: Reusable workflow — one fix attempt of the OC flakiness fix agent.
#              Claude Code reads the flaky test and the failures of the previous
#              validation pass, edits the suite, and this workflow lints, commits
#              and pushes the result to the flaky-fix branch. It opens no PR: that
#              is decided by c8-orchestration-cluster-flakiness-fix.yml once the
#              fix has been validated.
# test location: /qa/c8-orchestration-cluster-e2e-test-suite
# type: CI
# owner: @camunda/test-automation-team
---
name: C8 Orchestration Cluster - Flakiness Agent

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      target_ref:
        description: "stable/<version> or main"
        required: true
        type: string
      branch:
        description: "flaky-fix branch to push to"
        required: true
        type: string
      base:
        description: "target: start from target_ref; iter1: build on the branch as pushed"
        required: true
        type: string
      iteration:
        required: true
        type: number
      spec:
        required: true
        type: string
      title_path:
        required: true
        type: string
      project:
        required: true
        type: string
      cells:
        required: true
        type: string
      evidence:
        description: 'JSON array of earlier pass labels whose artifacts the agent reads, e.g. ["baseline","iter1"]'
        required: true
        type: string
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_ROLE_ID:
        required: true
      VAULT_SECRET_ID:
        required: true
    outputs:
      changed:
        description: "true when a commit was pushed"
        value: ${{ jobs.fix.outputs.changed }}
      sha:
        value: ${{ jobs.fix.outputs.sha }}

permissions:
  contents: read

env:
  TEST_OWNER: '@camunda/test-automation-team'

jobs:
  fix:
    name: Fix attempt ${{ inputs.iteration }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      changed: ${{ steps.push.outputs.changed }}
      sha: ${{ steps.push.outputs.sha }}
    env:
      SUITE_PATH: qa/c8-orchestration-cluster-e2e-test-suite
    steps:
      - name: Record job start time
        id: job_start
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout main for workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/oc-flakiness
            qa/c8-orchestration-cluster-e2e-test-suite/AGENTS.md
            qa/c8-orchestration-cluster-e2e-test-suite/workspace-templates

      - name: Import Vault secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/qa/ci/common CLAUDE_API_KEY | ANTHROPIC_API_KEY ;
            secret/data/products/qa/ci/common GH_TOKEN | GH_PAT ;

      - name: Generate GitHub App Token
        id: github-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@main
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/qa-processes
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/qa-processes
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: camunda

      - name: Configure git with GitHub App token
        env:
          TOKEN: ${{ steps.github-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global user.name  "qa-processes[bot]"
          git config --global user.email "qa-processes[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Install workspace-cli
        env:
          GOPRIVATE: github.com/camunda/*
          GOTOOLCHAIN: auto
          GH_PAT: ${{ steps.secrets.outputs.GH_PAT }}
        run: |
          # The qa-processes App token cannot read workspace-cli; the more specific
          # insteadOf wins over the global one set above.
          git config --global url."https://x-access-token:${GH_PAT}@github.com/camunda/workspace-cli-v2".insteadOf "https://github.com/camunda/workspace-cli-v2"
          go install github.com/camunda/workspace-cli-v2/cmd/workspace@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.156
          claude --version

      - name: Create workspace on the starting point
        id: ws
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.workspace-templates"
          cp "$SUITE_PATH"/workspace-templates/camunda-orchestration-cluster-nightly.yaml \
             "$SUITE_PATH"/workspace-templates/camunda-orchestration-cluster-nightly.guidance.md \
             "$HOME/.workspace-templates/"
          cp "$SUITE_PATH/AGENTS.md" /tmp/flaky-agent-manual.md

          name="flaky-oc-${VERSION}-$(date -u +%Y%m%d-%H%M)-${GITHUB_RUN_ID}"
          workspace create "$name" --manifest camunda-orchestration-cluster-nightly
          ws_dir="$HOME/workspaces/${name}/camunda"

          if [[ "$BASE" == "iter1" ]]; then
            git -C "$ws_dir" fetch --depth 50 origin "$BRANCH"
            git -C "$ws_dir" checkout -B "$BRANCH" FETCH_HEAD
          else
            git -C "$ws_dir" fetch --depth 50 origin "$TARGET_REF"
            git -C "$ws_dir" checkout -B "$BRANCH" FETCH_HEAD
          fi
          {
            echo "dir=${ws_dir}"
            echo "start_sha=$(git -C "$ws_dir" rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Download the evidence of earlier passes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flaky-*
          path: /tmp/flaky-evidence

      - name: Keep only the requested passes
        env:
          EVIDENCE: ${{ inputs.evidence }}
        run: |
          set -euo pipefail
          cd /tmp/flaky-evidence
          for dir in */; do
            dir="${dir%/}"
            keep=false
            for label in $(jq -r '.[]' <<< "$EVIDENCE"); do
              [[ "$dir" == "flaky-${label}-"* || "$dir" == "flaky-score-${label}" ]] && keep=true
            done
            [[ "$keep" == "true" ]] || rm -rf "$dir"
          done
          ls

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install suite dependencies for lint
        working-directory: ${{ steps.ws.outputs.dir }}/${{ env.SUITE_PATH }}
        run: npm ci

      - name: Run Claude Code fix agent
        env:
          ANTHROPIC_API_KEY: ${{ steps.secrets.outputs.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
          WS_DIR: ${{ steps.ws.outputs.dir }}
          VERSION: ${{ inputs.version }}
          TARGET_REF: ${{ inputs.target_ref }}
          ITERATION: ${{ inputs.iteration }}
          SPEC: ${{ inputs.spec }}
          TITLE_PATH: ${{ inputs.title_path }}
          PROJECT: ${{ inputs.project }}
          CELLS: ${{ inputs.cells }}
          BASE: ${{ inputs.base }}
          JOB_START_EPOCH: ${{ steps.job_start.outputs.epoch }}
        run: |
          set -euo pipefail
          deadline=$(( JOB_START_EPOCH + 55 * 60 ))
          title=$(jq -r 'join(" › ")' <<< "$TITLE_PATH")
          scores=$(for f in /tmp/flaky-evidence/flaky-score-*/score.json; do
                     [[ -f "$f" ]] && printf '%s: %s\n' "$(basename "$(dirname "$f")")" "$(cat "$f")"
                   done)
          if [[ "$BASE" == "iter1" ]]; then
            start="Your branch already holds fix attempt 1. It helped but did not remove every failure; refine it."
          elif [[ "$ITERATION" -gt 1 ]]; then
            start="Fix attempt 1 made the test worse and was dropped. You start again from ${TARGET_REF}; take a different approach."
          else
            start="You start from ${TARGET_REF}."
          fi

          prompt=$(cat <<PROMPT
          You are stabilising ONE flaky test in the C8 Orchestration Cluster E2E/API suite.
          Repository: ${WS_DIR} (camunda/camunda, checked out at ${TARGET_REF}, version ${VERSION}).
          Suite: ${WS_DIR}/${SUITE_PATH}

          Test: ${SPEC} › ${title}   (Playwright project: ${PROJECT})
          Flaky in nightly cells: ${CELLS}
          ${start}

          It was just run many times, each shard on its own fresh docker-compose stack,
          with --retries=0. The per-pass scores (pass rate per cell and the most common
          failure messages) are:
          ${scores}

          The raw shard reports are under /tmp/flaky-evidence/flaky-<pass>-<cell>-s<n>/:
          json-report/results.json for every run, test-results/ for traces, screenshots and
          videos of the failed runs (open trace.zip with unzip -l / unzip -p). Read them.

          Rules, in order of precedence:
          1. Read /tmp/flaky-agent-manual.md: "Product-Bug Escalation" and the constraints of
             "Nightly Fix Agent" apply. Never mask a failure, never weaken or delete an
             assertion, never add test.skip / test.fixme / .only, never raise retries.
          2. Find the ROOT CAUSE of the intermittent failure (race, missing wait on the
             right condition, shared data between parallel workers, eventual consistency
             of search/exporter, order dependence) and fix that. A longer timeout alone is
             acceptable only when the evidence shows the operation is slow, not stuck.
          3. Edit files under ${SUITE_PATH}/ only. Keep the diff minimal.
          4. Do NOT commit, push, open a PR, or file issues: the workflow does that after
             it re-validates your change. Do not run Playwright; there is no stack here.
          5. If the failure is a product bug and no test-side fix is legitimate, make no
             change and say so.
          6. Finish before $(date -u -d "@${deadline}" +%H:%MZ).

          When done, write /tmp/flaky-fix-summary.md: root cause (with the evidence you used),
          what you changed and why it removes the race, or why you changed nothing.
          PROMPT
          )
          cd "$WS_DIR"
          timeout $(( deadline - $(date -u +%s) )) \
            claude -p "$prompt" --dangerously-skip-permissions 2>&1 | tee /tmp/flaky-agent-output.md || true

      - name: Check, lint and push the change
        id: push
        env:
          WS_DIR: ${{ steps.ws.outputs.dir }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
          ITERATION: ${{ inputs.iteration }}
          TITLE_PATH: ${{ inputs.title_path }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$WS_DIR"
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "The agent made no change."
            { echo "changed=false"; echo "sha="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for f in "${changed[@]}"; do
            if [[ "$f" != "$SUITE_PATH/"* ]]; then
              echo "::error::the agent edited $f, outside $SUITE_PATH/"
              exit 1
            fi
          done
          if git diff --cached -U0 -- "$SUITE_PATH" | grep -E '^\+' | grep -qE '\b(test|it|describe)\.(skip|fixme|only)\b|retries:'; then
            echo "::error::the change adds a skip, fixme, only or a retries setting"
            exit 1
          fi

          ts_files=()
          for f in "${changed[@]}"; do
            [[ "$f" == *.ts && -f "$f" ]] && ts_files+=("${f#"$SUITE_PATH"/}")
          done
          if [[ "${#ts_files[@]}" -gt 0 ]]; then
            pushd "$SUITE_PATH" > /dev/null
            npx prettier --write "${ts_files[@]}"
            npx eslint "${ts_files[@]}"
            npx tsc --noEmit
            popd > /dev/null
          fi
          git add -A

          title=$(jq -r '.[-1]' <<< "$TITLE_PATH" | cut -c1-70)
          {
            echo "test: stabilize flaky \"${title}\" (${VERSION}, attempt ${ITERATION})"
            echo
            if [[ -s /tmp/flaky-fix-summary.md ]]; then
              fold -s -w 72 /tmp/flaky-fix-summary.md
            else
              echo "Fix attempt ${ITERATION} by the OC flakiness fix agent."
            fi
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/flaky-commit-msg.txt
          git commit -F /tmp/flaky-commit-msg.txt

          if [[ "$BASE" == "iter1" ]]; then
            git push origin "HEAD:refs/heads/${BRANCH}"
          else
            # Attempt 2 after a regression starts over from the target branch and
            # replaces attempt 1 on this bot-owned branch.
            git push --force origin "HEAD:refs/heads/${BRANCH}"
          fi
          { echo "changed=true"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-agent-iter${{ inputs.iteration }}
          path: |
            /tmp/flaky-agent-output.md
            /tmp/flaky-fix-summary.md
          if-no-files-found: ignore
          retention-days: 14
