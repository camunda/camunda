# type: Project Management
# owner: @camunda/core-features-team
---
# Hourly urgency sync for Quality Board (#187)
#
# Picks up issues that were recently updated but don't have urgency set yet.
# Uses --direct mode to support cross-repo issues from all repos in the project.
#
name: Assign urgency to new issues in Quality Board

on:
  schedule:
    - cron: '0 * * * *' # every hour
  workflow_dispatch: {}

env:
  TEST_OWNER: '@camunda/core-features'

jobs:
  assign-urgency-batch:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Vault JWT login
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate GitHub token
        id: github-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@405ecc95af077cd030bfe3249511e802fd9e4585 # generate-github-app-token-from-vault-secrets-1.3.1
        with:
          github-app-id-vault-key: PROJECT_BOARD_AUTOMATION_APP_ID
          github-app-id-vault-path: secret/data/products/camunda/ci/camunda
          github-app-private-key-vault-key: PROJECT_BOARD_AUTOMATION_APP_PRIVATE_KEY
          github-app-private-key-vault-path: secret/data/products/camunda/ci/camunda
          vault-auth-method: jwt
          vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          # Org-wide token needed to read/write issues across all repos in the project
          owner: camunda
          repositories: '!all'

      - name: Run urgency batch for Quality Board
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
        with:
          max_attempts: 3
          retry_on: error
          retry_wait_seconds: 10
          timeout_minutes: 15
          command: |
            bash .github/workflows/assign-urgency-to-issues.sh \
              --project 187 \
              --direct \
              --updated-since 2h \
              --skip-assigned \
              --limit 100 \
              --delay 1
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_jwtRole: ${{ secrets.VAULT_JWT_ROLE }}
          secret_vault_jwtPath: ${{ secrets.VAULT_JWT_PATH }}
          secret_vault_jwtAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
