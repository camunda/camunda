---
name: Common paths filter for camunda/camunda

# owner: @camunda/engineering-operations

description: |
  Common filters to detect and group changes against a base branch
  It leverages the `dorny/paths-filter` action to filter paths
  Said third-party action uses picomatch patterns to filter paths

outputs:
  actionlint:
    description: Output whether `actionlint` should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.filter-common.outputs.actionlint-related-change == 'true'
      }}
  commitlint:
    description: Output whether commit messages should be linted based on GitHub event
    value: >-
      ${{
        github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.labels.*.name, 'ci:ignore-commitlint') &&
        steps.filter-special-branch.outputs.release-branch != 'true'
      }}
  codeowners-check:
    description: Output whether codeowners check should be performed based on GitHub event
    value: >-
      ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  maven-spotless-linter:
    description: Output whether jobs depending on files relevant for Maven spotless should be run, related checks are based on GitHub events and file changes
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.java-code-change == 'true' ||
        steps.filter-common.outputs.maven-change == 'true' ||
        steps.filter-common.outputs.markdown-change == 'true'
      }}
  validate-pom-metadata:
    description: Output whether flattened POM metadata validation should be run
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.maven-change == 'true' ||
        steps.filter-common.outputs.validate-pom-metadata-extra-change == 'true'
      }}
  java-code-changes:
    description: Output whether jobs depending on Java code changes should be run, related checks are based on GitHub events and java files changes
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.java-code-change == 'true' ||
        steps.filter-common.outputs.maven-change == 'true'
      }}
  identity-frontend-tests:
    description: Output whether Identity frontend tests should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-identity.outputs.identity-frontend-change == 'true'
      }}
  operate-backend-changes:
    description: Output whether Operate backend build should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-operate.outputs.operate-backend-change == 'true' ||
        steps.filter-common.outputs.webapps-change == 'true' ||
        steps.filter-common.outputs.maven-change == 'true' ||
        steps.filter-common.outputs.dockerfile-change == 'true'
      }}
  operate-frontend-changes:
    description: Output whether Operate frontend build should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-operate.outputs.operate-frontend-change == 'true'
      }}
  tasklist-frontend-changes:
    description: Output whether Tasklist frontend tests should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-tasklist.outputs.tasklist-frontend-change == 'true'
      }}
  tasklist-backend-changes:
    description: Output whether Tasklist backend build should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-tasklist.outputs.tasklist-backend-change == 'true' ||
        steps.filter-common.outputs.webapps-change == 'true' ||
        steps.filter-common.outputs.maven-change == 'true' ||
        steps.filter-common.outputs.dockerfile-change == 'true'
      }}
  optimize-frontend-changes:
    description: Output whether Optimize frontend tests should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-optimize.outputs.optimize-frontend-change == 'true'
      }}
  optimize-backend-changes:
    description: Output whether Optimize backend tests should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-optimize.outputs.optimize-backend-change == 'true' ||
        steps.filter-common.outputs.webapps-change == 'true' ||
        steps.filter-common.outputs.maven-change == 'true'
      }}
  optimize-dockerfile-changes:
    description: Output whether Optimize's Dockerfile-only tooling checks (hadolint, base image validation) should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.dockerfile-change == 'true'
      }}
  camunda-docker-tests:
    description: Output whether Camunda Docker tests should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.java-code-change == 'true' ||
        steps.filter-common.outputs.maven-change == 'true' ||
        steps.filter-common.outputs.dockerfile-change == 'true' ||
        steps.filter-common.outputs.frontend-change == 'true'
      }}
  frontend-changes:
    description: Output whether any frontend has changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.frontend-change == 'true' ||
        steps.filter-identity.outputs.frontend-identity == 'true'
      }}
  zeebe-changes:
    description: Output whether any Zeebe code has changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.webapps-change == 'true' ||
        steps.filter-common.outputs.maven-change == 'true' ||
        steps.filter-zeebe.outputs.zeebe-change == 'true'
      }}
  protobuf-changes:
    description: >-
      Output whether the Protobuf backwards-compatibility check should be run based on GitHub event and files changed.
      Restricted to pull requests and merge queues: the check's breaking-change comparison relies on PR/merge-group
      context (e.g. a "BREAKING CHANGE:" acknowledgment) that isn't available on a plain push to main/stable.
    value: >-
      ${{
        (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
        steps.filter-common.outputs.protobuf-change == 'true'
      }}
  openapi-changes:
    description: Output whether any C8 OpenAPI code has changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.openapi-change == 'true'
      }}
  stable-branch-changes:
    description: Output whether the change is occurring on a stable/X.Y branch or not
    value: >-
      ${{
        github.event_name == 'push' &&
        steps.filter-special-branch.outputs.stable-branch == 'true'
      }}
  rdbms-integration-tests:
    description: Output whether RDBMS integrations tests should be run based on code changes
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.java-code-change == 'true' ||
        steps.filter-common.outputs.maven-change == 'true' ||
        steps.filter-common.outputs.rdbms-change == 'true'
      }}
  async-replication-tests:
    description: Output whether async-replication integration tests should be run based on code changes
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.maven-change == 'true' ||
        steps.filter-common.outputs.async-replication-change == 'true'
      }}
  release-notes-action:
    description: Output whether the release-notes action's tests and bundle-drift guards should be run
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.release-notes-action-change == 'true'
      }}
  renovate-config-changes:
    description: Output whether renovate config validator needs to be run
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-common.outputs.renovate-config-change == 'true'
      }}
  webapp-client-changes:
    description: Output whether Webapp Client tests should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-webapp-client.outputs.webapp-client-change == 'true'
      }}
  docs-changes:
    description: Output whether Documentation tests should be run based on GitHub event and files changed
    value: >-
      ${{
        steps.filter-docs.outputs.docs-change == 'true'
      }}
  deps-changed:
    description: Output whether dependency manifests (pom.xml, lock files) changed, triggering PR vulnerability scanning
    value: >-
      ${{ steps.filter-dep-manifests.outputs.dep-manifest-change == 'true' }}
  fossa-changes:
    description: Output whether FOSSA license analysis should be run based on GitHub event and files changed (dependency manifests or the license CI itself)
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-dep-manifests.outputs.dep-manifest-change == 'true'
      }}
  c8-e2e-test-suite-changes:
    description: Output whether the C8 Orchestration Cluster E2E test suite lint check should be run based on GitHub event and files changed
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-c8-e2e-test-suite.outputs.c8-e2e-test-suite-change == 'true'
      }}
  load-test-setup-changes:
    description: Output whether the load-test setup golden file tests should be run based on files changed
    value: >-
      ${{
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-load-test-setup.outputs.load-test-setup-change == 'true'
      }}
  scripts-changes:
    description: Output whether any file under .github/scripts/ or .ci/db-versions.yml changed, so their Python unit tests should be run
    value: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        steps.ci-github-actions.outputs.ci-relevant == 'true' ||
        steps.filter-scripts.outputs.scripts-change == 'true'
      }}

runs:
  using: composite
  steps:

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-common
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        actionlint-related-change:
          - '.github/actions/**'
          - '.github/workflows/**'
          - '.github/actionlint*'
          - '.github/conftest-*.rego'

        renovate-config-change:
          - '**/renovate.json5'
          - '.github/renovate/**.json5'

        # The gate workflow is included so a change to it still runs the action's
        # tests and the bundle-drift guard that back it.
        #
        # The first two globs overlap `ci-relevant` (which already covers
        # .github/actions/** and .github/workflows/**) and are kept on purpose:
        # ci-relevant additionally requires check.sh to judge the change
        # CI-relevant, so an excluded path there would otherwise skip the
        # action's own tests. The last two are not GitHub Actions files at all,
        # so only this filter catches them — and both are drift-guarded by the
        # action's CI, which is exactly what must run when they change.
        release-notes-action-change:
          - '.github/actions/release-notes/**'
          - '.github/workflows/release-notes*'
          - '.github/pull_request_template.md'
          - 'commitlint.config.cjs'

        # We use specific src/main and src/test path to:
        #  * react on java code (production + test) changes
        #  * react on resource changes like bpmn, XML, etc.
        #  * but _not_ react on frontend src folder changes
        java-code-change:
          - '**/src/main/**'
          - '**/src/test/**'
          - '**/src/it/**'

        maven-change:
          - 'bom/**'
          - 'build-tools/**'
          - 'dist/**'
          - 'parent/**'
          - '**/pom.xml'
          - '.mvn/**'
          - '.ci/db-versions.yml'

        validate-pom-metadata-extra-change:
          - 'mvnw'
          - 'mvnw.cmd'
          - '.github/scripts/validate-flattened-poms.sh'

        dockerfile-change:
          - '*.Dockerfile'

        markdown-change:
          - '**/*.md'

        webapps-change:
          - 'configuration/**'
          - 'webapps-backup/**'
          - 'webapps-common/**'
          - 'webapps-schema/**'

        frontend-change:
          - 'operate/client/**'
          - 'tasklist/client/**'
          - 'identity/client/**'
          - 'optimize/client/**'

        protobuf-change:
          - '**/*.proto'
          - 'buf.yaml'

        openapi-change:
          - 'zeebe/gateway-protocol/src/main/proto/v2/**'
          - 'zeebe/gateway-protocol/vacuum-ruleset.yaml'
          - 'zeebe/gateway-protocol/vacuum-ignores.yaml'
          - 'zeebe/gateway-protocol/.spectral.yaml'
          - 'zeebe/gateway-protocol/spectral-functions/**'
          - 'zeebe/gateway-protocol/spectral-tests/**'
          - '.github/scripts/x-added-in-version-check/**'
          - '.github/workflows/verify-x-added-in-version-annotations.yml'

        rdbms-change:
        - 'db/rdbms/**'
        - 'db/rdbms-schema/**'
        - 'qa/acceptance-tests/**'
        - 'search/search-domain/**'
        - 'zeebe/exporters/rdbms-exporter/**'

        async-replication-change:
        - 'db/rdbms/**'
        - 'zeebe/exporters/rdbms-exporter/**'
        - 'qa/acceptance-tests/src/test/java/io/camunda/it/rdbms/db/asyncreplication/**'
        - 'qa/acceptance-tests/src/test/java/io/camunda/it/rdbms/db/util/**'

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-github-actions
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      list-files: json
      filters: |
        github-actions-change:
          - '.github/actions/**'
          - '.github/workflows/**'
          - '.github/actionlint*'
          - '.github/conftest-*.rego'

  # dorny/paths-filter negation patterns are broken (dorny/paths-filter#200,
  # micromatch/picomatch#154): each pattern is an independent OR'd matcher, so
  # !pattern matches everything NOT matching it instead of excluding.
  # Work around by piping the actual file list through check.sh, which applies
  # glob exclusions from .github/scripts/ci-relevance/excluded-paths.txt.
  - id: ci-github-actions
    shell: bash
    env:
      CHANGED_FILES: ${{ steps.filter-github-actions.outputs.github-actions-change_files }}
    run: |
      if [[ "${{ steps.filter-github-actions.outputs.github-actions-change }}" != "true" ]]; then
        echo "ci-relevant=false" >> "$GITHUB_OUTPUT"
        exit 0
      fi
      if jq -r '.[]' <<< "$CHANGED_FILES" | \
          .github/scripts/ci-relevance/check.sh; then
        echo "ci-relevant=true" >> "$GITHUB_OUTPUT"
      else
        echo "ci-relevant=false" >> "$GITHUB_OUTPUT"
      fi

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-identity
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        identity-frontend-change:
          - 'identity/client/**'

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-zeebe
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        zeebe-change:
          - 'zeebe/**'
          - 'clients/**'

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-operate
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        operate-backend-change:
          - 'operate/!(client/**)/**'

        operate-frontend-change:
          - operate/client/**

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-tasklist
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        tasklist-backend-change:
          - 'tasklist/!(client/**)/**'

        tasklist-frontend-change:
          - tasklist/client/**

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-optimize
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        optimize-backend-change:
          - optimize/backend/**
          - optimize/upgrade/**
          - optimize/util/**
          - optimize/plugins/**

        optimize-frontend-change:
          - optimize/client/**
          - optimize/backend/src/main/resources/localization/**

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-webapp-client
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        webapp-client-change:
          - 'webapp/client/**'

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-dep-manifests
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        dep-manifest-change:
          - '**/pom.xml'
          - 'bom/**'
          - 'parent/**'
          - '**/package.json'
          - '**/package-lock.json'
          - '**/yarn.lock'
          - '**/go.mod'
          - '**/go.sum'

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-docs
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        docs-change:
          # Keep in sync with the content roots compiled by the docs site in
          # monorepo-docs-site/docusaurus.config.js. Each of these folders is a
          # Docusaurus plugin/preset content root; a broken link in any of them
          # fails the production build. Omitting one here means changes to it
          # never trigger the docs-preview build, so a broken link stays latent
          # until an unrelated docs change trips over it.
          - 'docs/monorepo-docs/**'
          - 'docs/architecture/**'
          - 'docs/adr/**'
          - 'identity/docs/**'
          - 'monorepo-docs-site/!(node_modules)/**'
          - 'monorepo-docs-site/*'
          - '.github/workflows/docs-build-deploy.yml'
          - '.github/workflows/docs-preview.yml'

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-c8-e2e-test-suite
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        c8-e2e-test-suite-change:
          - 'qa/c8-orchestration-cluster-e2e-test-suite/**'

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-load-test-setup
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        load-test-setup-change:
          - 'load-tests/setup/**'
          - '.tool-versions'

  - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
    id: filter-scripts
    with:
      base: ${{ github.event.merge_group.base_ref || '' }}
      ref: ${{ github.event.merge_group.head_ref || github.ref }}
      filters: |
        scripts-change:
          - '.github/scripts/**'
          - '.ci/db-versions.yml'

  # only works `on: push` and `on: pull_request` GitHub trigger events
  - id: filter-special-branch
    shell: bash
    run: |
      if [[ $GITHUB_EVENT_NAME == 'push' ]]; then
        test_branch_name="$GITHUB_REF_NAME"
      elif [[ $GITHUB_EVENT_NAME == 'pull_request' ]]; then
        test_branch_name="$GITHUB_HEAD_REF"
      fi
      echo "Branch name: $test_branch_name"

      if [[ $test_branch_name =~ ^stable\/[0-9]+\.[0-9]+$ ]]; then
        echo "Stable branch: true"
        echo "stable-branch=true" >> "$GITHUB_OUTPUT"
      else
        echo "Stable branch: false"
        echo "stable-branch=false" >> "$GITHUB_OUTPUT"
      fi

      if [[ $test_branch_name =~ ^release.*$ ]]; then
        echo "Release branch: true"
        echo "release-branch=true" >> "$GITHUB_OUTPUT"
      else
        echo "Release branch: false"
        echo "release-branch=false" >> "$GITHUB_OUTPUT"
      fi
