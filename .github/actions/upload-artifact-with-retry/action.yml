---
# owner: @camunda/engineering-operations
name: Upload artifact with retry

description: >
  Runs `actions/upload-artifact` with retries so a transient GitHub
  artifact-storage error does not fail an otherwise-green job (INC-7913).

inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: A file, directory or wildcard pattern describing what to upload.
    required: true
  retention-days:
    description: Number of days to keep the artifact. Empty uses the repository default.
    required: false
    default: ""
  include-hidden-files:
    description: Whether to include hidden files in the provided path.
    required: false
    default: "false"
  if-no-files-found:
    description: Behaviour when no files match `path` -- `warn`, `error` or `ignore`.
    required: false
    default: warn

runs:
  using: composite
  # GitHub Actions has no retry primitive for a `uses:` step, so each attempt is
  # a literal copy of the step gated on the previous attempt's outcome. Editing
  # one attempt means editing all of them -- keep the `with:` blocks identical.
  #
  # A skipped step reports `outcome: skipped`, never `failure`, so gating each
  # attempt on its immediate predecessor is enough: attempt 3 can only run if
  # attempt 2 ran and failed, which in turn required attempt 1 to fail.
  #
  # The last attempt deliberately omits `continue-on-error` so an exhausted
  # retry fails the job.
  #
  # `overwrite: true` is load-bearing, not cosmetic: a failed attempt leaves the
  # artifact name reserved, so a later attempt would fail with `(409) Conflict`
  # -- also non-retryable, which makes the 403-then-409 sequence terminal. It is
  # safe here only because every caller uploads a name unique within the run;
  # `overwrite` races when parallel jobs share one name (upload-artifact#506),
  # so check that before reusing this action.
  steps:
    - name: Upload artifact (attempt 1 of 3)
      id: attempt-1
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true

    - name: Wait before attempt 2
      if: steps.attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Upload artifact (attempt 2 of 3)
      id: attempt-2
      if: steps.attempt-1.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true

    - name: Wait before attempt 3
      if: steps.attempt-2.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Upload artifact (attempt 3 of 3)
      if: steps.attempt-2.outcome == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true
