---
# owner: @camunda/engineering-operations
name: Upload artifact with retry

description: >
  Runs `actions/upload-artifact` with retries so a transient GitHub
  artifact-storage error does not fail an otherwise-green job (INC-7913).

inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: A file, directory or wildcard pattern describing what to upload.
    required: true
  retention-days:
    description: Number of days to keep the artifact. Empty uses the repository default.
    required: false
    default: ""
  include-hidden-files:
    description: Whether to include hidden files in the provided path.
    required: false
    default: "false"
  if-no-files-found:
    description: Behaviour when no files match `path`, one of `warn`, `error` or `ignore`.
    required: false
    default: warn
  compression-level:
    description: Zlib compression level (0-9). 0 skips compression, for already-compressed input.
    required: false
    default: "6"
  retry-delay-seconds:
    description: >
      Base seconds to wait before each retry. `0` retries immediately.
    required: false
    default: "10"
  retry-jitter-seconds:
    description: >
      Upper bound, inclusive, on a random extra wait added to
      `retry-delay-seconds`. Keeps matrix shards off a lockstep retry, so `0`
      is only safe for a single unsharded upload.
    required: false
    default: "10"

outputs:
  attempts:
    description: >
      Number of upload attempts made. More than 1 means a transient failure was
      absorbed and left the job green; `0` means invalid backoff inputs stopped
      the action before it tried.
    value: ${{ steps.attempts.outputs.count }}

runs:
  using: composite
  # No retry primitive exists for a `uses:` step, so each attempt is a literal
  # copy gated on the previous attempt's outcome. Keep the `with:` blocks in sync.
  #
  # `overwrite: true` is required, not cosmetic: a failed attempt reserves the
  # artifact name, so a retry without it would hit a non-retryable 409. Safe
  # here only because every caller uses a name unique within the run; it races
  # when parallel jobs share one name (upload-artifact#506).
  steps:
    # Up front, not in the wait steps: bash arithmetic reads a non-numeric value
    # as 0, so a typo would silently drop the backoff even on a run that retries.
    - name: Validate retry backoff inputs
      shell: bash
      env:
        DELAY: ${{ inputs.retry-delay-seconds }}
        JITTER: ${{ inputs.retry-jitter-seconds }}
      run: |
        set -euo pipefail
        if ! [[ "$DELAY" =~ ^[0-9]+$ && "$JITTER" =~ ^[0-9]+$ ]]; then
          echo "::error::retry delay and jitter must be whole seconds, got '$DELAY' and '$JITTER'."
          exit 1
        fi

    - name: Upload artifact (attempt 1 of 3)
      id: attempt-1
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true

    - name: Wait before attempt 2
      if: steps.attempt-1.outcome == 'failure'
      shell: bash
      # Jittered so matrix shards don't retry in lockstep and recreate the burst.
      env:
        DELAY: ${{ inputs.retry-delay-seconds }}
        JITTER: ${{ inputs.retry-jitter-seconds }}
      run: sleep $(( DELAY + RANDOM % (JITTER + 1) ))

    - name: Upload artifact (attempt 2 of 3)
      id: attempt-2
      if: steps.attempt-1.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true

    - name: Wait before attempt 3
      if: steps.attempt-2.outcome == 'failure'
      shell: bash
      # Same reason as the wait before attempt 2.
      env:
        DELAY: ${{ inputs.retry-delay-seconds }}
        JITTER: ${{ inputs.retry-jitter-seconds }}
      run: sleep $(( DELAY + RANDOM % (JITTER + 1) ))

    - name: Upload artifact (attempt 3 of 3)
      id: attempt-3
      if: steps.attempt-2.outcome == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true

    # A successful retry leaves the job green, so surface it in the run summary
    # to keep a rising rate of absorbed failures visible instead of silent.
    # `always()`, not `!cancelled()`: an exhausted retry has already failed the
    # job here, and a failed step skips its successors.
    - name: Count attempts and report absorbed retries
      id: attempts
      if: ${{ always() }}
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        ATTEMPT_1_OUTCOME: ${{ steps.attempt-1.outcome }}
        ATTEMPT_2_OUTCOME: ${{ steps.attempt-2.outcome }}
        ATTEMPT_3_OUTCOME: ${{ steps.attempt-3.outcome }}
      run: |
        set -euo pipefail

        # Any outcome other than `skipped` means the attempt ran. Counting from
        # attempt 1 rather than assuming it: the validation step above can fail
        # and skip every upload, and `attempts` must not claim one happened.
        count=0
        if [ "$ATTEMPT_1_OUTCOME" != "skipped" ]; then count=1; fi
        if [ "$ATTEMPT_2_OUTCOME" != "skipped" ]; then count=2; fi
        if [ "$ATTEMPT_3_OUTCOME" != "skipped" ]; then count=3; fi
        echo "count=${count}" >> "$GITHUB_OUTPUT"

        if [ "$count" -le 1 ]; then
          exit 0
        fi

        if [ "$ATTEMPT_3_OUTCOME" = "failure" ]; then
          detail="failed after all ${count} upload attempts"
        else
          detail="needed ${count} upload attempts"
        fi
        echo "::warning::Artifact '${ARTIFACT_NAME}' ${detail}."
        echo "Artifact \`${ARTIFACT_NAME}\` ${detail}." >> "$GITHUB_STEP_SUMMARY"
