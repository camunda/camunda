---
name: npm ci with retry

# owner: @camunda/engineering-operations

description: >
  Runs `npm ci` wrapped in retry logic so a singular transient npm-registry
  network failure does not fail the whole job.

inputs:
  directory:
    description: >
      Directory to install dependencies in. The retry action runs from the
      repository root and ignores `working-directory`, so this must be passed
      explicitly.
    required: true
  max_attempts:
    description: Maximum number of attempts before giving up.
    required: false
    default: "3"
  retry_wait_seconds:
    description: Seconds to wait between attempts.
    required: false
    default: "5"
  timeout_minutes:
    description: Timeout per attempt in minutes.
    required: false
    default: "10"

runs:
  using: composite
  steps:
    # per docs/monorepo-docs/ci.md §"GitHub Actions Cache": NPM/Yarn dependencies
    # should use the shared cache action; writes only happen from main/stable*.
    - name: Setup npm cache
      uses: ./.github/actions/setup-npm-cache
      with:
        cache-dependency-path: ${{ inputs.directory }}/package-lock.json
    - name: Install node dependencies
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        max_attempts: ${{ inputs.max_attempts }}
        retry_wait_seconds: ${{ inputs.retry_wait_seconds }}
        timeout_minutes: ${{ inputs.timeout_minutes }}
        # Pin to bash so a forward-slash `directory` works consistently on
        # Linux, container images, and Windows runners (git-bash).
        shell: bash
        # --loglevel=http surfaces each registry request/response (and where
        # one is hanging) instead of a silent gap between the deprecation
        # warnings and the timeout kill.
        command: |
          cd "${{ inputs.directory }}" && npm ci --loglevel=http
        # A killed attempt (timeout) can leave node_modules half-extracted,
        # which makes the next attempt fail deterministically (e.g. ENOTEMPTY)
        # instead of getting a clean retry.
        on_retry_command: |
          rm -rf "${{ inputs.directory }}/node_modules"
