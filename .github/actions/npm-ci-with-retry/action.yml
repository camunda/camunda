---
name: npm ci with retry

# owner: @camunda/engineering-operations

description: >
  Runs `npm ci` wrapped in retry logic so a singular transient npm-registry
  network failure does not fail the whole job.

inputs:
  directory:
    description: >
      Directory to install dependencies in. The retry action runs from the
      repository root and ignores `working-directory`, so this must be passed
      explicitly.
    required: true
  max_attempts:
    description: Maximum number of attempts before giving up.
    required: false
    default: "3"
  retry_wait_seconds:
    description: Seconds to wait between attempts.
    required: false
    default: "5"
  timeout_minutes:
    description: Timeout per attempt in minutes.
    required: false
    default: "10"

runs:
  using: composite
  steps:
    # per docs/monorepo-docs/ci.md §"GitHub Actions Cache": NPM/Yarn dependencies
    # should use the shared cache action; writes only happen from main/stable*.
    - name: Setup npm cache
      uses: ./.github/actions/setup-npm-cache
      with:
        cache-dependency-path: ${{ inputs.directory }}/package-lock.json
    - name: Validate timeout and derive attempt budgets
      id: budget
      shell: bash
      env:
        TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      run: |
        if ! [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::npm-ci-with-retry: the 'timeout_minutes' input must be a positive integer, got '${TIMEOUT_MINUTES}'"
          exit 1
        fi
        # npm gets the attempt time minus the 30s --kill-after grace.
        echo "inner_timeout_seconds=$((TIMEOUT_MINUTES * 60 - 30))" >> "$GITHUB_OUTPUT"
        echo "retry_timeout_seconds=$((TIMEOUT_MINUTES * 60 + 30))" >> "$GITHUB_OUTPUT"
    - name: Install node dependencies
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        NPM_CI_DIRECTORY: ${{ inputs.directory }}
        NPM_CI_TIMEOUT_SECONDS: ${{ steps.budget.outputs.inner_timeout_seconds }}
      with:
        max_attempts: ${{ inputs.max_attempts }}
        retry_wait_seconds: ${{ inputs.retry_wait_seconds }}
        # Backstop only: nick-fields/retry kills without waiting for npm to
        # exit, which let attempts overlap (INC-9201). The inner `timeout`
        # below must always fire first.
        timeout_seconds: ${{ steps.budget.outputs.retry_timeout_seconds }}
        # Pin to bash so a forward-slash `directory` works consistently on
        # Linux, container images, and Windows runners (git-bash).
        shell: bash
        # Without these, a single stalled registry request rides along until
        # the timeout kills the whole process with no error logged (see
        # #62796). These bound npm's own retry of that request so it fails
        # fast and lets `nick-fields/retry` try again cleanly.
        #
        # The budget must stay under the inner timeout of the smallest
        # `timeout_minutes` any caller passes (currently 6, so 5m30s), or
        # npm is killed mid-retry and we are back to the silent kill this is
        # meant to remove. Worst case for one stalled request: 4 request
        # windows of 60s, plus backoff of 5s + 15s + 15s at npm's default
        # `fetch-retry-factor` of 10, so 4m35s. Re-check this if a caller
        # lowers its timeout or these numbers grow.
        #
        # `timeout` signals npm's whole process group (SIGKILL after 30s, exit
        # 137) but only waits for npm itself, so a descendant that ignores
        # SIGTERM can outlive it. timeout leads its own process group, so the
        # leftovers are killed by group ID before the rm -rf below runs. Don't
        # add `--foreground`, it would signal npm only.
        command: |
          cd "$NPM_CI_DIRECTORY" || exit 1
          status=0
          timeout --kill-after=30s "${NPM_CI_TIMEOUT_SECONDS}s" npm ci --fetch-timeout=60000 --fetch-retries=3 --fetch-retry-mintimeout=5000 --fetch-retry-maxtimeout=15000 &
          pgid=$!
          wait "$pgid" || status=$?
          if kill -0 -- "-$pgid" 2>/dev/null; then
            kill -KILL -- "-$pgid" 2>/dev/null || true
            while kill -0 -- "-$pgid" 2>/dev/null; do sleep 1; done
          fi
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::warning::npm ci timed out after ${NPM_CI_TIMEOUT_SECONDS}s (exit ${status})"
          fi
          exit "$status"
        # A killed attempt (timeout) can leave node_modules half-extracted,
        # which makes the next attempt fail deterministically (e.g. ENOTEMPTY)
        # instead of getting a clean retry.
        on_retry_command: |
          rm -rf "$NPM_CI_DIRECTORY/node_modules"
