# owner: @camunda/engineering-operations
name: Download shared build artifact
description: >-
  Download this run's distball, installed Maven SNAPSHOT archive, or Gradle
  parity inputs from GCS, falling back to the GitHub artifact for fork PRs.
  GCS authentication must already be configured by the calling workflow.
inputs:
  artifact:
    description: >-
      Shared artifact to download (distball, m2-installed, or
      gradle-parity-inputs)
    required: true
  path:
    description: Destination directory
    required: true
runs:
  using: composite
  steps:
    - name: Prepare download
      id: artifact
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
        DOWNLOAD_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        if [[ -z "$DOWNLOAD_PATH" ]]; then
          echo "::error::A destination path is required"
          exit 1
        fi
        case "$ARTIFACT" in
          distball)
            object='camunda-zeebe-*.tar.gz'
            timeout_minutes=2
            ;;
          m2-installed)
            object='m2-installed.tar'
            timeout_minutes=1
            ;;
          gradle-parity-inputs)
            # Object names must match the upload side exactly; no rename on either
            # hop so producer and consumer never have to keep a mapping in sync.
            object='gradle-distribution.tar gradle-dist-dependencies.json'
            timeout_minutes=2
            ;;
          *)
            echo "::error::Expected artifact to be distball, m2-installed, or gradle-parity-inputs"
            exit 1
            ;;
        esac
        mkdir -p "$DOWNLOAD_PATH"
        printf 'object=%s\ntimeout-minutes=%s\n' "$object" "$timeout_minutes" >> "$GITHUB_OUTPUT"
    - name: Download from GCS
      if: github.event.pull_request.head.repo.fork != true
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        ARTIFACT_OBJECT: ${{ steps.artifact.outputs.object }}
        DOWNLOAD_PATH: ${{ inputs.path }}
      with:
        max_attempts: 5
        retry_wait_seconds: 10
        timeout_minutes: ${{ steps.artifact.outputs.timeout-minutes }}
        shell: bash
        command: |
          set -euo pipefail
          # An artifact may resolve to several objects; build one URL per name
          # (gcloud expands wildcards server-side) and copy them in one call.
          urls=()
          for object in $ARTIFACT_OBJECT; do
            urls+=("gs://${GCS_BUILD_CACHE_BUCKET}/${GITHUB_RUN_ID}/${object}")
          done
          gcloud storage cp "${urls[@]}" "${DOWNLOAD_PATH}/"
    - name: Download from GitHub for fork PRs
      if: github.event.pull_request.head.repo.fork == true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}-${{ github.run_id }}
        path: ${{ inputs.path }}
