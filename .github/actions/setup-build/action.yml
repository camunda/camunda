---
name: Setup build

# owner: @camunda/engineering-operations

description: Sets up the required stack to build, install, and run monorepo projects

inputs:
  camunda-nexus:
    description: |
      If enabled, Camunda Nexus will be configured and used as a mirror for Maven repositories
      Camunda Nexus is automatically disabled for fork PRs.
    required: false
    default: "true"
  dockerhub:
    description: |
      If enabled, logs into DockerHub with a CI account.
      DockerHub login is automatically disabled for fork PRs.
    required: false
    default: "false"
  dockerhub-readonly:
    description: |
      If enabled, logs into DockerHub with a read-only CI account.
      Useful to avoid being rate-limited when using an anonymous account from GitHub-managed runners.
      DockerHub login is automatically disabled for fork PRs.
    required: false
    default: "false"
  harbor:
    description: |
      If enabled, logs into Harbor with a Harbor robot account.
      Harbor login is automatically disabled for fork PRs.
    required: false
    default: "false"
  minimus:
    description: |
      If enabled, logs into Minimus with a CI account.
      Minimus login is automatically disabled for fork PRs.
    required: false
    default: "false"
  java-distribution:
    description: Java distribution to use
    required: false
    default: temurin
  java-version:
    description: JDK version to install
    required: false
    default: "21"
  maven-cache-key-modifier:
    description: A modifier to use for maven cache key
    required: false
    default: "shared"
  maven-mirrors:
    description: |
      JSON list of extra Maven mirrors.
      It will be merged with Camunda Nexus settings (if enabled ), with precedence."
    required: false
    default: '[]'
  maven-servers:
    description: |
      JSON list of extra Maven servers.
      It will be merged with Camunda Nexus settings (if enabled), with precedence."
    required: false
    default: '[]'
  time-zone:
    description: |
      Time zone to set for the build environment. Use TZ identifiers, e.g., 'Europe/Berlin'.
      https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
    required: false
  vault-address:
    description: Vault URL to retrieve secrets from
    required: false
  vault-role-id:
    description: Vault Role ID to use
    required: false
  vault-secret-id:
    description: Vault Secret ID to use
    required: false

outputs: {}

runs:
  using: composite
  steps:
  - name: Check for Fork
    uses: ./.github/actions/is-fork
    id: is-fork
  - name: Preliminary checks
    id: checks
    env:
      DOCKERHUB: ${{ inputs.dockerhub }}
      DOCKERHUB_READONLY: ${{ inputs.dockerhub-readonly }}
      # Paths to Vault secrets for DockerHub accounts
      DOCKERHUB_VAULT_PATHS: >-
        {
          "camunda": {
            "path": "secret/data/products/camunda/ci/github-actions"
          },
          "operate": {
            "path": "secret/data/products/operate/ci/github-actions"
          },
          "optimize": {
            "path": "secret/data/products/optimize/ci/camunda-optimize"
          },
          "tasklist": {
            "path": "secret/data/products/tasklist/ci/tasklist"
          },
          "zeebe": {
            "path": "secret/data/products/zeebe/ci/zeebe"
          }
        }
      WORKFLOW_REF: ${{ github.workflow_ref }}
    shell: bash
    run: |
      ## Preliminary checks

      # Check if current workflow run is related to a fork PR
      if [[ "${{ steps.is-fork.outputs.is-fork }}" == "true" ]]; then
        echo "The current workflow run is related to a fork PR."
        echo "As a result, Vault secrets cannot be recovered, Camunda Nexus and DockerHub/Harbor login will be disabled."
      fi

      # Check if DockerHub and DockerHub-readonly are both enabled
      if [[ "${DOCKERHUB}" == "true" && "${DOCKERHUB_READONLY}" == "true" ]]; then
        echo "Both dockerhub and dockerhub-readonly inputs are enabled. Only one can be enabled at a time."
        exit 1
      fi

      # Infer team from workflow (.yml) file name if possible, otherwise default to camunda
      worklow=$(basename ${WORKFLOW_REF%@*})  # remove Github ref part and extract filename
      team=camunda
      if [[ "$worklow" =~ ^(operate|optimize|tasklist|zeebe)-.*\.(yml|yaml)$ ]]; then
        team=${BASH_REMATCH[1]}
      fi

      # Get Vault path to the DockerHub account to use, and check JSON validity at the same time
      dockerhub_vault_path=$(echo ${DOCKERHUB_VAULT_PATHS} | jq -r --arg team "$team" '.[$team].path')

      echo dockerhub-vault-path="${dockerhub_vault_path}" | tee -a $GITHUB_OUTPUT
  - name: Import Secrets
    # Secrets are imported only if current workflow run is not related to a fork PR
    if: steps.is-fork.outputs.is-fork != 'true'
    id: secrets
    uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
    with:
      url: ${{ inputs.vault-address }}
      method: approle
      roleId: ${{ inputs.vault-role-id }}
      secretId: ${{ inputs.vault-secret-id }}
      secrets: |
        secret/data/github.com/organizations/camunda NEXUS_PSW | ci-account-password;
        secret/data/github.com/organizations/camunda NEXUS_USR | ci-account-username;
        ${{ steps.checks.outputs.dockerhub-vault-path }} REGISTRY_HUB_DOCKER_COM_PSW${{ inputs.dockerhub-readonly == 'true' && '_READ_ONLY' || ''}} | dockerhub-token;
        ${{ steps.checks.outputs.dockerhub-vault-path }} REGISTRY_HUB_DOCKER_COM_USR | dockerhub-username;
        secret/data/products/camunda/ci/github-actions REGISTRY_MINIMUS_PSW | minimus-token;
        secret/data/products/camunda/ci/harbor username | harbor-username;
        secret/data/products/camunda/ci/harbor password | harbor-password
  - name: Prepare wretry action-clone credential
    # wretry does not reuse the runner's authenticated action download -- it fetches the wrapped
    # action with its own `git clone`. For a public repo GitHub answers git's first probe with 200,
    # so git is never challenged and credentials embedded in the clone URL are never sent: the
    # clone is anonymous whatever `github_token` is passed, which is how GitHub's anonymous
    # download limiting took out 33 CI jobs on 2026-09-03. An `http.<url>.extraheader` is sent
    # unconditionally on the first request, so it is the only way to authenticate that clone.
    # Handed to the wretry step through GIT_CONFIG_* rather than `git config --global` so it is
    # scoped to that one step: nothing to clean up, and no global config to clobber.
    id: wretry-clone-credential
    shell: bash
    env:
      ACTION_CLONE_TOKEN: ${{ github.token }}
    run: |
      credential="$(printf 'x-access-token:%s' "$ACTION_CLONE_TOKEN" | base64 | tr -d '\n')"
      # base64 of the token is a usable credential and does not match the raw secret, so Actions
      # will not mask it on its own.
      echo "::add-mask::$credential"
      echo "header=AUTHORIZATION: basic $credential" >> "$GITHUB_OUTPUT"
  - name: Setup Java
    # wretry retries setup-java through transient network/setup failures (INC-7417). Same pattern
    # as build-platform-docker; `_js_action` pin lets the *_context inputs be overridden.
    # `token` is passed explicitly since github_context is blanked (setup-java defaults it from it).
    uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
      GIT_CONFIG_VALUE_0: ${{ steps.wretry-clone-credential.outputs.header }}
    with:
      action: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      attempt_limit: 3
      attempt_delay: 10000
      github_token: ${{ github.token }}
      github_context: '{}'
      env_context: '{}'
      job_context: '{}'
      matrix_context: '{}'
      with: |
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        token: ${{ github.token }}
  # wretry leaks the wrapped action's INPUT_* vars into GITHUB_ENV; blank them (cannot unset).
  - name: Clear setup-java inputs leaked into the job environment by wretry
    if: always()
    shell: bash
    run: |
      env | grep -o '^INPUT_[^=]*' | sed 's/$/=/' >> "$GITHUB_ENV" || true
  - name: Register Maven problem matcher
    shell: bash
    run: echo "::add-matcher::.github/maven-matcher.json"
  - name: Configure Maven cache
    uses: ./.github/actions/setup-maven-cache
    with:
      maven-cache-key-modifier: ${{ inputs.maven-cache-key-modifier }}
  # Camunda Nexus and extra mirrors/servers must be merged on ids (extra values have precedence).
  - name: Get Maven mirrors and servers to use
    id: maven
    env:
      # Camunda Nexus is disabled for fork PRs
      CAMUNDA_NEXUS_ENABLED: >-
        ${{
          steps.is-fork.outputs.is-fork != 'true' &&
          inputs.camunda-nexus == 'true'
        }}
      CAMUNDA_NEXUS_MAVEN_MIRROR: >-
        [{
          "id": "camunda-nexus",
          "name": "Camunda Nexus",
          "url": "https://repository.nexus.camunda.cloud/content/groups/internal/",
          "mirrorOf": "camunda-bpm,camunda-identity,zeebe,zeebe-snapshots"
        }]
      CAMUNDA_NEXUS_MAVEN_SERVER: >-
        [{
          "id": "camunda-nexus",
          "username": "${{ steps.secrets.outputs.ci-account-username }}",
          "password": "${{ steps.secrets.outputs.ci-account-password }}"
        }]
      # Avoid rate limiting on repo.maven.apache.org by mirroring central via Google's
      # public Maven Central mirror. Applies to all artifacts (deps, plugins, extensions, BOM).
      CENTRAL_MAVEN_MIRROR: >-
        [{
          "id": "google-maven-central",
          "name": "Google Maven Central Mirror",
          "url": "https://maven-central.storage-download.googleapis.com/maven2",
          "mirrorOf": "central"
        }]
      EXTRA_MAVEN_MIRRORS: ${{ inputs.maven-mirrors }}
      EXTRA_MAVEN_SERVERS: ${{ inputs.maven-servers }}
    run: |
      # If Camunda Nexus is disabled, reset default mirrors/servers to empty lists
      if [ "${CAMUNDA_NEXUS_ENABLED}" != "true" ]; then
        CAMUNDA_NEXUS_MAVEN_MIRROR="[]"
        CAMUNDA_NEXUS_MAVEN_SERVER="[]"
      fi

      # Use jq 'add' operator to merge grouped sublists
      mirrors=$(\
        jq -n \
        --argjson nexus_mirror "${CAMUNDA_NEXUS_MAVEN_MIRROR}" \
        --argjson central_mirror "${CENTRAL_MAVEN_MIRROR}" \
        --argjson maven_mirrors "${EXTRA_MAVEN_MIRRORS}" \
        '[ $nexus_mirror + $central_mirror + $maven_mirrors | group_by(.id)[] | add ]'
      )
      servers=$(\
        jq -n \
        --argjson nexus_server "${CAMUNDA_NEXUS_MAVEN_SERVER}" \
        --argjson maven_servers "${EXTRA_MAVEN_SERVERS}" \
        '[ $nexus_server + $maven_servers | group_by(.id)[] | add ]'
      )

      echo mirrors=$mirrors >> $GITHUB_OUTPUT
      echo servers=$servers >> $GITHUB_OUTPUT
    shell: bash
  - name: Update Maven settings.xml
    uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
    with:
      githubServer: false
      servers: ${{ steps.maven.outputs.servers }}
      mirrors: ${{ steps.maven.outputs.mirrors }}
  - uses: ./.github/actions/apt-fast-mirror-failover
    if: inputs.time-zone != '' && runner.os == 'Linux'
  # tzdata is not installed in self-hosted runners. `timeout` runs inside the sudo'd
  # root process tree so it can self-terminate a hung apt-get without nick-fields/retry
  # having to kill across the privilege boundary -- doing that externally throws
  # `kill EPERM` and crashes instead of retrying, see
  # https://github.com/nick-fields/retry/issues/124.
  - name: Install tzdata
    if: inputs.time-zone != '' && runner.os == 'Linux'
    uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
    with:
      max_attempts: 3
      retry_wait_seconds: 10
      timeout_minutes: 2
      shell: bash
      command: sudo timeout 115 bash -c "apt-get update && apt-get install -y tzdata"
  - name: Set Time Zone
    if: inputs.time-zone != '' && runner.os == 'Linux'
    env:
      TZ_IDENTIFIER: ${{ inputs.time-zone }}
    run: |
      echo ${TZ_IDENTIFIER} | sudo tee /etc/timezone
      sudo rm -rf /etc/localtime
      sudo ln -s /usr/share/zoneinfo/${TZ_IDENTIFIER} /etc/localtime
    shell: bash
  - name: Logs on to DockerHub
    # DockerHub login is disabled for fork PRs
    if: >-
      steps.is-fork.outputs.is-fork != 'true' &&
      (
        inputs.dockerhub == 'true' ||
        inputs.dockerhub-readonly == 'true'
      )
    uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
    env:
      DOCKER_USERNAME: ${{ steps.secrets.outputs.dockerhub-username }}
      DOCKER_PASSWORD: ${{ steps.secrets.outputs.dockerhub-token }}
    with:
      max_attempts: 3
      retry_wait_seconds: 10
      timeout_seconds: 60
      shell: bash
      command: |
        printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
  - name: Logs on to Harbor
    # Harbor login is disabled for fork PRs
    if: >-
      steps.is-fork.outputs.is-fork != 'true' &&
      inputs.harbor == 'true'
    uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
    env:
      DOCKER_USERNAME: ${{ steps.secrets.outputs.harbor-username }}
      DOCKER_PASSWORD: ${{ steps.secrets.outputs.harbor-password }}
    with:
      max_attempts: 3
      retry_wait_seconds: 10
      timeout_seconds: 60
      shell: bash
      command: |
        printf '%s' "${DOCKER_PASSWORD}" | docker login registry.camunda.cloud \
          --username "${DOCKER_USERNAME}" --password-stdin
  - name: Logs on to Minimus
    # Minimus login is disabled for fork PRs
    if: >-
      steps.is-fork.outputs.is-fork != 'true' &&
      inputs.minimus == 'true'
    uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
    env:
      DOCKER_PASSWORD: ${{ steps.secrets.outputs.minimus-token }}
    with:
      max_attempts: 3
      retry_wait_seconds: 10
      timeout_seconds: 60
      shell: bash
      command: |
        printf '%s' "${DOCKER_PASSWORD}" | docker login reg.mini.dev \
          --username minimus --password-stdin
