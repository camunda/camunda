# This action packages the complete Zeebe distribution artifacts.
# This excludes the Docker image. See the build-platform-docker for that.

---
name: Build Zeebe
description: Builds & installs the complete Zeebe distribution

inputs:
  maven-extra-args:
    description: Additional CLI arguments which will be passed to the maven install command as is, e.g. "-am -pl util/"
    default: ""
    required: false

outputs:
  distball:
    description: "The path to the Zeebe distribution TAR ball"
    value: ${{ steps.build-java.outputs.distball }}

runs:
  using: composite
  steps:
    # The internal Nexus artifact mirror (repository.nexus.camunda.cloud) has intermittently
    # dropped connections mid-build with "Connection reset", surviving even Maven's own
    # transport-level retry (aether.transport.http.retryHandler.count=5, set in
    # setup-maven-cache/action.yaml) exhausting its 5 attempts without recovering (INC-8051).
    # Retrying the whole build step gives it a second full attempt against Nexus rather than
    # failing the job outright on one transient blip.
    # retry_on: any, not error -- a timeout_minutes kill is a distinct event that retry_on: error
    # does NOT retry (see the identical note on the deploy-snapshots job in ci.yml).
    # timeout_minutes is a PER-ATTEMPT cap, not a total. This step builds the whole distribution
    # (not just this module), so it is slow: the build-distball job notes it can run ~15min on
    # its self-hosted runner, and ci-zeebe.yml's own smoke-tests/windows job (a slower, GitHub-
    # hosted runner) has observed up to ~11.7min (700s) across recent runs. 18min gives headroom
    # above both so a healthy-but-slow build isn't killed before completing; every job calling
    # this action must budget at least one full 18min attempt (ideally two) -- see the
    # timeout-minutes comment on the smoke-tests job in ci-zeebe.yml for the worked example.
    - name: Package Zeebe
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        shell: bash
        max_attempts: 2
        retry_on: any
        retry_wait_seconds: 15
        timeout_minutes: 18
        command: ./mvnw -B -T1C -DskipTests -DskipChecks install ${{ inputs.maven-extra-args }}

    - name: Determine Zeebe distball path
      shell: bash
      id: build-java
      run: |
        set -euo pipefail

        BUILD_DIR=$(
          ./mvnw -q -N -f dist/pom.xml help:evaluate \
                -Dexpression=project.build.directory \
                -DforceStdout
        ) || { echo "::error::could not evaluate project.build.directory"; exit 1; }

        ARTIFACT=$(
          ./mvnw -q -N -f dist/pom.xml help:evaluate \
                -Dexpression=project.build.finalName \
                -DforceStdout
        ) || { echo "::error::could not evaluate project.build.finalName"; exit 1; }

        echo "distball=${BUILD_DIR}/${ARTIFACT}.tar.gz" >> $GITHUB_OUTPUT
