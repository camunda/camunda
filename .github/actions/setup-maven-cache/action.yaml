---
name: Setup Maven Cache

# owner: @camunda/engineering-operations

description: Configured GHA cache for Maven global cache dir (no save on PRs), see https://camunda.github.io/camunda/ci/#caching-strategy

inputs:
  maven-cache-key-modifier:
    description: A modifier key used for the maven cache, can be used to create isolated caches for certain jobs.
    default: "shared"
    required: false
  maven-wagon-http-pool:
    description: Whether to use a connection pool for HTTP connections.
    default: "true"
    required: false
  cache-download-timeout-mins:
    description: >
      Upper bound, in minutes, on how long `actions/cache` may spend downloading a single
      cache segment before aborting the restore. A healthy restore takes under 60s, so the
      default trades a rare cold resolve for a bounded one -- see INC-7899.
    default: "3"
    required: false

outputs:
  cache-result:
    description: >
      Outcome of the Maven cache restore: `exact` (primary key matched), `fallback` (a restore key
      matched an older pom hash or the `shared` slot), `miss` (nothing restored) or `skipped`
      (cache step did not run, e.g. disabled on a PR).
    value: ${{ steps.cache-outcome.outputs.result }}
  cache-matched-key:
    description: The key of the cache entry that was restored. Only set on pull request runs, empty otherwise.
    value: ${{ steps.cache-outcome.outputs.matched-key }}

runs:
  using: composite
  steps:
    - name: Configure Maven
      shell: bash
      # `--errors` ensures errors will also spit out a stack trace, which is always useful, and has no impact on normal builds
      #
      # `--update-snapshots` to force Maven into updating snapshots, but also to retry looking for
      #    release artifacts when an earlier lookup failure made it into the cache.
      #
      # `aether.enhancedLocalRepository.split` splits between local and remote artifacts.
      # `aether.enhancedLocalRepository.splitRemote` splits remote artifacts into released and snapshot
      # `aether.syncContext.*` config ensures that maven uses file locks to prevent corruption
      #      from downloading multiple artifacts at the same time.
      # `aether.dependencyCollector.impl=bf` uses a breadth first algorithm when resolving/downloading poms.
      #     The `bf` collector is suggested when the project contains many modules and dependencies.
      # `aether.connector.*` configures the HTTP transport of Maven 3.9 (resolver 1.x).
      # `aether.connector.requestTimeout` is a socket read timeout (max silence between packets), not a total download time.
      # `aether.connector.http.retryHandler.serviceUnavailable` lists the HTTP status codes Maven retries, up to
      #     `retryHandler.count` times with a 5s, 10s, 15s, ... backoff. The default is 429,503, so a short Nexus
      #     502 or 504 failed the build at once.
      run: |
        tee .mvn/maven.config <<EOF
        --errors
        --batch-mode
        --update-snapshots
        -D aether.connector.requestTimeout=60000
        -D aether.connector.http.connectionMaxTtl=120
        -D aether.connector.http.reuseConnections=${{ inputs.maven-wagon-http-pool }}
        -D aether.connector.http.retryHandler.count=5
        -D aether.connector.http.retryHandler.serviceUnavailable=429,502,503,504
        -D aether.enhancedLocalRepository.split=true
        -D aether.enhancedLocalRepository.splitRemote=true
        -D aether.syncContext.named.nameMapper=file-gav
        -D aether.syncContext.named.factory=file-lock
        -D aether.syncContext.named.time=180
        -D maven.artifact.threads=32
        -D aether.dependencyCollector.impl=bf
        EOF
    - name: Get cache path and keys
      env:
        HASH_FILES: ${{ hashFiles('**/pom.xml') }}
        # it matters for caching as absolute paths on self-hosted and GitHub runners differ
        # self-hosted: `/runner/` vs gh-hosted: `/home/runner`
        KEY_PREFIX: ${{ runner.environment }}-${{ runner.os }}-mvn-${{ inputs.maven-cache-key-modifier }}
        # Fall back to the busy `shared` slot when LRU evicts a low-traffic one
        FALLBACK_KEY_PREFIX: ${{ runner.environment }}-${{ runner.os }}-mvn-shared
      shell: sh
      run: |
        maven_version=$(./mvnw --version | head -n 1 | sed "s/Apache Maven \([[:digit:]]\.[[:digit:]]\.[[:digit:]]\).*/\1/g")
        # Only cache release artifacts for Maven version 3.9+
        # GitHub env variables are used instead of outputs, as outputs are not available in post steps
        # https://github.com/actions/runner/issues/2009
        if echo "3.9.0\n$maven_version" | sort --version-sort --check=quiet; then
          # This is the path used by the `enhancedLocalRepository` set up in the 'Configure Maven' step.
          # `aether.enhancedLocalRepository.remotePrefix` defaults to 'cached'
          # `aether.enhancedLocalRepository.releasesPrefix` defaults to 'releases'
          echo "MAVEN_CACHE_PATH=~/.m2/repository/cached/releases/" >> $GITHUB_ENV
          echo "MAVEN_CACHE_KEY=${KEY_PREFIX}-${HASH_FILES}" >> $GITHUB_ENV
          echo "MAVEN_CACHE_KEY_PREFIX=${KEY_PREFIX}" >> $GITHUB_ENV
          echo "MAVEN_CACHE_FALLBACK_KEY_PREFIX=${FALLBACK_KEY_PREFIX}" >> $GITHUB_ENV
        else
          echo "MAVEN_CACHE_PATH=~/.m2/repository/" >> $GITHUB_ENV
          echo "MAVEN_CACHE_KEY=${KEY_PREFIX}-full-${HASH_FILES}" >> $GITHUB_ENV
          echo "MAVEN_CACHE_KEY_PREFIX=${KEY_PREFIX}-full" >> $GITHUB_ENV
          echo "MAVEN_CACHE_FALLBACK_KEY_PREFIX=${FALLBACK_KEY_PREFIX}-full" >> $GITHUB_ENV
        fi

      # Check if PR contains a label to disable the cache
    - name: Check if cache is enabled
      uses: camunda/infra-global-github-actions/is-cache-enabled@main
      id: is-cache-enabled

    - name: Detect branch type
      id: branch-detect
      shell: bash
      env:
        IS_MAIN_OR_STABLE_BRANCH: ${{ startsWith(github.ref_name, 'stable/') || github.ref_name == 'main' }}
      run: |
        echo is-main-or-stable-branch="$IS_MAIN_OR_STABLE_BRANCH" | tee -a $GITHUB_OUTPUT

    # `actions/cache` aborts a stalled segment download with a *warning*, not a failure, and
    # then hands the job a cold Maven repository -- so the cost of a slow cache backend is paid
    # by every later Maven step rather than surfacing here. `SEGMENT_DOWNLOAD_TIMEOUT_MINS`
    # defaults to 10 minutes, which on its own exceeds several jobs' entire timeout budget
    # (`zeebe-unit-tests` allows 20). Bounding it keeps a degraded backend from converting a
    # 6-minute job into a timeout. `timeout-minutes` is deliberately not used: GitHub ignores it
    # on composite-action steps, so the bound has to come from the action's own env var.
    - name: Cache local Maven repository
      id: cache-full
      # Only use the full cache action if we're on main or stable/* branches
      if: ${{ steps.branch-detect.outputs.is-main-or-stable-branch == 'true' }}
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: ${{ inputs.cache-download-timeout-mins }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.MAVEN_CACHE_PATH }}
        key: ${{ env.MAVEN_CACHE_KEY }}
        restore-keys: |
          ${{ env.MAVEN_CACHE_KEY_PREFIX }}
          ${{ env.MAVEN_CACHE_FALLBACK_KEY_PREFIX }}

    - name: Restore maven cache
      id: cache-restore
      # Restore cache (but don't save it) if we're not on main or stable/* branches and cache is enabled
      if: ${{ steps.branch-detect.outputs.is-main-or-stable-branch == 'false' && steps.is-cache-enabled.outputs.is-cache-enabled == 'true' }}
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: ${{ inputs.cache-download-timeout-mins }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # This has to match the 'Cache local Maven repository' step above
        path: ${{ env.MAVEN_CACHE_PATH }}
        key: ${{ env.MAVEN_CACHE_KEY }}
        restore-keys: |
          ${{ env.MAVEN_CACHE_KEY_PREFIX }}
          ${{ env.MAVEN_CACHE_FALLBACK_KEY_PREFIX }}

    # `cache-hit` alone is only `true` on an exact key match, so a restore through `restore-keys`
    # (older pom hash, most dependencies present) would be indistinguishable from a cold miss.
    # Classify all three outcomes so hit ratios can be derived per job and modifier.
    - name: Report Maven cache outcome
      id: cache-outcome
      if: ${{ always() }}
      shell: bash
      env:
        STEP_OUTCOMES: ${{ steps.cache-full.outcome }} ${{ steps.cache-restore.outcome }}
        FULL_OUTCOME: ${{ steps.cache-full.outcome }}
        FULL_HIT: ${{ steps.cache-full.outputs.cache-hit }}
        RESTORE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
        RESTORE_KEY: ${{ steps.cache-restore.outputs.cache-matched-key }}
        MODIFIER: ${{ inputs.maven-cache-key-modifier }}
        BRANCH_TYPE: ${{ steps.branch-detect.outputs.is-main-or-stable-branch == 'true' && 'main-or-stable' || 'pr' }}
      run: |
        if [[ "$STEP_OUTCOMES" == *failure* || "$STEP_OUTCOMES" == *cancelled* ]]; then
          echo "maven-cache job=${GITHUB_JOB} modifier=${MODIFIER} branch-type=${BRANCH_TYPE} result omitted: cache step failed or was cancelled"
          exit 0
        elif [[ "$STEP_OUTCOMES" != *success* ]]; then
          result=skipped
        else
          # main/stable: the full `actions/cache` step emits no matched key, so a fallback restore
          # is told apart from a miss by the restored directory being populated.
          if [[ "$FULL_OUTCOME" == "success" ]]; then
            hit="$FULL_HIT"; MATCHED_KEY=""
          else
            hit="$RESTORE_HIT"; MATCHED_KEY="$RESTORE_KEY"
          fi
          cache_dir="${MAVEN_CACHE_PATH/#\~/$HOME}"
          if [[ "$hit" == "true" ]]; then
            result=exact
          elif [[ -n "$(ls -A "$cache_dir" 2>/dev/null)" ]]; then
            result=fallback
          else
            result=miss
          fi
        fi

        {
          echo "result=${result}"
          echo "matched-key=${MATCHED_KEY}"
        } >> "$GITHUB_OUTPUT"

        echo "maven-cache job=${GITHUB_JOB} modifier=${MODIFIER} branch-type=${BRANCH_TYPE} result=${result}"
        echo "- Maven cache \`${MODIFIER}\` (${BRANCH_TYPE}): **${result}**${MATCHED_KEY:+ (\`${MATCHED_KEY}\`)}" >> "$GITHUB_STEP_SUMMARY"
