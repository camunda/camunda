# owner: @camunda/reliability-testing
name: GCS load-test-results auth
description: >-
  Vault-fetch the load-test-results service account and authenticate gcloud
  via Workload Identity Federation. After this action, `gcloud storage` commands
  can write to the camunda-benchmark-load-test-results-prod bucket. The caller
  still runs its own `gcloud storage` step (upload) so intent stays at the call site.
inputs:
  vault-addr:
    description: Vault address (secrets.VAULT_ADDR)
    required: true
  vault-role-id:
    description: Vault AppRole role id (secrets.VAULT_ROLE_ID)
    required: true
  vault-secret-id:
    description: Vault AppRole secret id (secrets.VAULT_SECRET_ID)
    required: true
runs:
  using: composite
  steps:
    - name: Fetch GCS load-test-results credentials
      id: gcs-secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ inputs.vault-addr }}
        method: approle
        roleId: ${{ inputs.vault-role-id }}
        secretId: ${{ inputs.vault-secret-id }}
        exportEnv: false
        secrets: |
          secret/data/products/camunda/ci/load-test-results/load-test-results-sa SERVICE_ACCOUNT | GCS_SA;
          secret/data/products/camunda/ci/load-test-results/load-test-results-sa WORKLOAD_IDENTITY_PROVIDER | GCS_WIF;
    - name: Authenticate to GCS via WIF
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ steps.gcs-secrets.outputs.GCS_WIF }}
        service_account: ${{ steps.gcs-secrets.outputs.GCS_SA }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
