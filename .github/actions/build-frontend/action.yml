---
name: Build Frontend

# owner: @camunda/engineering-operations

description: Builds the frontend project in a certain Yarn workspace

inputs:
  node-version:
    description: The Node.js version to use
    required: false
    default: "26"
  directory:
    description: Directory of the Yarn workspace to build
    required: true
  package-manager:
    description: Package manager to use (yarn or npm)
    required: false
    default: "yarn"
  infra-tools:
    description: Pre-fill the tool cache from camunda/infra-tools first (PoC, camunda/team-infrastructure#1138).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Pre-fill tool cache with Node (infra-tools PoC)
      if: inputs.infra-tools == 'true'
      continue-on-error: true
      uses: camunda/infra-tools/cache@e711227cffecd643b5a6ca2669a9ee58862279b3 # 0.3.0
      env:
        INFRA_TOOLS_MIRROR: ${{ runner.environment == 'self-hosted' && 'europe-west1-docker.pkg.dev/ci-30-162810/ci-tools' || '' }}
      with:
        tools: node@${{ inputs.node-version }}

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup yarn
      if: ${{ inputs.package-manager == 'yarn' }}
      shell: bash
      run: npm install -g yarn

    - uses: camunda/infra-global-github-actions/setup-yarn-cache@main
      if: ${{ inputs.package-manager == 'yarn' }}
      with:
        directory: ${{ inputs.directory }}

    - name: Install node dependencies (yarn)
      if: ${{ inputs.package-manager == 'yarn' }}
      uses: ./.github/actions/yarn-install-with-retry
      with:
        directory: ${{ inputs.directory }}

    - name: Install node dependencies (npm)
      if: ${{ inputs.package-manager == 'npm' }}
      uses: ./.github/actions/npm-ci-with-retry
      with:
        directory: ${{ inputs.directory }}

    - name: Build frontend (yarn)
      if: ${{ inputs.package-manager == 'yarn' }}
      working-directory: ${{ inputs.directory }}
      shell: bash
      run: yarn build

    - name: Build frontend (npm)
      if: ${{ inputs.package-manager == 'npm' }}
      working-directory: ${{ inputs.directory }}
      shell: bash
      run: npm run build
