# owner: @camunda/engineering-operations
name: GCS auth via Workload Identity Federation
description: >-
  Vault-fetch a GCS service account and authenticate gcloud via Workload
  Identity Federation. After this action, `gcloud storage` commands can
  access whichever bucket the service account is scoped to. The caller
  still runs its own `gcloud storage` step (upload/download/delete) so
  intent stays at the call site.
inputs:
  vault-addr:
    description: Vault address (secrets.VAULT_ADDR)
    required: true
  vault-role-id:
    description: Vault AppRole role id (secrets.VAULT_ROLE_ID)
    required: true
  vault-secret-id:
    description: Vault AppRole secret id (secrets.VAULT_SECRET_ID)
    required: true
  secret-path:
    description: >-
      Vault path to the SERVICE_ACCOUNT/WORKLOAD_IDENTITY_PROVIDER pair to
      authenticate with. Defaults to the monorepo build-cache service account.
    required: false
    default: secret/data/products/camunda/ci/build-cache/monorepo-build-cache-sa
runs:
  using: composite
  steps:
    - name: Check for fork
      uses: ./.github/actions/is-fork
      id: is-fork
    - name: Fetch GCS credentials
      id: gcs-secrets
      if: steps.is-fork.outputs.is-fork != 'true'
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ inputs.vault-addr }}
        method: approle
        roleId: ${{ inputs.vault-role-id }}
        secretId: ${{ inputs.vault-secret-id }}
        exportEnv: false
        secrets: |
          ${{ inputs.secret-path }} SERVICE_ACCOUNT | GCS_SA;
          ${{ inputs.secret-path }} WORKLOAD_IDENTITY_PROVIDER | GCS_WIF;
    # Each attempt is a literal copy gated on its predecessor's outcome -- keep the `with:` blocks
    # identical. The last attempt omits `continue-on-error` so an exhausted retry fails the job.
    - name: Authenticate to GCS via WIF (attempt 1 of 3)
      id: auth-attempt-1
      if: steps.is-fork.outputs.is-fork != 'true'
      continue-on-error: true
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ steps.gcs-secrets.outputs.GCS_WIF }}
        service_account: ${{ steps.gcs-secrets.outputs.GCS_SA }}
    # The auth post hook only removes the last attempt's credentials file.
    - name: Clean up and wait before attempt 2
      if: steps.auth-attempt-1.outcome == 'failure'
      shell: bash
      env:
        CREDS_FILE: ${{ steps.auth-attempt-1.outputs.credentials_file_path }}
      run: |
        if [[ -n "${CREDS_FILE}" ]]; then rm -f "${CREDS_FILE}"; fi
        sleep 10
    - name: Authenticate to GCS via WIF (attempt 2 of 3)
      id: auth-attempt-2
      if: steps.auth-attempt-1.outcome == 'failure'
      continue-on-error: true
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ steps.gcs-secrets.outputs.GCS_WIF }}
        service_account: ${{ steps.gcs-secrets.outputs.GCS_SA }}
    - name: Clean up and wait before attempt 3
      if: steps.auth-attempt-2.outcome == 'failure'
      shell: bash
      env:
        CREDS_FILE: ${{ steps.auth-attempt-2.outputs.credentials_file_path }}
      run: |
        if [[ -n "${CREDS_FILE}" ]]; then rm -f "${CREDS_FILE}"; fi
        sleep 10
    - name: Authenticate to GCS via WIF (attempt 3 of 3)
      if: steps.auth-attempt-2.outcome == 'failure'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ steps.gcs-secrets.outputs.GCS_WIF }}
        service_account: ${{ steps.gcs-secrets.outputs.GCS_SA }}
    - if: steps.is-fork.outputs.is-fork != 'true'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
