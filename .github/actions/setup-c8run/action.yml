---
name: Setup c8run build
description: Sets up the required stack to build, install, and run c8run

inputs:
  checkout:
    description: Whether to check out source
    required: false
    default: true
  os:
    description: The OS to run the action on
    required: false
    default: ubuntu-latest
  vault-address:
    description: Vault URL to retrieve secrets from
    required: false
  vault-role-id:
    description: Vault Role ID to use
    required: false
  vault-secret-id:
    description: Vault Secret ID to use
    required: false
  vault-jwt-role:
    description: 'Vault JWT role; when set, the action logs in via JWT/OIDC and the job needs id-token: write'
    required: false
  vault-jwt-path:
    description: 'Vault JWT auth backend path'
    required: false
  vault-jwt-audience:
    description: 'GitHub OIDC audience for the Vault JWT login'
    required: false
  source-build:
    description: true if the camunda build should be built from source, false will build from latest camunda release
    required: false
    default: false
  local-archive-build:
    description: true if camunda platform should be taken from a local archive
    required: false
    default: false
  repository:
    description: The repository to build from
    required: false
    default: camunda/camunda
  github-token:
    description: The GitHub token to use to clone camunda
    required: true

outputs:
  path-to-c8run-build:
    description: The path to the c8run build

env:
  NODE_OPTIONS: "--max_old_space_size=4096"

permissions:
  actions: write
  attestations: none
  checks: write
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: write

runs:
  using: composite
  steps:
    - if: ${{ inputs.os == 'ubuntu-latest' }}
      name: disable and stop mono-xsp4.service
      shell: bash
      run: |
        sudo systemctl stop mono-xsp4.service || true
        sudo systemctl disable mono-xsp4.service || true
        sudo killall mono || true
        sudo killall xsp4 || true

    - if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        repository: ${{ inputs.repository }}
        token: ${{ inputs.github-token }}

    - name: Import Secrets
      id: secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ inputs.vault-address }}
        method: ${{ inputs.vault-jwt-role != '' && 'jwt' || 'approle' }}
        path: ${{ inputs.vault-jwt-path }}
        role: ${{ inputs.vault-jwt-role }}
        jwtGithubAudience: ${{ inputs.vault-jwt-audience }}
        roleId: ${{ inputs.vault-jwt-role == '' && inputs.vault-role-id || '' }}
        secretId: ${{ inputs.vault-jwt-role == '' && inputs.vault-secret-id || '' }}
        secrets: |
          secret/data/products/distribution/ci/nexus USER | NEXUS_USERNAME;
          secret/data/products/distribution/ci/nexus PASSWORD | NEXUS_PASSWORD;

    - name: print architecture
      run: arch
      shell: bash

    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: c8run/go.mod
        cache: false

    - name: Check if cache is enabled
      id: is-cache-enabled
      uses: camunda/infra-global-github-actions/is-cache-enabled@main

    - name: Locate Go module cache
      id: go-mod-cache
      shell: bash
      run: echo "path=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      if: ${{ startsWith(github.ref_name, 'stable/') || github.ref_name == 'main' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-mod-cache.outputs.path }}
        key: c8run-go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('c8run/go.sum') }}

    - name: Restore Go modules
      if: ${{ !startsWith(github.ref_name, 'stable/') && github.ref_name != 'main' && steps.is-cache-enabled.outputs.is-cache-enabled == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-mod-cache.outputs.path }}
        key: c8run-go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('c8run/go.sum') }}

    - name: Setup Java 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: "temurin"
        java-version: "21"

    - uses: ./.github/actions/setup-build
      if: ${{ inputs.source-build == 'true' }}
      with:
        vault-secret-id: ${{ inputs.vault-secret-id }}
        vault-address: ${{ inputs.vault-address }}
        vault-role-id: ${{ inputs.vault-role-id }}
        vault-jwt-role: ${{ inputs.vault-jwt-role }}
        vault-jwt-path: ${{ inputs.vault-jwt-path }}
        vault-jwt-audience: ${{ inputs.vault-jwt-audience }}

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26

    - uses: camunda/infra-global-github-actions/setup-yarn-cache@main
      if: ${{ inputs.source-build == 'true' }}
      with:
        directory: identity/client

    - name: Install node dependencies
      if: ${{ inputs.source-build == 'true' }}
      uses: ./.github/actions/npm-ci-with-retry
      with:
        directory: ./operate/client

    - name: Install node dependencies
      if: ${{ inputs.source-build == 'true' }}
      uses: ./.github/actions/npm-ci-with-retry
      with:
        directory: ./identity/client

    - uses: ./.github/actions/build-zeebe
      if: ${{ inputs.source-build == 'true' }}
      id: build-zeebe
      with:
        maven-extra-args: "-Dskip.fe.build=false"

    - name: Copy zeebe build
      if: ${{ inputs.source-build == 'true' }}
      run: cp $distball ./c8run/
      shell: bash
      env:
        distball: ${{ steps.build-zeebe.outputs.distball }}

    - name: Get version number from zeebe archive
      if: ${{ inputs.source-build == 'true' }}
      id: source-version
      run: echo version=$( echo $distball | grep -o 'camunda-zeebe-.*' | sed 's/camunda-zeebe-//' | sed 's/\.tar\.gz//') >> $GITHUB_OUTPUT
      shell: bash
      env:
        distball: ${{ steps.build-zeebe.outputs.distball }}

    - name: Get version of camunda-dist
      if: ${{ inputs.local-archive-build == 'true' }}
      id: archive-version
      run: echo version=$(ls camunda-zeebe*.tar.gz | grep -o 'camunda-zeebe-.*' | sed 's/camunda-zeebe-//' | sed 's/\.tar\.gz//') >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ./c8run

    - name: Set up Java 25 for C8Run packaging
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: "temurin"
        java-version: "25"

    - name: Build c8run
      run: go build -o c8run ./cmd/c8run
      shell: bash
      working-directory: ./c8run

    - name: Build c8run packager
      run: go build -o packager ./cmd/packager
      shell: bash
      working-directory: ./c8run

    - name: make a package
      run: |
        if [[ -n "$DIST_VERSION" ]]; then
          export CAMUNDA_VERSION="$DIST_VERSION"
        fi
        ./packager package
      shell: bash
      working-directory: ./c8run
      env:
        DIST_VERSION: ${{ steps.source-version.outputs.version || steps.archive-version.outputs.version }}
        JAVA_ARTIFACTS_USER: ${{ steps.secrets.outputs.NEXUS_USERNAME }}
        JAVA_ARTIFACTS_PASSWORD: ${{ steps.secrets.outputs.NEXUS_PASSWORD }}

    - name: Extract packaged C8Run for E2E
      run: |
        mkdir e2e-distribution
        case "${{ inputs.os }}" in
          ubuntu-latest) tar -xzf camunda8-run-*.tar.gz -C e2e-distribution ;;
          macos*) unzip -q camunda8-run-*.zip -d e2e-distribution ;;
        esac
        shopt -s nullglob
        distributions=("$PWD"/e2e-distribution/c8run-*)
        if [[ ${#distributions[@]} -ne 1 || ! -d "${distributions[0]}" ]]; then
          echo "Expected exactly one extracted c8run distribution, found ${#distributions[@]}" >&2
          exit 1
        fi
        echo "C8RUN_E2E_DIR=${distributions[0]}" >> "$GITHUB_ENV"
      shell: bash
      working-directory: ./c8run

    - name: Configure packaged C8Run E2E secret
      run: printf '%s' 'c8run-centralized-secret-test-value' | ./c8run secrets set C8RUN_E2E_SECRET --stdin
      shell: bash
      working-directory: ${{ env.C8RUN_E2E_DIR }}

    - name: ls
      run: ls
      shell: bash
      working-directory: ${{ env.C8RUN_E2E_DIR }}

    - if: ${{ inputs.os == 'ubuntu-latest' }}
      name: Linux - Run c8run
      run: ./c8run start --config ../../e2e_tests/config-flag.yaml
      shell: bash
      working-directory: ${{ env.C8RUN_E2E_DIR }}

    - if: ${{ startsWith(inputs.os, 'macos') }}
      name: Mac - Run c8run
      shell: bash
      run: ./c8run start --config ../../e2e_tests/config-flag.yaml
      working-directory: ${{ env.C8RUN_E2E_DIR }}

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: camunda8-run-build-${{ inputs.os }}
        path: ./c8run/camunda8-run*
        retention-days: 1

    - name: define c8run filepath
      id: path-to-build
      run: echo "path-to-c8run-build=$( ls ./c8run/camunda8-run* )" >> $GITHUB_OUTPUT
      shell: bash
